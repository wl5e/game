<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Falling Math</title>
<style>
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0%,#16233a 0%,#070b12 65%);font-family:ui-monospace,Menlo,Consolas,monospace;color:#cbd5e1;padding:16px;-webkit-tap-highlight-color:transparent}
  .wrap{width:min(92vw,460px);display:flex;flex-direction:column;gap:12px}
  .hud{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.15em;color:#64748b}
  .hud b{color:#38bdf8;font-size:20px;margin-left:6px}
  .area{background:#0b1220;border:1px solid #1e293b;border-radius:14px;min-height:230px;display:grid;place-items:center;padding:16px;text-align:center;user-select:none;position:relative;overflow:hidden}
  button{font-family:inherit;border:0;border-radius:10px;padding:11px 15px;font-size:14px;font-weight:700;background:#0ea5e9;color:#04222a;cursor:pointer}
  button:active{transform:translateY(1px)}
  .hint{color:#64748b;font-size:11px;text-align:center;line-height:1.6}
  .big{font-size:26px;font-weight:800}
  .opt{background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:10px;padding:10px 14px;font-size:16px;font-weight:700;margin:4px;cursor:pointer}
  .opt:hover{border-color:#38bdf8}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>BONS <b id="score">0</b></span><span>BEST <b id="best">—</b></span></div>
  <div class="area" id="area"><canvas id="cv" width="420" height="230"></canvas></div>
  <button id="go">Rejouer</button>
  <div class="hint">Résous le calcul avant qu'il ne touche le sol.</div>
</div>
<script>
const $=s=>document.querySelector(s);
let best=0;try{best=parseInt(localStorage.getItem('fallingmath.best')||'0',10)||0}catch(e){}
function saveHigh(v){ if(v>best){best=v;try{localStorage.setItem('fallingmath.best',String(v))}catch(e){}} upd(); }
function saveLow(v){ if(best===0||v<best){best=v;try{localStorage.setItem('fallingmath.best',String(v))}catch(e){}} upd(); }
function upd(){ $('#best').textContent=best?best:'—'; }
const cv=$('#cv'),c=cv.getContext('2d'); let q=null, score=0, raf=null;
function nq(){ const a=1+Math.floor(Math.random()*12),b=1+Math.floor(Math.random()*12); q={a,b,op:'+',ans:a+b,y:30}; }
function frame(){ if(q.y>cv.height-20){ saveHigh(score); cancelAnimationFrame(raf); c.fillStyle='#f87171';c.font='bold 20px monospace';c.textAlign='center';c.fillText('FIN : '+score,cv.width/2,cv.height/2); return; } q.y+=1.5; c.clearRect(0,0,cv.width,cv.height); c.fillStyle='#38bdf8';c.font='bold 24px monospace';c.textAlign='center';c.fillText(q.a+' + '+q.b+' = ?',cv.width/2,q.y); raf=requestAnimationFrame(frame); }
$('#area').onclick=()=>{}; // input via keyboard below
let buf='';
document.addEventListener('keydown',e=>{ if(e.key>='0'&&e.key<='9'){ buf+=e.key; if(parseInt(buf)===q.ans){ score++; $('#score').textContent=score; buf=''; nq(); } else if(buf.length>=3){ buf=''; } } });
$('#go').onclick=()=>{ score=0; buf=''; $('#score').textContent='0'; cancelAnimationFrame(raf); nq(); frame(); };
upd();
</script>
</body>
</html>
