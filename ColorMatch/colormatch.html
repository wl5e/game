<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Color Match</title>
<style>
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0%,#16233a 0%,#070b12 65%);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#cbd5e1;padding:16px;-webkit-tap-highlight-color:transparent}
  .wrap{width:min(92vw,460px);display:flex;flex-direction:column;gap:12px}
  .hud{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.15em;color:#64748b}
  .hud b{color:#38bdf8;font-size:20px;margin-left:6px}
  .area{background:#0b1220;border:1px solid #1e293b;border-radius:14px;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center;user-select:none;position:relative;overflow:hidden}
  button{font-family:inherit;border:0;border-radius:10px;padding:11px 15px;font-size:14px;font-weight:700;background:#0ea5e9;color:#04222a;cursor:pointer}
  button:active{transform:translateY(1px)}
  .hint{color:#64748b;font-size:11px;text-align:center;line-height:1.6}
  .msg{font-size:13px;color:#94a3b8;min-height:18px;line-height:1.5}
  .target{font-size:30px;font-weight:800;letter-spacing:.08em}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .tile{width:96px;height:96px;border-radius:14px;border:2px solid rgba(255,255,255,.15);cursor:pointer;box-shadow:0 10px 22px -12px #000;transition:transform .1s}
  .tile:active{transform:scale(.94)}
  .timer{width:100%;max-width:300px}
  .bar{height:8px;border-radius:6px;background:#1e293b;overflow:hidden}
  .bar i{display:block;height:100%;background:#38bdf8;transition:width .1s linear}
  .meta{font-size:12px;color:#64748b;letter-spacing:.1em}
  .meta b{color:#38bdf8;font-size:16px}
  .area.good{animation:goodflash .4s}
  .area.bad{animation:badflash .45s}
  @keyframes goodflash{0%{box-shadow:inset 0 0 0 4px #22c55e;background:#06281c}100%{box-shadow:inset 0 0 0 0 #22c55e}}
  @keyframes badflash{0%{box-shadow:inset 0 0 0 4px #ef4444;background:#2a0a0e}100%{box-shadow:inset 0 0 0 0 #ef4444}}
  .shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
</style>
<script src="../audio.js"></script>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>BONS <b id="score">0</b></span><span>BEST <b id="best">—</b></span></div>
  <div class="area" id="area">
    <div class="target" id="target">ROUGE</div>
    <div class="grid" id="grid"></div>
    <div class="timer"><div class="bar"><i id="bar"></i></div></div>
    <div class="meta">TEMPS <b id="time">30</b> s</div>
    <div class="msg" id="msg">Tape la case de la couleur demandée.</div>
  </div>
  <button id="go">Rejouer</button>
  <div class="hint">Tape la case de la couleur écrite en haut. 30 secondes.<br>Objectif : 20 bonnes réponses ou plus.</div>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
let best=0;try{best=parseInt(localStorage.getItem('colormatch.best')||'0',10)||0}catch(e){}
function saveHigh(v){ if(v>best){best=v;try{localStorage.setItem('colormatch.best',String(v))}catch(e){}} upd(); }
function upd(){ $('#best').textContent=best?best:'—'; }
const COLS={ROUGE:'#f87171',BLEU:'#60a5fa',VERT:'#4ade80',JAUNE:'#facc15'};
const NAMES=Object.keys(COLS);
const area=$('#area'), target=$('#target'), grid=$('#grid'), msg=$('#msg');
const bar=$('#bar'), timeEl=$('#time');
const DURATION=30;
let score=0, timeLeft=DURATION, want='', over=false, started=false, timer=null, busy=false;
function flash(kind){ area.classList.remove('good','bad'); void area.offsetWidth; area.classList.add(kind); }
function paint(){ $('#score').textContent=score; timeEl.textContent=Math.ceil(timeLeft); bar.style.width=(timeLeft/DURATION*100)+'%'; }
function q(){
  want=NAMES[Math.floor(Math.random()*NAMES.length)];
  target.textContent=want;
  const arr=NAMES.slice().sort(()=>Math.random()-0.5);
  grid.innerHTML='';
  arr.forEach(c=>{
    const t=document.createElement('button');
    t.className='tile';
    t.style.background=COLS[c];
    t.setAttribute('aria-label',c);
    t.onclick=()=>answer(c,t);
    grid.appendChild(t);
  });
}
function answer(c,tile){
  if(over||busy) return;
  if(!started){ started=true; timer=setInterval(tick,100); }
  if(c===want){
    score++; paint();
    msg.textContent='Bien vu !';
    flash('good'); Arcade.sfx('correct');
    busy=true; setTimeout(()=>{ busy=false; q(); },160);
  }else{
    msg.textContent='Ce n\'est pas '+want+'.';
    tile.classList.add('shake');
    area.classList.add('shake'); flash('bad'); Arcade.sfx('wrong');
    setTimeout(()=>{ tile.classList.remove('shake'); area.classList.remove('shake'); },450);
  }
}
function tick(){
  if(over) return;
  timeLeft-=0.1;
  if(timeLeft<=0){ timeLeft=0; paint(); end(); return; }
  paint();
  if(timeLeft<=5&&Math.ceil(timeLeft)!==Math.ceil(timeLeft+0.1)) Arcade.sfx('tick');
}
function end(){
  over=true;
  if(timer){ clearInterval(timer); timer=null; }
  grid.querySelectorAll('.tile').forEach(t=>t.disabled=true);
  const rec=score>best;
  saveHigh(score);
  msg.innerHTML='Temps écoulé — Score <b>'+score+'</b>'+(rec?' — RECORD !':'');
  (rec?Arcade.sfx('win'):Arcade.sfx('lose'));
}
function reset(){
  over=false; started=false; score=0; timeLeft=DURATION; busy=false;
  if(timer){ clearInterval(timer); timer=null; }
  area.classList.remove('good','bad','shake');
  msg.textContent='Tape la case de la couleur demandée.';
  paint(); q();
}
$('#go').onclick=reset;
upd();
reset();
</script>
</body>
</html>
