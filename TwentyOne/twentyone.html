<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Twenty One</title>
<style>
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0%,#16233a 0%,#070b12 65%);font-family:ui-monospace,Menlo,Consolas,monospace;color:#cbd5e1;padding:16px;-webkit-tap-highlight-color:transparent}
  .wrap{width:min(92vw,460px);display:flex;flex-direction:column;gap:12px}
  .hud{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.15em;color:#64748b}
  .hud b{color:#38bdf8;font-size:20px;margin-left:6px}
  .area{background:#0b1220;border:1px solid #1e293b;border-radius:14px;min-height:230px;display:grid;place-items:center;padding:16px;text-align:center;user-select:none;position:relative;overflow:hidden}
  button{font-family:inherit;border:0;border-radius:10px;padding:11px 15px;font-size:14px;font-weight:700;background:#0ea5e9;color:#04222a;cursor:pointer}
  button:active{transform:translateY(1px)}
  .hint{color:#64748b;font-size:11px;text-align:center;line-height:1.6}
  .big{font-size:26px;font-weight:800}
  .opt{background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:10px;padding:10px 14px;font-size:16px;font-weight:700;margin:4px;cursor:pointer}
  .opt:hover{border-color:#38bdf8}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>TOTAL <b id="score">0</b></span><span>BEST <b id="best">—</b></span></div>
  <div class="area" id="area"><div class="big" id="sum">0</div><div style="display:flex;gap:10px;margin-top:12px"><button class="opt" id="roll">LANCER</button><button class="opt" id="stop">STOP</button></div></div>
  <button id="go">Rejouer</button>
  <div class="hint">Lance les dés pour approcher 21 sans dépasser. 10 tours.</div>
</div>
<script>
const $=s=>document.querySelector(s);
let best=0;try{best=parseInt(localStorage.getItem('twentyone.best')||'0',10)||0}catch(e){}
function saveHigh(v){ if(v>best){best=v;try{localStorage.setItem('twentyone.best',String(v))}catch(e){}} upd(); }
function saveLow(v){ if(best===0||v<best){best=v;try{localStorage.setItem('twentyone.best',String(v))}catch(e){}} upd(); }
function upd(){ $('#best').textContent=best?best:'—'; }
let sum=0, total=0, turns=10;
function roll(){ if(turns<=0) return; const d=1+Math.floor(Math.random()*6); sum+=d; $('#sum').textContent=sum; if(sum>21){ sum=0; turns--; if(turns<=0) finish(); } }
function stop(){ if(turns<=0||sum===0) return; total+=sum; $('#score').textContent=total; sum=0; $('#sum').textContent='0'; turns--; if(turns<=0) finish(); }
function finish(){ saveHigh(total); $('#area').insertAdjacentHTML('beforeend','<div class="big">Total '+total+'</div>'); }
$('#roll').onclick=roll; $('#stop').onclick=stop;
$('#go').onclick=()=>{ sum=0; total=0; turns=10; $('#sum').textContent='0'; $('#score').textContent='0'; };
upd();
</script>
</body>
</html>
