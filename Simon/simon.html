<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Simon</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    background: radial-gradient(120% 80% at 50% 0%, #2a4a0a 0%, #080e02 65%);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #cbd5e1;
    padding: 16px;
    -webkit-tap-highlight-color: transparent;
  }

  .wrap {
    width: min(88vw, 480px);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .hud {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 12px;
    letter-spacing: .16em;
    color: #64748b;
  }
  .hud b {
    color: #4ade80;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .02em;
    margin-left: 6px;
    text-shadow: 0 0 14px rgba(74, 222, 128, .45);
  }

  .board {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 16px;
    overflow: hidden;
    background: #0b1220;
    box-shadow:
      0 0 0 1px #1e293b,
      0 0 0 6px rgba(15, 23, 42, .55),
      0 30px 60px -25px #000;
  }

  .pads {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 14px;
  }
  .pad {
    border-radius: 14px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: background .16s ease, box-shadow .16s ease, transform .07s ease;
  }
  .pad:active { transform: scale(.97); }
  .pads.showing .pad { pointer-events: none; }
  .pad.g { background: #14532d; }
  .pad.r { background: #4c1d1d; }
  .pad.y { background: #46350a; }
  .pad.b { background: #12274d; }
  .pad.lit.g { background: #4ade80; box-shadow: 0 0 26px rgba(74, 222, 128, .8); }
  .pad.lit.r { background: #f87171; box-shadow: 0 0 26px rgba(248, 113, 113, .8); }
  .pad.lit.y { background: #fde047; box-shadow: 0 0 26px rgba(253, 224, 71, .8); }
  .pad.lit.b { background: #60a5fa; box-shadow: 0 0 26px rgba(96, 165, 250, .8); }

  .pause-btn {
    position: fixed;
    top: 12px;
    right: 12px;
    width: 36px;
    height: 36px;
    display: none;
    align-items: center;
    justify-content: center;
    border: 1px solid #1e293b;
    border-radius: 10px;
    background: rgba(15, 23, 42, .72);
    color: #cbd5e1;
    font-size: 12px;
    letter-spacing: 0;
    cursor: pointer;
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    z-index: 90;
  }
  .pause-btn.show { display: flex; }
  .pause-btn:hover { background: rgba(30, 41, 59, .8); }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 24px;
    background: rgba(5, 9, 16, .82);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  .overlay h1 {
    margin: 0;
    font-size: clamp(26px, 8vw, 40px);
    letter-spacing: .22em;
    color: #e2e8f0;
    text-shadow: 0 0 26px rgba(74, 222, 128, .35);
  }
  .overlay p {
    margin: 0;
    font-size: 13px;
    line-height: 1.7;
    color: #94a3b8;
    letter-spacing: .06em;
    max-width: 30ch;
  }

  button {
    margin-top: 4px;
    padding: 12px 30px;
    font: inherit;
    font-size: 14px;
    letter-spacing: .18em;
    color: #04210f;
    background: linear-gradient(180deg, #86efac, #4ade80);
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 24px -8px rgba(74, 222, 128, .8);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 12px 28px -8px rgba(74, 222, 128, .9); }
  button:active { transform: translateY(1px) scale(.98); }

  .hint {
    margin: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: .14em;
    color: #475569;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="hud">
    <div>SCORE<b id="score">0</b></div>
    <div>BEST<b id="best">0</b></div>
  </div>

  <div class="board">
    <div class="pads" id="pads">
      <div class="pad g" id="pad-g" aria-label="Green"></div>
      <div class="pad r" id="pad-r" aria-label="Red"></div>
      <div class="pad y" id="pad-y" aria-label="Yellow"></div>
      <div class="pad b" id="pad-b" aria-label="Blue"></div>
    </div>
    <button class="pause-btn" id="pauseBtn" aria-label="Pause">❚❚</button>
    <div class="overlay show" id="overlay">
      <h1 id="ovTitle">SIMON</h1>
      <p id="ovText">Watch the lights, then repeat the sequence. It grows one step each round.</p>
      <button id="ovBtn">PLAY</button>
      <button id="ovBtn2" style="display:none">RESTART</button>
    </div>
  </div>

  <p class="hint">CLICK PADS &nbsp;·&nbsp; SPACE PAUSE &nbsp;·&nbsp; R RESTART</p>
</div>

<script>
(() => {
  "use strict";

  /* ---------- Setup ---------- */
  const PADS = ['g', 'r', 'y', 'b'];

  const padsEl   = document.getElementById('pads');
  const overlay  = document.getElementById('overlay');
  const ovTitle  = document.getElementById('ovTitle');
  const ovText   = document.getElementById('ovText');
  const ovBtn    = document.getElementById('ovBtn');
  const ovBtn2   = document.getElementById('ovBtn2');
  const pauseBtn = document.getElementById('pauseBtn');
  const scoreEl  = document.getElementById('score');
  const bestEl   = document.getElementById('best');

  const padEls = {};
  PADS.forEach((id) => { padEls[id] = document.getElementById('pad-' + id); });

  /* ---------- State ---------- */
  let seq = [];          // full sequence for the current round
  let round = 1;         // current round (equals seq.length while playing)
  let inputIdx = 0;      // how many pads the player has correctly repeated
  let showing = false;   // sequence is being played back (input blocked)
  let showToken = 0;     // invalidates stale playback loops on restart/resume
  let state = 'idle';    // 'idle' | 'playing' | 'paused' | 'over'

  let best = 0;
  try { best = parseInt(localStorage.getItem('simon.best') || '0', 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  /* ---------- Helpers ---------- */
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  function updateHud() {
    scoreEl.textContent = round;
    bestEl.textContent = best;
  }

  function showOverlay(title, text, btnLabel, btn2Label) {
    ovTitle.textContent = title;
    ovText.textContent = text;
    ovBtn.textContent = btnLabel;
    if (btn2Label) { ovBtn2.textContent = btn2Label; ovBtn2.style.display = ''; }
    else { ovBtn2.style.display = 'none'; }
    overlay.classList.add('show');
  }

  function hideOverlay() {
    overlay.classList.remove('show');
  }

  function updatePauseBtn() { pauseBtn.classList.toggle('show', state === 'playing'); }

  function setShowing(on) {
    showing = on;
    padsEl.classList.toggle('showing', on);
  }

  function lightPad(id, on) { padEls[id].classList.toggle('lit', on); }

  function flashPad(id) {
    const p = padEls[id];
    p.classList.add('lit');
    setTimeout(() => p.classList.remove('lit'), 220);
  }

  function clearPads() { PADS.forEach((id) => padEls[id].classList.remove('lit')); }

  function randPad() { return PADS[(Math.random() * PADS.length) | 0]; }

  /* ---------- Game logic ---------- */
  async function playSequence() {
    const token = ++showToken;
    setShowing(true);
    inputIdx = 0;

    await sleep(700);
    for (const id of seq) {
      if (token !== showToken || state !== 'playing') return;
      lightPad(id, true);
      await sleep(420);
      if (token !== showToken) return;
      lightPad(id, false);
      await sleep(160);
    }
    if (token !== showToken || state !== 'playing') return;
    setShowing(false);
  }

  function gameOver() {
    state = 'over';
    updatePauseBtn();
    clearPads();
    setShowing(false);
    if (round > best) {
      best = round;
      try { localStorage.setItem('simon.best', String(best)); } catch (e) {}
      updateHud();
    }
    showOverlay('GAME OVER', `You reached round ${round}. Best: ${best}.`, 'PLAY AGAIN');
  }

  function reset() {
    showToken++;
    seq = [];
    round = 1;
    inputIdx = 0;
    setShowing(false);
    clearPads();
  }

  function start() {
    reset();
    state = 'playing';
    hideOverlay();
    updatePauseBtn();
    seq.push(randPad());
    round = seq.length;
    updateHud();
    playSequence();
  }

  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      clearPads();
      showOverlay('PAUSED', 'The sequence will replay from the start.', 'RESUME', 'RESTART');
    } else if (state === 'paused') {
      state = 'playing';
      hideOverlay();
      playSequence();
    }
    updatePauseBtn();
  }

  function padClick(id) {
    if (state !== 'playing' || showing) return;

    flashPad(id);

    if (id !== seq[inputIdx]) { gameOver(); return; }

    inputIdx++;
    if (inputIdx === seq.length) {
      seq.push(randPad());
      round = seq.length;
      updateHud();
      playSequence();
    }
  }

  /* ---------- Input ---------- */
  window.addEventListener('keydown', (e) => {
    const k = e.key;

    if (k === ' ' || k === 'Spacebar' || k.startsWith('Arrow')) e.preventDefault();

    if (k === 'r' || k === 'R') { start(); return; }

    if (k === ' ' || k === 'Spacebar' || k === 'p' || k === 'P') {
      if (state === 'playing' || state === 'paused') togglePause();
      else start();
    }
  });

  ovBtn.addEventListener('click', () => {
    ovBtn.blur();
    if (state === 'paused') togglePause();
    else start();
  });

  ovBtn2.addEventListener('click', () => {
    ovBtn2.blur();
    start();
  });

  pauseBtn.addEventListener('click', () => {
    pauseBtn.blur();
    if (state === 'playing') togglePause();
  });

  PADS.forEach((id) => {
    padEls[id].addEventListener('click', () => padClick(id));
  });

  // Auto-pause when the tab loses focus
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'playing') togglePause();
  });

  /* ---------- Boot ---------- */
  reset();
  state = 'idle';
  scoreEl.textContent = '0';
  bestEl.textContent = best;
  updatePauseBtn();
})();
</script>
<style>
.sound-btn{position:fixed;top:12px;left:12px;width:38px;height:38px;border:1px solid #1e293b;border-radius:10px;background:rgba(15,23,42,.72);color:#cbd5e1;font-size:16px;line-height:1;cursor:pointer;z-index:99;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sound-btn:hover{background:rgba(30,41,59,.8)}
</style>
<button class="sound-btn" id="soundBtn" aria-label="Toggle sound">♪</button>
<script>
(function () {
  "use strict";
  var AC = window.AudioContext || window.webkitAudioContext;
  var ctx = null, master = null, musicGain = null, noiseBuf = null;
  var muted = false, musicOn = false, timer = null, step = 0, nextT = 0;

  var LEAD = [784,784,880.01,880.01,987.78,987.78,1174.67,1174.67,1318.53,1174.67,987.78,880.01,784,0,784,0];
  var BASS = [196,293.67,196,0,196,293.67,196,0,196,293.67,196,0,196,293.67,196,0];
  var STEP = 0.14;

  try { muted = localStorage.getItem('arcade.muted') === '1'; } catch (e) {}

  function ensureCtx() {
    if (!ctx) {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = muted ? 0 : 0.6;
      master.connect(ctx.destination);
      musicGain = ctx.createGain();
      musicGain.gain.value = 0.5;
      musicGain.connect(master);
      var n = Math.floor(ctx.sampleRate * 0.04);
      noiseBuf = ctx.createBuffer(1, n, ctx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    }
    if (ctx.state === 'suspended') ctx.resume();
  }

  function note(freq, t, dur, type, vol) {
    if (!freq) return;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(musicGain);
    o.start(t); o.stop(t + dur + 0.05);
  }

  function hat(t) {
    var s = ctx.createBufferSource(); s.buffer = noiseBuf;
    var hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7000;
    var g = ctx.createGain(); g.gain.value = 0.05;
    s.connect(hp); hp.connect(g); g.connect(musicGain);
    s.start(t);
  }

  function schedule(i, t) {
    var k = i % LEAD.length;
    note(LEAD[k], t, STEP * 0.9, 'square', 0.16);
    note(BASS[k], t, STEP * 0.95, 'triangle', 0.2);
    hat(t);
  }

  function tick() {
    while (nextT < ctx.currentTime + 0.12) {
      schedule(step, nextT);
      step++;
      nextT += STEP;
    }
  }

  function startMusic() {
    if (musicOn) return;
    ensureCtx();
    musicOn = true;
    nextT = ctx.currentTime + 0.05;
    step = 0;
    timer = setInterval(tick, 25);
  }

  function stopMusic() {
    if (timer) { clearInterval(timer); timer = null; }
    musicOn = false;
    step = 0;
  }

  function setMuted(m) {
    muted = m;
    try { localStorage.setItem('arcade.muted', m ? '1' : '0'); } catch (e) {}
    if (master) master.gain.setTargetAtTime(m ? 0 : 0.6, ctx.currentTime, 0.02);
    var b = document.getElementById('soundBtn');
    if (b) b.textContent = m ? '🔇' : '♪';
  }

  function sync() {
    var pb = document.getElementById('pauseBtn');
    if (pb && pb.classList.contains('show')) { if (!musicOn) startMusic(); }
    else if (musicOn) stopMusic();
  }

  function wire() {
    var sb = document.getElementById('soundBtn');
    if (sb) sb.addEventListener('click', function () { ensureCtx(); setMuted(!muted); });
    window.addEventListener('pointerdown', ensureCtx);
    window.addEventListener('keydown', ensureCtx);
    var pb = document.getElementById('pauseBtn');
    if (pb) new MutationObserver(sync).observe(pb, { attributes: true, attributeFilter: ['class'] });
    var b = document.getElementById('soundBtn');
    if (b) b.textContent = muted ? '🔇' : '♪';
    sync();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', wire);
  else wire();
})();
</script>
<button class="rules-btn" id="rulesBtn">RULES</button>
<div class="rules-panel" id="rulesPanel">
  <div class="rules-card">
    <h2>HOW TO PLAY</h2>
    <p id="rulesText"></p>
    <button id="rulesClose">BACK</button>
  </div>
</div>
<style>
.rules-btn{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);padding:10px 22px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:.18em;color:#cbd5e1;background:rgba(15,23,42,.85);border:1px solid #334155;border-radius:999px;cursor:pointer;display:none;z-index:60}
.rules-btn.show{display:block}
.rules-btn:hover{background:rgba(30,41,59,.9)}
.rules-panel{position:fixed;inset:0;background:rgba(5,9,16,.94);display:none;align-items:center;justify-content:center;padding:20px;z-index:200;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.rules-panel.show{display:flex}
.rules-card{width:min(88vw,440px);max-height:80vh;overflow:auto;background:#0b1220;border:1px solid #1e293b;border-radius:16px;padding:24px;box-shadow:0 30px 60px -25px #000;text-align:center}
.rules-card h2{margin:0 0 14px;font-size:14px;letter-spacing:.24em;color:#4ade80}
.rules-card p{margin:0 0 20px;font-size:13px;line-height:1.9;color:#cbd5e1;letter-spacing:.03em;text-align:left}
.rules-card button{margin:0;padding:10px 26px;font:inherit;font-size:13px;letter-spacing:.18em;color:#04210f;background:linear-gradient(180deg,#86efac,#4ade80);border:0;border-radius:999px;cursor:pointer;box-shadow:0 8px 24px -8px rgba(74,222,128,.8)}
</style>
<script>
(function () {
  "use strict";
  var RULES = "Watch the pads light up in a sequence, then repeat it by clicking the pads in the same order. Each round adds one more step. Pressing a wrong pad ends the game.";
  var btn = document.getElementById('rulesBtn');
  var panel = document.getElementById('rulesPanel');
  var text = document.getElementById('rulesText');
  var close = document.getElementById('rulesClose');
  if (text) text.textContent = RULES;
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' || e.key === 'Esc') {
      e.preventDefault();
      if (panel && panel.classList.contains('show')) { panel.classList.remove('show'); return; }
      try { document.dispatchEvent(new KeyboardEvent('keydown', { key: 'p', bubbles: true, cancelable: true })); } catch (err) {}
    }
  });
  function sync() {
    var pb = document.getElementById('pauseBtn');
    var title = document.getElementById('ovTitle');
    var paused = pb && !pb.classList.contains('show') && title && /PAUSED/i.test(title.textContent || '');
    if (btn) btn.classList.toggle('show', !!paused);
    var ov = document.getElementById('overlay');
    if (ov && !ov.classList.contains('show') && panel) panel.classList.remove('show');
  }
  var pb = document.getElementById('pauseBtn');
  if (pb) new MutationObserver(sync).observe(pb, { attributes: true, attributeFilter: ['class'] });
  var ov = document.getElementById('overlay');
  if (ov) new MutationObserver(sync).observe(ov, { attributes: true, attributeFilter: ['class'] });
  if (btn) btn.addEventListener('click', function () { if (panel) panel.classList.add('show'); });
  if (close) close.addEventListener('click', function () { if (panel) panel.classList.remove('show'); });
  if (panel) panel.addEventListener('click', function (e) { if (e.target === panel) panel.classList.remove('show'); });
  sync();
})();
</script>
<style>
#score{display:inline-block}
#score.pulse{animation:scorePulse .45s ease}
@keyframes scorePulse{
  0%{transform:scale(1);text-shadow:0 0 14px rgba(74,222,128,.45)}
  40%{transform:scale(1.4);text-shadow:0 0 26px rgba(74,222,128,.95)}
  100%{transform:scale(1);text-shadow:0 0 14px rgba(74,222,128,.45)}
}
</style>
<script>
(function () {
  "use strict";
  var el = document.getElementById('score');
  if (!el) return;
  var last = parseInt(el.textContent, 10) || 0;
  var mo = new MutationObserver(function () {
    var cur = parseInt(el.textContent, 10) || 0;
    if (cur > last) {
      el.classList.remove('pulse');
      void el.offsetWidth;
      el.classList.add('pulse');
    }
    last = cur;
  });
  mo.observe(el, { childList: true, characterData: true, subtree: true });
})();
</script>
</body>
</html>
