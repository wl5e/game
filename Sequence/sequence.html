<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Number Sequence</title>
<style>
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0%,#16233a 0%,#070b12 65%);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#cbd5e1;padding:16px;-webkit-tap-highlight-color:transparent;--acc:#a78bfa}
  .wrap{width:min(92vw,460px);display:flex;flex-direction:column;gap:12px}
  .hud{display:flex;justify-content:space-between;align-items:baseline;gap:6px;flex-wrap:wrap;font-size:11px;letter-spacing:.08em;color:#64748b}
  .hud b{color:var(--acc);font-size:19px;font-weight:800;margin-left:5px;letter-spacing:0}
  .area{background:#0b1220;border:1px solid #1e293b;border-radius:16px;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:18px;text-align:center;user-select:none;position:relative;overflow:hidden;transition:box-shadow .12s ease}
  .area.good{box-shadow:0 0 0 3px var(--acc),0 0 48px -6px var(--acc)}
  .area.bad{box-shadow:0 0 0 3px #f87171,0 0 48px -6px #f87171;animation:shake .38s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  @keyframes popIn{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
  .pop{animation:popIn .18s ease}
  button{font-family:inherit;border:0;border-radius:10px;padding:11px 15px;font-size:14px;font-weight:700;background:var(--acc);color:#160d2a;cursor:pointer}
  button:active{transform:translateY(1px)}
  .go{width:100%}
  .hint{color:#64748b;font-size:11px;text-align:center;line-height:1.6}
  .big{font-size:26px;font-weight:800;line-height:1.2}
  .opts{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
  .opt{background:#15202e;border:1px solid #2a3b4d;color:#e2e8f0;border-radius:10px;padding:12px 16px;font-size:16px;font-weight:700;cursor:pointer;min-width:66px}
  .opt:hover{border-color:var(--acc)}
  .over{display:flex;flex-direction:column;align-items:center;gap:8px}
  .o-title{font-size:14px;letter-spacing:.16em;color:#64748b}
  .o-score{font-size:46px;font-weight:800;color:var(--acc)}
  .o-sub{font-size:13px;color:#94a3b8}
  .o-sub.rec{color:var(--acc)}
</style>
<script src="../audio.js"></script>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>SÉRIE <b id="score">0</b></span><span>BEST <b id="best">—</b></span></div>
  <div class="area" id="area"></div>
  <button id="go" class="go">Rejouer</button>
  <div class="hint">Trouve le nombre suivant dans la suite. Une erreur = fin.</div>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const KEY='sequence.best';
let best=0; try{best=parseInt(localStorage.getItem(KEY)||'0',10)||0}catch(e){}
function upd(){ $('#best').textContent=best?best:'—'; }
function saveHigh(v){ if(v>best){best=v;try{localStorage.setItem('sequence.best',String(v))}catch(e){}upd();return true;} return false; }
const sfx=n=>{ try{window.Arcade&&window.Arcade.sfx(n);}catch(e){} };
function flash(good){ const a=$('#area'); a.classList.remove('good','bad'); void a.offsetWidth; a.classList.add(good?'good':'bad'); clearTimeout(flash._t); flash._t=setTimeout(()=>a.classList.remove('good','bad'),420); }
function popEl(el){ if(!el) return; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }

let streak=0, running=false, ans=0;

function makeOpts(ans, span){
  const set=new Set([ans]); let guard=0;
  while(set.size<4 && guard<300){ const off=Math.floor(Math.random()*(span*2+1))-span; const v=ans+off; if(v!==ans && v>=0) set.add(v); guard++; }
  let k=1; while(set.size<4){ set.add(ans+k); k++; }
  return [...set].sort(()=>Math.random()-0.5);
}
function renderOpts(arr){ $('#opts').innerHTML=arr.map(v=>`<button class="opt" data-v="${v}">${v}</button>`).join(''); $('#opts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>judge(parseInt(b.dataset.v,10))); }

function newQuestion(){
  const type=Math.floor(Math.random()*100);
  let terms=[];
  if(type<70){ // suite arithmétique
    const start=1+Math.floor(Math.random()*12), step=1+Math.floor(Math.random()*6);
    terms=[start,start+step,start+2*step,start+3*step]; ans=start+4*step;
  } else if(type<88){ // suite géométrique
    const start=1+Math.floor(Math.random()*3), mult=(Math.random()<0.5?2:3);
    terms=[start,start*mult,start*mult*mult,start*mult*mult*mult]; ans=terms[3]*mult;
  } else { // carrés
    const start=1+Math.floor(Math.random()*4);
    terms=[start*start,(start+1)*(start+1),(start+2)*(start+2),(start+3)*(start+3)]; ans=(start+4)*(start+4);
  }
  $('#seq').textContent=terms.join(', ')+', ?';
  popEl($('#seq'));
  renderOpts(makeOpts(ans, Math.max(4, Math.round(ans*0.22))));
}
function judge(v){
  if(!running) return;
  if(v===ans){ streak++; $('#score').textContent=streak; sfx('correct'); flash(true); newQuestion(); }
  else { sfx('wrong'); flash(false); endGame(); }
}
function overHTML(title,sc,rec){ return `<div class="over"><div class="o-title">${title}</div><div class="o-score">${sc}</div><div class="o-sub${rec?' rec':''}">${rec?'NOUVEAU RECORD !':'Appuie sur Rejouer pour recommencer'}</div></div>`; }
function endGame(){
  if(!running) return; running=false;
  const rec=saveHigh(streak); sfx(rec?'win':'lose');
  $('#area').innerHTML=overHTML('PERDU !', streak, rec);
}
function start(){
  streak=0; running=true; $('#score').textContent='0';
  $('#area').innerHTML='<div class="big pop" id="seq">2, 4, 6, 8, ?</div><div class="opts" id="opts"></div>';
  newQuestion();
}
$('#go').onclick=start;
document.addEventListener('keydown',e=>{ if(!running && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); start(); } });
upd();
start();
</script>
</body>
</html>
