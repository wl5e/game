<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Asteroids</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    background: radial-gradient(120% 80% at 50% 0%, #241a5a 0%, #05030f 65%);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #cbd5e1;
    padding: 16px;
    -webkit-tap-highlight-color: transparent;
  }

  .wrap {
    width: min(88vw, 480px);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .hud {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 12px;
    letter-spacing: .16em;
    color: #64748b;
  }
  .hud b {
    color: #4ade80;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .02em;
    margin-left: 6px;
    text-shadow: 0 0 14px rgba(74, 222, 128, .45);
  }

  .board {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 16px;
    overflow: hidden;
    background: #0b1220;
    box-shadow:
      0 0 0 1px #1e293b,
      0 0 0 6px rgba(15, 23, 42, .55),
      0 30px 60px -25px #000;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  .pause-btn {
    position: fixed;
    top: 12px;
    right: 12px;
    width: 36px;
    height: 36px;
    display: none;
    align-items: center;
    justify-content: center;
    border: 1px solid #1e293b;
    border-radius: 10px;
    background: rgba(15, 23, 42, .72);
    color: #cbd5e1;
    font-size: 12px;
    letter-spacing: 0;
    cursor: pointer;
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    z-index: 90;
  }
  .pause-btn.show { display: flex; }
  .pause-btn:hover { background: rgba(30, 41, 59, .8); }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 24px;
    background: rgba(5, 9, 16, .82);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  .overlay h1 {
    margin: 0;
    font-size: clamp(26px, 8vw, 40px);
    letter-spacing: .22em;
    color: #e2e8f0;
    text-shadow: 0 0 26px rgba(74, 222, 128, .35);
  }
  .overlay p {
    margin: 0;
    font-size: 13px;
    line-height: 1.7;
    color: #94a3b8;
    letter-spacing: .06em;
    max-width: 30ch;
  }

  button {
    margin-top: 4px;
    padding: 12px 30px;
    font: inherit;
    font-size: 14px;
    letter-spacing: .18em;
    color: #04210f;
    background: linear-gradient(180deg, #86efac, #4ade80);
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 24px -8px rgba(74, 222, 128, .8);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 12px 28px -8px rgba(74, 222, 128, .9); }
  button:active { transform: translateY(1px) scale(.98); }

  .hint {
    margin: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: .14em;
    color: #475569;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="hud">
    <div>SCORE<b id="score">0</b></div>
    <div>BEST<b id="best">0</b></div>
  </div>

  <div class="board">
    <canvas id="game"></canvas>
    <button class="pause-btn" id="pauseBtn" aria-label="Pause">❚❚</button>
    <div class="overlay show" id="overlay">
      <h1 id="ovTitle">ASTEROIDS</h1>
      <p id="ovText">Arrow keys or A/D to rotate, W or Arrow Up to thrust, Space to fire. Blast the drifting rocks before they hit you.</p>
      <button id="ovBtn">PLAY</button>
      <button id="ovBtn2" style="display:none">RESTART</button>
    </div>
  </div>

  <p class="hint">ARROWS / A D ROTATE &nbsp;·&nbsp; W THRUST &nbsp;·&nbsp; SPACE FIRE &nbsp;·&nbsp; P PAUSE &nbsp;·&nbsp; R RESTART</p>
</div>

<script>
(() => {
  "use strict";

  /* ---------- Setup ---------- */
  const W = 480;
  const H = 480;

  const canvas  = document.getElementById('game');
  const ctx     = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText  = document.getElementById('ovText');
  const ovBtn   = document.getElementById('ovBtn');
  const ovBtn2  = document.getElementById('ovBtn2');
  const pauseBtn = document.getElementById('pauseBtn');
  const scoreEl = document.getElementById('score');
  const bestEl  = document.getElementById('best');

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);

  /* ---------- Constants ---------- */
  const SHIP_R = 12;
  const ROT_SPEED = 4.6;
  const THRUST = 330;
  const MAX_SPEED = 360;
  const DRAG = 0.55;
  const BULLET_SPEED = 470;
  const BULLET_LIFE = 1.0;
  const FIRE_MS = 210;
  const INVULN_MS = 2500;
  const AST = { 3: { r: 36, score: 20 }, 2: { r: 21, score: 50 }, 1: { r: 11, score: 100 } };

  /* ---------- State ---------- */
  let ship, asteroids, bullets, stars;
  let score, lives, wave, invulnUntil, fireAt, waveTimer;
  let thrusting = false;
  let last = 0;
  let state = 'idle'; // 'idle' | 'playing' | 'paused' | 'over'
  const keys = new Set();
  let mouseDown = false;

  let best = 0;
  try { best = parseInt(localStorage.getItem('asteroids.best') || '0', 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  /* ---------- Helpers ---------- */
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function wrap(v, max) { return ((v % max) + max) % max; }

  function updateHud() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
  }

  function showOverlay(title, text, btnLabel, btn2Label) {
    ovTitle.textContent = title;
    ovText.textContent = text;
    ovBtn.textContent = btnLabel;
    if (btn2Label) { ovBtn2.textContent = btn2Label; ovBtn2.style.display = ''; }
    else { ovBtn2.style.display = 'none'; }
    overlay.classList.add('show');
  }

  function hideOverlay() {
    overlay.classList.remove('show');
  }

  function updatePauseBtn() { pauseBtn.classList.toggle('show', state === 'playing'); }

  /* ---------- Entities ---------- */
  function makeAsteroid(x, y, size) {
    const n = 8 + ((Math.random() * 6) | 0);
    const verts = [];
    for (let i = 0; i < n; i++) verts.push(rnd(0.72, 1.28));
    const spd = rnd(26, 72);
    const ang = rnd(0, Math.PI * 2);
    return {
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      size,
      r: AST[size].r,
      verts,
      rot: rnd(0, Math.PI * 2),
      rotSpd: rnd(-1.6, 1.6)
    };
  }

  function spawnWave() {
    const count = 4 + wave;
    for (let i = 0; i < count; i++) {
      let x = W / 2, y = H / 2;
      for (let t = 0; t < 40; t++) {
        x = rnd(36, W - 36);
        y = rnd(36, H - 36);
        const dx = x - W / 2, dy = y - H / 2;
        if (dx * dx + dy * dy > 130 * 130) break;
      }
      asteroids.push(makeAsteroid(x, y, 3));
    }
  }

  function respawnShip() {
    ship = { x: W / 2, y: H / 2, angle: -Math.PI / 2, vx: 0, vy: 0 };
  }

  function splitAsteroid(a) {
    score += AST[a.size].score;
    updateHud();
    if (a.size > 1) {
      const ns = a.size - 1;
      for (let i = 0; i < 2; i++) {
        const n = makeAsteroid(a.x, a.y, ns);
        const boost = rnd(30, 90);
        n.vx = a.vx * 0.4 + Math.cos(rnd(0, Math.PI * 2)) * boost;
        n.vy = a.vy * 0.4 + Math.sin(rnd(0, Math.PI * 2)) * boost;
        asteroids.push(n);
      }
    }
  }

  function shoot() {
    const now = performance.now();
    if (now < fireAt) return;
    fireAt = now + FIRE_MS;
    const nx = Math.cos(ship.angle), ny = Math.sin(ship.angle);
    bullets.push({
      x: ship.x + nx * (SHIP_R + 5),
      y: ship.y + ny * (SHIP_R + 5),
      vx: ship.vx * 0.6 + nx * BULLET_SPEED,
      vy: ship.vy * 0.6 + ny * BULLET_SPEED,
      life: BULLET_LIFE
    });
  }

  function loseLife() {
    lives--;
    if (lives <= 0) { gameOver(); return; }
    respawnShip();
    invulnUntil = performance.now() + INVULN_MS;
    bullets = [];
  }

  /* ---------- Flow ---------- */
  function reset() {
    respawnShip();
    asteroids = [];
    bullets = [];
    stars = [];
    for (let i = 0; i < 70; i++) {
      stars.push({ x: rnd(0, W), y: rnd(0, H), r: rnd(0.5, 1.7), a: rnd(0.2, 0.8), t: rnd(0, 2000) });
    }
    score = 0;
    lives = 3;
    wave = 0;
    waveTimer = 0;
    fireAt = 0;
    thrusting = false;
    invulnUntil = performance.now() + 1500;
    keys.clear();
    mouseDown = false;
    spawnWave();
    updateHud();
  }

  function start() {
    reset();
    state = 'playing';
    hideOverlay();
    updatePauseBtn();
    last = performance.now();
  }

  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      keys.clear();
      mouseDown = false;
      showOverlay('PAUSED', 'The rocks are frozen in place. Press P or hit resume.', 'RESUME', 'RESTART');
    } else if (state === 'paused') {
      state = 'playing';
      hideOverlay();
      last = performance.now();
    }
    updatePauseBtn();
  }

  function gameOver() {
    state = 'over';
    updatePauseBtn();
    if (score > best) {
      best = score;
      try { localStorage.setItem('asteroids.best', String(best)); } catch (e) {}
      updateHud();
    }
    showOverlay(
      'GAME OVER',
      `You scored ${score} point${score === 1 ? '' : 's'} across ${wave + 1} wave${wave + 1 === 1 ? '' : 's'}. Best: ${best}.`,
      'PLAY AGAIN'
    );
  }

  /* ---------- Update ---------- */
  function update(s) {
    if (keys.has('left')) ship.angle -= ROT_SPEED * s;
    if (keys.has('right')) ship.angle += ROT_SPEED * s;
    thrusting = keys.has('thrust');
    if (thrusting) {
      ship.vx += Math.cos(ship.angle) * THRUST * s;
      ship.vy += Math.sin(ship.angle) * THRUST * s;
    }
    const spd = Math.hypot(ship.vx, ship.vy);
    if (spd > MAX_SPEED) { ship.vx *= MAX_SPEED / spd; ship.vy *= MAX_SPEED / spd; }
    ship.vx *= Math.exp(-DRAG * s);
    ship.vy *= Math.exp(-DRAG * s);
    ship.x = wrap(ship.x + ship.vx * s, W);
    ship.y = wrap(ship.y + ship.vy * s, H);

    if (keys.has('fire') || mouseDown) shoot();

    for (const b of bullets) {
      b.x = wrap(b.x + b.vx * s, W);
      b.y = wrap(b.y + b.vy * s, H);
      b.life -= s;
    }
    bullets = bullets.filter(b => b.life > 0);

    for (const a of asteroids) {
      a.x = wrap(a.x + a.vx * s, W);
      a.y = wrap(a.y + a.vy * s, H);
      a.rot += a.rotSpd * s;
    }

    for (let i = asteroids.length - 1; i >= 0; i--) {
      const a = asteroids[i];
      for (let j = bullets.length - 1; j >= 0; j--) {
        const b = bullets[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const rr = a.r * 0.9;
        if (dx * dx + dy * dy < rr * rr) {
          bullets.splice(j, 1);
          asteroids.splice(i, 1);
          splitAsteroid(a);
          break;
        }
      }
    }

    if (performance.now() > invulnUntil) {
      for (const a of asteroids) {
        const dx = a.x - ship.x, dy = a.y - ship.y;
        const rr = a.r * 0.82 + SHIP_R * 0.9;
        if (dx * dx + dy * dy < rr * rr) { loseLife(); break; }
      }
    }

    if (asteroids.length === 0 && waveTimer === 0) waveTimer = performance.now() + 1300;
    if (waveTimer !== 0 && performance.now() > waveTimer) {
      waveTimer = 0;
      wave++;
      spawnWave();
    }
  }

  /* ---------- Rendering ---------- */
  function drawAsteroid(a) {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.rot);
    ctx.beginPath();
    const n = a.verts.length;
    for (let i = 0; i < n; i++) {
      const ang = (i / n) * Math.PI * 2;
      const rr = a.r * a.verts[i];
      const px = Math.cos(ang) * rr, py = Math.sin(ang) * rr;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = '#1e293b';
    ctx.fill();
    ctx.strokeStyle = 'rgba(148, 163, 184, .55)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
  }

  function drawShip() {
    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.rotate(ship.angle);

    if (thrusting) {
      ctx.beginPath();
      ctx.moveTo(-SHIP_R * 0.5, 0);
      ctx.lineTo(-SHIP_R * 1.7, SHIP_R * 0.5);
      ctx.lineTo(-SHIP_R * 0.9, 0);
      ctx.lineTo(-SHIP_R * 1.7, -SHIP_R * 0.5);
      ctx.closePath();
      ctx.fillStyle = 'rgba(74, 222, 128, .8)';
      ctx.fill();
    }

    ctx.beginPath();
    ctx.moveTo(SHIP_R, 0);
    ctx.lineTo(-SHIP_R * 0.85, SHIP_R * 0.8);
    ctx.lineTo(-SHIP_R * 0.45, 0);
    ctx.lineTo(-SHIP_R * 0.85, -SHIP_R * 0.8);
    ctx.closePath();
    ctx.fillStyle = '#0b1220';
    ctx.fill();
    ctx.strokeStyle = '#86efac';
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.shadowColor = 'rgba(74, 222, 128, .7)';
    ctx.shadowBlur = 12;
    ctx.stroke();
    ctx.restore();
  }

  function drawLives() {
    for (let i = 0; i < lives; i++) {
      const x = 20 + i * 24, y = 22;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(-Math.PI / 2);
      ctx.beginPath();
      ctx.moveTo(8, 0);
      ctx.lineTo(-7, 6);
      ctx.lineTo(-4, 0);
      ctx.lineTo(-7, -6);
      ctx.closePath();
      ctx.strokeStyle = '#4ade80';
      ctx.lineWidth = 1.5;
      ctx.lineJoin = 'round';
      ctx.stroke();
      ctx.restore();
    }
  }

  function draw(t) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#0b1220';
    ctx.fillRect(0, 0, W, H);

    for (const s of stars) {
      s.a = 0.2 + 0.5 * Math.abs(Math.sin(t / 900 + s.t));
      ctx.globalAlpha = s.a;
      ctx.fillStyle = '#cbd5e1';
      ctx.fillRect(s.x, s.y, s.r, s.r);
    }
    ctx.globalAlpha = 1;

    for (const a of asteroids) drawAsteroid(a);

    ctx.fillStyle = '#e2e8f0';
    for (const b of bullets) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }

    const blink = performance.now() < invulnUntil && ((performance.now() / 90) | 0) % 2 === 0;
    if (ship && !blink) drawShip();

    drawLives();
  }

  /* ---------- Main loop ---------- */
  function loop(t) {
    requestAnimationFrame(loop);
    if (!last) last = t;
    const dt = Math.min(t - last, 100);
    last = t;
    if (state === 'playing') update(Math.min(dt / 1000, 0.033));
    draw(t);
  }

  /* ---------- Input ---------- */
  const KEYMAP = {
    ArrowLeft: 'left', a: 'left', A: 'left',
    ArrowRight: 'right', d: 'right', D: 'right',
    ArrowUp: 'thrust', w: 'thrust', W: 'thrust'
  };

  window.addEventListener('keydown', (e) => {
    const k = e.key;
    if (k === ' ' || k === 'Spacebar' || k.startsWith('Arrow')) e.preventDefault();

    if (k === 'r' || k === 'R') { start(); return; }

    if (k === 'p' || k === 'P') {
      if (state === 'playing' || state === 'paused') togglePause();
      return;
    }

    if (k === ' ' || k === 'Spacebar') {
      if (state === 'idle' || state === 'over') { start(); return; }
      if (state === 'paused') { togglePause(); return; }
      keys.add('fire');
      return;
    }

    const mapped = KEYMAP[k];
    if (!mapped) return;
    if (state === 'idle' || state === 'over') start();
    if (state === 'paused') return;
    keys.add(mapped);
  });

  window.addEventListener('keyup', (e) => {
    const k = e.key;
    if (k === ' ' || k === 'Spacebar') keys.delete('fire');
    const mapped = KEYMAP[k];
    if (mapped) keys.delete(mapped);
  });

  ovBtn.addEventListener('click', () => {
    ovBtn.blur();
    if (state === 'paused') togglePause();
    else start();
  });

  ovBtn2.addEventListener('click', () => {
    ovBtn2.blur();
    start();
  });

  pauseBtn.addEventListener('click', () => {
    pauseBtn.blur();
    if (state === 'playing') togglePause();
  });

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (state === 'idle' || state === 'over') { start(); return; }
    if (state === 'paused') return;
    mouseDown = true;
    shoot();
  });

  window.addEventListener('pointerup', () => { mouseDown = false; });
  window.addEventListener('pointercancel', () => { mouseDown = false; });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'playing') togglePause();
  });

  /* ---------- Boot ---------- */
  reset();
  state = 'idle';
  updatePauseBtn();
  requestAnimationFrame(loop);
})();
</script>
<style>
.sound-btn{position:fixed;top:12px;left:12px;width:38px;height:38px;border:1px solid #1e293b;border-radius:10px;background:rgba(15,23,42,.72);color:#cbd5e1;font-size:16px;line-height:1;cursor:pointer;z-index:99;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sound-btn:hover{background:rgba(30,41,59,.8)}
</style>
<button class="sound-btn" id="soundBtn" aria-label="Toggle sound">♪</button>
<script>
(function () {
  "use strict";
  var AC = window.AudioContext || window.webkitAudioContext;
  var ctx = null, master = null, musicGain = null, noiseBuf = null;
  var muted = false, musicOn = false, timer = null, step = 0, nextT = 0;

  var LEAD = [587.32,698.45,879.99,1046.49,879.99,698.45,587.32,0,587.32,698.45,879.99,1046.49,879.99,698.45,587.32,0];
  var BASS = [146.83,220,146.83,0,146.83,220,146.83,0,146.83,220,146.83,0,146.83,220,146.83,0];
  var STEP = 0.11;

  try { muted = localStorage.getItem('arcade.muted') === '1'; } catch (e) {}

  function ensureCtx() {
    if (!ctx) {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = muted ? 0 : 0.6;
      master.connect(ctx.destination);
      musicGain = ctx.createGain();
      musicGain.gain.value = 0.5;
      musicGain.connect(master);
      var n = Math.floor(ctx.sampleRate * 0.04);
      noiseBuf = ctx.createBuffer(1, n, ctx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    }
    if (ctx.state === 'suspended') ctx.resume();
  }

  function note(freq, t, dur, type, vol) {
    if (!freq) return;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(musicGain);
    o.start(t); o.stop(t + dur + 0.05);
  }

  function hat(t) {
    var s = ctx.createBufferSource(); s.buffer = noiseBuf;
    var hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7000;
    var g = ctx.createGain(); g.gain.value = 0.05;
    s.connect(hp); hp.connect(g); g.connect(musicGain);
    s.start(t);
  }

  function schedule(i, t) {
    var k = i % LEAD.length;
    note(LEAD[k], t, STEP * 0.9, 'sawtooth', 0.16);
    note(BASS[k], t, STEP * 0.95, 'sine', 0.2);
    hat(t);
  }

  function tick() {
    while (nextT < ctx.currentTime + 0.12) {
      schedule(step, nextT);
      step++;
      nextT += STEP;
    }
  }

  function startMusic() {
    if (musicOn) return;
    ensureCtx();
    musicOn = true;
    nextT = ctx.currentTime + 0.05;
    step = 0;
    timer = setInterval(tick, 25);
  }

  function stopMusic() {
    if (timer) { clearInterval(timer); timer = null; }
    musicOn = false;
    step = 0;
  }

  function setMuted(m) {
    muted = m;
    try { localStorage.setItem('arcade.muted', m ? '1' : '0'); } catch (e) {}
    if (master) master.gain.setTargetAtTime(m ? 0 : 0.6, ctx.currentTime, 0.02);
    var b = document.getElementById('soundBtn');
    if (b) b.textContent = m ? '🔇' : '♪';
  }

  function sync() {
    var pb = document.getElementById('pauseBtn');
    if (pb && pb.classList.contains('show')) { if (!musicOn) startMusic(); }
    else if (musicOn) stopMusic();
  }

  function wire() {
    var sb = document.getElementById('soundBtn');
    if (sb) sb.addEventListener('click', function () { ensureCtx(); setMuted(!muted); });
    window.addEventListener('pointerdown', ensureCtx);
    window.addEventListener('keydown', ensureCtx);
    var pb = document.getElementById('pauseBtn');
    if (pb) new MutationObserver(sync).observe(pb, { attributes: true, attributeFilter: ['class'] });
    var b = document.getElementById('soundBtn');
    if (b) b.textContent = muted ? '🔇' : '♪';
    sync();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', wire);
  else wire();
})();
</script>
<button class="rules-btn" id="rulesBtn">RULES</button>
<div class="rules-panel" id="rulesPanel">
  <div class="rules-card">
    <h2>HOW TO PLAY</h2>
    <p id="rulesText"></p>
    <button id="rulesClose">BACK</button>
  </div>
</div>
<style>
.rules-btn{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);padding:10px 22px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:.18em;color:#cbd5e1;background:rgba(15,23,42,.85);border:1px solid #334155;border-radius:999px;cursor:pointer;display:none;z-index:60}
.rules-btn.show{display:block}
.rules-btn:hover{background:rgba(30,41,59,.9)}
.rules-panel{position:fixed;inset:0;background:rgba(5,9,16,.94);display:none;align-items:center;justify-content:center;padding:20px;z-index:200;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.rules-panel.show{display:flex}
.rules-card{width:min(88vw,440px);max-height:80vh;overflow:auto;background:#0b1220;border:1px solid #1e293b;border-radius:16px;padding:24px;box-shadow:0 30px 60px -25px #000;text-align:center}
.rules-card h2{margin:0 0 14px;font-size:14px;letter-spacing:.24em;color:#4ade80}
.rules-card p{margin:0 0 20px;font-size:13px;line-height:1.9;color:#cbd5e1;letter-spacing:.03em;text-align:left}
.rules-card button{margin:0;padding:10px 26px;font:inherit;font-size:13px;letter-spacing:.18em;color:#04210f;background:linear-gradient(180deg,#86efac,#4ade80);border:0;border-radius:999px;cursor:pointer;box-shadow:0 8px 24px -8px rgba(74,222,128,.8)}
</style>
<script>
(function () {
  "use strict";
  var RULES = "Rotate your ship with the Left/Right arrows or A/D, thrust with Up or W, and fire with Space. Shoot asteroids to break them into smaller pieces and clear them from the field. Avoid crashing into them - a hit costs one of your 3 lives. Objects wrap around the screen edges.";
  var btn = document.getElementById('rulesBtn');
  var panel = document.getElementById('rulesPanel');
  var text = document.getElementById('rulesText');
  var close = document.getElementById('rulesClose');
  if (text) text.textContent = RULES;
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' || e.key === 'Esc') {
      e.preventDefault();
      if (panel && panel.classList.contains('show')) { panel.classList.remove('show'); return; }
      try { document.dispatchEvent(new KeyboardEvent('keydown', { key: 'p', bubbles: true, cancelable: true })); } catch (err) {}
    }
  });
  function sync() {
    var pb = document.getElementById('pauseBtn');
    var title = document.getElementById('ovTitle');
    var paused = pb && !pb.classList.contains('show') && title && /PAUSED/i.test(title.textContent || '');
    if (btn) btn.classList.toggle('show', !!paused);
    var ov = document.getElementById('overlay');
    if (ov && !ov.classList.contains('show') && panel) panel.classList.remove('show');
  }
  var pb = document.getElementById('pauseBtn');
  if (pb) new MutationObserver(sync).observe(pb, { attributes: true, attributeFilter: ['class'] });
  var ov = document.getElementById('overlay');
  if (ov) new MutationObserver(sync).observe(ov, { attributes: true, attributeFilter: ['class'] });
  if (btn) btn.addEventListener('click', function () { if (panel) panel.classList.add('show'); });
  if (close) close.addEventListener('click', function () { if (panel) panel.classList.remove('show'); });
  if (panel) panel.addEventListener('click', function (e) { if (e.target === panel) panel.classList.remove('show'); });
  sync();
})();
</script>
<style>
#score{display:inline-block}
#score.pulse{animation:scorePulse .45s ease}
@keyframes scorePulse{
  0%{transform:scale(1);text-shadow:0 0 14px rgba(74,222,128,.45)}
  40%{transform:scale(1.4);text-shadow:0 0 26px rgba(74,222,128,.95)}
  100%{transform:scale(1);text-shadow:0 0 14px rgba(74,222,128,.45)}
}
</style>
<script>
(function () {
  "use strict";
  var el = document.getElementById('score');
  if (!el) return;
  var last = parseInt(el.textContent, 10) || 0;
  var mo = new MutationObserver(function () {
    var cur = parseInt(el.textContent, 10) || 0;
    if (cur > last) {
      el.classList.remove('pulse');
      void el.offsetWidth;
      el.classList.add('pulse');
    }
    last = cur;
  });
  mo.observe(el, { childList: true, characterData: true, subtree: true });
})();
</script>
