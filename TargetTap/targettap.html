<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Target Tap</title>
<style>
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0%,#16233a 0%,#070b12 65%);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#cbd5e1;padding:16px;-webkit-tap-highlight-color:transparent;user-select:none}
  .wrap{width:min(92vw,460px);display:flex;flex-direction:column;gap:12px}
  .hud{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.15em;color:#64748b}
  .hud b{color:#38bdf8;font-size:20px;font-weight:700;margin-left:6px}
  .area{background:#0b1220;border:1px solid #1e293b;border-radius:16px;overflow:hidden;position:relative;touch-action:manipulation}
  canvas{display:block;width:100%;height:auto}
  button{font-family:inherit;border:0;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:700;background:#0ea5e9;color:#04222a;cursor:pointer;letter-spacing:.03em;touch-action:manipulation}
  button:active{transform:translateY(1px) scale(.98)}
  .hint{color:#64748b;font-size:11px;text-align:center;line-height:1.6}
</style>
<script src="../audio.js"></script>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>TOUCHÉS <b id="score">0</b></span><span>BEST <b id="best">—</b></span></div>
  <div class="area" id="area"><canvas id="cv" width="420" height="230"></canvas></div>
  <button id="go">Rejouer</button>
  <div class="hint">Tape la cible <b>avant qu'elle ne rétrécisse</b>.<br>20 secondes — objectif : 20 cibles ou plus.</div>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const sfx=n=>{ try{ if(window.Arcade) window.Arcade.sfx(n); }catch(e){} };
const KEY='targettap.best', DUR=20000, PAR=20;
let best=0; try{ best=parseInt(localStorage.getItem(KEY)||'0',10)||0; }catch(e){}
function upd(){ $('#best').textContent=best?best:'—'; }
function save(v){ if(v>best){ best=v; try{ localStorage.setItem('targettap.best',String(v)); }catch(e){} } upd(); }

const cv=$('#cv'), c=cv.getContext('2d');
const W=cv.width, H=cv.height;
const scoreEl=$('#score');
let hits=0, state='idle', raf=null, startAt=0, endAt=0;
let tgt={x:W/2,y:H/2,r:27,born:0,life:1400};
let fx=[], flashKind=null, flashUntil=0;

function place(){ tgt.x=32+Math.random()*(W-64); tgt.y=36+Math.random()*(H-72); tgt.born=performance.now(); }
function flash(k){ flashKind=k; flashUntil=performance.now()+200; }
function start(){
  hits=0; state='go'; scoreEl.textContent='0';
  startAt=performance.now(); endAt=startAt+DUR;
  fx=[]; place(); cancelAnimationFrame(raf); loop();
}
function loop(){
  if(state!=='go') return;
  const now=performance.now();
  const left=endAt-now;
  if(left<=0){ end(); return; }
  if(now-tgt.born>tgt.life){ flash('bad'); sfx('wrong'); place(); }
  draw(now,left);
  raf=requestAnimationFrame(loop);
}
function end(){
  state='end'; cancelAnimationFrame(raf);
  save(hits);
  c.fillStyle='#0b1220'; c.fillRect(0,0,W,H);
  c.textAlign='center';
  c.fillStyle='#38bdf8'; c.font='bold 28px monospace';
  c.fillText(hits+' cibles', W/2, H/2-8);
  c.fillStyle='#64748b'; c.font='13px monospace';
  c.fillText((hits===best && hits>0)?'Nouveau record !':('Best : '+(best?best:'—')), W/2, H/2+22);
  sfx(hits>=PAR?'win':'pop');
}
function draw(now,left){
  c.clearRect(0,0,W,H);
  c.fillStyle='#0b1220'; c.fillRect(0,0,W,H);
  // countdown
  const frac=Math.max(0,left/DUR);
  c.fillStyle='#1e293b'; c.fillRect(10,10,W-20,6);
  c.fillStyle='#38bdf8'; c.fillRect(10,10,(W-20)*frac,6);
  c.fillStyle='#64748b'; c.font='bold 12px monospace'; c.textAlign='right';
  c.fillText((left/1000).toFixed(1)+'s', W-10,30);
  // target
  const lifeFrac=Math.max(0,Math.min(1,(now-tgt.born)/tgt.life));
  const ring=tgt.r*(0.55+0.45*lifeFrac);
  c.fillStyle='rgba(56,189,248,.20)'; c.beginPath(); c.arc(tgt.x,tgt.y,tgt.r,0,Math.PI*2); c.fill();
  c.strokeStyle='#38bdf8'; c.lineWidth=3;
  c.beginPath(); c.arc(tgt.x,tgt.y,ring,0,Math.PI*2); c.stroke();
  c.fillStyle='#e0f2fe'; c.beginPath(); c.arc(tgt.x,tgt.y,tgt.r*0.34,0,Math.PI*2); c.fill();
  // floating +1
  c.textAlign='center';
  fx=fx.filter(f=>now-f.born<f.life);
  fx.forEach(f=>{ const p=(now-f.born)/f.life; c.globalAlpha=1-p; c.fillStyle='#4ade80'; c.font='bold 16px monospace'; c.fillText(f.t,f.x,f.y-p*24); c.globalAlpha=1; });
  // flash overlay
  if(now<flashUntil){
    c.fillStyle = flashKind==='good' ? 'rgba(34,197,94,.25)' : 'rgba(239,68,68,.25)';
    c.fillRect(0,0,W,H);
  }
}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(state!=='go') return;
  const rct=cv.getBoundingClientRect();
  const x=(e.clientX-rct.left)*(W/rct.width), y=(e.clientY-rct.top)*(H/rct.height);
  if((x-tgt.x)**2+(y-tgt.y)**2 < tgt.r*tgt.r){
    hits++; scoreEl.textContent=hits;
    fx.push({x:tgt.x,y:tgt.y,t:'+1',born:performance.now(),life:600});
    flash('good'); sfx('pop'); place();
  } else { flash('bad'); sfx('wrong'); }
});
$('#go').addEventListener('click',start);
start(); upd();
</script>
</body>
</html>
