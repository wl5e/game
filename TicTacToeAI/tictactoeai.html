<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Tic-Tac-Toe AI</title>
<style>
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0%,#16233a 0%,#070b12 65%);font-family:ui-monospace,Menlo,Consolas,monospace;color:#cbd5e1;padding:16px;-webkit-tap-highlight-color:transparent}
  .wrap{width:min(92vw,460px);display:flex;flex-direction:column;gap:12px}
  .hud{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.15em;color:#64748b}
  .hud b{color:#38bdf8;font-size:20px;margin-left:6px}
  .area{background:#0b1220;border:1px solid #1e293b;border-radius:14px;min-height:230px;display:grid;place-items:center;padding:16px;text-align:center;user-select:none;position:relative;overflow:hidden}
  button{font-family:inherit;border:0;border-radius:10px;padding:11px 15px;font-size:14px;font-weight:700;background:#0ea5e9;color:#04222a;cursor:pointer}
  button:active{transform:translateY(1px)}
  .hint{color:#64748b;font-size:11px;text-align:center;line-height:1.6}
  .big{font-size:26px;font-weight:800}
  .opt{background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:10px;padding:10px 14px;font-size:16px;font-weight:700;margin:4px;cursor:pointer}
  .opt:hover{border-color:#38bdf8}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>VICTOIRES <b id="score">0</b></span><span>BEST <b id="best">—</b></span></div>
  <div class="area" id="area"><div id="g" style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:210px;margin:0 auto"></div></div>
  <button id="go">Rejouer</button>
  <div class="hint">Morpion contre l'IA. 5 manches.</div>
</div>
<script>
const $=s=>document.querySelector(s);
let best=0;try{best=parseInt(localStorage.getItem('tictactoeai.best')||'0',10)||0}catch(e){}
function saveHigh(v){ if(v>best){best=v;try{localStorage.setItem('tictactoeai.best',String(v))}catch(e){}} upd(); }
function saveLow(v){ if(best===0||v<best){best=v;try{localStorage.setItem('tictactoeai.best',String(v))}catch(e){}} upd(); }
function upd(){ $('#best').textContent=best?best:'—'; }
let b=Array(9).fill(null), wins=0, games=5, over=false;
function render(){ const g=$('#g'); g.innerHTML=''; b.forEach((v,i)=>{ const d=document.createElement('div'); d.style.cssText='width:64px;height:64px;border-radius:10px;background:#1e293b;border:1px solid #334155;display:grid;place-items:center;font-size:26px;font-weight:800;cursor:pointer'; d.textContent=v||''; d.onclick=()=>move(i); g.appendChild(d); }); }
function win(p){ const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]; return L.some(l=>l.every(i=>b[i]===p)); }
function move(i){ if(over||b[i]) return; b[i]='X'; if(win('X')){ wins++; $('#score').textContent=wins; return end(); } if(b.every(x=>x)) return end(); render(); setTimeout(ai,250); }
function ai(){ if(over) return; const e=b.map((v,i)=>v?null:i).filter(x=>x!==null); if(e.length){ b[e[Math.floor(Math.random()*e.length)]]='O'; } if(win('O')) return end(); if(b.every(x=>x)) return end(); render(); }
function end(){ over=true; render(); games--; if(games<=0){ saveHigh(wins); $('#area').insertAdjacentHTML('beforeend','<div class="big">'+wins+' victoires</div>'); } else { setTimeout(()=>{ b=Array(9).fill(null); over=false; render(); },900); } }
$('#go').onclick=()=>{ b=Array(9).fill(null); wins=0; games=5; over=false; $('#score').textContent='0'; render(); };
upd();
</script>
</body>
</html>
