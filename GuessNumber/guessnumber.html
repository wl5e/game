<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Guess the Number</title>
<style>
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0%,#16233a 0%,#070b12 65%);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#cbd5e1;padding:16px;-webkit-tap-highlight-color:transparent}
  .wrap{width:min(92vw,460px);display:flex;flex-direction:column;gap:12px}
  .hud{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.15em;color:#64748b}
  .hud b{color:#38bdf8;font-size:20px;margin-left:6px}
  .area{background:#0b1220;border:1px solid #1e293b;border-radius:16px;min-height:270px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center;user-select:none;position:relative;overflow:hidden}
  button{font-family:inherit;border:0;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:700;background:#0ea5e9;color:#04222a;cursor:pointer}
  button.big{width:100%}
  button:active{transform:translateY(1px)}
  .hint{color:#64748b;font-size:11px;text-align:center;line-height:1.6}
  #range{font-size:12px;letter-spacing:.2em;color:#64748b}
  #msg{font-size:22px;font-weight:800;color:#fbbf24;min-height:30px;transition:color .15s}
  #msg.good{color:#4ade80}
  #msg.bad{color:#f87171}
  input{background:#0a1322;border:1px solid #334155;border-radius:10px;color:#e2e8f0;padding:10px;font-size:22px;text-align:center;width:120px;font-family:inherit}
  input:focus{outline:none;border-color:#38bdf8}
  .row{display:flex;gap:8px;align-items:center}
  #hist{max-height:80px;overflow-y:auto;font-size:12px;color:#64748b;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  #hist span{background:#111c2c;border:1px solid #1a2738;border-radius:8px;padding:3px 8px}
  #hist span.up{color:#4ade80}
  #hist span.down{color:#fbbf24}
  .overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(7,11,18,.9);z-index:5;text-align:center}
  .overlay .t{font-size:26px;font-weight:800;color:#4ade80}
  .overlay .s{color:#94a3b8;margin-top:10px;font-size:13px;line-height:1.6}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
  .shake{animation:shake .3s}
</style>
<script src="../audio.js"></script>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>ESSAIS <b id="score">0</b></span><span>BEST <b id="best">—</b></span></div>
  <div class="area" id="area">
    <div id="range">1 – 100</div>
    <div id="msg">Devine le nombre…</div>
    <div class="row"><input id="in" type="number" min="1" max="100" inputmode="numeric" /><button id="ok">OK</button></div>
    <div id="hist"></div>
  </div>
  <button class="big" id="go">Rejouer</button>
  <div class="hint">Trouve le nombre secret entre 1 et 100. Moins d'essais = mieux. · Par 7</div>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
let best=0;try{best=parseInt(localStorage.getItem('guessnumber.best')||'0',10)||0}catch(e){}
function upd(){ $('#best').textContent=best?best:'—'; }
function saveLow(v){ if(best===0||v<best){ best=v; try{localStorage.setItem('guessnumber.best',String(v))}catch(e){} upd(); } }

let target=0, tries=0, lo=1, hi=100, over=false;

function guess(){
  if(over) return;
  const v=parseInt($('#in').value,10);
  $('#in').value='';
  if(isNaN(v)) return;
  tries++; $('#score').textContent=tries;
  const msg=$('#msg');

  if(v===target){
    over=true;
    msg.textContent='Trouvé en '+tries+' essai(s) !';
    msg.classList.add('good');
    Arcade.sfx('win');
    saveLow(tries);
    $('#in').disabled=true; $('#ok').disabled=true;
    showOver('Bravo !', 'Le nombre était '+target+'<br>Trouvé en '+tries+' essai(s)'+(tries<=best?' · nouveau record !':''));
    return;
  }
  if(v<target){
    lo=Math.max(lo, v+1);
    msg.textContent='Plus grand ↑'; msg.classList.remove('good'); msg.classList.add('bad');
    Arcade.sfx('tick');
    addHist(v,'up');
  } else {
    hi=Math.min(hi, v-1);
    msg.textContent='Plus petit ↓'; msg.classList.remove('good'); msg.classList.add('bad');
    Arcade.sfx('tick');
    addHist(v,'down');
  }
  setTimeout(()=>msg.classList.remove('bad'),250);
  $('#range').textContent=lo+' – '+hi;
}

function addHist(v,cls){
  const s=document.createElement('span'); s.className=cls; s.textContent=v;
  $('#hist').appendChild(s);
}

function showOver(t,s){
  const ov=document.createElement('div'); ov.className='overlay'; ov.innerHTML='<div><div class="t">'+t+'</div><div class="s">'+s+'</div></div>';
  $('#area').appendChild(ov);
}

function reset(){
  target=1+Math.floor(Math.random()*100);
  tries=0; lo=1; hi=100; over=false;
  $('#score').textContent='0';
  $('#range').textContent='1 – 100';
  const msg=$('#msg'); msg.textContent='Devine le nombre…'; msg.className='';
  $('#hist').innerHTML='';
  $('#in').disabled=false; $('#ok').disabled=false; $('#in').value='';
  const ov=$('.overlay'); if(ov) ov.remove();
  upd();
  $('#in').focus();
}
$('#ok').onclick=guess;
$('#in').onkeydown=e=>{ if(e.key==='Enter') guess(); };
$('#go').onclick=reset;
upd();
reset();
</script>
</body>
</html>
