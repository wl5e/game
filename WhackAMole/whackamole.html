<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Whack-a-Mole</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    background: radial-gradient(120% 80% at 50% 0%, #1a4a0a 0%, #050f02 65%);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #cbd5e1;
    padding: 16px;
    -webkit-tap-highlight-color: transparent;
  }

  .wrap {
    width: min(88vw, 480px);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .hud {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 12px;
    letter-spacing: .16em;
    color: #64748b;
  }
  .hud b {
    color: #4ade80;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .02em;
    margin-left: 6px;
    text-shadow: 0 0 14px rgba(74, 222, 128, .45);
  }

  .board {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 16px;
    overflow: hidden;
    background: #0b1220;
    box-shadow:
      0 0 0 1px #1e293b,
      0 0 0 6px rgba(15, 23, 42, .55),
      0 30px 60px -25px #000;
  }

  .grid {
    position: absolute;
    top: 46px;
    left: 0;
    right: 0;
    bottom: 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    padding: 14px;
  }

  .cell {
    position: relative;
    overflow: hidden;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  .hole {
    position: absolute;
    left: 12%;
    right: 12%;
    bottom: 5%;
    height: 32%;
    border-radius: 50%;
    background: #04070d;
    box-shadow: inset 0 8px 14px rgba(0, 0, 0, .85), 0 0 0 1px #1e293b;
  }
  .mole {
    position: absolute;
    left: 50%;
    bottom: 16%;
    transform: translate(-50%, 200%);
    transition: transform .15s ease;
    font-size: clamp(30px, 9vw, 46px);
    line-height: 1;
  }
  .cell.up .mole { transform: translate(-50%, -55%); }
  .cell.hit .hole {
    box-shadow: inset 0 8px 14px rgba(0, 0, 0, .85), 0 0 0 1px #1e293b, 0 0 16px rgba(74, 222, 128, .55);
  }

  .timer {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .1em;
    color: #4ade80;
    text-shadow: 0 0 14px rgba(74, 222, 128, .45);
  }
  .timer.low { color: #ff4d6d; text-shadow: 0 0 14px rgba(255, 77, 109, .45); }

  .pause-btn {
    position: fixed;
    top: 12px;
    right: 12px;
    width: 36px;
    height: 36px;
    display: none;
    align-items: center;
    justify-content: center;
    border: 1px solid #1e293b;
    border-radius: 10px;
    background: rgba(15, 23, 42, .72);
    color: #cbd5e1;
    font-size: 12px;
    letter-spacing: 0;
    cursor: pointer;
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    z-index: 90;
  }
  .pause-btn.show { display: flex; }
  .pause-btn:hover { background: rgba(30, 41, 59, .8); }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 24px;
    background: rgba(5, 9, 16, .82);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  .overlay h1 {
    margin: 0;
    font-size: clamp(26px, 8vw, 40px);
    letter-spacing: .22em;
    color: #e2e8f0;
    text-shadow: 0 0 26px rgba(74, 222, 128, .35);
  }
  .overlay p {
    margin: 0;
    font-size: 13px;
    line-height: 1.7;
    color: #94a3b8;
    letter-spacing: .06em;
    max-width: 30ch;
  }

  button {
    margin-top: 4px;
    padding: 12px 30px;
    font: inherit;
    font-size: 14px;
    letter-spacing: .18em;
    color: #04210f;
    background: linear-gradient(180deg, #86efac, #4ade80);
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 24px -8px rgba(74, 222, 128, .8);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 12px 28px -8px rgba(74, 222, 128, .9); }
  button:active { transform: translateY(1px) scale(.98); }

  .hint {
    margin: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: .14em;
    color: #475569;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="hud">
    <div>SCORE<b id="score">0</b></div>
    <div>BEST<b id="best">0</b></div>
  </div>

  <div class="board">
    <div class="grid" id="grid"></div>
    <div class="timer" id="timer">30</div>
    <button class="pause-btn" id="pauseBtn" aria-label="Pause">❚❚</button>
    <div class="overlay show" id="overlay">
      <h1 id="ovTitle">WHACK-A-MOLE</h1>
      <p id="ovText">Whack the moles before the 30-second clock runs out.</p>
      <button id="ovBtn">PLAY</button>
      <button id="ovBtn2" style="display:none">RESTART</button>
    </div>
  </div>

  <p class="hint">CLICK / TAP &nbsp;·&nbsp; SPACE PAUSE &nbsp;·&nbsp; R RESTART</p>
</div>

<script>
(() => {
  "use strict";

  /* ---------- Setup ---------- */
  const SIZE = 9;
  const DURATION = 30000;             // 30s round
  const MOLE_MIN = 650, MOLE_MAX = 1100;
  const SPAWN_MIN = 500, SPAWN_MAX = 900;

  const grid     = document.getElementById('grid');
  const overlay  = document.getElementById('overlay');
  const ovTitle  = document.getElementById('ovTitle');
  const ovText   = document.getElementById('ovText');
  const ovBtn    = document.getElementById('ovBtn');
  const ovBtn2   = document.getElementById('ovBtn2');
  const pauseBtn = document.getElementById('pauseBtn');
  const scoreEl  = document.getElementById('score');
  const bestEl   = document.getElementById('best');
  const timerEl  = document.getElementById('timer');

  /* ---------- State ---------- */
  let cells = [];
  let score = 0;
  let elapsed = 0;      // ms elapsed this round
  let remaining = DURATION;
  let spawnTimer = 0;
  let last = 0;         // last frame timestamp
  let state = 'idle';   // 'idle' | 'playing' | 'paused' | 'over'

  let best = 0;
  try { best = parseInt(localStorage.getItem('whackamole.best') || '0', 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  /* ---------- Helpers ---------- */
  function updateHud() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
  }

  function updateTimer() {
    const secs = Math.max(0, Math.ceil(remaining / 1000));
    timerEl.textContent = secs;
    timerEl.classList.toggle('low', secs <= 5);
  }

  function showOverlay(title, text, btnLabel, btn2Label) {
    ovTitle.textContent = title;
    ovText.textContent = text;
    ovBtn.textContent = btnLabel;
    if (btn2Label) { ovBtn2.textContent = btn2Label; ovBtn2.style.display = ''; }
    else { ovBtn2.style.display = 'none'; }
    overlay.classList.add('show');
  }

  function hideOverlay() {
    overlay.classList.remove('show');
  }

  function updatePauseBtn() { pauseBtn.classList.toggle('show', state === 'playing'); }

  /* ---------- Board ---------- */
  function buildGrid() {
    grid.innerHTML = '';
    cells = [];
    for (let i = 0; i < SIZE; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';

      const mole = document.createElement('div');
      mole.className = 'mole';
      mole.textContent = '🦫';
      const hole = document.createElement('div');
      hole.className = 'hole';

      cell.appendChild(mole);
      cell.appendChild(hole);
      cell.addEventListener('click', () => whack(cell));

      grid.appendChild(cell);
      cells.push(cell);
    }
  }

  /* ---------- Game logic ---------- */
  function whack(cell) {
    if (state !== 'playing' || !cell.classList.contains('up')) return;
    cell.classList.remove('up');
    cell.classList.add('hit');
    score++;
    updateHud();
    setTimeout(() => cell.classList.remove('hit'), 200);
  }

  function spawnMoles() {
    const empty = cells.filter((c) => !c.classList.contains('up'));
    if (!empty.length) return;
    const count = Math.random() < 0.32 ? 2 : 1;
    const n = Math.min(count, empty.length);
    for (let i = 0; i < n; i++) {
      const idx = (Math.random() * empty.length) | 0;
      const cell = empty.splice(idx, 1)[0];
      cell.classList.add('up');
      const dur = MOLE_MIN + Math.random() * (MOLE_MAX - MOLE_MIN);
      setTimeout(() => cell.classList.remove('up'), dur);
    }
  }

  function scheduleSpawn() {
    if (state !== 'playing') return;
    const delay = SPAWN_MIN + Math.random() * (SPAWN_MAX - SPAWN_MIN);
    spawnTimer = setTimeout(() => {
      if (state !== 'playing') return;
      spawnMoles();
      scheduleSpawn();
    }, delay);
  }

  function gameOver() {
    state = 'over';
    updatePauseBtn();
    clearTimeout(spawnTimer);
    cells.forEach((c) => c.classList.remove('up', 'hit'));
    if (score > best) {
      best = score;
      try { localStorage.setItem('whackamole.best', String(best)); } catch (e) {}
    }
    updateHud();
    showOverlay('TIME\'S UP!', `You whacked ${score} mole${score === 1 ? '' : 's'}. Best: ${best}.`, 'PLAY AGAIN');
  }

  function reset() {
    clearTimeout(spawnTimer);
    cells.forEach((c) => c.classList.remove('up', 'hit'));
    score = 0;
    elapsed = 0;
    remaining = DURATION;
    updateHud();
    updateTimer();
  }

  function start() {
    reset();
    state = 'playing';
    hideOverlay();
    updatePauseBtn();
    last = performance.now();
    scheduleSpawn();
  }

  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      clearTimeout(spawnTimer);
      showOverlay('PAUSED', 'The clock is frozen. Ready to continue?', 'RESUME', 'RESTART');
    } else if (state === 'paused') {
      state = 'playing';
      hideOverlay();
      last = performance.now();
      scheduleSpawn();
    }
    updatePauseBtn();
  }

  /* ---------- Main loop ---------- */
  function loop(t) {
    requestAnimationFrame(loop);

    if (!last) last = t;
    const dt = Math.min(t - last, 100);
    last = t;

    if (state === 'playing') {
      elapsed += dt;
      remaining = DURATION - elapsed;
      updateTimer();
      if (remaining <= 0) gameOver();
    }
  }

  /* ---------- Input ---------- */
  window.addEventListener('keydown', (e) => {
    const k = e.key;

    if (k === ' ' || k === 'Spacebar' || k.startsWith('Arrow')) e.preventDefault();

    if (k === 'r' || k === 'R') { start(); return; }

    if (k === ' ' || k === 'Spacebar' || k === 'p' || k === 'P') {
      if (state === 'playing' || state === 'paused') togglePause();
      else start();
    }
  });

  ovBtn.addEventListener('click', () => {
    ovBtn.blur();
    if (state === 'paused') togglePause();
    else start();
  });

  ovBtn2.addEventListener('click', () => {
    ovBtn2.blur();
    start();
  });

  pauseBtn.addEventListener('click', () => {
    pauseBtn.blur();
    if (state === 'playing') togglePause();
  });

  // Auto-pause when the tab loses focus
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'playing') togglePause();
  });

  /* ---------- Boot ---------- */
  buildGrid();
  reset();
  state = 'idle';
  updatePauseBtn();
  requestAnimationFrame(loop);
})();
</script>
<style>
.sound-btn{position:fixed;top:12px;left:12px;width:38px;height:38px;border:1px solid #1e293b;border-radius:10px;background:rgba(15,23,42,.72);color:#cbd5e1;font-size:16px;line-height:1;cursor:pointer;z-index:99;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sound-btn:hover{background:rgba(30,41,59,.8)}
</style>
<button class="sound-btn" id="soundBtn" aria-label="Toggle sound">♪</button>
<script>
(function () {
  "use strict";
  var AC = window.AudioContext || window.webkitAudioContext;
  var ctx = null, master = null, musicGain = null, noiseBuf = null;
  var muted = false, musicOn = false, timer = null, step = 0, nextT = 0;

  var LEAD = [987.74,932.31,879.98,783.97,659.24,783.97,879.98,932.31,987.74,1174.63,987.74,932.31,879.98,783.97,659.24,0];
  var BASS = [164.81,246.94,164.81,0,164.81,246.94,164.81,0,164.81,246.94,164.81,0,164.81,246.94,164.81,0];
  var STEP = 0.12;

  try { muted = localStorage.getItem('arcade.muted') === '1'; } catch (e) {}

  function ensureCtx() {
    if (!ctx) {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = muted ? 0 : 0.6;
      master.connect(ctx.destination);
      musicGain = ctx.createGain();
      musicGain.gain.value = 0.5;
      musicGain.connect(master);
      var n = Math.floor(ctx.sampleRate * 0.04);
      noiseBuf = ctx.createBuffer(1, n, ctx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    }
    if (ctx.state === 'suspended') ctx.resume();
  }

  function note(freq, t, dur, type, vol) {
    if (!freq) return;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(musicGain);
    o.start(t); o.stop(t + dur + 0.05);
  }

  function hat(t) {
    var s = ctx.createBufferSource(); s.buffer = noiseBuf;
    var hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7000;
    var g = ctx.createGain(); g.gain.value = 0.05;
    s.connect(hp); hp.connect(g); g.connect(musicGain);
    s.start(t);
  }

  function schedule(i, t) {
    var k = i % LEAD.length;
    note(LEAD[k], t, STEP * 0.9, 'square', 0.16);
    note(BASS[k], t, STEP * 0.95, 'triangle', 0.2);
    hat(t);
  }

  function tick() {
    while (nextT < ctx.currentTime + 0.12) {
      schedule(step, nextT);
      step++;
      nextT += STEP;
    }
  }

  function startMusic() {
    if (musicOn) return;
    ensureCtx();
    musicOn = true;
    nextT = ctx.currentTime + 0.05;
    step = 0;
    timer = setInterval(tick, 25);
  }

  function stopMusic() {
    if (timer) { clearInterval(timer); timer = null; }
    musicOn = false;
    step = 0;
  }

  function setMuted(m) {
    muted = m;
    try { localStorage.setItem('arcade.muted', m ? '1' : '0'); } catch (e) {}
    if (master) master.gain.setTargetAtTime(m ? 0 : 0.6, ctx.currentTime, 0.02);
    var b = document.getElementById('soundBtn');
    if (b) b.textContent = m ? '🔇' : '♪';
  }

  function sync() {
    var pb = document.getElementById('pauseBtn');
    if (pb && pb.classList.contains('show')) { if (!musicOn) startMusic(); }
    else if (musicOn) stopMusic();
  }

  function wire() {
    var sb = document.getElementById('soundBtn');
    if (sb) sb.addEventListener('click', function () { ensureCtx(); setMuted(!muted); });
    window.addEventListener('pointerdown', ensureCtx);
    window.addEventListener('keydown', ensureCtx);
    var pb = document.getElementById('pauseBtn');
    if (pb) new MutationObserver(sync).observe(pb, { attributes: true, attributeFilter: ['class'] });
    var b = document.getElementById('soundBtn');
    if (b) b.textContent = muted ? '🔇' : '♪';
    sync();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', wire);
  else wire();
})();
</script>
<button class="rules-btn" id="rulesBtn">RULES</button>
<div class="rules-panel" id="rulesPanel">
  <div class="rules-card">
    <h2>HOW TO PLAY</h2>
    <p id="rulesText"></p>
    <button id="rulesClose">BACK</button>
  </div>
</div>
<style>
.rules-btn{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);padding:10px 22px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:.18em;color:#cbd5e1;background:rgba(15,23,42,.85);border:1px solid #334155;border-radius:999px;cursor:pointer;display:none;z-index:60}
.rules-btn.show{display:block}
.rules-btn:hover{background:rgba(30,41,59,.9)}
.rules-panel{position:fixed;inset:0;background:rgba(5,9,16,.94);display:none;align-items:center;justify-content:center;padding:20px;z-index:200;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.rules-panel.show{display:flex}
.rules-card{width:min(88vw,440px);max-height:80vh;overflow:auto;background:#0b1220;border:1px solid #1e293b;border-radius:16px;padding:24px;box-shadow:0 30px 60px -25px #000;text-align:center}
.rules-card h2{margin:0 0 14px;font-size:14px;letter-spacing:.24em;color:#4ade80}
.rules-card p{margin:0 0 20px;font-size:13px;line-height:1.9;color:#cbd5e1;letter-spacing:.03em;text-align:left}
.rules-card button{margin:0;padding:10px 26px;font:inherit;font-size:13px;letter-spacing:.18em;color:#04210f;background:linear-gradient(180deg,#86efac,#4ade80);border:0;border-radius:999px;cursor:pointer;box-shadow:0 8px 24px -8px rgba(74,222,128,.8)}
</style>
<script>
(function () {
  "use strict";
  var RULES = "Whack the moles by clicking or tapping them as they pop up. Each mole you hit scores 1 point. You have 30 seconds - hit as many as you can.";
  var btn = document.getElementById('rulesBtn');
  var panel = document.getElementById('rulesPanel');
  var text = document.getElementById('rulesText');
  var close = document.getElementById('rulesClose');
  if (text) text.textContent = RULES;
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' || e.key === 'Esc') {
      e.preventDefault();
      if (panel && panel.classList.contains('show')) { panel.classList.remove('show'); return; }
      try { document.dispatchEvent(new KeyboardEvent('keydown', { key: 'p', bubbles: true, cancelable: true })); } catch (err) {}
    }
  });
  function sync() {
    var pb = document.getElementById('pauseBtn');
    var title = document.getElementById('ovTitle');
    var paused = pb && !pb.classList.contains('show') && title && /PAUSED/i.test(title.textContent || '');
    if (btn) btn.classList.toggle('show', !!paused);
    var ov = document.getElementById('overlay');
    if (ov && !ov.classList.contains('show') && panel) panel.classList.remove('show');
  }
  var pb = document.getElementById('pauseBtn');
  if (pb) new MutationObserver(sync).observe(pb, { attributes: true, attributeFilter: ['class'] });
  var ov = document.getElementById('overlay');
  if (ov) new MutationObserver(sync).observe(ov, { attributes: true, attributeFilter: ['class'] });
  if (btn) btn.addEventListener('click', function () { if (panel) panel.classList.add('show'); });
  if (close) close.addEventListener('click', function () { if (panel) panel.classList.remove('show'); });
  if (panel) panel.addEventListener('click', function (e) { if (e.target === panel) panel.classList.remove('show'); });
  sync();
})();
</script>
<style>
#score{display:inline-block}
#score.pulse{animation:scorePulse .45s ease}
@keyframes scorePulse{
  0%{transform:scale(1);text-shadow:0 0 14px rgba(74,222,128,.45)}
  40%{transform:scale(1.4);text-shadow:0 0 26px rgba(74,222,128,.95)}
  100%{transform:scale(1);text-shadow:0 0 14px rgba(74,222,128,.45)}
}
</style>
<script>
(function () {
  "use strict";
  var el = document.getElementById('score');
  if (!el) return;
  var last = parseInt(el.textContent, 10) || 0;
  var mo = new MutationObserver(function () {
    var cur = parseInt(el.textContent, 10) || 0;
    if (cur > last) {
      el.classList.remove('pulse');
      void el.offsetWidth;
      el.classList.add('pulse');
    }
    last = cur;
  });
  mo.observe(el, { childList: true, characterData: true, subtree: true });
})();
</script>
</body>
</html>
