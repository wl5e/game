<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Hoops</title>
<style>
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0%,#16233a 0%,#070b12 65%);font-family:ui-monospace,Menlo,Consolas,monospace;color:#cbd5e1;padding:16px;-webkit-tap-highlight-color:transparent}
  .wrap{width:min(92vw,460px);display:flex;flex-direction:column;gap:12px}
  .hud{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.15em;color:#64748b}
  .hud b{color:#38bdf8;font-size:20px;margin-left:6px}
  .area{background:#0b1220;border:1px solid #1e293b;border-radius:14px;display:grid;place-items:center;position:relative;overflow:hidden;user-select:none}
  .area canvas{display:block;border-radius:14px}
  button{font-family:inherit;border:0;border-radius:10px;padding:11px 15px;font-size:14px;font-weight:700;background:#0ea5e9;color:#04222a;cursor:pointer}
  button:active{transform:translateY(1px)}
  .hint{color:#64748b;font-size:11px;text-align:center;line-height:1.6}
  .ov{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:8px;background:rgba(7,11,18,.86);text-align:center;padding:16px;z-index:5;border-radius:14px}
  .ov .t{font-size:24px;font-weight:800;color:#fff}
  .ov .s{color:#94a3b8;font-size:12px;letter-spacing:.1em}
  .ov.hide{display:none}
</style>
<script src="../audio.js"></script>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>PANIERS <b id="score">0</b></span><span>TEMPS <b id="time">30</b></span><span>BEST <b id="best">—</b></span></div>
  <div class="area" id="area"><canvas id="cv" width="420" height="230"></canvas><div class="ov hide" id="ov"></div></div>
  <button id="go">Rejouer</button>
  <div class="hint">Objectif : 20 paniers en 30 s. Aligne le tireur sous le panier (◀ ▶ ou glisse) puis clique pour lancer.</div>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
let best=0;try{best=parseInt(localStorage.getItem('hoops.best')||'0',10)||0}catch(e){}
function saveHigh(v){ if(v>best){best=v;try{localStorage.setItem('hoops.best',String(v))}catch(e){}} upd(); }
function upd(){ $('#best').textContent=best?best:'—'; }
const cv=$('#cv'),c=cv.getContext('2d'),area=$('#area'),ov=$('#ov');
const DUR=30, HOOP_Y=52, HOOP_H=22, GRAV=0.5, SHOT_Y=cv.height-30;
let hoop,hd,shooter,ball,shooting,score,keys,t0,running,raf,last,flashT;
function reset(){
  hoop=cv.width/2; hd=2.4; shooter=cv.width/2;
  ball={x:shooter,y:SHOT_Y,vy:0}; shooting=false; score=0; keys={};
  running=true; t0=performance.now(); last=0; flashT=0;
  $('#score').textContent='0'; $('#time').textContent=DUR;
  ov.classList.add('hide');
  cancelAnimationFrame(raf); raf=requestAnimationFrame(loop);
}
function endGame(){
  running=false; cancelAnimationFrame(raf);
  saveHigh(score);
  Arcade.sfx('win');
  ov.innerHTML='<div class="t">TEMPS ÉCOULÉ</div><div class="s">Paniers : '+score+'</div>';
  ov.classList.remove('hide');
}
function loop(ts){
  if(!running) return;
  const dt=Math.min(0.05,(ts-last)/1000||0.016); last=ts;
  const el=(ts-t0)/1000;
  const rem=Math.max(0,DUR-el);
  $('#time').textContent=Math.ceil(rem);
  if(rem<=0){ draw(el); endGame(); return; }
  const v=300*dt;
  if(keys['ArrowLeft']) shooter-=v;
  if(keys['ArrowRight']) shooter+=v;
  shooter=Math.max(24,Math.min(cv.width-24,shooter));
  hoop+=hd*dt*60; if(hoop<54||hoop>cv.width-54) hd=-hd;
  if(shooting){
    ball.y+=ball.vy*dt*60; ball.vy+=GRAV*dt*60;
    // score only on the way down through the rim
    if(ball.vy>0 && ball.y>=HOOP_Y && ball.y<=HOOP_Y+HOOP_H && Math.abs(ball.x-hoop)<30){
      score++; $('#score').textContent=score;
      flashT=0.35; Arcade.sfx('coin');
      shooting=false;
    } else if(ball.y>cv.height-20){
      shooting=false; Arcade.sfx('tick');
    }
  }
  if(!shooting){ ball.y=SHOT_Y; ball.x=shooter; }
  if(flashT>0) flashT-=dt;
  draw(el);
  raf=requestAnimationFrame(loop);
}
function draw(el){
  c.clearRect(0,0,cv.width,cv.height);
  // hoop + rim
  c.strokeStyle='#f97316'; c.lineWidth=5; c.lineCap='round';
  c.beginPath(); c.moveTo(hoop-30,HOOP_Y+HOOP_H); c.lineTo(hoop-30,HOOP_Y); c.lineTo(hoop+30,HOOP_Y); c.lineTo(hoop+30,HOOP_Y+HOOP_H); c.stroke();
  c.strokeStyle='rgba(249,115,22,.4)'; c.lineWidth=1;
  for(let i=1;i<4;i++){ const yy=HOOP_Y+i*5; c.beginPath(); c.moveTo(hoop-30+i*4,HOOP_Y); c.lineTo(hoop-16+i*6,yy); c.moveTo(hoop+30-i*4,HOOP_Y); c.lineTo(hoop+16-i*6,yy); c.stroke(); }
  // ball
  c.fillStyle='#fbbf24'; c.beginPath(); c.arc(ball.x,ball.y,10,0,7); c.fill();
  c.strokeStyle='rgba(0,0,0,.3)'; c.beginPath(); c.arc(ball.x,ball.y,10,0,7); c.stroke();
  // shooter
  c.fillStyle='#38bdf8'; c.fillRect(shooter-16,cv.height-22,32,14);
  c.fillRect(shooter-4,cv.height-30,8,8);
  if(flashT>0){ c.fillStyle='rgba(74,222,128,.9)'; c.font='bold 16px monospace'; c.textAlign='center'; c.fillText('+1',hoop,HOOP_Y+HOOP_H+16); }
  c.fillStyle='#64748b'; c.font='bold 12px monospace'; c.textAlign='left'; c.fillText(Math.ceil(Math.max(0,DUR-el))+'s',10,16);
}
cv.addEventListener('pointermove',e=>{
  if(!running) return;
  const r=cv.getBoundingClientRect();
  shooter=(e.clientX-r.left)*(cv.width/r.width);
  shooter=Math.max(24,Math.min(cv.width-24,shooter));
});
cv.addEventListener('pointerdown',()=>{
  if(!running) return;
  if(!shooting){ shooting=true; ball.y=SHOT_Y; ball.x=shooter; ball.vy=-12.5; Arcade.sfx('whoosh'); }
});
document.addEventListener('keydown',e=>{ keys[e.key]=true; if(['ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault(); });
document.addEventListener('keyup',e=>{ keys[e.key]=false; });
$('#go').onclick=reset;
upd();
reset();
</script>
</body>
</html>
