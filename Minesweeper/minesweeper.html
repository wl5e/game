<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Minesweeper</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    background: radial-gradient(120% 80% at 50% 0%, #1a2433 0%, #050a12 65%);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #cbd5e1;
    padding: 16px;
    -webkit-tap-highlight-color: transparent;
  }

  .wrap {
    width: min(88vw, 480px);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .hud {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 12px;
    letter-spacing: .16em;
    color: #64748b;
  }
  .hud b {
    color: #4ade80;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .02em;
    margin-left: 6px;
    text-shadow: 0 0 14px rgba(74, 222, 128, .45);
  }

  .board {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 16px;
    overflow: hidden;
    background: #0b1220;
    box-shadow:
      0 0 0 1px #1e293b,
      0 0 0 6px rgba(15, 23, 42, .55),
      0 30px 60px -25px #000;
  }

  .ms-grid {
    position: absolute;
    inset: 0;
    padding: 10px;
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    grid-template-rows: repeat(9, 1fr);
    gap: 4px;
  }

  .cell {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, .05);
    border-radius: 6px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  .cell.rev {
    background: rgba(15, 23, 42, .85);
    cursor: default;
  }
  .cell.flag::before {
    content: '';
    position: absolute;
    width: 0;
    height: 0;
    border-left: 9px solid #f87171;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
    transform: translateX(-1px);
  }
  .cell.mine::after {
    content: '';
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #e2e8f0;
    box-shadow: 0 0 8px rgba(226, 232, 240, .6);
  }
  .cell.boom {
    background: rgba(244, 63, 94, .42);
  }

  .pause-btn {
    position: fixed;
    top: 12px;
    right: 12px;
    width: 36px;
    height: 36px;
    display: none;
    align-items: center;
    justify-content: center;
    border: 1px solid #1e293b;
    border-radius: 10px;
    background: rgba(15, 23, 42, .72);
    color: #cbd5e1;
    font-size: 12px;
    letter-spacing: 0;
    cursor: pointer;
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    z-index: 90;
  }
  .pause-btn.show { display: flex; }
  .pause-btn:hover { background: rgba(30, 41, 59, .8); }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 24px;
    background: rgba(5, 9, 16, .82);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  .overlay h1 {
    margin: 0;
    font-size: clamp(26px, 8vw, 40px);
    letter-spacing: .22em;
    color: #e2e8f0;
    text-shadow: 0 0 26px rgba(74, 222, 128, .35);
  }
  .overlay p {
    margin: 0;
    font-size: 13px;
    line-height: 1.7;
    color: #94a3b8;
    letter-spacing: .06em;
    max-width: 30ch;
  }

  button {
    margin-top: 4px;
    padding: 12px 30px;
    font: inherit;
    font-size: 14px;
    letter-spacing: .18em;
    color: #04210f;
    background: linear-gradient(180deg, #86efac, #4ade80);
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 24px -8px rgba(74, 222, 128, .8);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 12px 28px -8px rgba(74, 222, 128, .9); }
  button:active { transform: translateY(1px) scale(.98); }

  .hint {
    margin: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: .14em;
    color: #475569;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="hud">
    <div>TIME<b id="score">0</b></div>
    <div>MINES<b id="mines">10</b></div>
    <div>BEST<b id="best">--</b></div>
  </div>

  <div class="board">
    <div class="ms-grid" id="grid"></div>
    <button class="pause-btn" id="pauseBtn" aria-label="Pause">❚❚</button>
    <div class="overlay show" id="overlay">
      <h1 id="ovTitle">MINESWEEPER</h1>
      <p id="ovText">Reveal all safe cells without hitting a mine. Left-click to reveal, right-click to flag.</p>
      <button id="ovBtn">PLAY</button>
      <button id="ovBtn2" style="display:none">RESTART</button>
    </div>
  </div>

  <p class="hint">CLICK REVEAL · RIGHT-CLICK / LONG-PRESS FLAG &nbsp;·&nbsp; SPACE / P PAUSE &nbsp;·&nbsp; R RESTART</p>
</div>

<script>
(() => {
  "use strict";

  /* ---------- Setup ---------- */
  const SIZE = 9;
  const MINES = 10;

  const gridEl  = document.getElementById('grid');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText  = document.getElementById('ovText');
  const ovBtn   = document.getElementById('ovBtn');
  const ovBtn2  = document.getElementById('ovBtn2');
  const pauseBtn = document.getElementById('pauseBtn');
  const scoreEl = document.getElementById('score');
  const minesEl = document.getElementById('mines');
  const bestEl  = document.getElementById('best');

  const NUM_COLORS = {
    1: '#60a5fa', 2: '#4ade80', 3: '#f87171', 4: '#c084fc',
    5: '#fbbf24', 6: '#22d3ee', 7: '#f472b6', 8: '#a3e635'
  };

  /* ---------- Neighbors ---------- */
  const NEIGH = Array.from({ length: SIZE * SIZE }, (_, i) => {
    const r = (i / SIZE) | 0;
    const c = i % SIZE;
    const res = [];
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        if (!dr && !dc) continue;
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE) res.push(nr * SIZE + nc);
      }
    }
    return res;
  });

  /* ---------- State ---------- */
  let cells;          // array of {mine, adj, rev, flag}
  let placed;         // mines placed after first reveal
  let seconds;
  let flagged;
  let boomIdx;
  let state = 'idle'; // 'idle' | 'playing' | 'paused' | 'over'

  let best = null;
  try {
    const v = localStorage.getItem('minesweeper.best');
    if (v !== null && v !== '') { const n = parseInt(v, 10); if (!isNaN(n)) best = n; }
  } catch (e) {}

  /* ---------- DOM build ---------- */
  const cellEls = [];
  for (let i = 0; i < SIZE * SIZE; i++) {
    const el = document.createElement('div');
    el.className = 'cell';
    el.dataset.i = i;
    gridEl.appendChild(el);
    cellEls.push(el);
  }

  /* ---------- Helpers ---------- */
  function updateHud() {
    scoreEl.textContent = seconds;
    minesEl.textContent = MINES - flagged;
    bestEl.textContent = best === null ? '--' : best;
  }

  function showOverlay(title, text, btnLabel, btn2Label) {
    ovTitle.textContent = title;
    ovText.textContent = text;
    ovBtn.textContent = btnLabel;
    if (btn2Label) { ovBtn2.textContent = btn2Label; ovBtn2.style.display = ''; }
    else { ovBtn2.style.display = 'none'; }
    overlay.classList.add('show');
  }

  function hideOverlay() {
    overlay.classList.remove('show');
  }

  function updatePauseBtn() { pauseBtn.classList.toggle('show', state === 'playing'); }

  /* ---------- Rendering ---------- */
  function renderCell(i) {
    const c = cells[i];
    const el = cellEls[i];
    el.className = 'cell';
    if (c.rev) el.classList.add('rev');
    if (c.flag) el.classList.add('flag');
    if (c.rev && c.mine) el.classList.add('mine');
    if (c.boom) el.classList.add('boom');
    el.textContent = '';
    el.style.color = '';
    if (c.rev && !c.mine && c.adj > 0) {
      el.textContent = c.adj;
      el.style.color = NUM_COLORS[c.adj] || '#cbd5e1';
    }
  }

  function render() {
    for (let i = 0; i < cells.length; i++) renderCell(i);
  }

  /* ---------- Game logic ---------- */
  function newBoard() {
    cells = Array.from({ length: SIZE * SIZE }, () => ({ mine: false, adj: 0, rev: false, flag: false, boom: false }));
    placed = false;
    seconds = 0;
    flagged = 0;
    boomIdx = -1;
    render();
    updateHud();
  }

  function placeMines(safeIdx) {
    const safe = new Set([safeIdx]);
    for (const n of NEIGH[safeIdx]) safe.add(n);

    const candidates = [];
    for (let i = 0; i < cells.length; i++) if (!safe.has(i)) candidates.push(i);

    for (let n = 0; n < MINES; n++) {
      const j = (Math.random() * candidates.length) | 0;
      const idx = candidates[j];
      candidates[j] = candidates[candidates.length - 1];
      candidates.pop();
      cells[idx].mine = true;
    }

    for (let i = 0; i < cells.length; i++) {
      cells[i].adj = NEIGH[i].reduce((a, n) => a + (cells[n].mine ? 1 : 0), 0);
    }
    placed = true;
  }

  function flood(start) {
    const stack = [start];
    while (stack.length) {
      const i = stack.pop();
      const c = cells[i];
      if (c.rev || c.flag || c.mine) continue;
      c.rev = true;
      if (c.adj === 0) {
        for (const n of NEIGH[i]) stack.push(n);
      }
    }
  }

  function reveal(i) {
    if (state !== 'playing') return;
    const c = cells[i];
    if (c.flag || c.rev) return;
    if (!placed) placeMines(i);
    if (c.mine) { lose(i); return; }
    flood(i);
    render();
    checkWin();
  }

  function toggleFlag(i) {
    if (state !== 'playing') return;
    const c = cells[i];
    if (c.rev) return;
    c.flag = !c.flag;
    flagged += c.flag ? 1 : -1;
    renderCell(i);
    updateHud();
  }

  function checkWin() {
    let revealed = 0;
    for (const c of cells) if (c.rev) revealed++;
    if (revealed === SIZE * SIZE - MINES) win();
  }

  function win() {
    state = 'over';
    updatePauseBtn();
    if (best === null || seconds < best) {
      best = seconds;
      try { localStorage.setItem('minesweeper.best', String(best)); } catch (e) {}
    }
    for (let i = 0; i < cells.length; i++) if (cells[i].mine) cells[i].flag = true;
    flagged = MINES;
    render();
    updateHud();
    showOverlay('YOU WIN!', `Cleared the field in ${seconds}s. Best: ${best}s.`, 'PLAY AGAIN');
  }

  function lose(i) {
    state = 'over';
    updatePauseBtn();
    for (const c of cells) if (c.mine) c.rev = true;
    cells[i].boom = true;
    render();
    showOverlay('GAME OVER', 'You hit a mine. Better luck next time.', 'TRY AGAIN');
  }

  function start() {
    newBoard();
    state = 'playing';
    hideOverlay();
    updatePauseBtn();
  }

  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      showOverlay('PAUSED', 'The timer is frozen. Press space or hit resume.', 'RESUME', 'RESTART');
    } else if (state === 'paused') {
      state = 'playing';
      hideOverlay();
    }
    updatePauseBtn();
  }

  /* ---------- Timer ---------- */
  setInterval(() => {
    if (state === 'playing') {
      seconds++;
      scoreEl.textContent = seconds;
    }
  }, 1000);

  /* ---------- Input ---------- */
  window.addEventListener('keydown', (e) => {
    const k = e.key;
    if (k === ' ' || k === 'Spacebar') e.preventDefault();

    if (k === 'r' || k === 'R') { start(); return; }

    if (k === ' ' || k === 'Spacebar' || k === 'p' || k === 'P') {
      if (state === 'playing' || state === 'paused') togglePause();
      else start();
      return;
    }
  });

  ovBtn.addEventListener('click', () => {
    ovBtn.blur();
    if (state === 'paused') togglePause();
    else start();
  });

  ovBtn2.addEventListener('click', () => {
    ovBtn2.blur();
    start();
  });

  pauseBtn.addEventListener('click', () => {
    pauseBtn.blur();
    if (state === 'playing') togglePause();
  });

  // Mouse controls
  gridEl.addEventListener('click', (e) => {
    if (Date.now() - lastTouchEnd < 500) return; // ignore synthetic click after touch
    const cell = e.target.closest('.cell');
    if (!cell || state !== 'playing') return;
    reveal(+cell.dataset.i);
  });

  gridEl.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    const cell = e.target.closest('.cell');
    if (!cell || state !== 'playing') return;
    toggleFlag(+cell.dataset.i);
  });

  // Touch controls (tap reveals, long-press flags)
  let lpTimer = null;
  let lpIdx = -1;
  let lpFired = false;
  let lpMoved = false;
  let lastTouchEnd = 0;

  gridEl.addEventListener('touchstart', (e) => {
    const cell = e.target && e.target.closest ? e.target.closest('.cell') : null;
    if (!cell || state !== 'playing') return;
    lpIdx = +cell.dataset.i;
    lpMoved = false;
    lpFired = false;
    clearTimeout(lpTimer);
    lpTimer = setTimeout(() => {
      lpFired = true;
      toggleFlag(lpIdx);
    }, 450);
  }, { passive: true });

  gridEl.addEventListener('touchmove', () => { lpMoved = true; }, { passive: true });

  gridEl.addEventListener('touchend', () => {
    clearTimeout(lpTimer);
    lastTouchEnd = Date.now();
    if (lpIdx === -1) return;
    if (!lpMoved && !lpFired && state === 'playing') reveal(lpIdx);
    lpIdx = -1;
  }, { passive: true });

  gridEl.addEventListener('touchcancel', () => {
    clearTimeout(lpTimer);
    lpIdx = -1;
  }, { passive: true });

  // Auto-pause when the tab loses focus
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'playing') togglePause();
  });

  /* ---------- Boot ---------- */
  newBoard();
  state = 'idle';
  updatePauseBtn();
  showOverlay('MINESWEEPER', 'Reveal all safe cells without hitting a mine. Left-click to reveal, right-click to flag.', 'PLAY');
})();
</script>
<style>
.sound-btn{position:fixed;top:12px;left:12px;width:38px;height:38px;border:1px solid #1e293b;border-radius:10px;background:rgba(15,23,42,.72);color:#cbd5e1;font-size:16px;line-height:1;cursor:pointer;z-index:99;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sound-btn:hover{background:rgba(30,41,59,.8)}
</style>
<button class="sound-btn" id="soundBtn" aria-label="Toggle sound">♪</button>
<script>
(function () {
  "use strict";
  var AC = window.AudioContext || window.webkitAudioContext;
  var ctx = null, master = null, musicGain = null, noiseBuf = null;
  var muted = false, musicOn = false, timer = null, step = 0, nextT = 0;

  var LEAD = [783.97,739.97,698.44,622.24,523.24,622.24,698.44,739.97,783.97,932.31,783.97,739.97,698.44,622.24,523.24,0];
  var BASS = [130.81,195.99,130.81,0,130.81,195.99,130.81,0,130.81,195.99,130.81,0,130.81,195.99,130.81,0];
  var STEP = 0.10;

  try { muted = localStorage.getItem('arcade.muted') === '1'; } catch (e) {}

  function ensureCtx() {
    if (!ctx) {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = muted ? 0 : 0.6;
      master.connect(ctx.destination);
      musicGain = ctx.createGain();
      musicGain.gain.value = 0.5;
      musicGain.connect(master);
      var n = Math.floor(ctx.sampleRate * 0.04);
      noiseBuf = ctx.createBuffer(1, n, ctx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    }
    if (ctx.state === 'suspended') ctx.resume();
  }

  function note(freq, t, dur, type, vol) {
    if (!freq) return;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(musicGain);
    o.start(t); o.stop(t + dur + 0.05);
  }

  function hat(t) {
    var s = ctx.createBufferSource(); s.buffer = noiseBuf;
    var hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7000;
    var g = ctx.createGain(); g.gain.value = 0.05;
    s.connect(hp); hp.connect(g); g.connect(musicGain);
    s.start(t);
  }

  function schedule(i, t) {
    var k = i % LEAD.length;
    note(LEAD[k], t, STEP * 0.9, 'square', 0.16);
    note(BASS[k], t, STEP * 0.95, 'triangle', 0.2);
    hat(t);
  }

  function tick() {
    while (nextT < ctx.currentTime + 0.12) {
      schedule(step, nextT);
      step++;
      nextT += STEP;
    }
  }

  function startMusic() {
    if (musicOn) return;
    ensureCtx();
    musicOn = true;
    nextT = ctx.currentTime + 0.05;
    step = 0;
    timer = setInterval(tick, 25);
  }

  function stopMusic() {
    if (timer) { clearInterval(timer); timer = null; }
    musicOn = false;
    step = 0;
  }

  function setMuted(m) {
    muted = m;
    try { localStorage.setItem('arcade.muted', m ? '1' : '0'); } catch (e) {}
    if (master) master.gain.setTargetAtTime(m ? 0 : 0.6, ctx.currentTime, 0.02);
    var b = document.getElementById('soundBtn');
    if (b) b.textContent = m ? '🔇' : '♪';
  }

  function sync() {
    var pb = document.getElementById('pauseBtn');
    if (pb && pb.classList.contains('show')) { if (!musicOn) startMusic(); }
    else if (musicOn) stopMusic();
  }

  function wire() {
    var sb = document.getElementById('soundBtn');
    if (sb) sb.addEventListener('click', function () { ensureCtx(); setMuted(!muted); });
    window.addEventListener('pointerdown', ensureCtx);
    window.addEventListener('keydown', ensureCtx);
    var pb = document.getElementById('pauseBtn');
    if (pb) new MutationObserver(sync).observe(pb, { attributes: true, attributeFilter: ['class'] });
    var b = document.getElementById('soundBtn');
    if (b) b.textContent = muted ? '🔇' : '♪';
    sync();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', wire);
  else wire();
})();
</script>

<script>
(function () {
  "use strict";
  var RULES = "Reveal all the safe cells without hitting a mine. Left-click reveals a cell (numbers show how many mines touch it; empty cells auto-expand). Right-click - or long-press on touch - places a flag. Flag all 10 mines and clear the rest to win.";
  var btn = document.getElementById('rulesBtn');
  var panel = document.getElementById('rulesPanel');
  var text = document.getElementById('rulesText');
  var close = document.getElementById('rulesClose');
  if (text) text.textContent = RULES;
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' || e.key === 'Esc') {
      e.preventDefault();
      if (panel && panel.classList.contains('show')) { panel.classList.remove('show'); return; }
      try { document.dispatchEvent(new KeyboardEvent('keydown', { key: 'p', bubbles: true, cancelable: true })); } catch (err) {}
    }
  });
  function sync() {
    var pb = document.getElementById('pauseBtn');
    var title = document.getElementById('ovTitle');
    var paused = pb && !pb.classList.contains('show') && title && /PAUSED/i.test(title.textContent || '');
    if (btn) btn.classList.toggle('show', !!paused);
    var ov = document.getElementById('overlay');
    if (ov && !ov.classList.contains('show') && panel) panel.classList.remove('show');
  }
  var pb = document.getElementById('pauseBtn');
  if (pb) new MutationObserver(sync).observe(pb, { attributes: true, attributeFilter: ['class'] });
  var ov = document.getElementById('overlay');
  if (ov) new MutationObserver(sync).observe(ov, { attributes: true, attributeFilter: ['class'] });
  if (btn) btn.addEventListener('click', function () { if (panel) panel.classList.add('show'); });
  if (close) close.addEventListener('click', function () { if (panel) panel.classList.remove('show'); });
  if (panel) panel.addEventListener('click', function (e) { if (e.target === panel) panel.classList.remove('show'); });
  sync();
})();
</script>
<style>
#score{display:inline-block}
#score.pulse{animation:scorePulse .45s ease}
@keyframes scorePulse{
  0%{transform:scale(1);text-shadow:0 0 14px rgba(74,222,128,.45)}
  40%{transform:scale(1.4);text-shadow:0 0 26px rgba(74,222,128,.95)}
  100%{transform:scale(1);text-shadow:0 0 14px rgba(74,222,128,.45)}
}
</style>
<script>
(function () {
  "use strict";
  var el = document.getElementById('score');
  if (!el) return;
  var last = parseInt(el.textContent, 10) || 0;
  var mo = new MutationObserver(function () {
    var cur = parseInt(el.textContent, 10) || 0;
    if (cur > last) {
      el.classList.remove('pulse');
      void el.offsetWidth;
      el.classList.add('pulse');
    }
    last = cur;
  });
  mo.observe(el, { childList: true, characterData: true, subtree: true });
})();
</script>
