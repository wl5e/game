<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Color Reflex</title>
<style>
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0%,#16233a 0%,#070b12 65%);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#cbd5e1;padding:16px;-webkit-tap-highlight-color:transparent;user-select:none}
  .wrap{width:min(92vw,460px);display:flex;flex-direction:column;gap:12px}
  .hud{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.15em;color:#64748b}
  .hud b{color:#38bdf8;font-size:20px;font-weight:700;margin-left:6px}
  .area{background:#0b1220;border:1px solid #1e293b;border-radius:16px;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;position:relative;overflow:hidden;transition:background .15s,border-color .15s}
  .area.good{background:#0b2316;border-color:#22c55e}
  .area.bad{background:#2a0f14;border-color:#ef4444;animation:shake .3s}
  .big{font-size:40px;font-weight:800;line-height:1.2}
  .small{color:#64748b;font-size:13px}
  .row{display:flex;gap:12px;width:100%}
  .opt{flex:1;font-family:inherit;border:1px solid #334155;border-radius:12px;padding:18px 10px;font-size:20px;font-weight:800;background:#1e293b;color:#e2e8f0;cursor:pointer;touch-action:manipulation}
  .opt:active{transform:scale(.97)}
  .bar{width:100%;height:8px;border-radius:99px;background:#1e293b;overflow:hidden}
  .fill{height:100%;width:100%;background:#38bdf8;border-radius:99px}
  button{font-family:inherit;border:0;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:700;background:#0ea5e9;color:#04222a;cursor:pointer;letter-spacing:.03em;touch-action:manipulation}
  button:active{transform:translateY(1px) scale(.98)}
  .hint{color:#64748b;font-size:11px;text-align:center;line-height:1.6}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
</style>
<script src="../audio.js"></script>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>BONS <b id="score">0</b></span><span>BEST <b id="best">—</b></span></div>
  <div class="area" id="area">
    <div class="big" id="big">3</div>
    <div class="big" id="word" style="font-size:34px">ROUGE</div>
    <div class="row">
      <button class="opt" id="ok">✔</button>
      <button class="opt" id="no">✘</button>
    </div>
    <div class="bar"><div class="fill" id="fill"></div></div>
  </div>
  <button id="go">Rejouer</button>
  <div class="hint">✔ si la couleur du texte correspond au mot, ✘ sinon.<br>30 secondes — objectif : 20 bons ou plus.</div>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const sfx=n=>{ try{ if(window.Arcade) window.Arcade.sfx(n); }catch(e){} };
const KEY='colorreflex.best', DUR=30000, PAR=20;
let best=0; try{ best=parseInt(localStorage.getItem(KEY)||'0',10)||0; }catch(e){}
function upd(){ $('#best').textContent=best?best:'—'; }
function save(v){ if(v>best){ best=v; try{ localStorage.setItem('colorreflex.best',String(v)); }catch(e){} } upd(); }

const WORDS=['ROUGE','BLEU','VERT','JAUNE','ROSE'];
const INKS={ROUGE:'#f87171',BLEU:'#60a5fa',VERT:'#4ade80',JAUNE:'#facc15',ROSE:'#f472b6'};
const area=$('#area'), big=$('#big'), word=$('#word'), fill=$('#fill'), scoreEl=$('#score');
let score=0, match=false, phase='idle', cd=3, cdTimer=null, raf=null, startAt=0, endAt=0;

function gen(){
  const w=WORDS[Math.floor(Math.random()*WORDS.length)];
  let ink;
  if(Math.random()<0.5){ ink=w; }
  else { const o=WORDS.filter(x=>x!==w); ink=o[Math.floor(Math.random()*o.length)]; }
  word.textContent=w; word.style.color=INKS[ink];
  match=(w===ink);
}
function begin(){
  clearInterval(cdTimer); cancelAnimationFrame(raf);
  phase='countdown'; score=0; cd=3;
  scoreEl.textContent='0'; fill.style.width='100%';
  big.textContent=cd; big.style.color='#38bdf8'; gen();
  cdTimer=setInterval(()=>{
    cd--;
    if(cd>0){ big.textContent=cd; sfx('tick'); }
    else{
      clearInterval(cdTimer);
      phase='go'; startAt=performance.now(); endAt=startAt+DUR;
      big.textContent='GO !'; sfx('whoosh'); loop();
    }
  },700);
}
function loop(){
  if(phase!=='go') return;
  const left=endAt-performance.now();
  if(left<=0){ finish(); return; }
  fill.style.width=(left/DUR*100)+'%';
  big.textContent=(left/1000).toFixed(1)+'s';
  raf=requestAnimationFrame(loop);
}
function finish(){
  phase='end'; cancelAnimationFrame(raf);
  save(score);
  fill.style.width='0%';
  big.textContent=score+' bons';
  word.textContent=score===best && score>0 ? 'Nouveau record !' : 'Best : '+(best?best:'—');
  word.style.color='#38bdf8';
  sfx(score>=PAR?'win':'pop');
}
function judge(v){
  if(phase!=='go') return;
  if(v===match){ score++; scoreEl.textContent=score; area.classList.add('good'); setTimeout(()=>area.classList.remove('good'),180); sfx('correct'); }
  else { area.classList.add('bad'); setTimeout(()=>area.classList.remove('bad'),300); sfx('wrong'); }
  gen();
}
$('#ok').addEventListener('pointerdown',e=>{ e.preventDefault(); judge(true); });
$('#no').addEventListener('pointerdown',e=>{ e.preventDefault(); judge(false); });
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='y'||e.key==='Y'){ e.preventDefault(); judge(true); }
  else if(e.key==='ArrowLeft'||e.key==='n'||e.key==='N'){ e.preventDefault(); judge(false); }
});
$('#go').addEventListener('click',begin);
begin(); upd();
</script>
</body>
</html>
