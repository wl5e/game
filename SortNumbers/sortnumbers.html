<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Sort Numbers</title>
<style>
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0%,#16233a 0%,#070b12 65%);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#cbd5e1;padding:16px;-webkit-tap-highlight-color:transparent}
  .wrap{width:min(92vw,460px);display:flex;flex-direction:column;gap:12px}
  .hud{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.15em;color:#64748b}
  .hud b{color:#38bdf8;font-size:20px;margin-left:6px}
  .area{background:#0b1220;border:1px solid #1e293b;border-radius:16px;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center;user-select:none;position:relative;overflow:hidden}
  button{font-family:inherit;border:0;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:700;background:#0ea5e9;color:#04222a;cursor:pointer}
  button.big{width:100%}
  button:active{transform:translateY(1px)}
  .hint{color:#64748b;font-size:11px;text-align:center;line-height:1.6}
  .msg{font-size:11px;letter-spacing:.2em;color:#64748b;min-height:14px}
  .barwrap{width:100%;height:8px;border-radius:6px;background:#1e293b;overflow:hidden}
  #bar{height:100%;width:100%;background:#38bdf8;border-radius:6px;transition:none}
  #g{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:320px}
  .tile{width:64px;height:64px;border-radius:12px;background:#1e293b;border:1px solid #334155;color:#e2e8f0;font-size:22px;font-weight:800;cursor:pointer;display:grid;place-items:center;transition:background .12s,border-color .12s}
  .tile:active{background:#0e7490}
  .tile.empty{background:transparent;border-color:#16222f;cursor:default;color:#334155}
  .area.goodflash{border-color:#4ade80}
  .overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(7,11,18,.9);z-index:5;text-align:center}
  .overlay .t{font-size:26px;font-weight:800;color:#f87171}
  .overlay .s{color:#94a3b8;margin-top:10px;font-size:13px;line-height:1.6}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
  .shake{animation:shake .3s}
</style>
<script src="../audio.js"></script>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>TOURS <b id="score">0</b></span><span>BEST <b id="best">—</b></span></div>
  <div class="area" id="area">
    <div class="msg" id="msg">Clique dans l'ordre croissant !</div>
    <div class="barwrap"><div id="bar"></div></div>
    <div id="g"></div>
  </div>
  <button class="big" id="go">Rejouer</button>
  <div class="hint">Clique les nombres dans l'<b>ordre croissant</b> (1, 2, 3…). Le temps se réduit à chaque tour. · Par 15 tours</div>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
let best=0;try{best=parseInt(localStorage.getItem('sortnumbers.best')||'0',10)||0}catch(e){}
function upd(){ $('#best').textContent=best?best:'—'; }
function saveHigh(v){ if(v>best){ best=v; try{localStorage.setItem('sortnumbers.best',String(v))}catch(e){} upd(); } }

let vals=[], next=1, rounds=0, active=false, raf=0, start=0, limit=5000;

function render(){
  const g=$('#g'); g.innerHTML='';
  vals.forEach((v,i)=>{
    const b=document.createElement('button');
    b.className='tile'+(v===null?' empty':'');
    b.textContent=v===null?'·':v;
    if(v!==null) b.onclick=()=>tap(i);
    g.appendChild(b);
  });
}
function shuffle(){ vals=Array.from({length:8},(_,i)=>i+1).sort(()=>Math.random()-0.5); }

function newRound(){
  shuffle(); next=1; render();
  limit=Math.max(2400, 5000 - rounds*180);
  start=performance.now();
  active=true;
  $('#msg').textContent='Tour '+(rounds+1);
  cancelAnimationFrame(raf);
  tick();
}
function tick(){
  if(!active) return;
  const left=limit-(performance.now()-start);
  $('#bar').style.width=Math.max(0,left/limit*100)+'%';
  if(left<=0){ lose('Temps écoulé'); return; }
  raf=requestAnimationFrame(tick);
}
function flashGood(){ const a=$('#area'); a.classList.add('goodflash'); setTimeout(()=>a.classList.remove('goodflash'),220); }

function tap(i){
  if(!active) return;
  const v=vals[i];
  if(v===null) return;
  if(v===next){
    vals[i]=null;
    Arcade.sfx('tick'); flashGood();
    next++;
    render();
    if(next>8){
      rounds++; $('#score').textContent=rounds;
      active=false; cancelAnimationFrame(raf);
      Arcade.sfx('correct');
      $('#msg').textContent='✔ Tour terminé !';
      setTimeout(newRound, 520);
    }
  } else {
    lose('Mauvais nombre');
  }
}

function lose(msg){
  if(!active) return;
  active=false; cancelAnimationFrame(raf);
  Arcade.sfx('wrong'); setTimeout(()=>Arcade.sfx('lose'),200);
  const a=$('#area'); a.classList.add('shake'); setTimeout(()=>a.classList.remove('shake'),320);
  saveHigh(rounds);
  showOver('Perdu !', msg+'<br>'+rounds+' tour(s) terminé(s)');
}

function showOver(t,s){
  const ov=document.createElement('div'); ov.className='overlay'; ov.innerHTML='<div><div class="t">'+t+'</div><div class="s">'+s+'</div></div>';
  $('#area').appendChild(ov);
}

function reset(){
  cancelAnimationFrame(raf);
  rounds=0; active=false;
  $('#score').textContent='0';
  $('#msg').textContent='Clique dans l\'ordre croissant !';
  $('#bar').style.width='100%';
  const ov=$('.overlay'); if(ov) ov.remove();
  $('#area').classList.remove('shake','goodflash');
  upd();
  newRound();
}
$('#go').onclick=reset;
upd();
reset();
</script>
</body>
</html>
