<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Card Pairs</title>
<style>
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0%,#16233a 0%,#070b12 65%);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#cbd5e1;padding:16px;-webkit-tap-highlight-color:transparent}
  .wrap{width:min(92vw,460px);display:flex;flex-direction:column;gap:12px}
  .hud{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.15em;color:#64748b}
  .hud b{color:#38bdf8;font-size:20px;margin-left:6px}
  .area{background:#0b1220;border:1px solid #1e293b;border-radius:16px;min-height:300px;display:grid;place-items:center;padding:16px;text-align:center;user-select:none;position:relative;overflow:hidden}
  button{font-family:inherit;border:0;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:700;background:#0ea5e9;color:#04222a;cursor:pointer}
  button.big{width:100%}
  button:active{transform:translateY(1px)}
  .hint{color:#64748b;font-size:11px;text-align:center;line-height:1.6}
  #g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .card{width:64px;height:64px;border-radius:12px;background:#1e293b;border:1px solid #334155;display:grid;place-items:center;font-size:26px;cursor:pointer;transition:background .15s,border-color .15s}
  .card.up{background:#0e7490;border-color:#22d3ee}
  .card.done{background:#15803d;border-color:#4ade80;cursor:default}
  .card.flip{animation:flipIn .25s}
  @keyframes flipIn{from{transform:scale(.5) rotateY(90deg)}to{transform:scale(1) rotateY(0)}}
  .overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(7,11,18,.9);z-index:5;text-align:center}
  .overlay .t{font-size:26px;font-weight:800;color:#4ade80}
  .overlay .s{color:#94a3b8;margin-top:10px;font-size:13px;line-height:1.6}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
  .shake{animation:shake .3s}
</style>
<script src="../audio.js"></script>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>COUPS <b id="score">0</b></span><span>BEST <b id="best">—</b></span></div>
  <div class="area" id="area"><div id="g"></div></div>
  <button class="big" id="go">Rejouer</button>
  <div class="hint">Retourne les cartes et trouve les 6 paires. Moins de coups = mieux. · Par 20</div>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
let best=0;try{best=parseInt(localStorage.getItem('cardpairs.best')||'0',10)||0}catch(e){}
function upd(){ $('#best').textContent=best?best:'—'; }
function saveLow(v){ if(best===0||v<best){ best=v; try{localStorage.setItem('cardpairs.best',String(v))}catch(e){} upd(); } }

const SYM=['🐶','🐱','🐸','🐤','🐙','🦊'];
let cards=[], open=[], moves=0, matched=0, lock=false;

function render(){
  const gg=$('#g'); gg.innerHTML='';
  cards.forEach((c,i)=>{
    const d=document.createElement('div');
    d.className='card'+(c.up?' up':'')+(c.done?' done':'');
    d.textContent=(c.up||c.done)?c.s:'?';
    d.onclick=()=>flip(i);
    gg.appendChild(d);
  });
}
function anim(i){
  const el=$('#g').children[i];
  if(el){ el.classList.add('flip'); setTimeout(()=>el.classList.remove('flip'),280); }
}

function flip(i){
  if(lock||cards[i].up||cards[i].done) return;
  cards[i].up=true; open.push(i);
  Arcade.sfx('click');
  render(); anim(i);
  if(open.length===2){
    moves++; $('#score').textContent=moves;
    const [a,b]=open;
    if(cards[a].s===cards[b].s){
      lock=true;
      setTimeout(()=>{
        cards[a].done=cards[b].done=true; cards[a].up=cards[b].up=false; open=[];
        matched+=2; lock=false;
        Arcade.sfx('correct');
        render(); anim(a); anim(b);
        if(matched===cards.length) win();
      },360);
    } else {
      lock=true;
      setTimeout(()=>{
        cards[a].up=cards[b].up=false; open=[]; lock=false;
        Arcade.sfx('wrong');
        render(); anim(a); anim(b);
      },800);
    }
  }
}

function win(){
  Arcade.sfx('win');
  saveLow(moves);
  showOver('Gagné !', moves+' coups'+(moves<=best?' · nouveau record !':' · record '+best));
}

function showOver(t,s){
  const ov=document.createElement('div'); ov.className='overlay'; ov.innerHTML='<div><div class="t">'+t+'</div><div class="s">'+s+'</div></div>';
  $('#area').appendChild(ov);
}

function reset(){
  const syms=[...SYM,...SYM];
  cards=syms.sort(()=>Math.random()-0.5).map(s=>({s,up:false,done:false}));
  open=[]; moves=0; matched=0; lock=false;
  $('#score').textContent='0';
  const ov=$('.overlay'); if(ov) ov.remove();
  render();
  upd();
}
$('#go').onclick=reset;
upd();
reset();
</script>
</body>
</html>
