<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Order Tap</title>
<style>
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0%,#16233a 0%,#070b12 65%);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#cbd5e1;padding:16px;-webkit-tap-highlight-color:transparent;user-select:none}
  .wrap{width:min(92vw,460px);display:flex;flex-direction:column;gap:12px}
  .hud{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.15em;color:#64748b}
  .hud b{color:#38bdf8;font-size:20px;font-weight:700;margin-left:6px}
  .area{background:#0b1220;border:1px solid #1e293b;border-radius:16px;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center;position:relative;overflow:hidden}
  .big{font-size:30px;font-weight:800;line-height:1}
  .small{color:#64748b;font-size:12px;line-height:1.5}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
  .cell{font-family:inherit;border:1px solid #334155;border-radius:12px;height:56px;font-size:20px;font-weight:800;background:#1e293b;color:#e2e8f0;cursor:pointer;touch-action:manipulation;transition:background .12s,border-color .12s,transform .12s}
  .cell:active{transform:scale(.94)}
  .cell.done{background:#0f2d1c;border-color:#22c55e;color:#4ade80}
  .cell.good{background:#14532d;border-color:#22c55e}
  .cell.bad{background:#7f1d1d;border-color:#ef4444;animation:shake .3s}
  .bar{width:100%;height:8px;border-radius:99px;background:#1e293b;overflow:hidden}
  .fill{height:100%;width:100%;background:#38bdf8;border-radius:99px}
  button{font-family:inherit;border:0;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:700;background:#0ea5e9;color:#04222a;cursor:pointer;letter-spacing:.03em;touch-action:manipulation}
  button:active{transform:translateY(1px) scale(.98)}
  .hint{color:#64748b;font-size:11px;text-align:center;line-height:1.6}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
</style>
<script src="../audio.js"></script>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>BONS <b id="score">0</b></span><span>BEST <b id="best">—</b></span></div>
  <div class="area" id="area">
    <div class="big" id="big">3</div>
    <div class="grid" id="g"></div>
    <div class="small" id="sub">Tour 1 · Suivant : 1</div>
    <div class="bar"><div class="fill" id="fill"></div></div>
  </div>
  <button id="go">Rejouer</button>
  <div class="hint">Tape les cases <b>1 → 2 → 3 … → 8</b> dans l'ordre.<br>Les gros chiffres sont des pièges. 30 s — objectif : 20 bons.</div>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const sfx=n=>{ try{ if(window.Arcade) window.Arcade.sfx(n); }catch(e){} };
const KEY='ordertap.best', DUR=30000, PAR=20, TARGETS=8, DECOYS=4;
let best=0; try{ best=parseInt(localStorage.getItem(KEY)||'0',10)||0; }catch(e){}
function upd(){ $('#best').textContent=best?best:'—'; }
function save(v){ if(v>best){ best=v; try{ localStorage.setItem('ordertap.best',String(v)); }catch(e){} } upd(); }

const area=$('#area'), big=$('#big'), g=$('#g'), sub=$('#sub'), fill=$('#fill'), scoreEl=$('#score');
let cells=[], cellEls=[], next=1, score=0, rounds=1, phase='idle', cd=3, cdTimer=null, raf=null, startAt=0, endAt=0;

function shuffle(){
  const nums=Array.from({length:TARGETS},(_,i)=>i+1);
  const decoys=[];
  while(decoys.length<DECOYS){ const n=9+Math.floor(Math.random()*12); if(!decoys.includes(n)) decoys.push(n); }
  cells=nums.concat(decoys).map(n=>({num:n,done:false}));
  cells.sort(()=>Math.random()-0.5);
  next=1;
  render();
}
function render(){
  g.innerHTML=''; cellEls=[];
  cells.forEach((c,i)=>{
    const d=document.createElement('button');
    d.className='cell'+(c.done?' done':'');
    d.textContent=c.done?'✓':c.num;
    d.addEventListener('pointerdown',e=>{ e.preventDefault(); tap(i); });
    g.appendChild(d); cellEls.push(d);
  });
  sub.textContent='Tour '+rounds+' · Suivant : '+(next<=TARGETS?next:'—');
}
function flashCell(i,kind){
  const el=cellEls[i]; if(!el) return;
  el.classList.add(kind); setTimeout(()=>el.classList.remove(kind), kind==='good'?180:320);
}
function tap(i){
  if(phase!=='go') return;
  const c=cells[i];
  if(c.done) return;
  if(c.num===next){
    c.done=true; next++; score++; scoreEl.textContent=score;
    render(); flashCell(i,'good'); sfx('correct');
    if(next>TARGETS){
      rounds++; sfx('win');
      setTimeout(shuffle,380);
    }
  } else {
    cells.forEach(x=>x.done=false); next=1;
    render(); flashCell(i,'bad'); sfx('wrong');
  }
}
function begin(){
  clearInterval(cdTimer); cancelAnimationFrame(raf);
  phase='countdown'; score=0; rounds=1; cd=3;
  scoreEl.textContent='0'; fill.style.width='100%';
  big.textContent=cd; shuffle();
  cdTimer=setInterval(()=>{
    cd--;
    if(cd>0){ big.textContent=cd; sfx('tick'); }
    else{
      clearInterval(cdTimer);
      phase='go'; startAt=performance.now(); endAt=startAt+DUR;
      big.textContent='GO !'; sfx('whoosh'); loop();
    }
  },700);
}
function loop(){
  if(phase!=='go') return;
  const left=endAt-performance.now();
  if(left<=0){ finish(); return; }
  fill.style.width=(left/DUR*100)+'%';
  big.textContent=(left/1000).toFixed(1)+'s';
  raf=requestAnimationFrame(loop);
}
function finish(){
  phase='end'; cancelAnimationFrame(raf);
  save(score);
  fill.style.width='0%';
  g.innerHTML='';
  big.textContent=score+' bons';
  sub.textContent=(score===best&&score>0)?'Nouveau record !':('Best : '+(best?best:'—'));
  sfx(score>=PAR?'win':'pop');
}
$('#go').addEventListener('click',begin);
begin(); upd();
</script>
</body>
</html>
