<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Breakout</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    background: radial-gradient(120% 80% at 50% 0%, #4a1024 0%, #0d0206 65%);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #cbd5e1;
    padding: 16px;
    -webkit-tap-highlight-color: transparent;
  }

  .wrap {
    width: min(88vw, 480px);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .hud {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 12px;
    letter-spacing: .16em;
    color: #64748b;
  }
  .hud b {
    color: #4ade80;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .02em;
    margin-left: 6px;
    text-shadow: 0 0 14px rgba(74, 222, 128, .45);
  }

  .board {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    border-radius: 16px;
    overflow: hidden;
    background: #0b1220;
    box-shadow:
      0 0 0 1px #1e293b,
      0 0 0 6px rgba(15, 23, 42, .55),
      0 30px 60px -25px #000;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  .pause-btn {
    position: fixed;
    top: 12px;
    right: 12px;
    width: 36px;
    height: 36px;
    display: none;
    align-items: center;
    justify-content: center;
    border: 1px solid #1e293b;
    border-radius: 10px;
    background: rgba(15, 23, 42, .72);
    color: #cbd5e1;
    font-size: 12px;
    letter-spacing: 0;
    cursor: pointer;
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    z-index: 90;
  }
  .pause-btn.show { display: flex; }
  .pause-btn:hover { background: rgba(30, 41, 59, .8); }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 24px;
    background: rgba(5, 9, 16, .82);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  .overlay h1 {
    margin: 0;
    font-size: clamp(26px, 8vw, 40px);
    letter-spacing: .22em;
    color: #e2e8f0;
    text-shadow: 0 0 26px rgba(74, 222, 128, .35);
  }
  .overlay p {
    margin: 0;
    font-size: 13px;
    line-height: 1.7;
    color: #94a3b8;
    letter-spacing: .06em;
    max-width: 30ch;
  }

  button {
    margin-top: 4px;
    padding: 12px 30px;
    font: inherit;
    font-size: 14px;
    letter-spacing: .18em;
    color: #04210f;
    background: linear-gradient(180deg, #86efac, #4ade80);
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 24px -8px rgba(74, 222, 128, .8);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 12px 28px -8px rgba(74, 222, 128, .9); }
  button:active { transform: translateY(1px) scale(.98); }

  .hint {
    margin: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: .14em;
    color: #475569;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="hud">
    <div>SCORE<b id="score">0</b></div>
    <div>BEST<b id="best">0</b></div>
  </div>

  <div class="board">
    <canvas id="game"></canvas>
    <button class="pause-btn" id="pauseBtn" aria-label="Pause">❚❚</button>
    <div class="overlay show" id="overlay">
      <h1 id="ovTitle">BREAKOUT</h1>
      <p id="ovText">Move the paddle with your mouse or the arrow keys. Bounce the ball to smash every brick.</p>
      <button id="ovBtn">PLAY</button>
      <button id="ovBtn2" style="display:none">RESTART</button>
    </div>
  </div>

  <p class="hint">MOUSE / ◀ ▶ MOVE &nbsp;·&nbsp; SPACE LAUNCH &nbsp;·&nbsp; P PAUSE &nbsp;·&nbsp; R RESTART</p>
</div>

<script>
(() => {
  "use strict";

  /* ---------- Setup ---------- */
  const W = 420;
  const H = 560;

  const canvas  = document.getElementById('game');
  const ctx     = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText  = document.getElementById('ovText');
  const ovBtn   = document.getElementById('ovBtn');
  const ovBtn2  = document.getElementById('ovBtn2');
  const pauseBtn = document.getElementById('pauseBtn');
  const scoreEl = document.getElementById('score');
  const bestEl  = document.getElementById('best');

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);

  /* ---------- Constants ---------- */
  const PADDLE_W = 84;
  const PADDLE_H = 13;
  const PADDLE_Y = H - 44;
  const PADDLE_SPEED = 460;
  const BALL_R = 7;
  const BASE_SPEED = 300;
  const MAX_SPEED = 540;

  const BRICK_COLS = 7;
  const BRICK_ROWS = 5;
  const BRICK_TOP = 64;
  const BRICK_GAP = 6;
  const BRICK_H = 22;
  const SIDE = 24;
  const BRICK_W = (W - SIDE * 2 - BRICK_GAP * (BRICK_COLS - 1)) / BRICK_COLS;
  const ROW_POINTS = [50, 40, 30, 20, 10];
  const ROW_COLORS = ['#ff5d7e', '#ff9f43', '#ffd166', '#5eead4', '#60a5fa'];

  /* ---------- State ---------- */
  let paddle;        // { x }
  let ball;          // { x, y, vx, vy, stuck }
  let bricks;        // array of { x, y, w, h, row, alive }
  let bricksLeft;
  let totalBricks;
  let lives;
  let score;
  let state = 'idle'; // 'idle' | 'playing' | 'paused' | 'over'
  let keys = { left: false, right: false };
  let last = 0;

  let best = 0;
  try { best = parseInt(localStorage.getItem('breakout.best') || '0', 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  /* ---------- Helpers ---------- */
  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y,     x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x,     y + h, r);
    ctx.arcTo(x,     y + h, x,     y,     r);
    ctx.arcTo(x,     y,     x + w, y,     r);
    ctx.closePath();
  }

  function clamp(v, min, max) { return v < min ? min : (v > max ? max : v); }

  function updateHud() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
  }

  function showOverlay(title, text, btnLabel, btn2Label) {
    ovTitle.textContent = title;
    ovText.textContent = text;
    ovBtn.textContent = btnLabel;
    if (btn2Label) { ovBtn2.textContent = btn2Label; ovBtn2.style.display = ''; }
    else { ovBtn2.style.display = 'none'; }
    overlay.classList.add('show');
  }

  function hideOverlay() {
    overlay.classList.remove('show');
  }

  function updatePauseBtn() { pauseBtn.classList.toggle('show', state === 'playing'); }

  function currentSpeed() {
    return Math.min(MAX_SPEED, BASE_SPEED + (totalBricks - bricksLeft) * 8);
  }

  /* ---------- Game logic ---------- */
  function reset() {
    paddle = { x: (W - PADDLE_W) / 2 };
    ball = { x: W / 2, y: PADDLE_Y - BALL_R - 1, vx: 0, vy: 0, stuck: true };
    bricks = [];
    for (let r = 0; r < BRICK_ROWS; r++) {
      for (let c = 0; c < BRICK_COLS; c++) {
        bricks.push({
          x: SIDE + c * (BRICK_W + BRICK_GAP),
          y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
          w: BRICK_W,
          h: BRICK_H,
          row: r,
          alive: true
        });
      }
    }
    totalBricks = bricks.length;
    bricksLeft = totalBricks;
    lives = 3;
    score = 0;
    keys = { left: false, right: false };
    updateHud();
  }

  function launchBall() {
    if (!ball.stuck) return;
    ball.stuck = false;
    const sp = currentSpeed();
    const a = (Math.random() * 100 - 50) * Math.PI / 180; // -50..50 deg from vertical
    ball.vx = Math.sin(a) * sp;
    ball.vy = -Math.cos(a) * sp;
  }

  function loseLife() {
    lives--;
    if (lives <= 0) { gameOver(false); return; }
    ball = { x: paddle.x + PADDLE_W / 2, y: PADDLE_Y - BALL_R - 1, vx: 0, vy: 0, stuck: true };
  }

  function saveBest() {
    if (score > best) {
      best = score;
      try { localStorage.setItem('breakout.best', String(best)); } catch (e) {}
    }
    updateHud();
  }

  function win() {
    state = 'over';
    updatePauseBtn();
    saveBest();
    showOverlay(
      'YOU WIN!',
      `You smashed every brick with ${score} points. Best: ${best}.`,
      'PLAY AGAIN'
    );
  }

  function gameOver(won) {
    state = 'over';
    updatePauseBtn();
    saveBest();
    showOverlay(
      won ? 'YOU WIN!' : 'GAME OVER',
      won
        ? `You cleared the board with ${score} points. Best: ${best}.`
        : `You scored ${score} points. Best: ${best}.`,
      'PLAY AGAIN'
    );
  }

  function start() {
    reset();
    state = 'playing';
    hideOverlay();
    updatePauseBtn();
    last = performance.now();
  }

  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      showOverlay('PAUSED', 'The ball is frozen mid-air. Press space or hit resume.', 'RESUME', 'RESTART');
    } else if (state === 'paused') {
      state = 'playing';
      hideOverlay();
      last = performance.now();
    }
    updatePauseBtn();
  }

  function moveBall(s) {
    if (ball.stuck) return;
    ball.x += ball.vx * s;
    ball.y += ball.vy * s;

    // Walls
    if (ball.x - BALL_R < 0) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx); }
    if (ball.x + BALL_R > W) { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - BALL_R < 0) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); }

    // Paddle
    if (ball.vy > 0) {
      const by = ball.y + BALL_R;
      if (by >= PADDLE_Y && by <= PADDLE_Y + PADDLE_H + 6 &&
          ball.x >= paddle.x - BALL_R && ball.x <= paddle.x + PADDLE_W + BALL_R) {
        const hit = clamp((ball.x - (paddle.x + PADDLE_W / 2)) / (PADDLE_W / 2), -1, 1);
        const ang = hit * (Math.PI / 3);
        const sp = currentSpeed();
        ball.vx = Math.sin(ang) * sp;
        ball.vy = -Math.cos(ang) * sp;
        ball.y = PADDLE_Y - BALL_R - 0.5;
        return;
      }
    }

    // Lost below the board
    if (ball.y - BALL_R > H) { loseLife(); return; }

    // Bricks
    for (const b of bricks) {
      if (!b.alive) continue;
      const cx = Math.max(b.x, Math.min(ball.x, b.x + b.w));
      const cy = Math.max(b.y, Math.min(ball.y, b.y + b.h));
      const dx = ball.x - cx;
      const dy = ball.y - cy;
      if (dx * dx + dy * dy <= BALL_R * BALL_R) {
        b.alive = false;
        bricksLeft--;
        score += ROW_POINTS[b.row];
        updateHud();
        const penX = BALL_R - Math.abs(dx);
        const penY = BALL_R - Math.abs(dy);
        if (penX < penY) {
          ball.vx = -ball.vx;
          ball.x += Math.sign(dx || ball.vx) * (penX + 0.5);
        } else {
          ball.vy = -ball.vy;
          ball.y += Math.sign(dy || ball.vy) * (penY + 0.5);
        }
        if (bricksLeft <= 0) { win(); return; }
        break;
      }
    }
  }

  function update(dt) {
    if (state !== 'playing') return;
    const s = dt / 1000;

    // Paddle from keys
    if (keys.left) paddle.x -= PADDLE_SPEED * s;
    if (keys.right) paddle.x += PADDLE_SPEED * s;
    paddle.x = clamp(paddle.x, 0, W - PADDLE_W);

    if (ball.stuck) {
      ball.x = paddle.x + PADDLE_W / 2;
      ball.y = PADDLE_Y - BALL_R - 1;
      return;
    }

    // Sub-stepped movement avoids tunnelling at high speed
    const dist = Math.hypot(ball.vx, ball.vy) * s;
    const steps = Math.max(1, Math.ceil(dist / 6));
    const ds = s / steps;
    for (let i = 0; i < steps; i++) {
      if (ball.stuck || state !== 'playing') break;
      moveBall(ds);
    }

    if (state === 'playing' && !ball.stuck) {
      const sp = currentSpeed();
      const m = Math.hypot(ball.vx, ball.vy);
      if (m > 0) { ball.vx = ball.vx / m * sp; ball.vy = ball.vy / m * sp; }
    }
  }

  /* ---------- Rendering ---------- */
  function draw(t) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.fillStyle = '#0b1220';
    ctx.fillRect(0, 0, W, H);

    const cs = 28;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.022)';
    for (let gy = 0; gy * cs < H; gy++) {
      for (let gx = 0; gx * cs < W; gx++) {
        if ((gx + gy) % 2 === 0) ctx.fillRect(gx * cs, gy * cs, cs, cs);
      }
    }

    // Bricks
    for (const b of bricks) {
      if (!b.alive) continue;
      ctx.save();
      ctx.shadowColor = ROW_COLORS[b.row];
      ctx.shadowBlur = 8;
      ctx.fillStyle = ROW_COLORS[b.row];
      roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.20)';
      roundRect(b.x + 3, b.y + 3, b.w - 6, 4, 2);
      ctx.fill();
    }

    // Paddle
    ctx.save();
    ctx.shadowColor = 'rgba(74, 222, 128, .85)';
    ctx.shadowBlur = 16;
    ctx.fillStyle = '#4ade80';
    roundRect(paddle.x, PADDLE_Y, PADDLE_W, PADDLE_H, 7);
    ctx.fill();
    ctx.restore();

    // Ball
    ctx.save();
    ctx.shadowColor = 'rgba(255, 255, 255, .8)';
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#e2e8f0';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Lives
    for (let i = 0; i < lives; i++) {
      ctx.save();
      ctx.shadowColor = 'rgba(74, 222, 128, .7)';
      ctx.shadowBlur = 8;
      ctx.fillStyle = '#4ade80';
      ctx.beginPath();
      ctx.arc(18 + i * 24, 18, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  /* ---------- Main loop ---------- */
  function loop(t) {
    requestAnimationFrame(loop);

    if (!last) last = t;
    const dt = Math.min(t - last, 100);
    last = t;

    if (state === 'playing') update(dt);

    draw(t);
  }

  /* ---------- Input ---------- */
  function toLogicalX(clientX) {
    const r = canvas.getBoundingClientRect();
    return (clientX - r.left) * (W / r.width);
  }

  function movePaddleTo(clientX) {
    const x = toLogicalX(clientX) - PADDLE_W / 2;
    paddle.x = clamp(x, 0, W - PADDLE_W);
  }

  const KEYS_LEFT  = ['ArrowLeft', 'a', 'A'];
  const KEYS_RIGHT = ['ArrowRight', 'd', 'D'];

  window.addEventListener('keydown', (e) => {
    const k = e.key;

    if (k === ' ' || k === 'Spacebar' || k.startsWith('Arrow')) e.preventDefault();

    if (k === 'r' || k === 'R') { start(); return; }

    if (k === ' ' || k === 'Spacebar') {
      if (state === 'playing') { if (ball.stuck) launchBall(); else togglePause(); }
      else if (state === 'paused') togglePause();
      else start();
      return;
    }

    if (k === 'p' || k === 'P') {
      if (state === 'playing' || state === 'paused') togglePause();
      return;
    }

    if (KEYS_LEFT.includes(k)) keys.left = true;
    if (KEYS_RIGHT.includes(k)) keys.right = true;
  });

  window.addEventListener('keyup', (e) => {
    const k = e.key;
    if (KEYS_LEFT.includes(k)) keys.left = false;
    if (KEYS_RIGHT.includes(k)) keys.right = false;
  });

  canvas.addEventListener('mousemove', (e) => {
    if (state === 'playing') movePaddleTo(e.clientX);
  });

  canvas.addEventListener('click', (e) => {
    if (state === 'playing') { if (ball.stuck) launchBall(); return; }
    if (state === 'idle' || state === 'over') start();
  });

  ovBtn.addEventListener('click', () => {
    ovBtn.blur();
    if (state === 'paused') togglePause();
    else start();
  });

  ovBtn2.addEventListener('click', () => {
    ovBtn2.blur();
    start();
  });

  pauseBtn.addEventListener('click', () => {
    pauseBtn.blur();
    if (state === 'playing') togglePause();
  });

  // Touch controls: drag moves the paddle, tap launches the ball
  let touchId = null;
  let touchStart = null;

  canvas.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    touchId = t.identifier;
    touchStart = { x: t.clientX, y: t.clientY };
    movePaddleTo(t.clientX);
  }, { passive: true });

  canvas.addEventListener('touchmove', (e) => {
    if (state === 'playing') e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier === touchId) movePaddleTo(t.clientX);
    }
  }, { passive: false });

  canvas.addEventListener('touchend', (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier !== touchId) continue;
      if (touchStart && Math.hypot(t.clientX - touchStart.x, t.clientY - touchStart.y) < 22) {
        if (state === 'idle' || state === 'over') start();
        else if (state === 'playing' && ball.stuck) launchBall();
      }
    }
    touchId = null;
    touchStart = null;
  }, { passive: true });

  // Auto-pause when the tab loses focus
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'playing') togglePause();
  });

  /* ---------- Boot ---------- */
  reset();
  state = 'idle';
  updatePauseBtn();
  requestAnimationFrame(loop);
})();
</script>
<style>
.sound-btn{position:fixed;top:12px;left:12px;width:38px;height:38px;border:1px solid #1e293b;border-radius:10px;background:rgba(15,23,42,.72);color:#cbd5e1;font-size:16px;line-height:1;cursor:pointer;z-index:99;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sound-btn:hover{background:rgba(30,41,59,.8)}
</style>
<button class="sound-btn" id="soundBtn" aria-label="Toggle sound">♪</button>
<script>
(function () {
  "use strict";
  var AC = window.AudioContext || window.webkitAudioContext;
  var ctx = null, master = null, musicGain = null, noiseBuf = null;
  var muted = false, musicOn = false, timer = null, step = 0, nextT = 0;

  var LEAD = [659.24,659.24,739.97,739.97,830.59,830.59,987.74,987.74,1108.71,987.74,830.59,739.97,659.24,0,659.24,0];
  var BASS = [164.81,246.94,164.81,0,164.81,246.94,164.81,0,164.81,246.94,164.81,0,164.81,246.94,164.81,0];
  var STEP = 0.12;

  try { muted = localStorage.getItem('arcade.muted') === '1'; } catch (e) {}

  function ensureCtx() {
    if (!ctx) {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = muted ? 0 : 0.6;
      master.connect(ctx.destination);
      musicGain = ctx.createGain();
      musicGain.gain.value = 0.5;
      musicGain.connect(master);
      var n = Math.floor(ctx.sampleRate * 0.04);
      noiseBuf = ctx.createBuffer(1, n, ctx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    }
    if (ctx.state === 'suspended') ctx.resume();
  }

  function note(freq, t, dur, type, vol) {
    if (!freq) return;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(musicGain);
    o.start(t); o.stop(t + dur + 0.05);
  }

  function hat(t) {
    var s = ctx.createBufferSource(); s.buffer = noiseBuf;
    var hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7000;
    var g = ctx.createGain(); g.gain.value = 0.05;
    s.connect(hp); hp.connect(g); g.connect(musicGain);
    s.start(t);
  }

  function schedule(i, t) {
    var k = i % LEAD.length;
    note(LEAD[k], t, STEP * 0.9, 'square', 0.16);
    note(BASS[k], t, STEP * 0.95, 'triangle', 0.2);
    hat(t);
  }

  function tick() {
    while (nextT < ctx.currentTime + 0.12) {
      schedule(step, nextT);
      step++;
      nextT += STEP;
    }
  }

  function startMusic() {
    if (musicOn) return;
    ensureCtx();
    musicOn = true;
    nextT = ctx.currentTime + 0.05;
    step = 0;
    timer = setInterval(tick, 25);
  }

  function stopMusic() {
    if (timer) { clearInterval(timer); timer = null; }
    musicOn = false;
    step = 0;
  }

  function setMuted(m) {
    muted = m;
    try { localStorage.setItem('arcade.muted', m ? '1' : '0'); } catch (e) {}
    if (master) master.gain.setTargetAtTime(m ? 0 : 0.6, ctx.currentTime, 0.02);
    var b = document.getElementById('soundBtn');
    if (b) b.textContent = m ? '🔇' : '♪';
  }

  function sync() {
    var pb = document.getElementById('pauseBtn');
    if (pb && pb.classList.contains('show')) { if (!musicOn) startMusic(); }
    else if (musicOn) stopMusic();
  }

  function wire() {
    var sb = document.getElementById('soundBtn');
    if (sb) sb.addEventListener('click', function () { ensureCtx(); setMuted(!muted); });
    window.addEventListener('pointerdown', ensureCtx);
    window.addEventListener('keydown', ensureCtx);
    var pb = document.getElementById('pauseBtn');
    if (pb) new MutationObserver(sync).observe(pb, { attributes: true, attributeFilter: ['class'] });
    var b = document.getElementById('soundBtn');
    if (b) b.textContent = muted ? '🔇' : '♪';
    sync();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', wire);
  else wire();
})();
</script>
<button class="rules-btn" id="rulesBtn">RULES</button>
<div class="rules-panel" id="rulesPanel">
  <div class="rules-card">
    <h2>HOW TO PLAY</h2>
    <p id="rulesText"></p>
    <button id="rulesClose">BACK</button>
  </div>
</div>
<style>
.rules-btn{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);padding:10px 22px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:.18em;color:#cbd5e1;background:rgba(15,23,42,.85);border:1px solid #334155;border-radius:999px;cursor:pointer;display:none;z-index:60}
.rules-btn.show{display:block}
.rules-btn:hover{background:rgba(30,41,59,.9)}
.rules-panel{position:fixed;inset:0;background:rgba(5,9,16,.94);display:none;align-items:center;justify-content:center;padding:20px;z-index:200;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.rules-panel.show{display:flex}
.rules-card{width:min(88vw,440px);max-height:80vh;overflow:auto;background:#0b1220;border:1px solid #1e293b;border-radius:16px;padding:24px;box-shadow:0 30px 60px -25px #000;text-align:center}
.rules-card h2{margin:0 0 14px;font-size:14px;letter-spacing:.24em;color:#4ade80}
.rules-card p{margin:0 0 20px;font-size:13px;line-height:1.9;color:#cbd5e1;letter-spacing:.03em;text-align:left}
.rules-card button{margin:0;padding:10px 26px;font:inherit;font-size:13px;letter-spacing:.18em;color:#04210f;background:linear-gradient(180deg,#86efac,#4ade80);border:0;border-radius:999px;cursor:pointer;box-shadow:0 8px 24px -8px rgba(74,222,128,.8)}
</style>
<script>
(function () {
  "use strict";
  var RULES = "Move the paddle with the mouse, the Left/Right arrows, or A/D. Launch the ball with Space. Bounce the ball to destroy every brick. Higher rows are worth more points. If the ball slips past your paddle, you lose one of your 3 lives.";
  var btn = document.getElementById('rulesBtn');
  var panel = document.getElementById('rulesPanel');
  var text = document.getElementById('rulesText');
  var close = document.getElementById('rulesClose');
  if (text) text.textContent = RULES;
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' || e.key === 'Esc') {
      e.preventDefault();
      if (panel && panel.classList.contains('show')) { panel.classList.remove('show'); return; }
      try { document.dispatchEvent(new KeyboardEvent('keydown', { key: 'p', bubbles: true, cancelable: true })); } catch (err) {}
    }
  });
  function sync() {
    var pb = document.getElementById('pauseBtn');
    var title = document.getElementById('ovTitle');
    var paused = pb && !pb.classList.contains('show') && title && /PAUSED/i.test(title.textContent || '');
    if (btn) btn.classList.toggle('show', !!paused);
    var ov = document.getElementById('overlay');
    if (ov && !ov.classList.contains('show') && panel) panel.classList.remove('show');
  }
  var pb = document.getElementById('pauseBtn');
  if (pb) new MutationObserver(sync).observe(pb, { attributes: true, attributeFilter: ['class'] });
  var ov = document.getElementById('overlay');
  if (ov) new MutationObserver(sync).observe(ov, { attributes: true, attributeFilter: ['class'] });
  if (btn) btn.addEventListener('click', function () { if (panel) panel.classList.add('show'); });
  if (close) close.addEventListener('click', function () { if (panel) panel.classList.remove('show'); });
  if (panel) panel.addEventListener('click', function (e) { if (e.target === panel) panel.classList.remove('show'); });
  sync();
})();
</script>
<style>
#score{display:inline-block}
#score.pulse{animation:scorePulse .45s ease}
@keyframes scorePulse{
  0%{transform:scale(1);text-shadow:0 0 14px rgba(74,222,128,.45)}
  40%{transform:scale(1.4);text-shadow:0 0 26px rgba(74,222,128,.95)}
  100%{transform:scale(1);text-shadow:0 0 14px rgba(74,222,128,.45)}
}
</style>
<script>
(function () {
  "use strict";
  var el = document.getElementById('score');
  if (!el) return;
  var last = parseInt(el.textContent, 10) || 0;
  var mo = new MutationObserver(function () {
    var cur = parseInt(el.textContent, 10) || 0;
    if (cur > last) {
      el.classList.remove('pulse');
      void el.offsetWidth;
      el.classList.add('pulse');
    }
    last = cur;
  });
  mo.observe(el, { childList: true, characterData: true, subtree: true });
})();
</script>
