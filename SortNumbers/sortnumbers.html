<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Sort Numbers</title>
<style>
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0%,#16233a 0%,#070b12 65%);font-family:ui-monospace,Menlo,Consolas,monospace;color:#cbd5e1;padding:16px;-webkit-tap-highlight-color:transparent}
  .wrap{width:min(92vw,460px);display:flex;flex-direction:column;gap:12px}
  .hud{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.15em;color:#64748b}
  .hud b{color:#38bdf8;font-size:20px;margin-left:6px}
  .area{background:#0b1220;border:1px solid #1e293b;border-radius:14px;min-height:230px;display:grid;place-items:center;padding:16px;text-align:center;user-select:none;position:relative;overflow:hidden}
  button{font-family:inherit;border:0;border-radius:10px;padding:11px 15px;font-size:14px;font-weight:700;background:#0ea5e9;color:#04222a;cursor:pointer}
  button:active{transform:translateY(1px)}
  .hint{color:#64748b;font-size:11px;text-align:center;line-height:1.6}
  .big{font-size:26px;font-weight:800}
  .opt{background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:10px;padding:10px 14px;font-size:16px;font-weight:700;margin:4px;cursor:pointer}
  .opt:hover{border-color:#38bdf8}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>TOURS <b id="score">0</b></span><span>BEST <b id="best">—</b></span></div>
  <div class="area" id="area"><div id="g" style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center"></div></div>
  <button id="go">Rejouer</button>
  <div class="hint">Clique les nombres dans l'ordre croissant.</div>
</div>
<script>
const $=s=>document.querySelector(s);
let best=0;try{best=parseInt(localStorage.getItem('sortnumbers.best')||'0',10)||0}catch(e){}
function saveHigh(v){ if(v>best){best=v;try{localStorage.setItem('sortnumbers.best',String(v))}catch(e){}} upd(); }
function saveLow(v){ if(best===0||v<best){best=v;try{localStorage.setItem('sortnumbers.best',String(v))}catch(e){}} upd(); }
function upd(){ $('#best').textContent=best?best:'—'; }
let vals=[], next=1, rounds=0;
function render(){ const g=$('#g'); g.innerHTML=''; vals.forEach((v,i)=>{ const b=document.createElement('button'); b.className='opt'; b.textContent=v||''; b.onclick=()=>tap(i); g.appendChild(b); }); }
function tap(i){ if(vals[i]===next){ vals[i]=null; next++; if(vals.every(v=>v===null)){ rounds++; $('#score').textContent=rounds; shuffle(); } render(); } }
function shuffle(){ vals=Array.from({length:8},(_,i)=>i+1).sort(()=>Math.random()-0.5); next=1; render(); }
$('#go').onclick=()=>{ rounds=0; shuffle(); $('#score').textContent='0'; };
upd();
</script>
</body>
</html>
