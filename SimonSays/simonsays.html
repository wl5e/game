<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Simon Says</title>
<style>
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0%,#16233a 0%,#070b12 65%);font-family:ui-monospace,Menlo,Consolas,monospace;color:#cbd5e1;padding:16px;-webkit-tap-highlight-color:transparent}
  .wrap{width:min(92vw,460px);display:flex;flex-direction:column;gap:12px}
  .hud{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.15em;color:#64748b}
  .hud b{color:#38bdf8;font-size:20px;margin-left:6px}
  .area{background:#0b1220;border:1px solid #1e293b;border-radius:14px;display:grid;place-items:center;position:relative;overflow:hidden;user-select:none;padding:20px;min-height:230px;text-align:center;gap:14px}
  button{font-family:inherit;border:0;border-radius:10px;padding:12px 16px;font-size:16px;font-weight:700;background:#0ea5e9;color:#04222a;cursor:pointer}
  button:active{transform:translateY(1px)}
  .hint{color:#64748b;font-size:11px;text-align:center;line-height:1.6}
  .big{font-size:24px;font-weight:800;color:#fff;line-height:1.4}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .opt{background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer}
  .opt:active{border-color:#38bdf8;background:#0c1a2b}
  .skip{border-color:#3a3f52}
  .barwrap{width:100%;max-width:300px;height:6px;background:#1e293b;border-radius:4px;overflow:hidden}
  #bar{height:100%;width:100%;background:#38bdf8;border-radius:4px}
  .ov{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:8px;background:rgba(7,11,18,.9);text-align:center;padding:16px;z-index:5;border-radius:14px}
  .ov .t{font-size:24px;font-weight:800;color:#fff}
  .ov .s{color:#94a3b8;font-size:12px;letter-spacing:.1em}
  .ov.hide{display:none}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.1)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  .good{color:#4ade80!important;animation:pop .25s}
  .bad{color:#f87171!important;animation:shake .3s}
  .shake{animation:shake .4s}
</style>
<script src="../audio.js"></script>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>NIVEAU <b id="score">1</b></span><span>BEST <b id="best">—</b></span></div>
  <div class="area" id="area">
    <div class="big" id="cmd">Prêt</div>
    <div class="barwrap"><div id="bar"></div></div>
    <div class="row">
      <button class="opt" id="j">SAUTER</button>
      <button class="opt" id="t">TOURNER</button>
      <button class="opt skip" id="i">IGNORER</button>
    </div>
    <div class="ov hide" id="ov"></div>
  </div>
  <button id="go">Rejouer</button>
  <div class="hint">Objectif : atteindre le niveau 6. Si « Simon dit », fais l'action. Sinon, appuie sur IGNORER. Réponds vite !</div>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
let best=0;try{best=parseInt(localStorage.getItem('simonsays.best')||'0',10)||0}catch(e){}
function saveHigh(v){ if(v>best){best=v;try{localStorage.setItem('simonsays.best',String(v))}catch(e){}} upd(); }
function upd(){ $('#best').textContent=best?best:'—'; }
const area=$('#area');
const PAR=6, LIMIT=4000;
let level,running,simon,want,timeoutId,pending,accepting;
function flashGood(){ const c=$('#cmd'); c.classList.remove('good','bad'); void c.offsetWidth; c.classList.add('good'); }
function flashBad(){ const c=$('#cmd'); c.classList.remove('good','bad'); void c.offsetWidth; c.classList.add('bad'); area.classList.remove('shake'); void area.offsetWidth; area.classList.add('shake'); }
function startBar(){ const b=$('#bar'); b.style.transition='none'; b.style.width='100%'; void b.offsetWidth; b.style.transition='width '+LIMIT+'ms linear'; b.style.width='0%'; }
function stopBar(){ const b=$('#bar'); b.style.transition='none'; b.style.width='100%'; }
function nextRound(){
  accepting=true;
  simon=Math.random()<0.6;
  want=Math.random()<0.5?'SAUTER':'TOURNER';
  $('#cmd').textContent=(simon?'Simon dit : ':'')+want;
  $('#cmd').classList.remove('good','bad');
  startBar();
  timeoutId=setTimeout(()=>answer(null),LIMIT);
}
function answer(action){
  if(!running || !accepting) return;
  accepting=false;
  clearTimeout(timeoutId); stopBar();
  const ok = simon ? (action===want) : (action===null);
  if(ok){
    flashGood(); Arcade.sfx('correct');
    level++; $('#score').textContent=level;
    if(level>=PAR){ win(); return; }
    pending=setTimeout(nextRound,340);
  } else {
    running=false;
    flashBad(); Arcade.sfx('wrong'); setTimeout(()=>Arcade.sfx('lose'),140);
    saveHigh(level);
    $('#ov').innerHTML='<div class="t" style="color:#f87171">PERDU</div><div class="s">Niveau atteint : '+level+'</div>';
    $('#ov').classList.remove('hide');
  }
}
function win(){
  running=false; stopBar();
  saveHigh(level); Arcade.sfx('win');
  $('#ov').innerHTML='<div class="t" style="color:#4ade80">PAR ATTEINT !</div><div class="s">Niveau '+level+' / '+PAR+'</div>';
  $('#ov').classList.remove('hide');
}
function reset(){
  level=1; running=true;
  clearTimeout(timeoutId); clearTimeout(pending);
  $('#score').textContent='1';
  $('#ov').classList.add('hide');
  area.classList.remove('shake');
  nextRound();
}
$('#j').onclick=()=>answer('SAUTER');
$('#t').onclick=()=>answer('TOURNER');
$('#i').onclick=()=>answer(null);
$('#go').onclick=reset;
upd();
reset();
</script>
</body>
</html>
