<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Bigger Number</title>
<style>
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0%,#16233a 0%,#070b12 65%);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#cbd5e1;padding:16px;-webkit-tap-highlight-color:transparent;--acc:#fbbf24}
  .wrap{width:min(92vw,460px);display:flex;flex-direction:column;gap:12px}
  .hud{display:flex;justify-content:space-between;align-items:baseline;gap:6px;flex-wrap:wrap;font-size:11px;letter-spacing:.08em;color:#64748b}
  .hud b{color:var(--acc);font-size:19px;font-weight:800;margin-left:5px;letter-spacing:0}
  .bar{height:8px;background:#0b1220;border:1px solid #1e293b;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:100%;background:var(--acc);border-radius:99px;transition:width .1s linear}
  .area{background:#0b1220;border:1px solid #1e293b;border-radius:16px;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px;text-align:center;user-select:none;position:relative;overflow:hidden;transition:box-shadow .12s ease}
  .area.good{box-shadow:0 0 0 3px var(--acc),0 0 48px -6px var(--acc)}
  .area.bad{box-shadow:0 0 0 3px #f87171,0 0 48px -6px #f87171;animation:shake .38s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  @keyframes popIn{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
  .pop{animation:popIn .18s ease}
  button{font-family:inherit;border:0;border-radius:10px;padding:11px 15px;font-size:14px;font-weight:700;background:var(--acc);color:#211703;cursor:pointer}
  button:active{transform:translateY(1px)}
  .go{width:100%}
  .hint{color:#64748b;font-size:11px;text-align:center;line-height:1.6}
  .pair{display:flex;gap:16px}
  .cardnum{background:#15202e;border:1px solid #2a3b4d;border-radius:14px;padding:26px 30px;font-size:36px;font-weight:800;color:#e2e8f0;cursor:pointer;min-width:96px}
  .cardnum:hover{border-color:var(--acc)}
  .over{display:flex;flex-direction:column;align-items:center;gap:8px}
  .o-title{font-size:14px;letter-spacing:.16em;color:#64748b}
  .o-score{font-size:46px;font-weight:800;color:var(--acc)}
  .o-sub{font-size:13px;color:#94a3b8}
  .o-sub.rec{color:var(--acc)}
</style>
<script src="../audio.js"></script>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>SÉRIE <b id="score">0</b></span><span>BEST <b id="best">—</b></span><span>TEMPS <b id="time">30</b></span></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="area" id="area"></div>
  <button id="go" class="go">Rejouer</button>
  <div class="hint">Clique sur le PLUS GRAND nombre, le plus vite possible. Une erreur = fin.</div>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const KEY='bigger.best';
let best=0; try{best=parseInt(localStorage.getItem(KEY)||'0',10)||0}catch(e){}
function upd(){ $('#best').textContent=best?best:'—'; }
function saveHigh(v){ if(v>best){best=v;try{localStorage.setItem('bigger.best',String(v))}catch(e){}upd();return true;} return false; }
const sfx=n=>{ try{window.Arcade&&window.Arcade.sfx(n);}catch(e){} };
function flash(good){ const a=$('#area'); a.classList.remove('good','bad'); void a.offsetWidth; a.classList.add(good?'good':'bad'); clearTimeout(flash._t); flash._t=setTimeout(()=>a.classList.remove('good','bad'),420); }
function popEl(el){ if(!el) return; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }

let streak=0, running=false, timerId=null, endTime=0, lastTick=0;
const DUR=30000;

function newQuestion(){
  const maxDiff=Math.max(1, 17-streak);
  let x=10+Math.floor(Math.random()*90);
  const d=1+Math.floor(Math.random()*maxDiff);
  let y=x+(Math.random()<0.5?-d:d);
  if(y<10||y>99||y===x){ y=x+d; if(y>99) y=x-d; }
  if(y<10||y>99||y===x){ y = x<90 ? x+1 : x-1; }
  $('#a').textContent=x; $('#a').dataset.v=x;
  $('#b').textContent=y; $('#b').dataset.v=y;
  popEl($('#a')); popEl($('#b'));
}
function judge(pickA){
  if(!running) return;
  const a=parseInt($('#a').dataset.v,10), b=parseInt($('#b').dataset.v,10);
  if((a>b)===pickA){ streak++; $('#score').textContent=streak; sfx('correct'); flash(true); newQuestion(); }
  else { sfx('wrong'); flash(false); endGame('ERREUR !'); }
}
function tick(){
  const rem=Math.max(0, endTime-Date.now());
  const bar=$('#bar'); bar.style.width=(rem/DUR*100)+'%'; bar.style.background=rem<=5000?'#f87171':'var(--acc)';
  $('#time').textContent=Math.ceil(rem/1000);
  const s=Math.ceil(rem/1000);
  if(rem<=5000 && s!==lastTick){ lastTick=s; sfx('tick'); }
  if(rem<=0) endGame('TEMPS ÉCOULÉ');
}
function overHTML(title,sc,rec){ return `<div class="over"><div class="o-title">${title}</div><div class="o-score">${sc}</div><div class="o-sub${rec?' rec':''}">${rec?'NOUVEAU RECORD !':'Appuie sur Rejouer pour recommencer'}</div></div>`; }
function endGame(title){
  if(!running) return; running=false; clearInterval(timerId);
  const rec=saveHigh(streak); sfx(rec?'win':'lose');
  $('#area').innerHTML=overHTML(title, streak, rec);
}
function start(){
  streak=0; running=true; lastTick=0; $('#score').textContent='0';
  clearInterval(timerId); endTime=Date.now()+DUR; timerId=setInterval(tick,100);
  $('#bar').style.width='100%'; $('#bar').style.background='var(--acc)'; $('#time').textContent=DUR/1000;
  $('#area').innerHTML='<div class="pair"><div class="cardnum" id="a">12</div><div class="cardnum" id="b">34</div></div>';
  $('#a').onclick=()=>judge(true); $('#b').onclick=()=>judge(false);
  newQuestion();
}
$('#go').onclick=start;
document.addEventListener('keydown',e=>{ if(!running && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); start(); } });
upd();
start();
</script>
</body>
</html>
