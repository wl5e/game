<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Reflex Chain</title>
<style>
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0%,#16233a 0%,#070b12 65%);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#cbd5e1;padding:16px;-webkit-tap-highlight-color:transparent;user-select:none}
  .wrap{width:min(92vw,460px);display:flex;flex-direction:column;gap:12px}
  .hud{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.15em;color:#64748b}
  .hud b{color:#38bdf8;font-size:20px;font-weight:700;margin-left:6px}
  .area{background:#0b1220;border:1px solid #1e293b;border-radius:16px;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center;position:relative;overflow:hidden;touch-action:manipulation;transition:background .15s,border-color .15s}
  .area.good{background:#0b2316;border-color:#22c55e}
  .area.bad{background:#2a0f14;border-color:#ef4444;animation:shake .3s}
  .light{width:120px;height:120px;border-radius:50%;background:#1e293b;border:1px solid #334155;transition:background .08s,box-shadow .08s}
  .light.lit{background:#22c55e;border-color:#22c55e;box-shadow:0 0 46px rgba(34,197,94,.65)}
  .light.lose{background:#ef4444;border-color:#ef4444;box-shadow:0 0 46px rgba(239,68,68,.6)}
  .small{color:#64748b;font-size:13px;line-height:1.6}
  button{font-family:inherit;border:0;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:700;background:#0ea5e9;color:#04222a;cursor:pointer;letter-spacing:.03em;touch-action:manipulation}
  button:active{transform:translateY(1px) scale(.98)}
  .hint{color:#64748b;font-size:11px;text-align:center;line-height:1.6}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
</style>
<script src="../audio.js"></script>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>CHAÎNE <b id="score">0</b></span><span>BEST <b id="best">—</b></span></div>
  <div class="area" id="area">
    <div class="light" id="light"></div>
    <div class="small" id="sub">Tape quand le cercle s'allume.</div>
  </div>
  <button id="go">Rejouer</button>
  <div class="hint">Tape <b>uniquement</b> pendant que le cercle est vert.<br>Un tap trop tôt ou trop tard = fin. Objectif : chaîne de 10.</div>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const sfx=n=>{ try{ if(window.Arcade) window.Arcade.sfx(n); }catch(e){} };
const KEY='reflexchain.best', PAR=10;
let best=0; try{ best=parseInt(localStorage.getItem(KEY)||'0',10)||0; }catch(e){}
function upd(){ $('#best').textContent=best?best:'—'; }
function save(v){ if(v>best){ best=v; try{ localStorage.setItem('reflexchain.best',String(v)); }catch(e){} } upd(); }

const area=$('#area'), light=$('#light'), sub=$('#sub'), scoreEl=$('#score');
let chain=0, phase='idle', lit=false, timer=null;
const rand=(a,b)=>a+Math.random()*(b-a);

function scheduleNext(){
  if(phase!=='go') return;
  const gap=Math.max(260, rand(650,1250)-Math.min(420,chain*32));
  timer=setTimeout(lightOn,gap);
}
function lightOn(){
  if(phase!=='go') return;
  lit=true; light.classList.add('lit'); sfx('pop');
  const w=Math.max(300, rand(430,900)-Math.min(280,chain*26));
  timer=setTimeout(lightOff,w);
}
function lightOff(){
  if(phase!=='go') return;
  lit=false; light.classList.remove('lit');
  gameOver('Tu as laissé passer la lumière !');
}
function begin(){
  clearTimeout(timer);
  chain=0; lit=false; phase='go';
  scoreEl.textContent='0';
  light.className='light';
  sub.textContent='Tape quand le cercle s\'allume.';
  scheduleNext();
}
function gameOver(msg){
  if(phase!=='go') return;
  phase='end'; clearTimeout(timer);
  lit=false;
  save(chain);
  light.className='light lose';
  sub.textContent=msg+' Série : '+chain+(chain===best&&chain>0?' — record !':'');
  area.classList.add('bad'); setTimeout(()=>area.classList.remove('bad'),350);
  sfx('lose');
}
area.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(phase!=='go') return;
  if(lit){
    chain++; scoreEl.textContent=chain;
    lit=false; clearTimeout(timer); light.classList.remove('lit');
    area.classList.add('good'); setTimeout(()=>area.classList.remove('good'),140);
    sfx('correct');
    scheduleNext();
  } else {
    gameOver('Trop tôt !');
  }
});
window.addEventListener('keydown',e=>{
  if((e.code==='Space'||e.code==='Enter') && phase==='go'){
    e.preventDefault();
    if(lit){
      chain++; scoreEl.textContent=chain;
      lit=false; clearTimeout(timer); light.classList.remove('lit');
      area.classList.add('good'); setTimeout(()=>area.classList.remove('good'),140);
      sfx('correct');
      scheduleNext();
    } else { gameOver('Trop tôt !'); }
  }
});
$('#go').addEventListener('click',begin);
begin(); upd();
</script>
</body>
</html>
