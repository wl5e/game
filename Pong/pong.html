<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Pong</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    background: radial-gradient(120% 80% at 50% 0%, #0a4a4a 0%, #030e0e 65%);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #cbd5e1;
    padding: 16px;
    -webkit-tap-highlight-color: transparent;
  }

  .wrap {
    width: min(88vw, 480px);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .hud {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 12px;
    letter-spacing: .16em;
    color: #64748b;
  }
  .hud b {
    color: #4ade80;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .02em;
    margin-left: 6px;
    text-shadow: 0 0 14px rgba(74, 222, 128, .45);
  }

  .board {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    border-radius: 16px;
    overflow: hidden;
    background: #0b1220;
    box-shadow:
      0 0 0 1px #1e293b,
      0 0 0 6px rgba(15, 23, 42, .55),
      0 30px 60px -25px #000;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  .pause-btn {
    position: fixed;
    top: 12px;
    right: 12px;
    width: 36px;
    height: 36px;
    display: none;
    align-items: center;
    justify-content: center;
    border: 1px solid #1e293b;
    border-radius: 10px;
    background: rgba(15, 23, 42, .72);
    color: #cbd5e1;
    font-size: 12px;
    letter-spacing: 0;
    cursor: pointer;
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    z-index: 90;
  }
  .pause-btn.show { display: flex; }
  .pause-btn:hover { background: rgba(30, 41, 59, .8); }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 24px;
    background: rgba(5, 9, 16, .82);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  .overlay h1 {
    margin: 0;
    font-size: clamp(26px, 8vw, 40px);
    letter-spacing: .22em;
    color: #e2e8f0;
    text-shadow: 0 0 26px rgba(74, 222, 128, .35);
  }
  .overlay p {
    margin: 0;
    font-size: 13px;
    line-height: 1.7;
    color: #94a3b8;
    letter-spacing: .06em;
    max-width: 30ch;
  }

  button {
    margin-top: 4px;
    padding: 12px 30px;
    font: inherit;
    font-size: 14px;
    letter-spacing: .18em;
    color: #04210f;
    background: linear-gradient(180deg, #86efac, #4ade80);
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 24px -8px rgba(74, 222, 128, .8);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 12px 28px -8px rgba(74, 222, 128, .9); }
  button:active { transform: translateY(1px) scale(.98); }

  .hint {
    margin: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: .14em;
    color: #475569;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="hud">
    <div>SCORE<b id="score">0</b></div>
    <div>BEST<b id="best">0</b></div>
  </div>

  <div class="board">
    <canvas id="game"></canvas>
    <button class="pause-btn" id="pauseBtn" aria-label="Pause">❚❚</button>
    <div class="overlay show" id="overlay">
      <h1 id="ovTitle">PONG</h1>
      <p id="ovText">First to 7 points wins. Move with W/S or the arrow keys, or drag on touch.</p>
      <button id="ovBtn">PLAY</button>
      <button id="ovBtn2" style="display:none">RESTART</button>
    </div>
  </div>

  <p class="hint">W/S OR ▲ ▼ MOVE &nbsp;·&nbsp; SPACE PAUSE &nbsp;·&nbsp; R RESTART</p>
</div>

<script>
(() => {
  "use strict";

  /* ---------- Setup ---------- */
  const W = 420;
  const H = 560;

  const canvas  = document.getElementById('game');
  const ctx     = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText  = document.getElementById('ovText');
  const ovBtn   = document.getElementById('ovBtn');
  const ovBtn2  = document.getElementById('ovBtn2');
  const pauseBtn = document.getElementById('pauseBtn');
  const scoreEl = document.getElementById('score');
  const bestEl  = document.getElementById('best');

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);

  /* ---------- Constants ---------- */
  const PW = 12;            // paddle width
  const PH = 88;            // paddle height
  const INSET = 26;         // distance from the side walls
  const PLAYER_X = INSET;
  const CPU_X = W - INSET - PW;
  const BALL_R = 7;
  const PADDLE_SPEED = 430;
  const CPU_SPEED = 240;
  const BALL_SPEED = 330;
  const BALL_MAX = 460;
  const WIN_SCORE = 7;

  /* ---------- State ---------- */
  let playerY;
  let cpuY;
  let ball;           // { x, y, vx, vy }
  let ballSpeed;
  let cpuError;
  let playerScore;
  let cpuScore;
  let state = 'idle'; // 'idle' | 'playing' | 'paused' | 'over'
  let keys = { up: false, down: false };
  let last = 0;

  let best = 0;
  try { best = parseInt(localStorage.getItem('pong.best') || '0', 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  /* ---------- Helpers ---------- */
  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y,     x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x,     y + h, r);
    ctx.arcTo(x,     y + h, x,     y,     r);
    ctx.arcTo(x,     y,     x + w, y,     r);
    ctx.closePath();
  }

  function clamp(v, min, max) { return v < min ? min : (v > max ? max : v); }

  function updateHud() {
    scoreEl.textContent = playerScore;
    bestEl.textContent = best;
  }

  function showOverlay(title, text, btnLabel, btn2Label) {
    ovTitle.textContent = title;
    ovText.textContent = text;
    ovBtn.textContent = btnLabel;
    if (btn2Label) { ovBtn2.textContent = btn2Label; ovBtn2.style.display = ''; }
    else { ovBtn2.style.display = 'none'; }
    overlay.classList.add('show');
  }

  function hideOverlay() {
    overlay.classList.remove('show');
  }

  function updatePauseBtn() { pauseBtn.classList.toggle('show', state === 'playing'); }

  /* ---------- Game logic ---------- */
  function reset() {
    playerY = (H - PH) / 2;
    cpuY = (H - PH) / 2;
    playerScore = 0;
    cpuScore = 0;
    cpuError = 44;
    keys = { up: false, down: false };
    serve();
    updateHud();
  }

  function serve() {
    ballSpeed = BALL_SPEED;
    ball = { x: W / 2, y: H / 2 };
    const a = (Math.random() * 60 - 30) * Math.PI / 180;
    const dir = Math.random() < 0.5 ? -1 : 1;
    ball.vx = Math.cos(a) * ballSpeed * dir;
    ball.vy = Math.sin(a) * ballSpeed;
  }

  function saveBest() {
    if (playerScore > best) {
      best = playerScore;
      try { localStorage.setItem('pong.best', String(best)); } catch (e) {}
    }
    updateHud();
  }

  function start() {
    reset();
    state = 'playing';
    hideOverlay();
    updatePauseBtn();
    last = performance.now();
  }

  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      showOverlay('PAUSED', 'The rally is on hold. Press space or hit resume.', 'RESUME', 'RESTART');
    } else if (state === 'paused') {
      state = 'playing';
      hideOverlay();
      last = performance.now();
    }
    updatePauseBtn();
  }

  function gameOver(won) {
    state = 'over';
    updatePauseBtn();
    saveBest();
    showOverlay(
      won ? 'YOU WIN!' : 'CPU WINS',
      won
        ? `You took the match ${playerScore}–${cpuScore}. Best: ${best}.`
        : `The CPU won ${cpuScore}–${playerScore}. You scored ${playerScore} point${playerScore === 1 ? '' : 's'}.`,
      'PLAY AGAIN'
    );
  }

  function scorePoint(who) {
    if (who === 'player') playerScore++;
    else cpuScore++;
    updateHud();

    if (playerScore >= WIN_SCORE) { gameOver(true); return; }
    if (cpuScore >= WIN_SCORE) { gameOver(false); return; }

    cpuError = 34 + Math.random() * 46;
    serve();
  }

  function moveCpu(s) {
    const center = cpuY + PH / 2;
    if (ball.vx > 0) {
      // Track the ball with a dead-zone and limited speed (lag)
      const dist = ball.y - center;
      if (Math.abs(dist) > cpuError + 6) {
        const maxStep = CPU_SPEED * s;
        const step = Math.sign(dist) * Math.min(Math.abs(dist) * 0.16 + CPU_SPEED * s * 0.5, maxStep);
        cpuY += step;
      }
    } else {
      // Drift back toward the center when the ball is heading away
      const c = (H - PH) / 2 - cpuY;
      cpuY += Math.sign(c) * Math.min(Math.abs(c) * 0.05, CPU_SPEED * 0.5 * s);
    }
    cpuY = clamp(cpuY, 0, H - PH);
  }

  function moveBall(s) {
    ball.x += ball.vx * s;
    ball.y += ball.vy * s;

    // Top / bottom walls
    if (ball.y - BALL_R < 0) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); }
    if (ball.y + BALL_R > H) { ball.y = H - BALL_R; ball.vy = -Math.abs(ball.vy); }

    // Player paddle (left)
    if (ball.vx < 0 && ball.x - BALL_R <= PLAYER_X + PW && ball.x - BALL_R >= PLAYER_X - 4) {
      if (ball.y + BALL_R >= playerY && ball.y - BALL_R <= playerY + PH) {
        const hit = clamp((ball.y - (playerY + PH / 2)) / (PH / 2), -1, 1);
        const a = hit * (Math.PI / 4);
        ballSpeed = Math.min(BALL_MAX, ballSpeed + 6);
        ball.vx = Math.cos(a) * ballSpeed;
        ball.vy = Math.sin(a) * ballSpeed;
        ball.x = PLAYER_X + PW + BALL_R + 0.5;
        return;
      }
    }

    // CPU paddle (right)
    if (ball.vx > 0 && ball.x + BALL_R >= CPU_X && ball.x + BALL_R <= CPU_X + 4) {
      if (ball.y + BALL_R >= cpuY && ball.y - BALL_R <= cpuY + PH) {
        const hit = clamp((ball.y - (cpuY + PH / 2)) / (PH / 2), -1, 1);
        const a = hit * (Math.PI / 4);
        ballSpeed = Math.min(BALL_MAX, ballSpeed + 6);
        ball.vx = -Math.cos(a) * ballSpeed;
        ball.vy = Math.sin(a) * ballSpeed;
        ball.x = CPU_X - BALL_R - 0.5;
        return;
      }
    }

    // Scoring
    if (ball.x + BALL_R < 0) { scorePoint('cpu'); return; }
    if (ball.x - BALL_R > W) { scorePoint('player'); return; }
  }

  function update(dt) {
    if (state !== 'playing') return;
    const s = dt / 1000;

    // Player paddle from keys
    if (keys.up) playerY -= PADDLE_SPEED * s;
    if (keys.down) playerY += PADDLE_SPEED * s;
    playerY = clamp(playerY, 0, H - PH);

    moveCpu(s);

    // Sub-stepped ball movement avoids tunnelling
    const dist = Math.hypot(ball.vx, ball.vy) * s;
    const steps = Math.max(1, Math.ceil(dist / 4));
    const ds = s / steps;
    for (let i = 0; i < steps; i++) {
      if (state !== 'playing') break;
      moveBall(ds);
    }
  }

  /* ---------- Rendering ---------- */
  function draw(t) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.fillStyle = '#0b1220';
    ctx.fillRect(0, 0, W, H);

    const cs = 28;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.022)';
    for (let gy = 0; gy * cs < H; gy++) {
      for (let gx = 0; gx * cs < W; gx++) {
        if ((gx + gy) % 2 === 0) ctx.fillRect(gx * cs, gy * cs, cs, cs);
      }
    }

    // Center line
    ctx.strokeStyle = 'rgba(148, 163, 184, 0.18)';
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 12]);
    ctx.beginPath();
    ctx.moveTo(W / 2, 0);
    ctx.lineTo(W / 2, H);
    ctx.stroke();
    ctx.setLineDash([]);

    // Match score inside the board
    ctx.textAlign = 'center';
    ctx.font = '700 46px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
    ctx.fillStyle = 'rgba(74, 222, 128, 0.9)';
    ctx.fillText(String(playerScore), W * 0.27, 74);
    ctx.fillStyle = 'rgba(148, 163, 184, 0.8)';
    ctx.fillText(String(cpuScore), W * 0.73, 74);
    ctx.font = '600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
    ctx.fillStyle = '#64748b';
    ctx.fillText('YOU', W * 0.27, 36);
    ctx.fillText('CPU', W * 0.73, 36);

    // Player paddle
    ctx.save();
    ctx.shadowColor = 'rgba(74, 222, 128, .85)';
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#4ade80';
    roundRect(PLAYER_X, playerY, PW, PH, 6);
    ctx.fill();
    ctx.restore();

    // CPU paddle
    ctx.save();
    ctx.shadowColor = 'rgba(148, 163, 184, .5)';
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#64748b';
    roundRect(CPU_X, cpuY, PW, PH, 6);
    ctx.fill();
    ctx.restore();

    // Ball
    ctx.save();
    ctx.shadowColor = 'rgba(255, 255, 255, .8)';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#e2e8f0';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  /* ---------- Main loop ---------- */
  function loop(t) {
    requestAnimationFrame(loop);

    if (!last) last = t;
    const dt = Math.min(t - last, 100);
    last = t;

    if (state === 'playing') update(dt);

    draw(t);
  }

  /* ---------- Input ---------- */
  function toLogicalY(clientY) {
    const r = canvas.getBoundingClientRect();
    return (clientY - r.top) * (H / r.height);
  }

  function movePaddleTo(clientY) {
    playerY = clamp(toLogicalY(clientY) - PH / 2, 0, H - PH);
  }

  const KEYS_UP   = ['ArrowUp', 'w', 'W'];
  const KEYS_DOWN = ['ArrowDown', 's', 'S'];

  window.addEventListener('keydown', (e) => {
    const k = e.key;

    if (k === ' ' || k === 'Spacebar' || k.startsWith('Arrow')) e.preventDefault();

    if (k === 'r' || k === 'R') { start(); return; }

    if (k === ' ' || k === 'Spacebar') {
      if (state === 'playing' || state === 'paused') togglePause();
      else start();
      return;
    }

    if (k === 'p' || k === 'P') {
      if (state === 'playing' || state === 'paused') togglePause();
      return;
    }

    if (KEYS_UP.includes(k)) keys.up = true;
    if (KEYS_DOWN.includes(k)) keys.down = true;
  });

  window.addEventListener('keyup', (e) => {
    const k = e.key;
    if (KEYS_UP.includes(k)) keys.up = false;
    if (KEYS_DOWN.includes(k)) keys.down = false;
  });

  ovBtn.addEventListener('click', () => {
    ovBtn.blur();
    if (state === 'paused') togglePause();
    else start();
  });

  ovBtn2.addEventListener('click', () => {
    ovBtn2.blur();
    start();
  });

  pauseBtn.addEventListener('click', () => {
    pauseBtn.blur();
    if (state === 'playing') togglePause();
  });

  // Touch controls: drag moves the player paddle, tap starts
  let touchId = null;
  let touchStart = null;

  canvas.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    touchId = t.identifier;
    touchStart = { x: t.clientX, y: t.clientY };
    movePaddleTo(t.clientY);
  }, { passive: true });

  canvas.addEventListener('touchmove', (e) => {
    if (state === 'playing') e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier === touchId) movePaddleTo(t.clientY);
    }
  }, { passive: false });

  canvas.addEventListener('touchend', (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier !== touchId) continue;
      if (touchStart && Math.hypot(t.clientX - touchStart.x, t.clientY - touchStart.y) < 22) {
        if (state === 'idle' || state === 'over') start();
      }
    }
    touchId = null;
    touchStart = null;
  }, { passive: true });

  // Auto-pause when the tab loses focus
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'playing') togglePause();
  });

  /* ---------- Boot ---------- */
  reset();
  state = 'idle';
  updatePauseBtn();
  requestAnimationFrame(loop);
})();
</script>
<style>
.sound-btn{position:fixed;top:12px;left:12px;width:38px;height:38px;border:1px solid #1e293b;border-radius:10px;background:rgba(15,23,42,.72);color:#cbd5e1;font-size:16px;line-height:1;cursor:pointer;z-index:99;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sound-btn:hover{background:rgba(30,41,59,.8)}
</style>
<button class="sound-btn" id="soundBtn" aria-label="Toggle sound">♪</button>
<script>
(function () {
  "use strict";
  var AC = window.AudioContext || window.webkitAudioContext;
  var ctx = null, master = null, musicGain = null, noiseBuf = null;
  var muted = false, musicOn = false, timer = null, step = 0, nextT = 0;

  var LEAD = [659.24,739.97,830.59,879.98,987.74,879.98,830.59,739.97,659.24,830.59,987.74,830.59,879.98,830.59,739.97,659.24];
  var BASS = [164.81,246.94,164.81,0,164.81,246.94,164.81,0,164.81,246.94,164.81,0,164.81,246.94,164.81,0];
  var STEP = 0.12;

  try { muted = localStorage.getItem('arcade.muted') === '1'; } catch (e) {}

  function ensureCtx() {
    if (!ctx) {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = muted ? 0 : 0.6;
      master.connect(ctx.destination);
      musicGain = ctx.createGain();
      musicGain.gain.value = 0.5;
      musicGain.connect(master);
      var n = Math.floor(ctx.sampleRate * 0.04);
      noiseBuf = ctx.createBuffer(1, n, ctx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    }
    if (ctx.state === 'suspended') ctx.resume();
  }

  function note(freq, t, dur, type, vol) {
    if (!freq) return;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(musicGain);
    o.start(t); o.stop(t + dur + 0.05);
  }

  function hat(t) {
    var s = ctx.createBufferSource(); s.buffer = noiseBuf;
    var hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7000;
    var g = ctx.createGain(); g.gain.value = 0.05;
    s.connect(hp); hp.connect(g); g.connect(musicGain);
    s.start(t);
  }

  function schedule(i, t) {
    var k = i % LEAD.length;
    note(LEAD[k], t, STEP * 0.9, 'square', 0.16);
    note(BASS[k], t, STEP * 0.95, 'triangle', 0.2);
    hat(t);
  }

  function tick() {
    while (nextT < ctx.currentTime + 0.12) {
      schedule(step, nextT);
      step++;
      nextT += STEP;
    }
  }

  function startMusic() {
    if (musicOn) return;
    ensureCtx();
    musicOn = true;
    nextT = ctx.currentTime + 0.05;
    step = 0;
    timer = setInterval(tick, 25);
  }

  function stopMusic() {
    if (timer) { clearInterval(timer); timer = null; }
    musicOn = false;
    step = 0;
  }

  function setMuted(m) {
    muted = m;
    try { localStorage.setItem('arcade.muted', m ? '1' : '0'); } catch (e) {}
    if (master) master.gain.setTargetAtTime(m ? 0 : 0.6, ctx.currentTime, 0.02);
    var b = document.getElementById('soundBtn');
    if (b) b.textContent = m ? '🔇' : '♪';
  }

  function sync() {
    var pb = document.getElementById('pauseBtn');
    if (pb && pb.classList.contains('show')) { if (!musicOn) startMusic(); }
    else if (musicOn) stopMusic();
  }

  function wire() {
    var sb = document.getElementById('soundBtn');
    if (sb) sb.addEventListener('click', function () { ensureCtx(); setMuted(!muted); });
    window.addEventListener('pointerdown', ensureCtx);
    window.addEventListener('keydown', ensureCtx);
    var pb = document.getElementById('pauseBtn');
    if (pb) new MutationObserver(sync).observe(pb, { attributes: true, attributeFilter: ['class'] });
    var b = document.getElementById('soundBtn');
    if (b) b.textContent = muted ? '🔇' : '♪';
    sync();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', wire);
  else wire();
})();
</script>
<button class="rules-btn" id="rulesBtn">RULES</button>
<div class="rules-panel" id="rulesPanel">
  <div class="rules-card">
    <h2>HOW TO PLAY</h2>
    <p id="rulesText"></p>
    <button id="rulesClose">BACK</button>
  </div>
</div>
<style>
.rules-btn{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);padding:10px 22px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:.18em;color:#cbd5e1;background:rgba(15,23,42,.85);border:1px solid #334155;border-radius:999px;cursor:pointer;display:none;z-index:60}
.rules-btn.show{display:block}
.rules-btn:hover{background:rgba(30,41,59,.9)}
.rules-panel{position:fixed;inset:0;background:rgba(5,9,16,.94);display:none;align-items:center;justify-content:center;padding:20px;z-index:200;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.rules-panel.show{display:flex}
.rules-card{width:min(88vw,440px);max-height:80vh;overflow:auto;background:#0b1220;border:1px solid #1e293b;border-radius:16px;padding:24px;box-shadow:0 30px 60px -25px #000;text-align:center}
.rules-card h2{margin:0 0 14px;font-size:14px;letter-spacing:.24em;color:#4ade80}
.rules-card p{margin:0 0 20px;font-size:13px;line-height:1.9;color:#cbd5e1;letter-spacing:.03em;text-align:left}
.rules-card button{margin:0;padding:10px 26px;font:inherit;font-size:13px;letter-spacing:.18em;color:#04210f;background:linear-gradient(180deg,#86efac,#4ade80);border:0;border-radius:999px;cursor:pointer;box-shadow:0 8px 24px -8px rgba(74,222,128,.8)}
</style>
<script>
(function () {
  "use strict";
  var RULES = "Move your paddle with W/S or the Up/Down arrows. Score a point by getting the ball past the computer's paddle. The first to 7 points wins the match.";
  var btn = document.getElementById('rulesBtn');
  var panel = document.getElementById('rulesPanel');
  var text = document.getElementById('rulesText');
  var close = document.getElementById('rulesClose');
  if (text) text.textContent = RULES;
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' || e.key === 'Esc') {
      e.preventDefault();
      if (panel && panel.classList.contains('show')) { panel.classList.remove('show'); return; }
      try { document.dispatchEvent(new KeyboardEvent('keydown', { key: 'p', bubbles: true, cancelable: true })); } catch (err) {}
    }
  });
  function sync() {
    var pb = document.getElementById('pauseBtn');
    var title = document.getElementById('ovTitle');
    var paused = pb && !pb.classList.contains('show') && title && /PAUSED/i.test(title.textContent || '');
    if (btn) btn.classList.toggle('show', !!paused);
    var ov = document.getElementById('overlay');
    if (ov && !ov.classList.contains('show') && panel) panel.classList.remove('show');
  }
  var pb = document.getElementById('pauseBtn');
  if (pb) new MutationObserver(sync).observe(pb, { attributes: true, attributeFilter: ['class'] });
  var ov = document.getElementById('overlay');
  if (ov) new MutationObserver(sync).observe(ov, { attributes: true, attributeFilter: ['class'] });
  if (btn) btn.addEventListener('click', function () { if (panel) panel.classList.add('show'); });
  if (close) close.addEventListener('click', function () { if (panel) panel.classList.remove('show'); });
  if (panel) panel.addEventListener('click', function (e) { if (e.target === panel) panel.classList.remove('show'); });
  sync();
})();
</script>
<style>
#score{display:inline-block}
#score.pulse{animation:scorePulse .45s ease}
@keyframes scorePulse{
  0%{transform:scale(1);text-shadow:0 0 14px rgba(74,222,128,.45)}
  40%{transform:scale(1.4);text-shadow:0 0 26px rgba(74,222,128,.95)}
  100%{transform:scale(1);text-shadow:0 0 14px rgba(74,222,128,.45)}
}
</style>
<script>
(function () {
  "use strict";
  var el = document.getElementById('score');
  if (!el) return;
  var last = parseInt(el.textContent, 10) || 0;
  var mo = new MutationObserver(function () {
    var cur = parseInt(el.textContent, 10) || 0;
    if (cur > last) {
      el.classList.remove('pulse');
      void el.offsetWidth;
      el.classList.add('pulse');
    }
    last = cur;
  });
  mo.observe(el, { childList: true, characterData: true, subtree: true });
})();
</script>
</body>
</html>
