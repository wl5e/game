<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Target Tap</title>
<style>
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0%,#16233a 0%,#070b12 65%);font-family:ui-monospace,Menlo,Consolas,monospace;color:#cbd5e1;padding:16px;-webkit-tap-highlight-color:transparent}
  .wrap{width:min(92vw,460px);display:flex;flex-direction:column;gap:12px}
  .hud{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.15em;color:#64748b}
  .hud b{color:#38bdf8;font-size:20px;margin-left:6px}
  .area{background:#0b1220;border:1px solid #1e293b;border-radius:14px;min-height:230px;display:grid;place-items:center;padding:16px;text-align:center;user-select:none;position:relative;overflow:hidden}
  button{font-family:inherit;border:0;border-radius:10px;padding:11px 15px;font-size:14px;font-weight:700;background:#0ea5e9;color:#04222a;cursor:pointer}
  button:active{transform:translateY(1px)}
  .hint{color:#64748b;font-size:11px;text-align:center;line-height:1.6}
  .big{font-size:26px;font-weight:800}
  .opt{background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:10px;padding:10px 14px;font-size:16px;font-weight:700;margin:4px;cursor:pointer}
  .opt:hover{border-color:#38bdf8}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>TOUCHÉS <b id="score">0</b></span><span>BEST <b id="best">—</b></span></div>
  <div class="area" id="area"><canvas id="cv" width="420" height="230"></canvas></div>
  <button id="go">Rejouer</button>
  <div class="hint">Clique la cible avant qu'elle ne disparaisse. 20 secondes.</div>
</div>
<script>
const $=s=>document.querySelector(s);
let best=0;try{best=parseInt(localStorage.getItem('targettap.best')||'0',10)||0}catch(e){}
function saveHigh(v){ if(v>best){best=v;try{localStorage.setItem('targettap.best',String(v))}catch(e){}} upd(); }
function saveLow(v){ if(best===0||v<best){best=v;try{localStorage.setItem('targettap.best',String(v))}catch(e){}} upd(); }
function upd(){ $('#best').textContent=best?best:'—'; }
const cv=$('#cv'),c=cv.getContext('2d');let hits=0,ox=0,oy=0,r=24,time=20000,left=20000,last=performance.now();
function place(){ ox=30+Math.random()*(cv.width-60); oy=30+Math.random()*(cv.height-60); }
function draw(){ c.clearRect(0,0,cv.width,cv.height); c.strokeStyle='#f87171';c.lineWidth=3;c.beginPath();c.arc(ox,oy,r,0,7);c.stroke(); c.strokeStyle='#fca5a5';c.beginPath();c.arc(ox,oy,r*0.5,0,7);c.stroke(); }
function frame(){ const now=performance.now(); left-=now-last; last=now; if(left<=0){ end(); return; } draw(); requestAnimationFrame(frame); }
function end(){ saveHigh(hits); $('#score').textContent=hits; c.clearRect(0,0,cv.width,cv.height); c.fillStyle='#f87171';c.font='bold 22px monospace';c.textAlign='center';c.fillText(hits+' cibles',cv.width/2,cv.height/2); }
cv.onclick=e=>{ const rct=cv.getBoundingClientRect(); const x=(e.clientX-rct.left)*(cv.width/rct.width), y=(e.clientY-rct.top)*(cv.height/rct.height); if((x-ox)**2+(y-oy)**2 < r*r){ hits++; place(); } };
$('#go').onclick=()=>{ hits=0; left=20000; last=performance.now(); place(); $('#score').textContent='0'; frame(); };
upd();
</script>
</body>
</html>
