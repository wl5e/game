<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Odd One Out</title>
<style>
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0%,#16233a 0%,#070b12 65%);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#cbd5e1;padding:16px;-webkit-tap-highlight-color:transparent}
  .wrap{width:min(92vw,460px);display:flex;flex-direction:column;gap:12px}
  .hud{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.15em;color:#64748b}
  .hud b{color:#38bdf8;font-size:20px;margin-left:6px}
  .area{background:#0b1220;border:1px solid #1e293b;border-radius:16px;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;text-align:center;user-select:none;position:relative;overflow:hidden}
  button{font-family:inherit;border:0;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:700;background:#0ea5e9;color:#04222a;cursor:pointer}
  button.big{width:100%}
  button:active{transform:translateY(1px)}
  .hint{color:#64748b;font-size:11px;text-align:center;line-height:1.6}
  .msg{font-size:11px;letter-spacing:.2em;color:#64748b;min-height:14px}
  .barwrap{width:100%;height:8px;border-radius:6px;background:#1e293b;overflow:hidden}
  #bar{height:100%;width:100%;background:#38bdf8;border-radius:6px}
  #shapes{display:flex;gap:12px;justify-content:center}
  .shape{width:76px;height:76px;border-radius:16px;background:#1e293b;border:1px solid #334155;font-size:38px;cursor:pointer;display:grid;place-items:center;transition:background .12s,border-color .12s,transform .12s}
  .shape:active{transform:scale(.92)}
  .shape.good{background:#15803d;border-color:#4ade80}
  .shape.bad{background:#7f1d1d;border-color:#f87171}
  .overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(7,11,18,.9);z-index:5;text-align:center}
  .overlay .t{font-size:26px;font-weight:800;color:#f87171}
  .overlay .s{color:#94a3b8;margin-top:10px;font-size:13px;line-height:1.6}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
  .shake{animation:shake .3s}
</style>
<script src="../audio.js"></script>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>SÉRIE <b id="score">0</b></span><span>BEST <b id="best">—</b></span></div>
  <div class="area" id="area">
    <div class="msg" id="msg">Trouve l'intrus !</div>
    <div class="barwrap"><div id="bar"></div></div>
    <div id="shapes"></div>
  </div>
  <button class="big" id="go">Rejouer</button>
  <div class="hint">Trouve l'<b>intrus</b> parmi les 4 formes. Le temps se réduit à chaque bonne réponse. · Par 15</div>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
let best=0;try{best=parseInt(localStorage.getItem('patternbreak.best')||'0',10)||0}catch(e){}
function upd(){ $('#best').textContent=best?best:'—'; }
function saveHigh(v){ if(v>best){ best=v; try{localStorage.setItem('patternbreak.best',String(v))}catch(e){} upd(); } }

const SH=['🔵','🔺','🟩','⭐','🔷','🟠','💠','🍎','🐚','🟣','🧲','🎲'];
let streak=0, odd=0, active=false, raf=0, start=0, limit=4000;

function q(){
  const base=SH[Math.floor(Math.random()*SH.length)];
  const arr=[base,base,base,base];
  odd=Math.floor(Math.random()*4);
  let o; do{ o=SH[Math.floor(Math.random()*SH.length)]; }while(o===base);
  arr[odd]=o;
  const box=$('#shapes'); box.innerHTML='';
  arr.forEach((s,i)=>{
    const b=document.createElement('button');
    b.className='shape'; b.textContent=s;
    b.onclick=()=>tap(i);
    box.appendChild(b);
  });
  limit=Math.max(1600, 4000 - streak*130);
  start=performance.now();
  active=true;
  $('#msg').textContent='Série '+streak;
  cancelAnimationFrame(raf);
  tick();
}
function tick(){
  if(!active) return;
  const left=limit-(performance.now()-start);
  $('#bar').style.width=Math.max(0,left/limit*100)+'%';
  if(left<=0){ lose('Temps écoulé'); return; }
  raf=requestAnimationFrame(tick);
}

function tap(i){
  if(!active) return;
  const el=$('#shapes').children[i];
  if(i===odd){
    active=false; cancelAnimationFrame(raf);
    streak++; $('#score').textContent=streak;
    el.classList.add('good'); Arcade.sfx('correct');
    setTimeout(q, 340);
  } else {
    active=false; cancelAnimationFrame(raf);
    el.classList.add('bad');
    $('#shapes').children[odd].classList.add('good');
    Arcade.sfx('wrong'); setTimeout(()=>Arcade.sfx('lose'),200);
    const a=$('#area'); a.classList.add('shake'); setTimeout(()=>a.classList.remove('shake'),320);
    saveHigh(streak);
    showOver('Perdu !', 'Série : '+streak);
  }
}

function showOver(t,s){
  const ov=document.createElement('div'); ov.className='overlay'; ov.innerHTML='<div><div class="t">'+t+'</div><div class="s">'+s+'</div></div>';
  $('#area').appendChild(ov);
}

function reset(){
  cancelAnimationFrame(raf);
  streak=0; active=false;
  $('#score').textContent='0';
  $('#msg').textContent='Trouve l\'intrus !';
  $('#bar').style.width='100%';
  const ov=$('.overlay'); if(ov) ov.remove();
  $('#area').classList.remove('shake');
  upd();
  q();
}
$('#go').onclick=reset;
upd();
reset();
</script>
</body>
</html>
