<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Hangman</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    background: radial-gradient(120% 80% at 50% 0%, #3a2010 0%, #0c0602 65%);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #cbd5e1;
    padding: 16px;
    -webkit-tap-highlight-color: transparent;
  }

  .wrap {
    width: min(88vw, 480px);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .hud {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 12px;
    letter-spacing: .16em;
    color: #64748b;
  }
  .hud b {
    color: #4ade80;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .02em;
    margin-left: 6px;
    text-shadow: 0 0 14px rgba(74, 222, 128, .45);
  }

  .board {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    border-radius: 16px;
    overflow: hidden;
    background: #0b1220;
    box-shadow:
      0 0 0 1px #1e293b,
      0 0 0 6px rgba(15, 23, 42, .55),
      0 30px 60px -25px #000;
    display: flex;
    flex-direction: column;
  }

  .pause-btn {
    position: fixed;
    top: 12px;
    right: 12px;
    width: 36px;
    height: 36px;
    display: none;
    align-items: center;
    justify-content: center;
    border: 1px solid #1e293b;
    border-radius: 10px;
    background: rgba(15, 23, 42, .72);
    color: #cbd5e1;
    font-size: 12px;
    letter-spacing: 0;
    cursor: pointer;
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    z-index: 90;
  }
  .pause-btn.show { display: flex; }
  .pause-btn:hover { background: rgba(30, 41, 59, .8); }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 24px;
    background: rgba(5, 9, 16, .82);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  .overlay h1 {
    margin: 0;
    font-size: clamp(26px, 8vw, 40px);
    letter-spacing: .22em;
    color: #e2e8f0;
    text-shadow: 0 0 26px rgba(74, 222, 128, .35);
  }
  .overlay p {
    margin: 0;
    font-size: 13px;
    line-height: 1.7;
    color: #94a3b8;
    letter-spacing: .06em;
    max-width: 30ch;
  }

  button {
    margin-top: 4px;
    padding: 12px 30px;
    font: inherit;
    font-size: 14px;
    letter-spacing: .18em;
    color: #04210f;
    background: linear-gradient(180deg, #86efac, #4ade80);
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 24px -8px rgba(74, 222, 128, .8);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 12px 28px -8px rgba(74, 222, 128, .9); }
  button:active { transform: translateY(1px) scale(.98); }

  .hint {
    margin: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: .14em;
    color: #475569;
  }

  /* ---------- Hangman-specific ---------- */
  .hang {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
    padding: 16px 14px 8px;
    min-height: 0;
  }
  svg {
    display: block;
    width: min(230px, 56%);
    flex-shrink: 0;
  }
  .part {
    opacity: 0;
    transition: opacity .18s ease;
    stroke: #4ade80;
    stroke-width: 4;
    stroke-linecap: round;
    fill: none;
  }
  .part.on { opacity: 1; }

  .word {
    display: flex;
    gap: 6px;
    justify-content: center;
    flex-wrap: wrap;
    min-height: 34px;
  }
  .tile {
    width: 26px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 3px solid #334155;
    font-size: 20px;
    font-weight: 700;
    color: #e2e8f0;
    text-transform: uppercase;
  }
  .tile.revealed { color: #4ade80; }
  .tile.missed { color: #ff8fa3; border-color: rgba(255, 77, 109, .5); }

  .keys {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    padding: 0 14px 16px;
  }
  button.key {
    margin: 0;
    padding: 8px 0;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: #cbd5e1;
    background: #131c2c;
    border: 1px solid #1e293b;
    border-radius: 8px;
    box-shadow: none;
    cursor: pointer;
  }
  button.key:hover { background: #1e293b; }
  button.key.used { cursor: default; opacity: .35; }
  button.key.hit { background: rgba(74, 222, 128, .16); color: #4ade80; border-color: rgba(74, 222, 128, .4); }
  button.key.miss { background: rgba(255, 77, 109, .12); color: #ff8fa3; border-color: rgba(255, 77, 109, .35); }
</style>
</head>
<body>

<div class="wrap">
  <div class="hud">
    <div>SCORE<b id="score">0</b></div>
    <div>BEST<b id="best">0</b></div>
  </div>

  <div class="board">
    <div class="hang">
      <svg viewBox="0 0 220 175" aria-hidden="true">
        <g stroke="#64748b" stroke-width="5" stroke-linecap="round" fill="none">
          <line x1="24" y1="166" x2="156" y2="166" />
          <line x1="48" y1="166" x2="48" y2="26" />
          <line x1="48" y1="26" x2="132" y2="26" />
          <line x1="132" y1="26" x2="132" y2="46" />
        </g>
        <g class="part"><circle cx="132" cy="58" r="13" /></g>
        <g class="part"><line x1="132" y1="71" x2="132" y2="118" /></g>
        <g class="part"><line x1="132" y1="82" x2="110" y2="102" /></g>
        <g class="part"><line x1="132" y1="82" x2="154" y2="102" /></g>
        <g class="part"><line x1="132" y1="118" x2="114" y2="146" /></g>
        <g class="part"><line x1="132" y1="118" x2="150" y2="146" /></g>
      </svg>
      <div class="word" id="word"></div>
    </div>
    <div class="keys" id="keys"></div>
    <button class="pause-btn" id="pauseBtn" aria-label="Pause">❚❚</button>
    <div class="overlay show" id="overlay">
      <h1 id="ovTitle">HANGMAN</h1>
      <p id="ovText">Guess the hidden word one letter at a time. Six wrong guesses and the game is over.</p>
      <button id="ovBtn">PLAY</button>
      <button id="ovBtn2" style="display:none">RESTART</button>
    </div>
  </div>

  <p class="hint">A–Z KEYS / TAP &nbsp;·&nbsp; SPACE PAUSE &nbsp;·&nbsp; R RESTART</p>
</div>

<script>
(() => {
  "use strict";

  /* ---------- Setup ---------- */
  const WORDS = [
    'acorn','anchor','angel','apple','arrow','atlas','autumn','bacon','baker',
    'bamboo','banana','basket','beacon','beaver','berry','bicycle','blanket',
    'blossom','boulder','branch','breeze','bridge','bucket','butter','cabin',
    'cactus','camel','candle','canoe','castle','cedar','cheese','cherry',
    'chicken','clock','cloud','clover','coast','coconut','coffee','compass',
    'coral','corner','cottage','cricket','daisy','dawn','deer','desert',
    'diamond','dolphin','dragon','drum','eagle','echo','ember','engine',
    'falcon','feather','fern','field','flame','flower','forest','fossil',
    'fountain','garden','ginger','glacier','globe','goose','grape','hammer',
    'harbor','harvest','hawk','helmet','honey','horse','island','jacket',
    'jewel','jungle','kettle','kite','ladder','lantern','lemon','leopard',
    'lighthouse','meadow','melon','mirror','moon','mountain','mushroom',
    'nectar','noodle','ocean','olive','orange','orchard','otter','owl',
    'palace','palm','parrot','pebble','pencil','penguin','pepper','piano',
    'pigeon','pineapple','planet','plum','pond','pumpkin','puzzle','quail',
    'queen','rabbit','rainbow','raven','river','robin','rocket','rose',
    'saddle','salmon','sapphire','scarf','shadow','shark','sheep','shell',
    'silver','spider','squirrel','star','storm','strawberry','summer','swan',
    'thunder','tiger','tomato','torch','tower','train','tulip','turtle',
    'valley','violin','volcano','wagon','waterfall','wheat','whistle',
    'window','winter','wolf','zebra'
  ];
  const MAX_WRONG = 6;
  const LETTERS = 'abcdefghijklmnopqrstuvwxyz';

  const overlay  = document.getElementById('overlay');
  const ovTitle  = document.getElementById('ovTitle');
  const ovText   = document.getElementById('ovText');
  const ovBtn    = document.getElementById('ovBtn');
  const ovBtn2   = document.getElementById('ovBtn2');
  const pauseBtn = document.getElementById('pauseBtn');
  const scoreEl  = document.getElementById('score');
  const bestEl   = document.getElementById('best');
  const wordEl   = document.getElementById('word');
  const keysEl   = document.getElementById('keys');
  const parts    = Array.from(document.querySelectorAll('.part'));

  /* ---------- State ---------- */
  let answer;       // the word to guess
  let guessed;      // Set of letters guessed
  let wrong;        // number of wrong guesses
  let revealAll;    // show the word on loss
  let streak;       // current win streak (score)
  let state = 'idle'; // 'idle' | 'playing' | 'paused' | 'over'

  let best = 0;
  try { best = parseInt(localStorage.getItem('hangman.best') || '0', 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  /* ---------- Helpers ---------- */
  function showOverlay(title, text, btnLabel, btn2Label) {
    ovTitle.textContent = title;
    ovText.textContent = text;
    ovBtn.textContent = btnLabel;
    if (btn2Label) { ovBtn2.textContent = btn2Label; ovBtn2.style.display = ''; }
    else { ovBtn2.style.display = 'none'; }
    overlay.classList.add('show');
  }

  function hideOverlay() {
    overlay.classList.remove('show');
  }

  function updatePauseBtn() { pauseBtn.classList.toggle('show', state === 'playing'); }

  function updateHud() {
    scoreEl.textContent = streak;
    bestEl.textContent = best;
  }

  /* ---------- On-screen keyboard ---------- */
  const keyEls = {};
  for (const ch of LETTERS) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'key';
    b.textContent = ch.toUpperCase();
    b.dataset.ch = ch;
    b.addEventListener('click', () => { b.blur(); guess(ch); });
    keysEl.appendChild(b);
    keyEls[ch] = b;
  }

  /* ---------- Rendering ---------- */
  function renderWord() {
    wordEl.innerHTML = '';
    for (const ch of answer) {
      const d = document.createElement('div');
      d.className = 'tile';
      if (guessed.has(ch)) {
        d.textContent = ch.toUpperCase();
        d.classList.add('revealed');
      } else if (revealAll) {
        d.textContent = ch.toUpperCase();
        d.classList.add('missed');
      }
      wordEl.appendChild(d);
    }
  }

  function renderGallows() {
    parts.forEach((p, i) => p.classList.toggle('on', wrong > i));
  }

  function renderKeys() {
    for (const ch of LETTERS) {
      const el = keyEls[ch];
      if (guessed.has(ch)) {
        el.classList.add('used');
        el.classList.toggle('hit', answer.indexOf(ch) !== -1);
        el.classList.toggle('miss', answer.indexOf(ch) === -1);
      } else {
        el.classList.remove('used', 'hit', 'miss');
      }
    }
  }

  /* ---------- Game logic ---------- */
  function pickWord() {
    answer = WORDS[(Math.random() * WORDS.length) | 0];
  }

  function reset() {
    pickWord();
    guessed = new Set();
    wrong = 0;
    revealAll = false;
    renderWord();
    renderGallows();
    renderKeys();
    updateHud();
  }

  function checkWin() {
    for (const ch of answer) if (!guessed.has(ch)) return false;
    return true;
  }

  function guess(ch) {
    if (state !== 'playing') return;
    if (typeof ch === 'string') ch = ch.toLowerCase();
    if (!/[a-z]/.test(ch) || guessed.has(ch)) return;
    guessed.add(ch);
    if (answer.indexOf(ch) === -1) wrong++;
    renderWord();
    renderGallows();
    renderKeys();
    if (checkWin()) { endGame(true); return; }
    if (wrong >= MAX_WRONG) { endGame(false); return; }
  }

  function endGame(won) {
    state = 'over';
    updatePauseBtn();
    if (won) {
      streak += 1;
      if (streak > best) {
        best = streak;
        try { localStorage.setItem('hangman.best', String(best)); } catch (e) {}
      }
    } else {
      revealAll = true;
      streak = 0;
      renderWord();
    }
    updateHud();
    showOverlay(
      won ? 'YOU WIN' : 'GAME OVER',
      won
        ? `The word was ${answer.toUpperCase()}. Streak: ${streak}.`
        : `The word was ${answer.toUpperCase()}. Streak reset to 0.`,
      'PLAY AGAIN'
    );
  }

  function start() {
    reset();
    state = 'playing';
    hideOverlay();
    updatePauseBtn();
  }

  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      showOverlay('PAUSED', 'Take a breath. The word will still be here when you resume.', 'RESUME', 'RESTART');
    } else if (state === 'paused') {
      state = 'playing';
      hideOverlay();
    }
    updatePauseBtn();
  }

  /* ---------- Input ---------- */
  window.addEventListener('keydown', (e) => {
    const k = e.key;

    if (k === ' ' || k === 'Spacebar' || k.startsWith('Arrow')) e.preventDefault();

    if (k === 'r' || k === 'R') { start(); return; }

    if (k === ' ' || k === 'Spacebar') {
      if (state === 'playing' || state === 'paused') togglePause();
      else start();
      return;
    }

    if (k === 'p' || k === 'P') {
      if (state === 'playing' || state === 'paused') togglePause();
      return;
    }

    if (state === 'playing' && /^[a-zA-Z]$/.test(k)) guess(k);
  });

  ovBtn.addEventListener('click', () => {
    ovBtn.blur();
    if (state === 'paused') togglePause();
    else start();
  });

  ovBtn2.addEventListener('click', () => {
    ovBtn2.blur();
    start();
  });

  pauseBtn.addEventListener('click', () => {
    pauseBtn.blur();
    if (state === 'playing') togglePause();
  });

  // Auto-pause when the tab loses focus
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'playing') togglePause();
  });

  /* ---------- Boot ---------- */
  reset();
  state = 'idle';
  updatePauseBtn();
})();
</script>
<style>
.sound-btn{position:fixed;top:12px;left:12px;width:38px;height:38px;border:1px solid #1e293b;border-radius:10px;background:rgba(15,23,42,.72);color:#cbd5e1;font-size:16px;line-height:1;cursor:pointer;z-index:99;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sound-btn:hover{background:rgba(30,41,59,.8)}
</style>
<button class="sound-btn" id="soundBtn" aria-label="Toggle sound">♪</button>
<script>
(function () {
  "use strict";
  var AC = window.AudioContext || window.webkitAudioContext;
  var ctx = null, master = null, musicGain = null, noiseBuf = null;
  var muted = false, musicOn = false, timer = null, step = 0, nextT = 0;

  var LEAD = [880,987.77,1108.73,1244.51,1318.51,1244.51,1108.73,987.77,880,1108.73,1318.51,1108.73,1244.51,1108.73,987.77,880];
  var BASS = [220,329.63,220,0,220,329.63,220,0,220,329.63,220,0,220,329.63,220,0];
  var STEP = 0.15;

  try { muted = localStorage.getItem('arcade.muted') === '1'; } catch (e) {}

  function ensureCtx() {
    if (!ctx) {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = muted ? 0 : 0.6;
      master.connect(ctx.destination);
      musicGain = ctx.createGain();
      musicGain.gain.value = 0.5;
      musicGain.connect(master);
      var n = Math.floor(ctx.sampleRate * 0.04);
      noiseBuf = ctx.createBuffer(1, n, ctx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    }
    if (ctx.state === 'suspended') ctx.resume();
  }

  function note(freq, t, dur, type, vol) {
    if (!freq) return;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(musicGain);
    o.start(t); o.stop(t + dur + 0.05);
  }

  function hat(t) {
    var s = ctx.createBufferSource(); s.buffer = noiseBuf;
    var hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7000;
    var g = ctx.createGain(); g.gain.value = 0.05;
    s.connect(hp); hp.connect(g); g.connect(musicGain);
    s.start(t);
  }

  function schedule(i, t) {
    var k = i % LEAD.length;
    note(LEAD[k], t, STEP * 0.9, 'sawtooth', 0.16);
    note(BASS[k], t, STEP * 0.95, 'sine', 0.2);
    hat(t);
  }

  function tick() {
    while (nextT < ctx.currentTime + 0.12) {
      schedule(step, nextT);
      step++;
      nextT += STEP;
    }
  }

  function startMusic() {
    if (musicOn) return;
    ensureCtx();
    musicOn = true;
    nextT = ctx.currentTime + 0.05;
    step = 0;
    timer = setInterval(tick, 25);
  }

  function stopMusic() {
    if (timer) { clearInterval(timer); timer = null; }
    musicOn = false;
    step = 0;
  }

  function setMuted(m) {
    muted = m;
    try { localStorage.setItem('arcade.muted', m ? '1' : '0'); } catch (e) {}
    if (master) master.gain.setTargetAtTime(m ? 0 : 0.6, ctx.currentTime, 0.02);
    var b = document.getElementById('soundBtn');
    if (b) b.textContent = m ? '🔇' : '♪';
  }

  function sync() {
    var pb = document.getElementById('pauseBtn');
    if (pb && pb.classList.contains('show')) { if (!musicOn) startMusic(); }
    else if (musicOn) stopMusic();
  }

  function wire() {
    var sb = document.getElementById('soundBtn');
    if (sb) sb.addEventListener('click', function () { ensureCtx(); setMuted(!muted); });
    window.addEventListener('pointerdown', ensureCtx);
    window.addEventListener('keydown', ensureCtx);
    var pb = document.getElementById('pauseBtn');
    if (pb) new MutationObserver(sync).observe(pb, { attributes: true, attributeFilter: ['class'] });
    var b = document.getElementById('soundBtn');
    if (b) b.textContent = muted ? '🔇' : '♪';
    sync();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', wire);
  else wire();
})();
</script>
<button class="rules-btn" id="rulesBtn">RULES</button>
<div class="rules-panel" id="rulesPanel">
  <div class="rules-card">
    <h2>HOW TO PLAY</h2>
    <p id="rulesText"></p>
    <button id="rulesClose">BACK</button>
  </div>
</div>
<style>
.rules-btn{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);padding:10px 22px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:.18em;color:#cbd5e1;background:rgba(15,23,42,.85);border:1px solid #334155;border-radius:999px;cursor:pointer;display:none;z-index:60}
.rules-btn.show{display:block}
.rules-btn:hover{background:rgba(30,41,59,.9)}

.rules-panel.show{display:flex}
.rules-card{width:min(88vw,440px);max-height:80vh;overflow:auto;background:#0b1220;border:1px solid #1e293b;border-radius:16px;padding:24px;box-shadow:0 30px 60px -25px #000;text-align:center}

.rules-card button{margin:0;padding:10px 26px;font:inherit;font-size:13px;letter-spacing:.18em;color:#04210f;background:linear-gradient(180deg,#86efac,#4ade80);border:0;border-radius:999px;cursor:pointer;box-shadow:0 8px 24px -8px rgba(74,222,128,.8)}
</style>
<script>
(function () {
  "use strict";
  var RULES = "Guess the hidden word one letter at a time using the on-screen keyboard or your own keyboard. Each wrong letter draws part of the gallows. Make 6 mistakes and you lose. Guess the whole word to win.";
  var btn = document.getElementById('rulesBtn');
  var panel = document.getElementById('rulesPanel');
  var text = document.getElementById('rulesText');
  var close = document.getElementById('rulesClose');
  if (text) text.textContent = RULES;
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' || e.key === 'Esc') {
      e.preventDefault();
      if (panel && panel.classList.contains('show')) { panel.classList.remove('show'); return; }
      try { document.dispatchEvent(new KeyboardEvent('keydown', { key: 'p', bubbles: true, cancelable: true })); } catch (err) {}
    }
  });
  function sync() {
    var pb = document.getElementById('pauseBtn');
    var title = document.getElementById('ovTitle');
    var paused = pb && !pb.classList.contains('show') && title && /PAUSED/i.test(title.textContent || '');
    if (btn) btn.classList.toggle('show', !!paused);
    var ov = document.getElementById('overlay');
    if (ov && !ov.classList.contains('show') && panel) panel.classList.remove('show');
  }
  var pb = document.getElementById('pauseBtn');
  if (pb) new MutationObserver(sync).observe(pb, { attributes: true, attributeFilter: ['class'] });
  var ov = document.getElementById('overlay');
  if (ov) new MutationObserver(sync).observe(ov, { attributes: true, attributeFilter: ['class'] });
  if (btn) btn.addEventListener('click', function () { if (panel) panel.classList.add('show'); });
  if (close) close.addEventListener('click', function () { if (panel) panel.classList.remove('show'); });
  if (panel) panel.addEventListener('click', function (e) { if (e.target === panel) panel.classList.remove('show'); });
  sync();
})();
</script>
<style>
#score{display:inline-block}
#score.pulse{animation:scorePulse .45s ease}
@keyframes scorePulse{
  0%{transform:scale(1);text-shadow:0 0 14px rgba(74,222,128,.45)}
  40%{transform:scale(1.4);text-shadow:0 0 26px rgba(74,222,128,.95)}
  100%{transform:scale(1);text-shadow:0 0 14px rgba(74,222,128,.45)}
}
</style>
<script>
(function () {
  "use strict";
  var el = document.getElementById('score');
  if (!el) return;
  var last = parseInt(el.textContent, 10) || 0;
  var mo = new MutationObserver(function () {
    var cur = parseInt(el.textContent, 10) || 0;
    if (cur > last) {
      el.classList.remove('pulse');
      void el.offsetWidth;
      el.classList.add('pulse');
    }
    last = cur;
  });
  mo.observe(el, { childList: true, characterData: true, subtree: true });
})();
</script>
