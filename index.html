<!DOCTYPE html>
<html lang="fr" data-theme="minimal">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Jeux</title>
<style>
  :root, [data-theme="minimal"]{
    --bg0:#f6f7f9; --bg1:#eceff3;
    --card:#ffffff; --card2:#f2f4f7;
    --txt:#1f2430; --dim:#6b7280; --line:#e5e7eb;
    --track:#eceff3; --fill:linear-gradient(90deg,#6b7280,#3b4252);
    --accent:#4f6ef7; --accent-ink:#ffffff;
    --gem:#7c6ff0; --gem-ink:#ffffff;
    --btn:#ffffff; --btn-ink:#1f2430; --btn-border:#e5e7eb;
    --shadow:0 1px 3px rgba(15,23,42,.07);
    --overlay:rgba(15,23,42,.35);
    --radius:12px; --radius-lg:16px;
    --gold:#f0a23b; --purple:#9a5cf0; --blue:#4f7cf0; --gray:#9aa1ab;
    --green:#2fb27a; --red:#e5484d; --cyan:#3db7d0;
    --pink:#f0648f; --pink2:#e5487d;
    --rN:#9aa1ab; --rR:#4f7cf0; --rSR:#9a5cf0; --rSSR:#e8972f;
    --rNbg:linear-gradient(160deg,#ffffff,#f2f4f7); --rNbd:#e5e7eb;
    --rRbg:linear-gradient(160deg,#f3f7ff,#e3ecff); --rRbd:#c9d8ff;
    --rSRbg:linear-gradient(160deg,#f8f3ff,#ecdcff); --rSRbd:#e0c8ff;
    --rSSRbg:linear-gradient(160deg,#fff8ec,#ffe6c2); --rSSRbd:#ffd38f;
    --rEX:#e0288a; --rEXbg:linear-gradient(160deg,#fff0f7,#ffd9e9); --rEXbd:#ff8ec4;
  }
  [data-theme="dark"]{
    --bg0:#12151c; --bg1:#1b1f29;
    --card:#1e222c; --card2:#262b37;
    --txt:#e6e8ee; --dim:#8a93a6; --line:#2c3240;
    --track:#2a2f3c; --fill:linear-gradient(90deg,#5b8cff,#7ea2ff);
    --accent:#5b8cff; --accent-ink:#0b1020;
    --gem:#8f7bff; --gem-ink:#0d0a1e;
    --btn:#1e222c; --btn-ink:#e6e8ee; --btn-border:#2c3240;
    --shadow:0 4px 18px rgba(0,0,0,.35);
    --overlay:rgba(0,0,0,.6);
    --radius:12px; --radius-lg:16px;
    --gold:#f0b64a; --purple:#b08aff; --blue:#6a98ff; --gray:#9aa1ab;
    --green:#43c08a; --red:#ff6b7a; --cyan:#4fc3e0;
    --pink:#ff7ba3; --pink2:#ff5c8a;
    --rN:#9aa1ab; --rR:#6a98ff; --rSR:#b08aff; --rSSR:#f0b64a;
    --rNbg:linear-gradient(160deg,#1e222c,#181c24); --rNbd:#2c3240;
    --rRbg:linear-gradient(160deg,#16213a,#10182c); --rRbd:#1f3a63;
    --rSRbg:linear-gradient(160deg,#231a3d,#171030); --rSRbd:#35255c;
    --rSSRbg:linear-gradient(160deg,#38260f,#241806); --rSSRbd:#5a3c10;
    --rEX:#ff5ca8; --rEXbg:linear-gradient(160deg,#3a1230,#240a1e); --rEXbd:#a0306a;
  }
  [data-theme="kawaii"]{
    --bg0:#fff4ea; --bg1:#ffdfd0;
    --card:#fffdf9; --card2:#fff3e8;
    --txt:#5a4636; --dim:#b69276; --line:#ffe0cf;
    --track:#ffe6d6; --fill:linear-gradient(90deg,#ff8fb1,#c9a2ff);
    --accent:#ff8fb1; --accent-ink:#ffffff;
    --gem:#c69cff; --gem-ink:#4a2470;
    --btn:#ffffff; --btn-ink:#5a4636; --btn-border:#ffe0cf;
    --shadow:0 8px 24px rgba(255,150,120,.14);
    --overlay:rgba(255,214,196,.55);
    --radius:18px; --radius-lg:22px;
    --gold:#ffb84d; --purple:#c69cff; --blue:#7fb5f0; --gray:#bca994;
    --green:#6fc895; --red:#ff7a8c; --cyan:#8fd0e8;
    --pink:#ff8fb1; --pink2:#ff6f9c;
    --rN:#bca994; --rR:#6fa8f0; --rSR:#c08fff; --rSSR:#ff9e2c;
    --rNbg:linear-gradient(160deg,#fffdf8,#f5eadd); --rNbd:#e9d9c8;
    --rRbg:linear-gradient(160deg,#f3f9ff,#dcecff); --rRbd:#cfe4ff;
    --rSRbg:linear-gradient(160deg,#f9f1ff,#ead7ff); --rSRbd:#e6d2ff;
    --rSSRbg:linear-gradient(160deg,#fff7e2,#ffe2b0); --rSSRbd:#ffd9a0;
    --rEX:#ff4fa0; --rEXbg:linear-gradient(160deg,#fff0f7,#ffe0ee); --rEXbd:#ffa0cc;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Arial Rounded MT Bold","Trebuchet MS","Segoe UI",sans-serif;
    background:radial-gradient(130% 90% at 50% 0%,var(--bg1) 0%,var(--bg0) 60%);
    color:var(--txt);-webkit-tap-highlight-color:transparent;}
  #app{max-width:1020px;margin:0 auto;padding:10px 12px 40px;position:relative;z-index:1;}

  .deco{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;display:none;}
  [data-theme="kawaii"] .deco{display:block;}
  .deco span{position:absolute;bottom:-60px;font-size:26px;opacity:.45;animation:floatUp 16s linear infinite;}
  @keyframes floatUp{to{transform:translateY(-120vh) rotate(340deg);}}

  /* ---------- Top bar ---------- */
  .topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0 12px;}
  .brand{font-weight:800;letter-spacing:1px;font-size:19px;color:var(--txt);margin-right:auto;}
  [data-theme="kawaii"] .brand{font-weight:900;color:transparent;
    background:linear-gradient(90deg,var(--pink2),var(--purple),var(--gold));
    -webkit-background-clip:text;background-clip:text;}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:999px;
    padding:6px 11px;display:flex;align-items:center;gap:6px;font-size:13px;box-shadow:var(--shadow);}
  .chip b{color:var(--accent);}
  .chip .ico{font-size:15px;}
  .chip.gear{cursor:pointer;border-style:dashed;}
  .energybar{width:60px;height:8px;background:var(--track);border-radius:999px;overflow:hidden;}
  .energybar i{display:block;height:100%;background:var(--fill);border-radius:999px;}

  /* ---------- Tabs ---------- */
  .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:12px;}
  .tab{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--dim);
    padding:8px 13px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:700;letter-spacing:.3px;
    white-space:nowrap;transition:transform .1s;}
  .tab.active{background:var(--accent);color:var(--accent-ink);border-color:transparent;}

  /* ---------- Cards / panels ---------- */
  .grid{display:grid;gap:12px;}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow);}
  .panel h2{margin:0 0 10px;font-size:16px;letter-spacing:.2px;color:var(--accent);}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  button{font-family:inherit;border:1px solid var(--btn-border);border-radius:10px;padding:10px 15px;cursor:pointer;
    font-size:13px;font-weight:700;letter-spacing:.3px;background:var(--btn);color:var(--btn-ink);
    transition:filter .1s,transform .1s;}
  button:hover{filter:brightness(1.06);}
  button:active{transform:translateY(1px);}
  button:disabled{opacity:.45;cursor:not-allowed;}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;}
  button.gem{background:var(--gem);color:var(--gem-ink);border-color:transparent;}
  button.ghost{background:transparent;border:1px dashed var(--line);color:var(--dim);}
  .bar{height:10px;background:var(--track);border-radius:999px;overflow:hidden;}
  .bar i{display:block;height:100%;background:var(--fill);border-radius:999px;}
  .muted{color:var(--dim);font-size:12px;}
  .gold{color:var(--gold);} .green{color:var(--green);} .red{color:var(--red);}
  .badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.4px;}

  /* ---------- Game tiles ---------- */
  .games{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
  .gtile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px;
    text-align:center;cursor:pointer;box-shadow:var(--shadow);transition:transform .1s,border-color .1s;}
  .gtile:hover{transform:translateY(-2px);border-color:var(--accent);}
  .gtile .emoji{font-size:32px;}
  .gtile .nm{font-weight:800;font-size:13px;margin-top:6px;}
  .gtile .rt{font-size:11px;color:var(--dim);margin-top:3px;}

  /* ---------- Rarity ---------- */
  .N{color:var(--rN);} .R{color:var(--rR);} .SR{color:var(--rSR);} .SSR{color:var(--rSSR);}
  .rN{border-color:var(--rNbd);background:var(--rNbg);}
  .rR{border-color:var(--rRbd);background:var(--rRbg);}
  .rSR{border-color:var(--rSRbd);background:var(--rSRbg);}
  .rSSR{border-color:var(--rSSRbd);background:var(--rSSRbg);}
  .EX{color:var(--rEX);}
  .rEX{border-color:var(--rEXbd);background:var(--rEXbg);box-shadow:0 0 16px rgba(255,80,160,.35);}

  /* ---------- Mascot / collection ---------- */
  .mascots{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;}
  .mascot{border-radius:var(--radius);padding:13px;text-align:center;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);}
  .mascot .em{font-size:38px;}
  .mascot .nm{font-weight:800;font-size:12px;margin-top:5px;}
  .mascot .stars{color:var(--gold);font-size:11px;letter-spacing:1px;}
  .mascot .inf{font-size:10px;color:var(--dim);margin-top:4px;line-height:1.6;}
  .mascot.locked{opacity:.5;filter:grayscale(.6);}

  /* ---------- Leaderboard ---------- */
  .lb{display:flex;flex-direction:column;gap:6px;}
  .lbrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius);
    background:var(--card);border:1px solid var(--line);font-size:13px;box-shadow:var(--shadow);}
  .lbrow.me{border-color:var(--accent);background:var(--card2);box-shadow:0 0 0 1px var(--accent) inset;}
  .lbrow .rank{width:34px;font-weight:800;color:var(--dim);}
  .lbrow .xp{margin-left:auto;color:var(--accent);font-weight:800;}

  /* ---------- Modal ---------- */
  #modal{position:fixed;inset:0;background:var(--overlay);display:none;align-items:center;
    justify-content:center;z-index:50;padding:16px;}
  #modal.open{display:flex;}
  .mcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);
    max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:20px;box-shadow:var(--shadow);}
  .mcard h2{margin:0 0 12px;font-size:18px;color:var(--accent);}
  .pullgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .pcard{border-radius:var(--radius);padding:10px 4px;text-align:center;border:1px solid var(--line);
    min-height:88px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;
    transition:transform .3s;}
  .pcard.back{color:transparent;border-color:var(--line);
    background-image:repeating-linear-gradient(45deg,var(--card2) 0 8px,var(--card) 8px 16px);}
  .pcard .em{font-size:26px;}
  .pcard .nm{font-size:10px;font-weight:800;margin-top:3px;}
  .pcard.ssr{animation:pop .5s;}
  @keyframes pop{0%{transform:scale(.6);}60%{transform:scale(1.15);}100%{transform:scale(1);}}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--card);
    border:1px solid var(--accent);color:var(--txt);padding:11px 18px;border-radius:999px;
    font-size:13px;font-weight:700;z-index:60;display:none;max-width:90%;text-align:center;box-shadow:var(--shadow);}

  .missions-list{display:flex;flex-direction:column;gap:8px;}
  .mission{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:var(--radius);
    background:var(--card);border:1px solid var(--line);font-size:13px;box-shadow:var(--shadow);}
  .mission .prog{color:var(--dim);font-size:11px;}
  .mission .claim{margin-left:auto;}

  .countdown{font-size:11px;color:var(--red);letter-spacing:.3px;font-weight:700;}
  .hint{color:var(--dim);font-size:11px;line-height:1.6;}
  table.rates{border-collapse:collapse;width:100%;font-size:12px;background:var(--card);border-radius:10px;overflow:hidden;}
  table.rates td,table.rates th{border:1px solid var(--line);padding:6px 9px;text-align:left;}

  /* ---------- Settings ---------- */
  .seg{display:flex;gap:6px;flex-wrap:wrap;}
  .seg button{flex:1;min-width:80px;padding:9px 10px;font-size:12px;}
  .seg button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent;}

  /* ---------- Compagnon IA ---------- */
  #companion{position:fixed;right:14px;bottom:14px;z-index:45;display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  #companion .bubble{background:var(--card);border:1px solid var(--accent);border-radius:14px;
    padding:9px 13px;max-width:260px;font-size:12px;line-height:1.5;box-shadow:var(--shadow);display:none;}
  #companion .bubble.visible{display:block;}
  #companion .typing{display:none;color:var(--dim);font-size:11px;}
  #companion .typing.on{display:block;}
  #companion .avatar{width:54px;height:54px;border-radius:50%;background:var(--card);border:1px solid var(--accent);
    display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;box-shadow:var(--shadow);}
  #companion .avatar .status{position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;border-radius:50%;
    background:var(--green);border:2px solid var(--bg0);}
  #companion .avatar .status.off{background:var(--red);}
  #companion .cava-host{display:block;width:44px;height:44px;line-height:0;}
  #companion .cava-host svg{width:100%;height:100%;display:block;overflow:visible;}
  .cava{display:block;width:100%;height:100%;overflow:visible;}
  .cava .bodyg{animation:breathe 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 92%;}
  @keyframes breathe{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-2.5px) scale(1.02);}}
  .cava .head{transform-box:fill-box;transform-origin:50% 60%;transition:transform .35s ease;}
  .cava.mood-taquine .head{transform:rotate(-5deg) translateX(1px);}
  .cava .eye{animation:blink 4.2s infinite;transform-box:fill-box;transform-origin:center;}
  @keyframes blink{0%,91%,100%{transform:scaleY(1);}94%,97%{transform:scaleY(.06);}}
  .cava .hl{animation:twinkle 2.6s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:1;}50%{opacity:.4;}}
  .cava .bangs{animation:hairsway 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0%;}
  @keyframes hairsway{0%,100%{transform:rotate(0deg);}50%{transform:rotate(1.8deg);}}
  .cava .mouth .m-smile,.cava .mouth .m-big,.cava .mouth .m-o,.cava .mouth .m-smirk,.cava .mouth .m-flat{display:none;}
  .cava.mood-neutre .mouth .m-smile{display:block;}
  .cava.mood-content .mouth .m-big{display:block;}
  .cava.mood-excite .mouth .m-o{display:block;}
  .cava.mood-taquine .mouth .m-smirk{display:block;}
  .cava.mood-decu .mouth .m-flat{display:block;}
  .cava.talking .mouth{animation:talk .2s infinite;transform-box:fill-box;transform-origin:center;}
  @keyframes talk{0%,100%{transform:scaleY(1);}50%{transform:scaleY(.4);}}
  .cava.mood-excite .eyes{transform:scale(1.12);transform-box:fill-box;transform-origin:center;}
  .cava .brows{transform-box:fill-box;transform-origin:center;transition:transform .3s ease;}
  .cava.mood-excite .brows{transform:translateY(-3px);}
  .cava.mood-decu .brows{transform:translateY(2px) rotate(4deg);}
  .cava .blush{opacity:.5;transition:opacity .3s ease;}
  .cava.mood-content .blush,.cava.mood-excite .blush{opacity:.95;}
  .cava .sparkles{opacity:0;transition:opacity .25s ease;}
  .cava.mood-excite .sparkles{opacity:1;}
  .cava .sparkles .sp{transform-box:fill-box;transform-origin:center;animation:sparkle 1.6s ease-in-out infinite;}
  .cava .sparkles g:nth-child(2) .sp{animation-delay:.4s;}
  .cava .sparkles g:nth-child(3) .sp{animation-delay:.8s;}
  .cava .sparkles g:nth-child(4) .sp{animation-delay:1.2s;}
  @keyframes sparkle{0%,100%{transform:scale(.6) rotate(0deg);opacity:.35;}50%{transform:scale(1.15) rotate(20deg);opacity:1;}}
  #cchat{position:fixed;right:14px;bottom:80px;z-index:46;width:320px;max-width:calc(100vw - 28px);
    background:var(--card);border:1px solid var(--accent);border-radius:var(--radius-lg);padding:12px;display:none;
    flex-direction:column;gap:8px;box-shadow:var(--shadow);max-height:72vh;}
  #cchat.open{display:flex;}
  .msgs{display:flex;flex-direction:column;gap:6px;overflow-y:auto;}
  #cchat .msgs{max-height:320px;min-height:60px;}
  .m{font-size:12px;line-height:1.5;padding:7px 10px;border-radius:10px;max-width:92%;}
  .m.you{align-self:flex-end;background:var(--card2);border:1px solid var(--line);}
  .m.comp{align-self:flex-start;background:var(--card2);border:1px solid var(--line);}
  .inputrow{display:flex;gap:6px;}
  .inputrow input{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:999px;color:var(--txt);
    padding:9px 12px;font-size:13px;font-family:inherit;outline:none;}
  .inputrow input:focus{border-color:var(--accent);}
  .affbar{height:10px;background:var(--track);border-radius:999px;overflow:hidden;}
  .affbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--pink2));}

  /* ---------- Kawaii flourishes ---------- */
  [data-theme="kawaii"] button{border-radius:999px;box-shadow:0 3px 0 rgba(255,160,130,.25);}
  [data-theme="kawaii"] button:hover{transform:translateY(-2px);}
  [data-theme="kawaii"] .gtile:hover{transform:translateY(-4px) scale(1.03);}
  [data-theme="kawaii"] .gtile .emoji{transition:transform .15s;}
  [data-theme="kawaii"] .gtile:hover .emoji{transform:scale(1.2) rotate(-6deg);}
  [data-theme="kawaii"] .mascot .em{animation:bob 3s ease-in-out infinite;}
  [data-theme="kawaii"] .mascot.locked .em{animation:none;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

  /* ---------- Icônes & cosmétiques ---------- */
  .ic{vertical-align:-0.22em;flex:0 0 auto;}
  .glyph{display:flex;align-items:center;justify-content:center;color:var(--accent);}
  .glyph svg{display:block;}
  .event{width:100%;display:flex;align-items:center;gap:8px;background:var(--rSSRbg);
    border:1px solid var(--rSSRbd);border-radius:12px;padding:7px 12px;font-size:12px;margin-bottom:10px;}
  .event b{color:var(--gold);}
  .event .countdown{margin-left:auto;}
  .seg.col{flex-direction:column;}
  .seg.col button{justify-content:space-between;}
  .pack{flex:1;min-width:140px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 10px;border-radius:var(--radius);}
  .pack .big{font-size:22px;font-weight:900;}
  .pack .price{font-size:12px;color:var(--dim);}
  .pack.best{border-color:var(--gold);background:var(--rSSRbg);}
  .frame-box{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:15px;
    background:var(--card2);border:2px solid var(--line);}
  .frame-silver{box-shadow:0 0 0 2px #c9d1e0 inset;}
  .frame-gold{box-shadow:0 0 0 2px var(--gold) inset;}
  .frame-ssr{box-shadow:0 0 0 2px #ffd98a inset, 0 0 12px rgba(255,200,90,.6);}
  .frame-neon{box-shadow:0 0 0 2px var(--cyan) inset, 0 0 12px rgba(60,200,220,.6);}
  .frame-sakura{box-shadow:0 0 0 2px var(--pink) inset, 0 0 12px rgba(255,140,180,.5);}
  .frame-diamond{box-shadow:0 0 0 2px var(--blue) inset, 0 0 12px rgba(90,150,255,.5);}
  .player-card{display:flex;align-items:center;gap:12px;padding:10px;border-radius:var(--radius-lg);background:var(--card2);}

  /* ============================================================
     AAA GACHA UI — override premium (thème par défaut)
     ============================================================ */
  :root, [data-theme="minimal"]{
    --bg0:#0a0e1c; --bg1:#151c38;
    --card:rgba(23,30,52,.62); --card2:rgba(32,40,68,.74);
    --txt:#eef2fb; --dim:#94a1bf; --line:rgba(255,255,255,.10);
    --track:rgba(255,255,255,.08); --fill:linear-gradient(90deg,#f7ce75,#e9a83f);
    --accent:#f7ce75; --accent2:#e9a83f; --accent-ink:#231400;
    --gem:#b591ff; --gem-ink:#1a0a38;
    --gold:#f7ce75; --purple:#b591ff; --blue:#6ab0ff; --gray:#98a3ba;
    --green:#43d6a0; --red:#ff6b81; --cyan:#4fd3e8;
    --pink:#ff7ba3; --pink2:#ff5c8a;
    --btn:rgba(33,42,70,.85); --btn-ink:#eef2fb; --btn-border:rgba(255,255,255,.14);
    --shadow:0 10px 34px rgba(0,0,0,.5);

let THEME = 'minimal';

if(!['minimal','dark','kawaii'].includes(THEME)) THEME = 'minimal';
function t(key, vars){
  let s = (I18N[LANG] && I18N[LANG][key]) || I18N.fr[key] || key;
  if(vars) for(const k in vars) s = s.split('{'+k+'}').join(vars[k]);
  return s;
}
function applyLang(){ document.documentElement.lang = LANG; }
function applyTheme(){ document.documentElement.setAttribute('data-theme', THEME); }
function setLang(l){ LANG=l; try{ localStorage.setItem('gacha.lang', l); }catch(e){} applyLang(); render(); }
function setTheme(t){ THEME=t; try{ localStorage.setItem('gacha.theme', t); }catch(e){} applyTheme(); }

  setJSON(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} },
};

const yesterday = () => { const d=new Date(Date.now()-86400000); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const weekNum = () => { const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+3-((d.getDay()+6)%7)); const w1=new Date(d.getFullYear(),0,4); return d.getFullYear()+'-W'+String(1+Math.round(((d-w1)/86400000-3+((w1.getDay()+6)%7))/7)).padStart(2,'0'); };
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function seededShuffle(arr, rng){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---------- Énergie ---------- */
function syncEnergy(){
  const e=S.energy; const t=Date.now();
  if(e.value < ENERGY_MAX){ const g=Math.floor((t-e.at)/ENERGY_REFILL_MS); if(g>0){ e.value=Math.min(ENERGY_MAX,e.value+g); e.at=t; } }
  else e.at=t;
}
function energyCountdown(){
  const e=S.energy;
  if(e.value>=ENERGY_MAX) return 0;
  return (ENERGY_MAX-e.value)*ENERGY_REFILL_MS - (Date.now()-e.at);
}

/* ---------- Lecture des records / score ---------- */
function readBest(id){
  const v = parseInt(LS.get(id+'.best'),10);
  if(isNaN(v)) return null;
  const g = GAMES.find(x=>x.id===id);
  if(g.dir==='high') return v>0 ? v : null;
  return (v>0 && v<900) ? v : null;
}
function ratingForBest(g, best){
  if(best==null) return 0;
  let r;
  if(g.dir==='high') r = Math.min(best/g.par*100, g.cap);
  else r = 100 - (best-g.par)/g.par*100;
  return Math.max(0, Math.min(r, g.cap));
}
function ratingOf(g){ return ratingForBest(g, readBest(g.id)); }
function totalRating(){ return GAMES.reduce((s,g)=>s+ratingOf(g),0); }

function missionValue(m){
  if(m.type==='level') return S.level;
  if(m.type==='collect') return ownedCount();

function track(type, amt){
  let dirty=false;
  for(const m of MISSIONS){
    if(m.type!==type) continue;
    if(!S.missions[m.id]) S.missions[m.id]={value:0, claimed:false};

}

function ascend(id){

  if(c.stars>=5){ toast(t('toast.maxed')); return; }

/* ---------- Gacha ---------- */
function pickMascot(r){
  const pool = GAMES.filter(g=>g.rarity===r);
  const feat = S.banner.game;
  let total=0; const w = pool.map(g=>{ const wt=(g.id===feat?2:1); total+=wt; return wt; });
  let x=Math.random()*total;
  for(let i=0;i<pool.length;i++){ x-=w[i]; if(x<0) return pool[i].id; }
  return pool[pool.length-1].id;
}
function rollOne(forceSR){
  let r;
  if(S.pity.sinceSSR >= 89) r='SSR';
  else { const x=Math.random()*100; r = x<3?'SSR' : x<12?'SR' : x<40?'R' : 'N'; }
  if(forceSR && (r==='N'||r==='R')) r='SR';
  const id = pickMascot(r);
  if(r==='SR'||r==='SSR') S.pity.sinceSR=0; else S.pity.sinceSR++;
  if(r==='SSR') S.pity.sinceSSR=0; else S.pity.sinceSSR++;
  return {kind:'mascot', rarity:r, id};
}
const COMPANION_DROP_CHANCE = 0.18;
const COMPANION_RATE = {N:60, R:30, SR:8, SSR:2};
function featuredCompanion(){ const pool = COMPANIONS.filter(c=>c.rarity==='SR'||c.rarity==='SSR'); return pool[parseInt(weekNum().replace(/\D/g,''),10) % pool.length]; }
const EX_DROP_CHANCE = 0.008;
function activeEventCompanion(){ const ex = COMPANIONS.filter(c=>c.rarity==='EX'); return ex[parseInt(weekNum().replace(/\D/g,''),10) % ex.length]; }
function eventUntil(){ const d=new Date(); const day=d.getDay(); const add=(day===0)?0:(7-day); d.setDate(d.getDate()+add); d.setHours(23,59,59,999); return d.getTime(); }
function rollCompanion(){
  const pool = COMPANIONS.filter(c=>!S.companion.owned[c.id] && c.rarity!=='EX');
  if(pool.length===0) return null;
  const feat = featuredCompanion();
  let r;
  if(S.pity.compSSR >= 79) r='SSR';
  else if(S.pity.compSR >= 9){ const x=Math.random()*100; r = x<50?'SR':'SSR'; }
  else { const x=Math.random()*100; r = x<2?'SSR' : x<10?'SR' : x<40?'R' : 'N'; }
  let cand = pool.filter(c=>c.rarity===r);
  if(cand.length===0) cand = pool;
  let total=0; const w=cand.map(c=>{ const wt=(c.id===feat.id?5:1); total+=wt; return wt; });
  let x=Math.random()*total; let pick=cand[cand.length-1];
  for(let i=0;i<cand.length;i++){ x-=w[i]; if(x<0){ pick=cand[i]; break; } }
  if(pick.rarity==='SR'||pick.rarity==='SSR') S.pity.compSR=0; else S.pity.compSR++;
  if(pick.rarity==='SSR') S.pity.compSSR=0; else S.pity.compSSR++;
  return {kind:'companion', rarity:pick.rarity, id:pick.id};
}
function applyPullResult(res){
  if(res.kind==='companion'){
    const c = COMPANIONS.find(x=>x.id===res.id);
    S.companion.owned[res.id] = true;
    if(res.rarity==='EX'){ toast(t('comp.ex', {name:c.name})); addPts(100); grantAffection(10); }
    else { toast(t('comp.new', {name:c.name, r:c.rarity})); addPts(30); grantAffection(4); }
  } else {
    const m=mascotOf(res.id);
    if(!S.collection[res.id]) S.collection[res.id]={count:0, shards:0, stars:0};
    const c=S.collection[res.id];
    if(c.count===0){ c.count=1; toast(t('toast.new', {name:m.mascot})); }
    else { c.count++; c.shards+=SHARDS[res.rarity]; }
    if(res.rarity==='SSR') S.stats.ssrPulled++;
    addPts(10);
  }
  S.stats.pulls++; track('pull',1);
}
function doPull(times, useGems){
  syncEnergy();
  const cost = times===10 ? (useGems?PULL10_GEMS:PULL10_COINS) : (useGems?PULL_COST_GEMS:PULL_COST_COINS);
  if(useGems){ if(S.gems<cost){ showGemModal(); return; } spendGems(cost); }
  else { if(S.coins<cost){ toast(t('toast.noCoins')); return; } spendCoins(cost); }
  const results=[];
  const guaranteed = times===10;
  let srInBatch = false;
  const exComp = activeEventCompanion();
  for(let i=0;i<times;i++){
    const force = guaranteed && i===times-1 && !srInBatch;
    let r;
    if(exComp && !S.companion.owned[exComp.id] && (Math.random() < EX_DROP_CHANCE || S.pity.ex >= 99)){
      r = {kind:'companion', rarity:'EX', id:exComp.id};
      S.pity.ex = 0;
    } else {
      S.pity.ex = (S.pity.ex||0) + 1;
      if(Math.random() < COMPANION_DROP_CHANCE){
        const comp = rollCompanion();
        r = comp || rollOne(force);
      } else {
        r = rollOne(force);
      }
    }
    results.push(r);
    if(r.rarity==='SR'||r.rarity==='SSR'||r.rarity==='EX') srInBatch=true;
  }
  results.forEach(applyPullResult);
  companionDailyCount().pulls += times;
  grantAffection(times);
  save(); render();
  showPullResults(results);
  companionReact('pull', {results});
}

/* ---------- Rivaux / classement ---------- */
function getRivals(){
  const seed = parseInt(weekNum().replace(/\D/g,''),10) || 1;
  const rng = mulberry32((seed*2654435761) ^ 0x9e3779b9);
  const names = seededShuffle(BOT_NAMES, rng);
  const bots=[];
  const topGaps=[260,180,120,70,25];
  for(let i=0;i<5;i++) bots.push({name:names[i], xp:S.seasonXP+topGaps[i], avatar:i%10});
  for(let i=5;i<49;i++){ const spread=(rng()-0.45)*22000; bots.push({name:names[i], xp:Math.max(0,Math.round(S.seasonXP+spread)), avatar:i%10}); }
  bots.push({name:S.profile.name||'PLAYER', xp:S.seasonXP, avatar:S.profile.avatar, me:true});
  bots.sort((a,b)=>b.xp-a.xp);
  bots.forEach((b,i)=>b.rank=i+1);
  return bots;
}

/* ---------- Nouveaux records (points de score) ---------- */
function initBestCache(){
  S.bestCache = {};
  GAMES.forEach(g=>{ S.bestCache[g.id]=readBest(g.id); });
  save(); saveBest();
}
function rescan(){
  syncEnergy();
  if(!S.bestCache) initBestCache();
  let improved=[], totalCoins=0, totalPts=0;
  GAMES.forEach(g=>{
    const b = readBest(g.id);
    if(b==null) return;
    const cached = S.bestCache[g.id];
    const isRecord = g.dir==='low' ? (cached==null || b<cached) : (cached==null || b>cached);
    if(isRecord){
      const oldRating = ratingForBest(g, cached);
      const newRating = ratingForBest(g, b);
      const deltaRating = newRating - oldRating;
      const pts = 20 + Math.round(deltaRating * 5);
      const coins = 100 + Math.min(400, Math.max(10, Math.round(deltaRating * 4)));
      S.bestCache[g.id]=b;
      addCoins(coins); addPts(pts, 'score'); totalCoins+=coins; totalPts+=pts;
      S.stats.records++; track('record',1);
      improved.push({g, coins, pts});
    }
  });
  if(improved.length){
    companionDailyCount().records += improved.length;
    grantAffection(2*improved.length);
    save(); saveBest(); render(); showRecordModal(improved, totalCoins, totalPts);
    companionReact('record', {g:improved[0].g});
  }
  else { render(); }
}

/* ---------- Cosmétiques & boutique premium (simulée) ---------- */
const FRAMES = ['default','silver','gold','ssr','neon','sakura','diamond'];
const TITLES = ['rookie','grinder','ssr_hunter','collector','champion','whale','veteran','completionist'];
const AVATARS = ['🦊','🐸','🐙','👾','🐲','🦄','🐢','🦉','🐯','🤖'];
function myRank(){ return getRivals().find(b=>b.me).rank; }
function frameUnlock(f){
  switch(f){
    case 'default': return true;
    case 'silver': return S.level >= 3;
    case 'gold': return S.level >= 8;
    case 'ssr': return S.stats.ssrPulled >= 1;
    case 'neon': return S.cosmetics.ownedFrames.includes('neon');
    case 'sakura': return S.bp.premium;
    case 'diamond': return myRank() <= 3;
    default: return false;
  }
}
function titleUnlock(tid){
  switch(tid){
    case 'rookie': return true;
    case 'grinder': return S.stats.plays >= 50;
    case 'ssr_hunter': return S.stats.ssrPulled >= 1;
    case 'collector': return ownedCount() >= 10;
    case 'champion': return myRank() <= 3;
    case 'whale': return S.stats.gemsSpentTotal >= 1000;
    case 'veteran': return S.level >= 10;
    case 'completionist': return ownedCount() >= GAMES.length;
    default: return false;
  }
}
function syncCosmetics(){
  let dirty=false;
  FRAMES.forEach(f=>{ if(frameUnlock(f) && !S.cosmetics.ownedFrames.includes(f)){ S.cosmetics.ownedFrames.push(f); toast(t('toast.cosmetic', {name:t('frame.'+f)})); dirty=true; } });
  TITLES.forEach(tid=>{ if(titleUnlock(tid) && !S.cosmetics.ownedTitles.includes(tid)){ S.cosmetics.ownedTitles.push(tid); toast(t('toast.cosmetic', {name:t('title.'+tid)})); dirty=true; } });
  if(dirty) save();
}
function equipFrame(f){ if(!S.cosmetics.ownedFrames.includes(f)) return; S.cosmetics.frame=f; toast(t('toast.equip', {name:t('frame.'+f)})); save(); render(); }
function equipTitle(tid){ if(tid && !S.cosmetics.ownedTitles.includes(tid)) return; S.cosmetics.title=tid; toast(t('toast.equip', {name:tid?t('title.'+tid):t('profile.noTitle')})); save(); render(); }
function buyFrame(f, cost){ if(S.gems<cost){ showGemModal(); return; } if(S.cosmetics.ownedFrames.includes(f)){ equipFrame(f); return; } spendGems(cost); S.cosmetics.ownedFrames.push(f); equipFrame(f); }
function buyGems(n){ addGems(n); toast(t('toast.bought', {n})); save(); render(); }
function buyBoost(){ if(S.gems<30){ showGemModal(); return; } spendGems(30); S.cosmetics.boostUntil = Date.now() + 3600000; toast(t('shop.boostOn')); save(); render(); }
function showGemModal(){
  let html=`<h2>${ic('gems',18)} ${t('shop.premium')}</h2>
    <p class="muted">${t('shop.premiumNote')}</p>
    <div class="seg col">
      ${[[100,'0,99 €',1],[550,'4,99 €',0],[1200,'9,99 €',0],[3000,'19,99 €',1]].map(([g,p,best])=>`<button class="${best?'gold':''}" onclick="buyGems(${g})"><span>${g} 💎</span><span>${p}</span></button>`).join('')}
    </div>
    <div class="row" style="margin-top:12px"><button class="primary" onclick="closeModal()" style="flex:1">${t('modal.ok')}</button></div>`;
  openModal(html);
}

function viewProfile(){

let currentMood = 'neutre';
let moodTimer = null;
function applyMood(mood){

    el.classList.remove('mood-neutre','mood-content','mood-excite','mood-taquine','mood-decu');

}
function setMood(mood){
  currentMood = mood;

function moodFor(event, extra){
  switch(event){
    case 'pull': {
      const best = [...extra.results].sort((a,b)=>RARITY_ORDER.indexOf(b.rarity)-RARITY_ORDER.indexOf(a.rarity))[0];
      if(best.rarity==='SSR'||best.rarity==='EX') return 'excite';
      if(best.rarity==='SR') return 'content';
      return 'decu';
    }
    case 'record': return 'excite';
    case 'levelup': return 'excite';
    case 'welcome': return 'content';
    case 'goal': return 'content';
    case 'affection': return 'excite';
    case 'nudge': return 'taquine';
    case 'chat': return 'content';
    default: return 'neutre';
  }
}
function companionDailyCount(){
  const c = S.companion;
  if(!c.daily || c.daily.date !== today()) c.daily = {date:today(), plays:0, pulls:0, records:0};
  return c.daily;
}
function goalProgress(goal){
  if(goal.type==='missions') return MISSIONS.filter(m=>m.period==='daily' && missionValue(m)>=m.target).length;
  return companionDailyCount()[goal.type] || 0;
}
function companionContext(){
  const me = getRivals().find(b=>b.me);
  const nextBot = getRivals().filter(b=>!b.me && b.xp>S.seasonXP).pop();
  const ssrIn = Math.max(0, 90 - S.pity.sinceSSR);
  const parts = [
    `Level ${S.level}, ${fmt(S.coins)} coins, ${fmt(S.gems)} gems, ${S.energy.value} energy.`,
    `Login streak ${S.login.streak} days, rank #${me.rank} (${t(tierFor(me.rank))}).`,
    `Pity: SSR guaranteed in ${ssrIn} pulls (SR since ${S.pity.sinceSR}).`,
    `${ownedCount()}/${GAMES.length} mascots owned.`,
  ];
  if(nextBot) parts.push(`Rival just ahead: ${nextBot.name} at ${nextBot.xp-S.seasonXP} pts.`);
  return parts.join(' ');
}
function buildPrompt(event, extra){
  switch(event){
    case 'pull': {
      const best = [...extra.results].sort((a,b)=>RARITY_ORDER.indexOf(b.rarity)-RARITY_ORDER.indexOf(a.rarity))[0];
      if(best.kind==='companion'){ const c=COMPANIONS.find(x=>x.id===best.id); return `The player just pulled a companion: ${c.name} (${t('rarity.'+best.rarity)}). React with emotion!`; }
      const m = mascotOf(best.id);
      return `The player just pulled. Best result: ${m.mascot} (${t('rarity.'+best.rarity)}, ${m.emoji}). React with emotion and push them to continue.`;
    }
    case 'record': return `The player just beat their record on ${extra.g.title} (${extra.g.emoji}). React.`;
    case 'levelup': return `The player just reached level ${extra.level}. React.`;
    case 'welcome': return `The player is logging in (day #${extra.day}). Welcome them.`;
    case 'goal': return `Propose the daily goal: « ${extra.goalText} ».`;
    case 'affection': return `You give a gift: ${extra.reward}. Thank and reward warmly.`;
    case 'nudge': return extra.text;
    case 'chat': return extra.text;
    default: return 'Say something short and in character.';
  }
}
function cannedReact(event, extra){
  switch(event){
    case 'pull': {
      const best = [...extra.results].sort((a,b)=>RARITY_ORDER.indexOf(b.rarity)-RARITY_ORDER.indexOf(a.rarity))[0];
      if(best.kind==='companion'){ const c=COMPANIONS.find(x=>x.id===best.id); return best.rarity==='EX' ? t('comp.ex', {name:c.name}) : t('comp.new', {name:c.name, r:best.rarity}); }
      const m = mascotOf(best.id);
      if(best.rarity==='SSR') return t('comp.react.ssr', {name:m.mascot});
      if(best.rarity==='SR') return t('comp.react.sr', {name:m.mascot});
      return t('comp.react.low', {name:m.mascot});
    }
    case 'record': return t('comp.react.record', {game:extra.g.title});
    case 'levelup': return t('comp.react.levelup', {level:extra.level});
    case 'welcome': return t('comp.react.welcome', {day:extra.day});
    case 'goal': return t('comp.react.goal', {goal:extra.goalText});
    case 'affection': return t('comp.react.affection', {reward:extra.reward});
    case 'nudge': return extra.text;
    case 'chat': return t('comp.react.offline');
    default: return '…';
  }
}
async function companionAsk(event, extra){
  if(!COMPANION.enabled) return null;
  if(aiEngine()==='webllm') return await webllmAsk(event, extra);
  const sys = companionPersona()
    + '\n\nPlayer state: ' + companionContext()
    + '\n\nAnswer in one short sentence, no quotes or tags.';
  const messages = [{role:'system', content:sys}];
  const hist = companionHistory.slice(-8);
  for(const m of hist) messages.push({role: m.role==='user'?'user':'assistant', content: m.content});
  messages.push({role:'user', content:buildPrompt(event, extra)});
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), COMPANION.timeoutMs);
  try{
    const r = await fetch(COMPANION.endpoint, {
      method:'POST', headers:{'Content-Type':'application/json'}, signal:ctrl.signal,
      body: JSON.stringify({model:COMPANION.model, stream:false, messages,
        options:{num_predict:COMPANION.num_predict, temperature:COMPANION.temperature}}),
    });
    if(!r.ok) return null;
    const data = await r.json();
    return (data && data.message && data.message.content) ? String(data.message.content).trim() : null;
  }catch(e){ return null; }
  finally{ clearTimeout(t); }
}

let webllmEngine=null, webllmReady=false;
async function ensureWebLLM(){
  if(webllmReady) return webllmEngine;
  const webllm = await import('https://esm.run/@mlc-ai/web-llm');
  webllmEngine = await webllm.CreateMLCEngine(COMPANION.webllmModel, {
    initProgressCallback: p => {
      const pct = (p && typeof p.progress==='number') ? Math.round(p.progress*100) : 0;
      const t = $('#ctyping'); if(t) t.textContent = 'Chargement du modèle… '+pct+'%';
    }
  });
  webllmReady = true;
  const t = $('#ctyping'); if(t) t.textContent = '…';
  return webllmEngine;
}
async function webllmAsk(event, extra){
  try{
    const eng = await ensureWebLLM();
    const sys = companionPersona()
      + '\n\nPlayer state: ' + companionContext()
      + '\n\nAnswer in one short sentence, no quotes or tags.';
    const messages = [{role:'system', content:sys}];
    for(const m of companionHistory.slice(-8)) messages.push({role: m.role==='user'?'user':'assistant', content: m.content});
    messages.push({role:'user', content:buildPrompt(event, extra)});
    const reply = await eng.chat.completions.create({
      messages, temperature: COMPANION.temperature, max_tokens: COMPANION.num_predict,
    });
    return (reply && reply.choices && reply.choices[0] && reply.choices[0].message && reply.choices[0].message.content)
      ? String(reply.choices[0].message.content).trim() : null;
  }catch(e){ return null; }
}

  setOffline(!text);

  showBubble(final);
}
function grantAffection(amount){
  const c = S.companion;
  const before = c.affection;
  c.affection = Math.min(100, c.affection + amount);
  save();
  for(const th of [20,40,60,80,100]){
    if(before < th && c.affection >= th){
      const r = AFFECTION_MILESTONES[th];
      const rewardTxt = (r.coins?'+'+r.coins+' 🪙 ':'')+(r.gems?'+'+r.gems+' 💎':'');
      if(r.coins) addCoins(r.coins);
      if(r.gems) addGems(r.gems);
      toast(t('toast.aff', {t:th}) + ' ' + rewardTxt);
      companionReact('affection', {reward: rewardTxt});
    }
  }
  save();
  ['#caff','#caff_view'].forEach(sel=>{ const el=$(sel); if(el) el.style.width=c.affection+'%'; });
  ['#caffn','#caffn_view'].forEach(sel=>{ const el=$(sel); if(el) el.textContent=c.affection+'/100'; });
}
function pickDailyGoal(){
  const c = S.companion;
  if(!c.dailyGoal || c.dailyGoal.date !== today()){
    const sorted = [...DAILY_GOALS].sort((a,b)=> (goalProgress(a)/a.target) - (goalProgress(b)/b.target));
    const g = sorted[0];
    c.dailyGoal = {date:today(), id:g.id, label:t(g.label), type:g.type, target:g.target, reward:g.reward, claimed:false};
    save();
    companionReact('goal', {goalText: t(g.label)});
  }
  return c.dailyGoal;
}
function claimDailyGoal(){
  const g = pickDailyGoal();
  if(g.claimed){ toast(t('toast.freeDone')); return; }
  const prog = goalProgress(g);
  if(prog < g.target){ toast(t('toast.goalProgress', {a:Math.min(prog,g.target), b:g.target})); return; }
  g.claimed = true;
  const rewardTxt = (g.reward.coins?'+'+g.reward.coins+' 🪙':'')+(g.reward.gems?'+'+g.reward.gems+' 💎':'');
  if(g.reward.coins) addCoins(g.reward.coins);
  if(g.reward.gems) addGems(g.reward.gems);
  grantAffection(5);
  toast(t('toast.goalDone') + ' ' + rewardTxt);
  save(); render();
}
function pickNudge(){
  const me = getRivals().find(b=>b.me);
  const nextBot = getRivals().filter(b=>!b.me && b.xp>S.seasonXP).pop();
  const ssrIn = Math.max(0, 90 - S.pity.sinceSSR);
  const opts = [];
  if(ssrIn>0 && ssrIn<=5) opts.push(t('nudge.pity', {n:ssrIn}));
  if(nextBot && (nextBot.xp - S.seasonXP) <= 120) opts.push(t('nudge.rival', {name:nextBot.name, pts:nextBot.xp-S.seasonXP}));
  if(S.energy.value < 40) opts.push(t('nudge.energy'));
  if(opts.length===0) return null;
  return opts[Math.floor(Math.random()*opts.length)];
}
async function companionNudge(){
  if(document.hidden) return;
  const now = Date.now();
  if(now - (S.companion.lastNudge||0) < COMPANION.idleMs) return;
  const nudge = pickNudge();
  if(!nudge) return;
  S.companion.lastNudge = now; save();
  companionReact('nudge', {text:nudge});
}
async function sendCompanionChat(){
  let text='';
  const fi=$('#cinput'), vi=$('#cinput_view');
  if(vi && vi.value && vi.value.trim()) text=vi.value.trim();
  else if(fi && fi.value && fi.value.trim()) text=fi.value.trim();
  if(!text) return;
  if(fi) fi.value=''; if(vi) vi.value='';
  companionPush('user', text);
  if(S.companion.lastChatAff !== today()){ S.companion.lastChatAff = today(); grantAffection(1); }
  setTyping(true);
  const reply = await companionAsk('chat', {text});
  setTyping(false);
  const final = reply ? reply : cannedReact('chat', {text});
  setOffline(!reply);
  companionPush('assistant', final);
  showBubble(final);
}

/* ----- Missions ----- */
function missionRow(m){
  const val=missionValue(m); const done=val>=m.target; const st=S.missions[m.id];
  const claimed = st && st.claimed;
  const r=m.reward;
  const rewardTxt=(r.coins?'+'+r.coins+'🪙 ':'')+(r.gems?'+'+r.gems+'💎 ':'')+(r.xp?'+'+r.xp+' PTS':'');
  return `<div class="mission">
    <div><b>${t(m.desc)}</b><div class="prog">${Math.min(val,m.target)}/${m.target} · ${rewardTxt}</div></div>
    ${claimed?`<span class="badge green">${t('missions.ok')}</span>`:(done?`<button class="claim primary" onclick="claimMission('${m.id}')">${t('missions.claim')}</button>`:'<span class="prog">…</span>')}
  </div>`;
}
function claimMission(id){
  const m=MISSIONS.find(x=>x.id===id); if(!m) return;
  const st=S.missions[id];
  if(!st || st.claimed || missionValue(m)<m.target) return;
  st.claimed=true;
  const r=m.reward; if(r.coins) addCoins(r.coins); if(r.gems) addGems(r.gems); if(r.xp) addPts(r.xp);
  toast(t('missions.done')+' '+(r.coins?'+'+r.coins+'🪙 ':'')+(r.gems?'+'+r.gems+'💎 ':'')+(r.xp?'+'+r.xp+' PTS':''));
  save(); render();
}
function viewMissions(){
  const daily=MISSIONS.filter(m=>m.period==='daily');
  const weekly=MISSIONS.filter(m=>m.period==='weekly');
  const html=`<div class="grid">
    <div class="panel"><h2>${ic('check',16)} ${t('missions.daily')}</h2><div class="missions-list">${daily.map(missionRow).join('')}</div></div>
    <div class="panel"><h2>${ic('clock',16)} ${t('missions.weekly')}</h2><div class="missions-list">${weekly.map(missionRow).join('')}</div></div>
  </div>`;
  $('#view').innerHTML=html;
}

/* ----- Battle pass ----- */
function viewPass(){
  const tiers='<div class="missions-list">'+Array.from({length:BP_TIERS},(_,i)=>{
    const n=i+1, th=bpThreshold(n), claimed=S.bp.claimed.includes(n), reachable=S.seasonXP>=th;
    const f=bpFreeReward(n); const p=bpPremiumReward(n);
    return `<div class="mission">
      <div><b>${t('pass.tier')} ${n}</b><div class="prog">${th} PTS · +${f.coins}🪙 ${S.bp.premium?'· +'+p.gems+'💎':''}</div></div>
      ${claimed?`<span class="badge green">${t('missions.ok')}</span>`:reachable?`<button class="claim primary" onclick="claimBPTier(${n})">${t('missions.claim')}</button>`:`<span class="prog">${Math.min(S.seasonXP,th)}/${th}</span>`}
    </div>`;
  }).join('')+'</div>';
  const html=`<div class="grid">
    <div class="panel">
      <h2>${ic('ticket',16)} ${t('pass.title')} — ${S.weekly}</h2>
      <p class="muted">${t('pass.seasonPts')} : <b class="gold">${fmt(S.seasonXP)}</b> · ${S.bp.premium?`<span class="green">${t('pass.premiumActive')}</span>`:t('pass.free')}</p>
      ${S.bp.premium?'':`<button class="gem" onclick="buyPremiumPass()">${ic('gems',14)} ${t('pass.activate')}</button>`}
    </div>
    <div class="panel"><h2>${t('pass.tiers')}</h2>${tiers}</div>
  </div>`;
  $('#view').innerHTML=html;
}

/* ----- Boutique ----- */
function viewShop(){
  const seed=offerSeed();
  const rng=mulberry32(seed*7919+1);
  const offerGems = 50 + Math.floor(rng()*50);
  const offerCoins = Math.round(offerGems*16);
  const offerUntil = (seed+1)*2*3600000;
  const html=`<div class="grid">
    <div class="panel rSSR">
      <h2>${ic('gems',16)} ${t('shop.premium')}</h2>
      <p class="muted">${t('shop.premiumNote')}</p>
      <div class="seg col">
        ${[[100,'0,99 €',1],[550,'4,99 €',0],[1200,'9,99 €',0],[3000,'19,99 €',1]].map(([g,p,best])=>`<button class="${best?'gold':''}" onclick="buyGems(${g})"><span>${g} 💎</span><span>${p}</span></button>`).join('')}
      </div>
    </div>

    <div class="panel">
      <h2>${ic('rocket',16)} ${t('shop.boost')}</h2>
      <p class="muted">${t('shop.boostDesc')}</p>
      <button class="gem" onclick="buyBoost()">${ic('gems',14)} ${t('shop.buy')} (30)</button>
    </div>

    <div class="panel">
      <h2>${ic('user',16)} ${t('shop.cosmetics')}</h2>
      <div class="row">
        <button class="gem" onclick="buyFrame('neon',100)">${ic('gems',14)} ${t('frame.neon')} (100)</button>
        <button class="gold" onclick="showGemModal()">${ic('gems',14)} ${t('modal.energy.buy')}</button>
      </div>
    </div>

    <div class="panel"><h2>${ic('heart',16)} ${t('shop.freePack')}</h2>
      <p class="muted">${t('shop.freeDesc')}</p>
      <button class="primary" onclick="claimDailyFree()">${t('shop.claim')}</button></div>

    <div class="panel"><h2>${ic('bolt',16)} ${t('shop.energy')}</h2>
      <div class="row">
        <button class="gem" onclick="refillEnergy()">${ic('refresh',14)} ${t('shop.full')}</button>
        <button onclick="fakeAd()">${ic('tv',14)} ${t('shop.ad')}</button>
      </div></div>

    <div class="panel"><h2>${ic('coins',16)} ${t('shop.exchange')}</h2>
      <div class="row">
        <button class="gem" onclick="buyCoinPack(50,600)">50 ${ic('gems',12)} → 600 ${ic('coins',12)}</button>
        <button class="gem" onclick="buyCoinPack(120,1600)">120 ${ic('gems',12)} → 1600 ${ic('coins',12)}</button>
      </div></div>

    <div class="panel rSSR">
      <h2>${ic('flame',16)} ${t('shop.flash')}</h2>
      <p>${offerGems} 💎 → <b>${fmt(offerCoins)} 🪙</b> <span class="badge red">-50%</span></p>
      <p class="countdown" id="offercd">${t('shop.flashExp',{t:fmtDur(offerUntil-Date.now())})}</p>
      <button class="primary" onclick="buyCoinPack(${offerGems},${offerCoins})">${t('shop.buy')}</button>
    </div>

    <div class="panel"><h2>${ic('crown',16)} ${t('shop.vip')}</h2>
      <p class="muted">${t('shop.vipDesc', {n:vipLevel(), spent:fmt(S.stats.gemsSpentTotal), next:(vipLevel()+1)*200-S.stats.gemsSpentTotal})}</p></div>
  </div>`;
  $('#view').innerHTML=html;
}

/* ----- Classement ----- */
function viewRank(){
  const rivals=getRivals();
  const me=rivals.find(b=>b.me);
  const tier=tierFor(me.rank);
  const top=rivals.slice(0,30);
  const lb=top.map(b=>{
    const tc=tierFor(b.rank);
    return `<div class="lbrow${b.me?' me':''}">
      <div class="rank">#${b.rank}</div>
      <div>${AVATARS[b.avatar]}</div>
      <div>${escapeHtml(b.name)}${b.me?' (toi)':''} <span class="muted">· ${t(tc)}</span></div>
      <div class="xp">${fmt(b.xp)}</div>
    </div>`;
  }).join('');
  const html=`<div class="grid">
    <div class="panel"><h2>${ic('trophy',16)} ${t('rank.season')} ${S.weekly}</h2>
      <div class="row">
        <span class="badge" style="background:${tierColor(tier)};color:#000">${t(tier)}</span>
        <span>${t('rank.rank')} <b>#${me.rank}</b> / ${rivals.length}</span>
        <span class="gold">${fmt(S.seasonXP)} PTS</span>
      </div>
      <p class="hint" style="margin-top:8px">${t('rank.resetHint')}</p></div>
    <div class="panel"><h2>${t('rank.top30')}</h2><div class="lb">${lb}</div></div>
    <div class="panel"><h2>${ic('sliders',16)} ${t('rank.debug')}</h2>
      <div class="row">
        <button class="ghost" onclick="resetSeason()">${t('rank.resetSeason')}</button>
        <button class="ghost" onclick="resetAll()">${t('rank.resetAll')}</button>
      </div></div>
  </div>`;
  $('#view').innerHTML=html;
}
function resetSeason(){ S.seasonXP=0; S.weekly=''; S.bp={season:'',premium:false,claimed:[]}; save(); location.reload(); }
function resetAll(){ if(confirm(t('rank.resetAll')+' ?')){ LS.set('gacha.state',null); LS.set('gacha.bestCache',null); location.reload(); } }

/* ---------- Render principal ---------- */
function render(){
  syncEnergy();
  syncCosmetics();
  renderTopbar();
  renderNav();
  const fn={home:viewHome,games:viewGames,gacha:viewGacha,collect:viewCollect,missions:viewMissions,pass:viewPass,shop:viewShop,rank:viewRank,profile:viewProfile,companion:viewCompanion}[currentView];
  fn();
  ['bannercd','offercd','eventcd'].forEach(id=>{ const el=$('#'+id); if(el) setTimeout(render,1000); });
}

/* ---------- Init ---------- */
function init(){
  applyLang();
  applyTheme();
  if(!S.bestCache) initBestCache();
  const needLogin = syncCalendar();
  syncCosmetics();
  render();
  initCompanion();
  setTimeout(companionNudge, 1500);
  if(needLogin) showLoginModal();
  window.addEventListener('focus', rescan);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) rescan(); });
  window.addEventListener('storage', e=>{ if(e.key && e.key.endsWith('.best')) rescan(); });
  setInterval(()=>{ if(!document.hidden){ syncEnergy(); renderTopbar(); } }, 1000);
}
init();
</script>
</body>
</html>
