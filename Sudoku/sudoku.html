<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Sudoku</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    background: radial-gradient(120% 80% at 50% 0%, #1a1a4a 0%, #050510 65%);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #cbd5e1;
    padding: 16px;
    -webkit-tap-highlight-color: transparent;
  }

  .wrap {
    width: min(88vw, 480px);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .hud {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 12px;
    letter-spacing: .16em;
    color: #64748b;
  }
  .hud b {
    color: #4ade80;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .02em;
    margin-left: 6px;
    text-shadow: 0 0 14px rgba(74, 222, 128, .45);
  }

  .board {
    position: relative;
    width: 100%;
    border-radius: 16px;
    overflow: hidden;
    background: #0b1220;
    box-shadow:
      0 0 0 1px #1e293b,
      0 0 0 6px rgba(15, 23, 42, .55),
      0 30px 60px -25px #000;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .sg-grid {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    grid-template-rows: repeat(9, 1fr);
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #0b1220;
    border: 2px solid #1e293b;
    border-radius: 10px;
    overflow: hidden;
  }

  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b1220;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  .cell.given { color: #e2e8f0; font-weight: 700; cursor: default; }
  .cell.user  { color: #4ade80; }
  .cell.same  { color: #86efac; }
  .cell.bad   { color: #f87171; }
  .cell.hl    { background: rgba(74, 222, 128, .07); }
  .cell.sel   { background: rgba(74, 222, 128, .16); box-shadow: inset 0 0 0 2px #4ade80; }

  .numpad {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 6px;
  }
  .numpad button {
    margin-top: 0;
    padding: 9px 0;
    font: inherit;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0;
    color: #cbd5e1;
    background: rgba(30, 41, 59, .8);
    border: 1px solid #1e293b;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: none;
  }
  .numpad button:hover { background: rgba(51, 65, 85, .9); }
  .numpad button:active { transform: translateY(1px) scale(.98); }

  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .actions button {
    margin-top: 0;
    padding: 8px 0;
    font: inherit;
    font-size: 12px;
    letter-spacing: .14em;
    color: #cbd5e1;
    background: rgba(30, 41, 59, .8);
    border: 1px solid #1e293b;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: none;
  }
  .actions button:hover { background: rgba(51, 65, 85, .9); }

  .pause-btn {
    position: fixed;
    top: 12px;
    right: 12px;
    width: 36px;
    height: 36px;
    display: none;
    align-items: center;
    justify-content: center;
    border: 1px solid #1e293b;
    border-radius: 10px;
    background: rgba(15, 23, 42, .72);
    color: #cbd5e1;
    font-size: 12px;
    letter-spacing: 0;
    cursor: pointer;
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    z-index: 90;
  }
  .pause-btn.show { display: flex; }
  .pause-btn:hover { background: rgba(30, 41, 59, .8); }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 24px;
    background: rgba(5, 9, 16, .82);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  .overlay h1 {
    margin: 0;
    font-size: clamp(26px, 8vw, 40px);
    letter-spacing: .22em;
    color: #e2e8f0;
    text-shadow: 0 0 26px rgba(74, 222, 128, .35);
  }
  .overlay p {
    margin: 0;
    font-size: 13px;
    line-height: 1.7;
    color: #94a3b8;
    letter-spacing: .06em;
    max-width: 30ch;
  }

  button {
    margin-top: 4px;
    padding: 12px 30px;
    font: inherit;
    font-size: 14px;
    letter-spacing: .18em;
    color: #04210f;
    background: linear-gradient(180deg, #86efac, #4ade80);
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 24px -8px rgba(74, 222, 128, .8);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 12px 28px -8px rgba(74, 222, 128, .9); }
  button:active { transform: translateY(1px) scale(.98); }

  .hint {
    margin: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: .14em;
    color: #475569;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="hud">
    <div>TIME<b id="score">0</b></div>
    <div>PUZZLE<b id="puzzle">1/3</b></div>
    <div>BEST<b id="best">--</b></div>
  </div>

  <div class="board">
    <div class="sg-grid" id="grid"></div>
    <div class="numpad" id="numpad"></div>
    <div class="actions">
      <button id="eraseBtn">ERASE</button>
      <button id="newBtn">NEW GAME</button>
    </div>
    <button class="pause-btn" id="pauseBtn" aria-label="Pause">❚❚</button>
    <div class="overlay show" id="overlay">
      <h1 id="ovTitle">SUDOKU</h1>
      <p id="ovText">Fill the grid so every row, column and 3x3 box contains 1-9. Click a cell, then type or use the pad.</p>
      <button id="ovBtn">PLAY</button>
      <button id="ovBtn2" style="display:none">RESTART</button>
    </div>
  </div>

  <p class="hint">CLICK CELL · TYPE 1-9 · ARROWS MOVE &nbsp;·&nbsp; SPACE / P PAUSE &nbsp;·&nbsp; N NEW &nbsp;·&nbsp; R RESTART</p>
</div>

<script>
(() => {
  "use strict";

  /* ---------- Setup ---------- */
  const gridEl   = document.getElementById('grid');
  const numpadEl = document.getElementById('numpad');
  const eraseBtn = document.getElementById('eraseBtn');
  const newBtn   = document.getElementById('newBtn');
  const overlay  = document.getElementById('overlay');
  const ovTitle  = document.getElementById('ovTitle');
  const ovText   = document.getElementById('ovText');
  const ovBtn    = document.getElementById('ovBtn');
  const ovBtn2   = document.getElementById('ovBtn2');
  const pauseBtn = document.getElementById('pauseBtn');
  const scoreEl  = document.getElementById('score');
  const puzzleEl = document.getElementById('puzzle');
  const bestEl   = document.getElementById('best');

  /* ---------- Puzzles ----------
     Base puzzle is the classic Wikipedia sudoku. Puzzles 2 and 3 are
     derived from it by rotation + digit permutation, which preserves
     validity and solution uniqueness. */
  const BASE_SOL = '534678912672195348198342567859761423426853791713924856961537284287419635345286179';
  const BASE_PUZ = '53..7....6..195....98....6.8...6...34..8.3..17...2...6.6....28....419..5....8..79';

  const MAP2 = [0, 4, 8, 1, 9, 6, 3, 2, 7, 5];
  const MAP3 = [0, 7, 3, 6, 2, 9, 5, 1, 8, 4];

  function toArr(s) { return Array.from(s, ch => ch === '.' ? 0 : +ch); }

  function rotateCW(g) {
    const out = new Array(81);
    for (let r = 0; r < 9; r++) {
      for (let c = 0; c < 9; c++) {
        out[c * 9 + (8 - r)] = g[r * 9 + c];
      }
    }
    return out;
  }

  function permute(g, map) { return g.map(d => (d === 0 ? 0 : map[d])); }

  function buildPuzzles() {
    const s1 = toArr(BASE_SOL);
    const p1 = toArr(BASE_PUZ);
    const s2 = permute(rotateCW(s1), MAP2);
    const p2 = permute(rotateCW(p1), MAP2);
    const s3 = permute(rotateCW(rotateCW(s1)), MAP3);
    const p3 = permute(rotateCW(rotateCW(p1)), MAP3);
    return [
      { sol: s1, giv: p1 },
      { sol: s2, giv: p2 },
      { sol: s3, giv: p3 }
    ];
  }

  const puzzles = buildPuzzles();

  /* ---------- Peers (row + column + box, minus self) ---------- */
  const PEERS = Array.from({ length: 81 }, (_, i) => {
    const r = (i / 9) | 0;
    const c = i % 9;
    const br = ((r / 3) | 0) * 3;
    const bc = ((c / 3) | 0) * 3;
    const s = new Set();
    for (let k = 0; k < 9; k++) {
      s.add(r * 9 + k);
      s.add(k * 9 + c);
    }
    for (let dr = 0; dr < 3; dr++) {
      for (let dc = 0; dc < 3; dc++) {
        s.add((br + dr) * 9 + (bc + dc));
      }
    }
    s.delete(i);
    return Array.from(s);
  });

  /* ---------- State ---------- */
  let puzzleIndex = 0;
  let sol;          // solution values (81)
  let given;        // booleans (81)
  let board;        // current values (81, 0 = empty)
  let sel = -1;     // selected cell index
  let seconds = 0;
  let state = 'idle'; // 'idle' | 'playing' | 'paused' | 'over'

  let best = null;
  try {
    const v = localStorage.getItem('sudoku.best');
    if (v !== null && v !== '') { const n = parseInt(v, 10); if (!isNaN(n)) best = n; }
  } catch (e) {}

  /* ---------- DOM build ---------- */
  const cellEls = [];
  for (let i = 0; i < 81; i++) {
    const el = document.createElement('div');
    el.className = 'cell';
    el.dataset.i = i;
    const r = (i / 9) | 0;
    const c = i % 9;
    if (c < 8) el.style.borderRight = (c % 3 === 2) ? '2px solid #334155' : '1px solid #1e293b';
    if (r < 8) el.style.borderBottom = (r % 3 === 2) ? '2px solid #334155' : '1px solid #1e293b';
    gridEl.appendChild(el);
    cellEls.push(el);
  }

  for (let d = 1; d <= 9; d++) {
    const b = document.createElement('button');
    b.textContent = d;
    b.addEventListener('click', () => { b.blur(); setValue(d); });
    numpadEl.appendChild(b);
  }

  /* ---------- Helpers ---------- */
  function updateHud() {
    scoreEl.textContent = seconds;
    puzzleEl.textContent = (puzzleIndex + 1) + '/' + puzzles.length;
    bestEl.textContent = best === null ? '--' : best;
  }

  function showOverlay(title, text, btnLabel, btn2Label) {
    ovTitle.textContent = title;
    ovText.textContent = text;
    ovBtn.textContent = btnLabel;
    if (btn2Label) { ovBtn2.textContent = btn2Label; ovBtn2.style.display = ''; }
    else { ovBtn2.style.display = 'none'; }
    overlay.classList.add('show');
  }

  function hideOverlay() {
    overlay.classList.remove('show');
  }

  function updatePauseBtn() { pauseBtn.classList.toggle('show', state === 'playing'); }

  /* ---------- Rendering ---------- */
  function render() {
    const bad = new Set();
    for (let i = 0; i < 81; i++) {
      if (!given[i] && board[i]) {
        for (const p of PEERS[i]) {
          if (board[p] === board[i]) { bad.add(i); break; }
        }
      }
    }

    const selVal = sel !== -1 ? board[sel] : 0;
    const selPeers = sel !== -1 ? new Set(PEERS[sel]) : null;

    for (let i = 0; i < 81; i++) {
      const el = cellEls[i];
      el.textContent = board[i] || '';
      el.className = 'cell';
      if (given[i]) el.classList.add('given');
      else if (board[i]) el.classList.add('user');
      if (i === sel) el.classList.add('sel');
      if (selPeers && selPeers.has(i)) el.classList.add('hl');
      if (selVal && board[i] === selVal && i !== sel) el.classList.add('same');
      if (bad.has(i)) el.classList.add('bad');
    }
  }

  /* ---------- Game logic ---------- */
  function loadPuzzle(idx) {
    puzzleIndex = idx;
    const p = puzzles[puzzleIndex];
    sol = p.sol;
    given = p.giv.map(d => d !== 0);
    board = p.giv.slice();
    sel = -1;
    seconds = 0;
    updateHud();
    render();
  }

  function start() {
    loadPuzzle(puzzleIndex);
    state = 'playing';
    hideOverlay();
    updatePauseBtn();
  }

  function startNew() {
    loadPuzzle((puzzleIndex + 1) % puzzles.length);
    state = 'playing';
    hideOverlay();
    updatePauseBtn();
  }

  function setValue(v) {
    if (state !== 'playing' || sel === -1 || given[sel]) return;
    board[sel] = v;
    render();
    checkWin();
  }

  function clearCell() {
    if (state !== 'playing' || sel === -1 || given[sel]) return;
    board[sel] = 0;
    render();
  }

  function moveSel(dr, dc) {
    if (sel === -1) {
      sel = 0;
    } else {
      const r = ((sel / 9) | 0) + dr;
      const c = (sel % 9) + dc;
      if (r < 0 || r > 8 || c < 0 || c > 8) return;
      sel = r * 9 + c;
    }
    render();
  }

  function checkWin() {
    for (let i = 0; i < 81; i++) if (!board[i]) return;
    for (let i = 0; i < 81; i++) if (board[i] !== sol[i]) return;
    win();
  }

  function win() {
    state = 'over';
    updatePauseBtn();
    if (best === null || seconds < best) {
      best = seconds;
      try { localStorage.setItem('sudoku.best', String(best)); } catch (e) {}
    }
    updateHud();
    showOverlay('YOU WIN!', `Solved in ${seconds}s. Best: ${best === null ? '--' : best}s.`, 'PLAY AGAIN', 'NEW GAME');
  }

  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      showOverlay('PAUSED', 'The timer is frozen. Press space or hit resume.', 'RESUME', 'RESTART');
    } else if (state === 'paused') {
      state = 'playing';
      hideOverlay();
    }
    updatePauseBtn();
  }

  /* ---------- Timer ---------- */
  setInterval(() => {
    if (state === 'playing') {
      seconds++;
      scoreEl.textContent = seconds;
    }
  }, 1000);

  /* ---------- Input ---------- */
  window.addEventListener('keydown', (e) => {
    const k = e.key;

    if (k === ' ' || k === 'Spacebar' || k.startsWith('Arrow')) e.preventDefault();

    if (k === 'r' || k === 'R') { start(); return; }
    if (k === 'n' || k === 'N') { startNew(); return; }

    if (k === ' ' || k === 'Spacebar' || k === 'p' || k === 'P') {
      if (state === 'playing' || state === 'paused') togglePause();
      else start();
      return;
    }

    if (state !== 'playing') return;

    if (k >= '1' && k <= '9') { setValue(+k); return; }
    if (k === 'Backspace' || k === 'Delete' || k === '0') { clearCell(); return; }

    const arrows = {
      ArrowUp: [-1, 0], ArrowDown: [1, 0],
      ArrowLeft: [0, -1], ArrowRight: [0, 1]
    };
    if (arrows[k]) moveSel(arrows[k][0], arrows[k][1]);
  });

  gridEl.addEventListener('click', (e) => {
    const cell = e.target.closest('.cell');
    if (!cell || state !== 'playing') return;
    sel = +cell.dataset.i;
    render();
  });

  ovBtn.addEventListener('click', () => {
    ovBtn.blur();
    if (state === 'paused') togglePause();
    else start();
  });

  ovBtn2.addEventListener('click', () => {
    ovBtn2.blur();
    if (state === 'over') startNew();
    else start();
  });

  pauseBtn.addEventListener('click', () => {
    pauseBtn.blur();
    if (state === 'playing') togglePause();
  });

  eraseBtn.addEventListener('click', () => {
    eraseBtn.blur();
    clearCell();
  });

  newBtn.addEventListener('click', () => {
    newBtn.blur();
    startNew();
  });

  // Auto-pause when the tab loses focus
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'playing') togglePause();
  });

  /* ---------- Boot ---------- */
  loadPuzzle(0);
  state = 'idle';
  updatePauseBtn();
  showOverlay('SUDOKU', 'Fill the grid so every row, column and 3x3 box contains 1-9. Click a cell, then type or use the pad.', 'PLAY');
})();
</script>
<style>
.sound-btn{position:fixed;top:12px;left:12px;width:38px;height:38px;border:1px solid #1e293b;border-radius:10px;background:rgba(15,23,42,.72);color:#cbd5e1;font-size:16px;line-height:1;cursor:pointer;z-index:99;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sound-btn:hover{background:rgba(30,41,59,.8)}
</style>
<button class="sound-btn" id="soundBtn" aria-label="Toggle sound">♪</button>
<script>
(function () {
  "use strict";
  var AC = window.AudioContext || window.webkitAudioContext;
  var ctx = null, master = null, musicGain = null, noiseBuf = null;
  var muted = false, musicOn = false, timer = null, step = 0, nextT = 0;

  var LEAD = [1046.52,1174.68,1318.53,1480,1568.01,1480,1318.53,1174.68,1046.52,1318.53,1568.01,1318.53,1480,1318.53,1174.68,1046.52];
  var BASS = [261.63,392,261.63,0,261.63,392,261.63,0,261.63,392,261.63,0,261.63,392,261.63,0];
  var STEP = 0.17;

  try { muted = localStorage.getItem('arcade.muted') === '1'; } catch (e) {}

  function ensureCtx() {
    if (!ctx) {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = muted ? 0 : 0.6;
      master.connect(ctx.destination);
      musicGain = ctx.createGain();
      musicGain.gain.value = 0.5;
      musicGain.connect(master);
      var n = Math.floor(ctx.sampleRate * 0.04);
      noiseBuf = ctx.createBuffer(1, n, ctx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    }
    if (ctx.state === 'suspended') ctx.resume();
  }

  function note(freq, t, dur, type, vol) {
    if (!freq) return;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(musicGain);
    o.start(t); o.stop(t + dur + 0.05);
  }

  function hat(t) {
    var s = ctx.createBufferSource(); s.buffer = noiseBuf;
    var hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7000;
    var g = ctx.createGain(); g.gain.value = 0.05;
    s.connect(hp); hp.connect(g); g.connect(musicGain);
    s.start(t);
  }

  function schedule(i, t) {
    var k = i % LEAD.length;
    note(LEAD[k], t, STEP * 0.9, 'sawtooth', 0.16);
    note(BASS[k], t, STEP * 0.95, 'sine', 0.2);
    hat(t);
  }

  function tick() {
    while (nextT < ctx.currentTime + 0.12) {
      schedule(step, nextT);
      step++;
      nextT += STEP;
    }
  }

  function startMusic() {
    if (musicOn) return;
    ensureCtx();
    musicOn = true;
    nextT = ctx.currentTime + 0.05;
    step = 0;
    timer = setInterval(tick, 25);
  }

  function stopMusic() {
    if (timer) { clearInterval(timer); timer = null; }
    musicOn = false;
    step = 0;
  }

  function setMuted(m) {
    muted = m;
    try { localStorage.setItem('arcade.muted', m ? '1' : '0'); } catch (e) {}
    if (master) master.gain.setTargetAtTime(m ? 0 : 0.6, ctx.currentTime, 0.02);
    var b = document.getElementById('soundBtn');
    if (b) b.textContent = m ? '🔇' : '♪';
  }

  function sync() {
    var pb = document.getElementById('pauseBtn');
    if (pb && pb.classList.contains('show')) { if (!musicOn) startMusic(); }
    else if (musicOn) stopMusic();
  }

  function wire() {
    var sb = document.getElementById('soundBtn');
    if (sb) sb.addEventListener('click', function () { ensureCtx(); setMuted(!muted); });
    window.addEventListener('pointerdown', ensureCtx);
    window.addEventListener('keydown', ensureCtx);
    var pb = document.getElementById('pauseBtn');
    if (pb) new MutationObserver(sync).observe(pb, { attributes: true, attributeFilter: ['class'] });
    var b = document.getElementById('soundBtn');
    if (b) b.textContent = muted ? '🔇' : '♪';
    sync();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', wire);
  else wire();
})();
</script>
<button class="rules-btn" id="rulesBtn">RULES</button>
<div class="rules-panel" id="rulesPanel">
  <div class="rules-card">
    <h2>HOW TO PLAY</h2>
    <p id="rulesText"></p>
    <button id="rulesClose">BACK</button>
  </div>
</div>
<style>
.rules-btn{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);padding:10px 22px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:.18em;color:#cbd5e1;background:rgba(15,23,42,.85);border:1px solid #334155;border-radius:999px;cursor:pointer;display:none;z-index:60}
.rules-btn.show{display:block}
.rules-btn:hover{background:rgba(30,41,59,.9)}
.rules-panel{position:fixed;inset:0;background:rgba(5,9,16,.94);display:none;align-items:center;justify-content:center;padding:20px;z-index:200;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.rules-panel.show{display:flex}
.rules-card{width:min(88vw,440px);max-height:80vh;overflow:auto;background:#0b1220;border:1px solid #1e293b;border-radius:16px;padding:24px;box-shadow:0 30px 60px -25px #000;text-align:center}
.rules-card h2{margin:0 0 14px;font-size:14px;letter-spacing:.24em;color:#4ade80}
.rules-card p{margin:0 0 20px;font-size:13px;line-height:1.9;color:#cbd5e1;letter-spacing:.03em;text-align:left}
.rules-card button{margin:0;padding:10px 26px;font:inherit;font-size:13px;letter-spacing:.18em;color:#04210f;background:linear-gradient(180deg,#86efac,#4ade80);border:0;border-radius:999px;cursor:pointer;box-shadow:0 8px 24px -8px rgba(74,222,128,.8)}
</style>
<script>
(function () {
  "use strict";
  var RULES = "Fill the 9x9 grid so that every row, column, and 3x3 box contains the digits 1-9 exactly once. Click a cell and enter a number with your keyboard or the on-screen numpad. Given cells are locked, and conflicts are highlighted.";
  var btn = document.getElementById('rulesBtn');
  var panel = document.getElementById('rulesPanel');
  var text = document.getElementById('rulesText');
  var close = document.getElementById('rulesClose');
  if (text) text.textContent = RULES;
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' || e.key === 'Esc') {
      e.preventDefault();
      if (panel && panel.classList.contains('show')) { panel.classList.remove('show'); return; }
      try { document.dispatchEvent(new KeyboardEvent('keydown', { key: 'p', bubbles: true, cancelable: true })); } catch (err) {}
    }
  });
  function sync() {
    var pb = document.getElementById('pauseBtn');
    var title = document.getElementById('ovTitle');
    var paused = pb && !pb.classList.contains('show') && title && /PAUSED/i.test(title.textContent || '');
    if (btn) btn.classList.toggle('show', !!paused);
    var ov = document.getElementById('overlay');
    if (ov && !ov.classList.contains('show') && panel) panel.classList.remove('show');
  }
  var pb = document.getElementById('pauseBtn');
  if (pb) new MutationObserver(sync).observe(pb, { attributes: true, attributeFilter: ['class'] });
  var ov = document.getElementById('overlay');
  if (ov) new MutationObserver(sync).observe(ov, { attributes: true, attributeFilter: ['class'] });
  if (btn) btn.addEventListener('click', function () { if (panel) panel.classList.add('show'); });
  if (close) close.addEventListener('click', function () { if (panel) panel.classList.remove('show'); });
  if (panel) panel.addEventListener('click', function (e) { if (e.target === panel) panel.classList.remove('show'); });
  sync();
})();
</script>
<style>
#score{display:inline-block}
#score.pulse{animation:scorePulse .45s ease}
@keyframes scorePulse{
  0%{transform:scale(1);text-shadow:0 0 14px rgba(74,222,128,.45)}
  40%{transform:scale(1.4);text-shadow:0 0 26px rgba(74,222,128,.95)}
  100%{transform:scale(1);text-shadow:0 0 14px rgba(74,222,128,.45)}
}
</style>
<script>
(function () {
  "use strict";
  var el = document.getElementById('score');
  if (!el) return;
  var last = parseInt(el.textContent, 10) || 0;
  var mo = new MutationObserver(function () {
    var cur = parseInt(el.textContent, 10) || 0;
    if (cur > last) {
      el.classList.remove('pulse');
      void el.offsetWidth;
      el.classList.add('pulse');
    }
    last = cur;
  });
  mo.observe(el, { childList: true, characterData: true, subtree: true });
})();
</script>
</body>
</html>
