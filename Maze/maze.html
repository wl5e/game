<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Maze</title>
<style>
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0%,#16233a 0%,#070b12 65%);font-family:ui-monospace,Menlo,Consolas,monospace;color:#cbd5e1;padding:16px;-webkit-tap-highlight-color:transparent}
  .wrap{width:min(92vw,460px);display:flex;flex-direction:column;gap:12px}
  .hud{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.15em;color:#64748b}
  .hud b{color:#38bdf8;font-size:20px;margin-left:6px}
  .area{background:#0b1220;border:1px solid #1e293b;border-radius:14px;min-height:230px;display:grid;place-items:center;padding:16px;text-align:center;user-select:none;position:relative;overflow:hidden}
  button{font-family:inherit;border:0;border-radius:10px;padding:11px 15px;font-size:14px;font-weight:700;background:#0ea5e9;color:#04222a;cursor:pointer}
  button:active{transform:translateY(1px)}
  .hint{color:#64748b;font-size:11px;text-align:center;line-height:1.6}
  .big{font-size:26px;font-weight:800}
  .opt{background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:10px;padding:10px 14px;font-size:16px;font-weight:700;margin:4px;cursor:pointer}
  .opt:hover{border-color:#38bdf8}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>TEMPS <b id="score">0</b></span><span>BEST <b id="best">—</b></span></div>
  <div class="area" id="area"><canvas id="cv" width="330" height="330"></canvas></div>
  <button id="go">Rejouer</button>
  <div class="hint">Atteins la sortie (en bas à droite) avec les flèches. Plus vite = mieux.</div>
</div>
<script>
const $=s=>document.querySelector(s);
let best=0;try{best=parseInt(localStorage.getItem('maze.best')||'0',10)||0}catch(e){}
function saveHigh(v){ if(v>best){best=v;try{localStorage.setItem('maze.best',String(v))}catch(e){}} upd(); }
function saveLow(v){ if(best===0||v<best){best=v;try{localStorage.setItem('maze.best',String(v))}catch(e){}} upd(); }
function upd(){ $('#best').textContent=best?best:'—'; }
const cv=$('#cv'),c=cv.getContext('2d'); const N=11; let grid, px=1, py=1, start=0, done=false;
function carve(x,y){ grid[y][x]=0; const dirs=[[2,0],[-2,0],[0,2],[0,-2]].sort(()=>Math.random()-0.5); for(const [dx,dy] of dirs){ const nx=x+dx,ny=y+dy; if(nx>0&&ny>0&&nx<N-1&&ny<N-1&&grid[ny][nx]){ grid[y+dy/2][x+dx/2]=0; carve(nx,ny); } } }
function gen(){ grid=Array.from({length:N},()=>Array(N).fill(1)); carve(1,1); px=1; py=1; }
function draw(){ const s=cv.width/N; c.clearRect(0,0,cv.width,cv.height); for(let y=0;y<N;y++) for(let x=0;x<N;x++){ if(grid[y][x]){ c.fillStyle='#1e293b'; c.fillRect(x*s,y*s,s,s); } } c.fillStyle='#4ade80'; c.fillRect((N-2)*s,(N-2)*s,s,s); c.fillStyle='#38bdf8'; c.beginPath(); c.arc(px*s+s/2,py*s+s/2,s*0.35,0,7); c.fill(); if(px===N-2&&py===N-2&&!done){ done=true; const t=Math.round((performance.now()-start)/1000); saveLow(t); $('#score').textContent=t; } }
function mv(dx,dy){ const nx=px+dx, ny=py+dy; if(nx>=0&&ny>=0&&nx<N&&ny<N&&grid[ny][nx]===0){ px=nx; py=ny; draw(); } }
document.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft')mv(-1,0); if(e.key==='ArrowRight')mv(1,0); if(e.key==='ArrowUp')mv(0,-1); if(e.key==='ArrowDown')mv(0,1); });
$('#go').onclick=()=>{ gen(); done=false; start=performance.now(); $('#score').textContent='0'; draw(); };
upd();
</script>
</body>
</html>
