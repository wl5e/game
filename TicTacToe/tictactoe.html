<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Tic-Tac-Toe</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    background: radial-gradient(120% 80% at 50% 0%, #4a2410 0%, #0e0802 65%);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #cbd5e1;
    padding: 16px;
    -webkit-tap-highlight-color: transparent;
  }

  .wrap {
    width: min(88vw, 380px);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .hud {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 12px;
    letter-spacing: .16em;
    color: #64748b;
  }
  .hud b {
    color: #4ade80;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .02em;
    margin-left: 6px;
    text-shadow: 0 0 14px rgba(74, 222, 128, .45);
  }

  .board {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 16px;
    overflow: hidden;
    background: #0b1220;
    box-shadow:
      0 0 0 1px #1e293b,
      0 0 0 6px rgba(15, 23, 42, .55),
      0 30px 60px -25px #000;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  .pause-btn {
    position: fixed;
    top: 12px;
    right: 12px;
    width: 36px;
    height: 36px;
    display: none;
    align-items: center;
    justify-content: center;
    border: 1px solid #1e293b;
    border-radius: 10px;
    background: rgba(15, 23, 42, .72);
    color: #cbd5e1;
    font-size: 12px;
    letter-spacing: 0;
    cursor: pointer;
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    z-index: 90;
  }
  .pause-btn.show { display: flex; }
  .pause-btn:hover { background: rgba(30, 41, 59, .8); }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 24px;
    background: rgba(5, 9, 16, .82);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  .overlay h1 {
    margin: 0;
    font-size: clamp(26px, 8vw, 40px);
    letter-spacing: .22em;
    color: #e2e8f0;
    text-shadow: 0 0 26px rgba(74, 222, 128, .35);
  }
  .overlay p {
    margin: 0;
    font-size: 13px;
    line-height: 1.7;
    color: #94a3b8;
    letter-spacing: .06em;
    max-width: 30ch;
  }

  button {
    margin-top: 4px;
    padding: 12px 30px;
    font: inherit;
    font-size: 14px;
    letter-spacing: .18em;
    color: #04210f;
    background: linear-gradient(180deg, #86efac, #4ade80);
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 24px -8px rgba(74, 222, 128, .8);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 12px 28px -8px rgba(74, 222, 128, .9); }
  button:active { transform: translateY(1px) scale(.98); }

  .hint {
    margin: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: .14em;
    color: #475569;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="hud">
    <div>SCORE<b id="score">0</b></div>
    <div>BEST<b id="best">0</b></div>
  </div>

  <div class="board">
    <canvas id="game"></canvas>
    <button class="pause-btn" id="pauseBtn" aria-label="Pause">❚❚</button>
    <div class="overlay show" id="overlay">
      <h1 id="ovTitle">TIC-TAC-TOE</h1>
      <p id="ovText">You are X, the CPU is O. Click a square to place your mark — three in a row wins.</p>
      <button id="ovBtn">PLAY</button>
      <button id="ovBtn2" style="display:none">RESTART</button>
    </div>
  </div>

  <p class="hint">CLICK / TAP &nbsp;·&nbsp; KEYS 1–9 &nbsp;·&nbsp; SPACE PAUSE &nbsp;·&nbsp; R RESTART</p>
</div>

<script>
(() => {
  "use strict";

  /* ---------- Setup ---------- */
  const N = 3;
  const W = 300;
  const H = 300;
  const PAD = 22;
  const CELL = (W - PAD * 2) / N;

  const canvas  = document.getElementById('game');
  const ctx     = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText  = document.getElementById('ovText');
  const ovBtn   = document.getElementById('ovBtn');
  const ovBtn2  = document.getElementById('ovBtn2');
  const pauseBtn = document.getElementById('pauseBtn');
  const scoreEl = document.getElementById('score');
  const bestEl  = document.getElementById('best');

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);

  /* ---------- State ---------- */
  let board;          // array of 9: '' | 'X' | 'O'
  let humanTurn;      // true when the human (X) may move
  let wins = 0, losses = 0, draws = 0;
  let streak = 0;
  let winLine = null; // winning cell indices for highlight
  let state = 'idle'; // 'idle' | 'playing' | 'paused' | 'over'
  let cpuTimer = null;
  let cpuPending = false;

  let best = 0;
  try { best = parseInt(localStorage.getItem('tictactoe.best') || '0', 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  const LINES = [
    [0,1,2], [3,4,5], [6,7,8],
    [0,3,6], [1,4,7], [2,5,8],
    [0,4,8], [2,4,6]
  ];

  /* ---------- Helpers ---------- */
  function updateHud() {
    scoreEl.textContent = wins;
    bestEl.textContent = best;
  }

  function showOverlay(title, text, btnLabel, btn2Label) {
    ovTitle.textContent = title;
    ovText.textContent = text;
    ovBtn.textContent = btnLabel;
    if (btn2Label) { ovBtn2.textContent = btn2Label; ovBtn2.style.display = ''; }
    else { ovBtn2.style.display = 'none'; }
    overlay.classList.add('show');
  }

  function hideOverlay() {
    overlay.classList.remove('show');
  }

  function updatePauseBtn() { pauseBtn.classList.toggle('show', state === 'playing'); }

  /* ---------- Game logic ---------- */
  function winnerOf(b, p) {
    return LINES.some(l => b[l[0]] === p && b[l[1]] === p && b[l[2]] === p);
  }

  function findWinLine(b, p) {
    for (const l of LINES) {
      if (b[l[0]] === p && b[l[1]] === p && b[l[2]] === p) return l;
    }
    return null;
  }

  function isFull(b) { return b.every(c => c !== ''); }

  // Minimax: CPU ('O') maximizes, human ('X') minimizes.
  // Returns +1 for a CPU win, -1 for a human win, 0 for a draw.
  function minimax(b, isMax) {
    if (winnerOf(b, 'O')) return 1;
    if (winnerOf(b, 'X')) return -1;
    if (isFull(b)) return 0;

    if (isMax) {
      let bestScore = -Infinity;
      for (let i = 0; i < 9; i++) {
        if (b[i] === '') {
          b[i] = 'O';
          const s = minimax(b, false);
          b[i] = '';
          if (s > bestScore) bestScore = s;
        }
      }
      return bestScore;
    } else {
      let bestScore = Infinity;
      for (let i = 0; i < 9; i++) {
        if (b[i] === '') {
          b[i] = 'X';
          const s = minimax(b, true);
          b[i] = '';
          if (s < bestScore) bestScore = s;
        }
      }
      return bestScore;
    }
  }

  function bestCpuMove() {
    // Occasionally play a suboptimal move so the CPU is beatable.
    if (Math.random() < 0.2) {
      const empties = [];
      for (let i = 0; i < 9; i++) if (board[i] === '') empties.push(i);
      return empties[(Math.random() * empties.length) | 0];
    }
    let bestScore = -Infinity;
    let move = -1;
    for (let i = 0; i < 9; i++) {
      if (board[i] === '') {
        board[i] = 'O';
        const s = minimax(board, false);
        board[i] = '';
        if (s > bestScore) { bestScore = s; move = i; }
      }
    }
    return move;
  }

  function finish(result) {
    state = 'over';
    updatePauseBtn();
    if (result === 'win') {
      wins++;
      streak++;
      if (streak > best) {
        best = streak;
        try { localStorage.setItem('tictactoe.best', String(best)); } catch (e) {}
      }
    } else if (result === 'loss') {
      losses++;
      streak = 0;
    } else {
      draws++;
      streak = 0;
    }
    updateHud();
    const title = result === 'win' ? 'YOU WIN' : result === 'loss' ? 'YOU LOSE' : 'DRAW';
    showOverlay(title, `Wins ${wins} · Losses ${losses} · Draws ${draws}. Best streak: ${best}.`, 'PLAY AGAIN');
  }

  function scheduleCpu() {
    cpuPending = true;
    cpuTimer = setTimeout(() => {
      cpuTimer = null;
      if (state !== 'playing') return;
      cpuPending = false;
      const move = bestCpuMove();
      if (move === -1) { finish('draw'); return; }
      board[move] = 'O';
      humanTurn = true;
      draw();
      const line = findWinLine(board, 'O');
      if (line) { winLine = line; draw(); finish('loss'); }
      else if (isFull(board)) { finish('draw'); }
    }, 360);
  }

  function humanMove(i) {
    if (state !== 'playing' || !humanTurn) return;
    if (board[i] !== '') return;
    board[i] = 'X';
    draw();
    const line = findWinLine(board, 'X');
    if (line) { winLine = line; draw(); finish('win'); return; }
    if (isFull(board)) { finish('draw'); return; }
    humanTurn = false;
    scheduleCpu();
  }

  function reset() {
    board = Array(9).fill('');
    humanTurn = true;
    winLine = null;
    cpuPending = false;
    if (cpuTimer) { clearTimeout(cpuTimer); cpuTimer = null; }
    draw();
    updateHud();
  }

  function start() {
    reset();
    state = 'playing';
    hideOverlay();
    updatePauseBtn();
  }

  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      if (cpuTimer) { clearTimeout(cpuTimer); cpuTimer = null; }
      showOverlay('PAUSED', 'The board is frozen. Press space or hit resume.', 'RESUME', 'RESTART');
    } else if (state === 'paused') {
      state = 'playing';
      hideOverlay();
      if (cpuPending && !humanTurn) scheduleCpu();
    }
    updatePauseBtn();
  }

  /* ---------- Rendering ---------- */
  function cellCenter(i) {
    const x = i % N;
    const y = (i / N) | 0;
    return {
      x: PAD + x * CELL + CELL / 2,
      y: PAD + y * CELL + CELL / 2
    };
  }

  function drawX(cx, cy) {
    const r = CELL * 0.30;
    ctx.save();
    ctx.strokeStyle = '#4ade80';
    ctx.lineWidth = Math.max(4, CELL * 0.09);
    ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(74, 222, 128, .6)';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(cx - r, cy - r); ctx.lineTo(cx + r, cy + r);
    ctx.moveTo(cx + r, cy - r); ctx.lineTo(cx - r, cy + r);
    ctx.stroke();
    ctx.restore();
  }

  function drawO(cx, cy) {
    const r = CELL * 0.30;
    ctx.save();
    ctx.strokeStyle = '#ff4d6d';
    ctx.lineWidth = Math.max(4, CELL * 0.09);
    ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(255, 77, 109, .55)';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.fillStyle = '#0b1220';
    ctx.fillRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 2;
    for (let i = 1; i < N; i++) {
      const p = PAD + i * CELL;
      ctx.beginPath();
      ctx.moveTo(p, PAD); ctx.lineTo(p, H - PAD);
      ctx.moveTo(PAD, p); ctx.lineTo(W - PAD, p);
      ctx.stroke();
    }

    // Win line highlight
    if (winLine) {
      const a = cellCenter(winLine[0]);
      const b = cellCenter(winLine[2]);
      ctx.strokeStyle = 'rgba(74, 222, 128, .55)';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }

    // Marks
    for (let i = 0; i < 9; i++) {
      const c = cellCenter(i);
      if (board[i] === 'X') drawX(c.x, c.y);
      else if (board[i] === 'O') drawO(c.x, c.y);
    }
  }

  /* ---------- Input ---------- */
  function cellFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width * W;
    const y = (e.clientY - rect.top) / rect.height * H;
    const col = Math.floor((x - PAD) / CELL);
    const row = Math.floor((y - PAD) / CELL);
    if (col < 0 || col >= N || row < 0 || row >= N) return -1;
    return row * N + col;
  }

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const i = cellFromEvent(e);
    if (i >= 0) humanMove(i);
  });

  window.addEventListener('keydown', (e) => {
    const k = e.key;

    if (k === ' ' || k === 'Spacebar') e.preventDefault();

    if (k === 'r' || k === 'R') { start(); return; }

    if (k === ' ' || k === 'Spacebar' || k === 'p' || k === 'P') {
      if (state === 'playing' || state === 'paused') togglePause();
      else start();
      return;
    }

    if (k >= '1' && k <= '9') {
      if (state === 'idle' || state === 'over') start();
      humanMove(parseInt(k, 10) - 1);
    }
  });

  ovBtn.addEventListener('click', () => {
    ovBtn.blur();
    if (state === 'paused') togglePause();
    else start();
  });

  ovBtn2.addEventListener('click', () => {
    ovBtn2.blur();
    start();
  });

  pauseBtn.addEventListener('click', () => {
    pauseBtn.blur();
    if (state === 'playing') togglePause();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'playing') togglePause();
  });

  /* ---------- Boot ---------- */
  reset();
  state = 'idle';
  updatePauseBtn();
})();
</script>
<style>
.sound-btn{position:fixed;top:12px;left:12px;width:38px;height:38px;border:1px solid #1e293b;border-radius:10px;background:rgba(15,23,42,.72);color:#cbd5e1;font-size:16px;line-height:1;cursor:pointer;z-index:99;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sound-btn:hover{background:rgba(30,41,59,.8)}
</style>
<button class="sound-btn" id="soundBtn" aria-label="Toggle sound">♪</button>
<script>
(function () {
  "use strict";
  var AC = window.AudioContext || window.webkitAudioContext;
  var ctx = null, master = null, musicGain = null, noiseBuf = null;
  var muted = false, musicOn = false, timer = null, step = 0, nextT = 0;

  var LEAD = [587.32,587.32,659.24,659.24,739.98,739.98,783.98,783.98,879.99,783.98,739.98,659.24,587.32,0,587.32,0];
  var BASS = [146.83,220,146.83,0,146.83,220,146.83,0,146.83,220,146.83,0,146.83,220,146.83,0];
  var STEP = 0.11;

  try { muted = localStorage.getItem('arcade.muted') === '1'; } catch (e) {}

  function ensureCtx() {
    if (!ctx) {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = muted ? 0 : 0.6;
      master.connect(ctx.destination);
      musicGain = ctx.createGain();
      musicGain.gain.value = 0.5;
      musicGain.connect(master);
      var n = Math.floor(ctx.sampleRate * 0.04);
      noiseBuf = ctx.createBuffer(1, n, ctx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    }
    if (ctx.state === 'suspended') ctx.resume();
  }

  function note(freq, t, dur, type, vol) {
    if (!freq) return;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(musicGain);
    o.start(t); o.stop(t + dur + 0.05);
  }

  function hat(t) {
    var s = ctx.createBufferSource(); s.buffer = noiseBuf;
    var hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7000;
    var g = ctx.createGain(); g.gain.value = 0.05;
    s.connect(hp); hp.connect(g); g.connect(musicGain);
    s.start(t);
  }

  function schedule(i, t) {
    var k = i % LEAD.length;
    note(LEAD[k], t, STEP * 0.9, 'sawtooth', 0.16);
    note(BASS[k], t, STEP * 0.95, 'sine', 0.2);
    hat(t);
  }

  function tick() {
    while (nextT < ctx.currentTime + 0.12) {
      schedule(step, nextT);
      step++;
      nextT += STEP;
    }
  }

  function startMusic() {
    if (musicOn) return;
    ensureCtx();
    musicOn = true;
    nextT = ctx.currentTime + 0.05;
    step = 0;
    timer = setInterval(tick, 25);
  }

  function stopMusic() {
    if (timer) { clearInterval(timer); timer = null; }
    musicOn = false;
    step = 0;
  }

  function setMuted(m) {
    muted = m;
    try { localStorage.setItem('arcade.muted', m ? '1' : '0'); } catch (e) {}
    if (master) master.gain.setTargetAtTime(m ? 0 : 0.6, ctx.currentTime, 0.02);
    var b = document.getElementById('soundBtn');
    if (b) b.textContent = m ? '🔇' : '♪';
  }

  function sync() {
    var pb = document.getElementById('pauseBtn');
    if (pb && pb.classList.contains('show')) { if (!musicOn) startMusic(); }
    else if (musicOn) stopMusic();
  }

  function wire() {
    var sb = document.getElementById('soundBtn');
    if (sb) sb.addEventListener('click', function () { ensureCtx(); setMuted(!muted); });
    window.addEventListener('pointerdown', ensureCtx);
    window.addEventListener('keydown', ensureCtx);
    var pb = document.getElementById('pauseBtn');
    if (pb) new MutationObserver(sync).observe(pb, { attributes: true, attributeFilter: ['class'] });
    var b = document.getElementById('soundBtn');
    if (b) b.textContent = muted ? '🔇' : '♪';
    sync();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', wire);
  else wire();
})();
</script>

</style>
<script>
(function () {
  "use strict";
  var RULES = "You are X and the computer is O. Click an empty cell to place your mark. Get three in a row - horizontally, vertically, or diagonally - to win. The computer plays well but can be beaten.";
  var btn = document.getElementById('rulesBtn');
  var panel = document.getElementById('rulesPanel');
  var text = document.getElementById('rulesText');
  var close = document.getElementById('rulesClose');
  if (text) text.textContent = RULES;
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' || e.key === 'Esc') {
      e.preventDefault();
      if (panel && panel.classList.contains('show')) { panel.classList.remove('show'); return; }
      try { document.dispatchEvent(new KeyboardEvent('keydown', { key: 'p', bubbles: true, cancelable: true })); } catch (err) {}
    }
  });
  function sync() {
    var pb = document.getElementById('pauseBtn');
    var title = document.getElementById('ovTitle');
    var paused = pb && !pb.classList.contains('show') && title && /PAUSED/i.test(title.textContent || '');
    if (btn) btn.classList.toggle('show', !!paused);
    var ov = document.getElementById('overlay');
    if (ov && !ov.classList.contains('show') && panel) panel.classList.remove('show');
  }
  var pb = document.getElementById('pauseBtn');
  if (pb) new MutationObserver(sync).observe(pb, { attributes: true, attributeFilter: ['class'] });
  var ov = document.getElementById('overlay');
  if (ov) new MutationObserver(sync).observe(ov, { attributes: true, attributeFilter: ['class'] });
  if (btn) btn.addEventListener('click', function () { if (panel) panel.classList.add('show'); });
  if (close) close.addEventListener('click', function () { if (panel) panel.classList.remove('show'); });
  if (panel) panel.addEventListener('click', function (e) { if (e.target === panel) panel.classList.remove('show'); });
  sync();
})();
</script>
<style>
#score{display:inline-block}
#score.pulse{animation:scorePulse .45s ease}
@keyframes scorePulse{
  0%{transform:scale(1);text-shadow:0 0 14px rgba(74,222,128,.45)}
  40%{transform:scale(1.4);text-shadow:0 0 26px rgba(74,222,128,.95)}
  100%{transform:scale(1);text-shadow:0 0 14px rgba(74,222,128,.45)}
}
</style>
<script>
(function () {
  "use strict";
  var el = document.getElementById('score');
  if (!el) return;
  var last = parseInt(el.textContent, 10) || 0;
  var mo = new MutationObserver(function () {
    var cur = parseInt(el.textContent, 10) || 0;
    if (cur > last) {
      el.classList.remove('pulse');
      void el.offsetWidth;
      el.classList.add('pulse');
    }
    last = cur;
  });
  mo.observe(el, { childList: true, characterData: true, subtree: true });
})();
</script>
</body>
