<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Hoops</title>
<style>
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0%,#16233a 0%,#070b12 65%);font-family:ui-monospace,Menlo,Consolas,monospace;color:#cbd5e1;padding:16px;-webkit-tap-highlight-color:transparent}
  .wrap{width:min(92vw,460px);display:flex;flex-direction:column;gap:12px}
  .hud{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.15em;color:#64748b}
  .hud b{color:#38bdf8;font-size:20px;margin-left:6px}
  .area{background:#0b1220;border:1px solid #1e293b;border-radius:14px;min-height:230px;display:grid;place-items:center;padding:16px;text-align:center;user-select:none;position:relative;overflow:hidden}
  button{font-family:inherit;border:0;border-radius:10px;padding:11px 15px;font-size:14px;font-weight:700;background:#0ea5e9;color:#04222a;cursor:pointer}
  button:active{transform:translateY(1px)}
  .hint{color:#64748b;font-size:11px;text-align:center;line-height:1.6}
  .big{font-size:26px;font-weight:800}
  .opt{background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:10px;padding:10px 14px;font-size:16px;font-weight:700;margin:4px;cursor:pointer}
  .opt:hover{border-color:#38bdf8}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>PANIERS <b id="score">0</b></span><span>BEST <b id="best">—</b></span></div>
  <div class="area" id="area"><canvas id="cv" width="420" height="230"></canvas></div>
  <button id="go">Rejouer</button>
  <div class="hint">Clique pour lancer le ballon dans le panier qui bouge.</div>
</div>
<script>
const $=s=>document.querySelector(s);
let best=0;try{best=parseInt(localStorage.getItem('hoops.best')||'0',10)||0}catch(e){}
function saveHigh(v){ if(v>best){best=v;try{localStorage.setItem('hoops.best',String(v))}catch(e){}} upd(); }
function saveLow(v){ if(best===0||v<best){best=v;try{localStorage.setItem('hoops.best',String(v))}catch(e){}} upd(); }
function upd(){ $('#best').textContent=best?best:'—'; }
const cv=$('#cv'),c=cv.getContext('2d'); let hoop=210, hd=2, by=cv.height-40, shooting=false, vy=0, score=0, raf=null;
function frame(){ hoop+=hd; if(hoop<40||hoop>cv.width-40) hd=-hd; if(shooting){ by+=vy; vy+=0.45; if(by<0){ shooting=false; by=cv.height-40; } } c.clearRect(0,0,cv.width,cv.height); c.strokeStyle='#f97316'; c.lineWidth=4; c.beginPath(); c.moveTo(hoop-28,50); c.lineTo(hoop-28,70); c.lineTo(hoop+28,70); c.lineTo(hoop+28,50); c.stroke(); c.fillStyle='#fbbf24'; c.beginPath(); c.arc(210,by,10,0,7); c.fill(); if(shooting && by<72 && by>60 && Math.abs(210-hoop)<26){ score++; $('#score').textContent=score; shooting=false; by=cv.height-40; } raf=requestAnimationFrame(frame); }
cv.onclick=()=>{ if(!shooting){ shooting=true; by=cv.height-40; vy=-9.5; } };
$('#go').onclick=()=>{ hoop=210; hd=2; shooting=false; by=cv.height-40; score=0; $('#score').textContent='0'; cancelAnimationFrame(raf); frame(); };
upd();
</script>
</body>
</html>
