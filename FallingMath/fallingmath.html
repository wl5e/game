<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Falling Math</title>
<style>
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0%,#16233a 0%,#070b12 65%);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#cbd5e1;padding:16px;-webkit-tap-highlight-color:transparent;--acc:#2dd4bf}
  .wrap{width:min(92vw,460px);display:flex;flex-direction:column;gap:12px}
  .hud{display:flex;justify-content:space-between;align-items:baseline;gap:6px;flex-wrap:wrap;font-size:11px;letter-spacing:.08em;color:#64748b}
  .hud b{color:var(--acc);font-size:19px;font-weight:800;margin-left:5px;letter-spacing:0}
  .area{background:#0b1220;border:1px solid #1e293b;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px;text-align:center;user-select:none;position:relative;overflow:hidden;transition:box-shadow .12s ease}
  .area.good{box-shadow:0 0 0 3px var(--acc),0 0 48px -6px var(--acc)}
  .area.bad{box-shadow:0 0 0 3px #f87171,0 0 48px -6px #f87171;animation:shake .38s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  button{font-family:inherit;border:0;border-radius:10px;padding:11px 15px;font-size:14px;font-weight:700;background:var(--acc);color:#03231d;cursor:pointer}
  button:active{transform:translateY(1px)}
  .go{width:100%}
  .hint{color:#64748b;font-size:11px;text-align:center;line-height:1.6}
  canvas{display:block;width:100%;height:auto;border-radius:10px;background:#0a0f18}
  .ans{font-size:22px;font-weight:800;color:#e2e8f0}
  .ans b{color:var(--acc);font-size:28px}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .k{background:#15202e;border:1px solid #2a3b4d;color:#e2e8f0;border-radius:10px;padding:14px 0;font-size:19px;font-weight:700;cursor:pointer}
  .k:hover{border-color:var(--acc)}
  .k.ok{background:var(--acc);color:#03231d}
</style>
<script src="../audio.js"></script>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>SCORE <b id="score">0</b></span><span>BEST <b id="best">—</b></span></div>
  <div class="area" id="area">
    <canvas id="cv" width="420" height="230"></canvas>
    <div class="ans">= <b id="ans">?</b></div>
  </div>
  <div class="pad" id="pad"></div>
  <button id="go" class="go">Rejouer</button>
  <div class="hint">Tape la réponse avant que le calcul ne touche le sol. ⌫ efface, OK valide.</div>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const KEY='fallingmath.best';
let best=0; try{best=parseInt(localStorage.getItem(KEY)||'0',10)||0}catch(e){}
function upd(){ $('#best').textContent=best?best:'—'; }
function saveHigh(v){ if(v>best){best=v;try{localStorage.setItem('fallingmath.best',String(v))}catch(e){}upd();return true;} return false; }
const sfx=n=>{ try{window.Arcade&&window.Arcade.sfx(n);}catch(e){} };
function flash(good){ const a=$('#area'); a.classList.remove('good','bad'); void a.offsetWidth; a.classList.add(good?'good':'bad'); clearTimeout(flash._t); flash._t=setTimeout(()=>a.classList.remove('good','bad'),420); }

const cv=$('#cv'), c=cv.getContext('2d');
const W=cv.width, H=cv.height, GROUND=H-24;
let score=0, running=false, raf=null, q=null, buf='', speed=1.4;

const keys=['1','2','3','4','5','6','7','8','9','⌫','0','OK'];
$('#pad').innerHTML=keys.map(k=>`<button class="k ${k==='OK'?'ok':''}" data-k="${k}">${k}</button>`).join('');
$('#pad').querySelectorAll('.k').forEach(b=>b.onclick=()=>{
  const k=b.dataset.k;
  if(k==='OK') submit();
  else if(k==='⌫'){ buf=buf.slice(0,-1); renderAns(); }
  else digit(k);
});

function renderAns(){ $('#ans').textContent = buf==='' ? '?' : buf; }
function newQ(){
  let a=1+Math.floor(Math.random()*12), b=1+Math.floor(Math.random()*12);
  const ops=['+','-','×']; const op=ops[Math.floor(Math.random()*3)];
  let ans;
  if(op==='+') ans=a+b;
  else if(op==='-'){ if(a<b){[a,b]=[b,a];} ans=a-b; }
  else ans=a*b;
  q={a,b,op,ans,y:34};
  buf=''; renderAns();
}
function digit(d){
  if(!running||!q) return;
  if(buf.length>=4) return;
  buf+=d; renderAns();
  if(buf.length>=String(q.ans).length) submit();
}
function submit(){
  if(!running||!q) return;
  if(buf==='') return;
  const v=parseInt(buf,10);
  buf=''; renderAns();
  if(v===q.ans){
    score++; $('#score').textContent=score; sfx('correct'); flash(true);
    speed=Math.min(3.6, 1.4+score*0.07);
    newQ();
  } else { sfx('wrong'); flash(false); }
}
function frame(){
  if(!running) return;
  q.y += speed;
  c.clearRect(0,0,W,H);
  // ligne de danger / sol
  c.fillStyle='#1e293b'; c.fillRect(0,GROUND,W,3);
  c.fillStyle='rgba(248,113,113,.12)'; c.fillRect(0,GROUND,W,H-GROUND);
  c.fillStyle='#2dd4bf'; c.font='bold 26px ui-monospace,Menlo,monospace'; c.textAlign='center'; c.textBaseline='alphabetic';
  c.fillText(q.a+' '+q.op+' '+q.b+' = ?', W/2, q.y);
  if(q.y >= GROUND-8){ endGame(); return; }
  raf=requestAnimationFrame(frame);
}
function endGame(){
  if(!running) return; running=false; cancelAnimationFrame(raf);
  const rec=saveHigh(score); sfx(rec?'win':'lose');
  c.fillStyle='rgba(7,11,18,.8)'; c.fillRect(0,0,W,H);
  c.textAlign='center'; c.textBaseline='middle';
  c.fillStyle='#f87171'; c.font='bold 24px ui-monospace,Menlo,monospace'; c.fillText('TOUCHÉ !', W/2, H/2-28);
  c.fillStyle='#e2e8f0'; c.font='bold 36px ui-monospace,Menlo,monospace'; c.fillText(String(score), W/2, H/2+12);
  c.fillStyle=rec?'#2dd4bf':'#94a3b8'; c.font='13px ui-monospace,Menlo,monospace';
  c.fillText(rec?'NOUVEAU RECORD !':'Appuie sur Rejouer pour recommencer', W/2, H/2+48);
}
function start(){
  score=0; running=true; speed=1.4; buf=''; $('#score').textContent='0'; renderAns();
  cancelAnimationFrame(raf);
  c.clearRect(0,0,W,H);
  newQ();
  raf=requestAnimationFrame(frame);
}
document.addEventListener('keydown',e=>{
  if(!running){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); start(); } return; }
  if(e.key>='0'&&e.key<='9') digit(e.key);
  else if(e.key==='Backspace'){ e.preventDefault(); buf=buf.slice(0,-1); renderAns(); }
  else if(e.key==='Enter'){ e.preventDefault(); submit(); }
});
$('#go').onclick=start;
upd();
start();
</script>
</body>
</html>
