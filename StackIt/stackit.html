<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Stack It</title>
<style>
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0%,#16233a 0%,#070b12 65%);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#cbd5e1;padding:16px;-webkit-tap-highlight-color:transparent;user-select:none}
  .wrap{width:min(92vw,460px);display:flex;flex-direction:column;gap:12px}
  .hud{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.15em;color:#64748b}
  .hud b{color:#38bdf8;font-size:20px;font-weight:700;margin-left:6px}
  .area{background:#0b1220;border:1px solid #1e293b;border-radius:16px;overflow:hidden;position:relative;touch-action:manipulation}
  canvas{display:block;width:100%;height:auto}
  button{font-family:inherit;border:0;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:700;background:#0ea5e9;color:#04222a;cursor:pointer;letter-spacing:.03em;touch-action:manipulation}
  button:active{transform:translateY(1px) scale(.98)}
  .hint{color:#64748b;font-size:11px;text-align:center;line-height:1.6}
</style>
<script src="../audio.js"></script>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>BLOCS <b id="score">0</b></span><span>BEST <b id="best">—</b></span></div>
  <div class="area" id="area"><canvas id="cv" width="420" height="230"></canvas></div>
  <button id="go">Rejouer</button>
  <div class="hint">Clique pour déposer le bloc et l'aligner sur la pile.<br>Un bloc parfait garde sa largeur. 15 blocs = victoire. (Espace fonctionne)</div>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const sfx=n=>{ try{ if(window.Arcade) window.Arcade.sfx(n); }catch(e){} };
const KEY='stackit.best', PAR=15;
let best=0; try{ best=parseInt(localStorage.getItem(KEY)||'0',10)||0; }catch(e){}
function upd(){ $('#best').textContent=best?best:'—'; }
function save(v){ if(v>best){ best=v; try{ localStorage.setItem('stackit.best',String(v)); }catch(e){} } upd(); }

const cv=$('#cv'), c=cv.getContext('2d');
const W=cv.width, H=cv.height, BASE_W=132, BH=14, STEP=15, WIN_AT=15;
const scoreEl=$('#score');
let blocks=[], placed=0, moveX=0, moveW=BASE_W, dir=1, speed=3;
let state='idle', raf=null, lastT=0, fx=[];

function rrect(x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function start(){
  state='go'; cancelAnimationFrame(raf);
  blocks=[{cx:W/2,w:BASE_W,y:H-BH}]; placed=0;
  scoreEl.textContent='0'; moveW=BASE_W; moveX=W/2; dir=Math.random()<0.5?-1:1; speed=3; fx=[]; lastT=performance.now();
  raf=requestAnimationFrame(loop);
}
function drop(){
  if(state!=='go') return;
  const last=blocks[blocks.length-1];
  const mLeft=moveX-moveW/2, mRight=moveX+moveW/2;
  const lLeft=last.cx-last.w/2, lRight=last.cx+last.w/2;
  const nl=Math.max(mLeft,lLeft), nr=Math.min(mRight,lRight);
  const nw=nr-nl;
  const y=last.y-STEP;
  if(nw<=0){ finish('GAME OVER', false); return; }
  const ncx=(nl+nr)/2;
  blocks.push({cx:ncx,w:nw,y});
  placed++; scoreEl.textContent=placed;
  const perfect=Math.abs(moveX-last.cx)<3;
  if(perfect){ fx.push({x:ncx,y:y-6,t:'PARFAIT +1',born:performance.now(),life:750}); placed++; scoreEl.textContent=placed; sfx('coin'); }
  else sfx('pop');
  if(placed>=WIN_AT){ finish('VOUS GAGNEZ !', true); return; }
  moveW=perfect?BASE_W:Math.max(8,nw);
  moveX=ncx; dir=Math.random()<0.5?-1:1;
  speed=Math.min(7,3+placed*0.22);
}
function finish(msg, win){
  state='end'; cancelAnimationFrame(raf);
  save(placed);
  draw(performance.now());
  c.fillStyle='rgba(7,11,18,.84)'; c.fillRect(0,0,W,H);
  c.textAlign='center';
  c.fillStyle=win?'#4ade80':'#f87171'; c.font='bold 28px monospace';
  c.fillText(msg, W/2, H/2-8);
  c.fillStyle='#cbd5e1'; c.font='13px monospace';
  c.fillText((placed===best&&placed>0)?'Nouveau record ! '+placed+' blocs':('Best : '+(best?best:'—')), W/2, H/2+20);
  sfx(win?'win':'lose');
}
function loop(now){
  if(state!=='go') return;
  const dt=Math.min(50,now-lastT); lastT=now;
  moveX+=dir*speed*(dt/16.7);
  if(moveX<moveW/2){ moveX=moveW/2; dir=1; }
  if(moveX>W-moveW/2){ moveX=W-moveW/2; dir=-1; }
  draw(now);
  raf=requestAnimationFrame(loop);
}
function draw(now){
  c.clearRect(0,0,W,H);
  c.fillStyle='#0b1220'; c.fillRect(0,0,W,H);
  c.fillStyle='#1e293b'; c.fillRect(0,H-4,W,4);
  blocks.forEach((b,i)=>{
    c.fillStyle = i%2 ? '#0ea5e9' : '#38bdf8';
    rrect(b.cx-b.w/2,b.y,b.w,BH,3); c.fill();
  });
  const ty=blocks[blocks.length-1].y-STEP;
  c.fillStyle='#e0f2fe';
  rrect(moveX-moveW/2, ty, moveW, BH, 3); c.fill();
  c.textAlign='center';
  c.fillStyle='#64748b'; c.font='bold 11px monospace';
  c.fillText(placed+'/'+WIN_AT+' — clique pour empiler', W/2, 14);
  fx=fx.filter(f=>now-f.born<f.life);
  fx.forEach(f=>{ const p=(now-f.born)/f.life; c.globalAlpha=1-p; c.fillStyle='#4ade80'; c.font='bold 13px monospace'; c.fillText(f.t,f.x,f.y-p*16); c.globalAlpha=1; });
}
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); drop(); });
window.addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); drop(); } });
$('#go').addEventListener('click',start);
start(); upd();
</script>
</body>
</html>
