<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Réaction</title>
<style>
  *{box-sizing:border-box;} html,body{height:100%;}
  body{margin:0;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0%,#2a0a0a 0%,#0d0202 65%);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#f5d5d5;padding:16px;-webkit-tap-highlight-color:transparent;}
  .wrap{width:min(88vw,440px);display:flex;flex-direction:column;gap:12px;}
  .hud{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.16em;color:#a06a6a;}
  .hud b{color:#4ade80;font-size:20px;font-weight:700;letter-spacing:.02em;margin-left:6px;}
  .hud button{background:transparent;border:1px solid #3a1a1a;color:#4ade80;border-radius:10px;padding:6px 10px;cursor:pointer;font-size:14px;}
  .pad{width:100%;aspect-ratio:1/1;border-radius:20px;display:grid;place-items:center;cursor:pointer;user-select:none;
    font-size:22px;font-weight:800;letter-spacing:.05em;transition:background .1s;
    box-shadow:0 0 0 1px #3a1414,0 30px 60px -25px #000;}
  .pad.wait{background:#b91c1c;color:#fee2e2;}
  .pad.go{background:#16a34a;color:#052e16;}
  .pad.idle{background:#160a0a;color:#6a4a4a;}
  .hint{color:#a06a6a;font-size:11px;text-align:center;line-height:1.6;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>DERNIER <b id="last">—</b></span><span>BEST <b id="best">—</b></span><button id="mbtn" onclick="toggleMusic()">🔊</button></div>
  <div class="pad idle" id="pad">Clique pour lancer</div>
  <div class="hint">Attends que le vert apparaisse, puis clique le plus vite possible.<br>Clique trop tôt (rouge) = échec.</div>
</div>
<script>
"use strict";
const NOTE={C4:261.63,D4:293.66,E4:329.63,G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25,G5:783.99,A5:880,C6:1046.5};
const MELODY=['E5','G5','A5','G5','E5','C5','D5','E5']; const BPM=150;
let actx=null,musTimer=null,musOn=false;
function beep(f,t,d){const o=actx.createOscillator(),g=actx.createGain();o.type='sawtooth';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.04,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d);}
function startMusic(){if(musOn)return;musOn=true;if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();const step=60/BPM;let i=0;musTimer=setInterval(()=>{beep(NOTE[MELODY[i%MELODY.length]],actx.currentTime+.02,step*.7);i++;},step*1000);}
function stopMusic(){musOn=false;clearInterval(musTimer);musTimer=null;}
function toggleMusic(){if(musOn)stopMusic();else startMusic();const b=document.getElementById('mbtn');if(b)b.textContent=musOn?'🔊':'🔇';}
document.addEventListener('pointerdown',function first(){startMusic();document.removeEventListener('pointerdown',first);});
const $=s=>document.querySelector(s);
let state='idle', startTime=0, timer=null;
let best=0; try{ best=parseInt(localStorage.getItem('reaction.best')||'0',10)||0; }catch(e){}
function setState(s,txt){ state=s; $('#pad').className='pad '+s; $('#pad').textContent=txt; }
function start(){
  setState('wait','Attends le vert…');
  timer=setTimeout(()=>{ if(state==='wait'){ state='go'; $('#pad').className='pad go'; $('#pad').textContent='CLIQUE !'; startTime=performance.now(); } }, 800+Math.random()*2500);
}
function fail(msg){ clearTimeout(timer); setState('idle',msg); }
function onGo(){
  const ms=Math.round(performance.now()-startTime);
  $('#last').textContent=ms+' ms';
  if(!best || ms<best){ best=ms; try{ localStorage.setItem('reaction.best',String(best)); }catch(e){} }
  $('#best').textContent=best+' ms';
  setState('idle',ms+' ms — clique pour relancer');
}
$('#pad').onclick=()=>{
  if(state==='idle') start();
  else if(state==='wait') fail('Trop tôt ! Clique pour relancer');
  else if(state==='go') onGo();
};
$('#best').textContent=best?best+' ms':'—';
</script>
</body>
</html>
