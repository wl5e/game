<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Nim</title>
<style>
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0%,#16233a 0%,#070b12 65%);font-family:ui-monospace,Menlo,Consolas,monospace;color:#cbd5e1;padding:16px;-webkit-tap-highlight-color:transparent}
  .wrap{width:min(92vw,460px);display:flex;flex-direction:column;gap:12px}
  .hud{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.15em;color:#64748b}
  .hud b{color:#38bdf8;font-size:20px;margin-left:6px}
  .area{background:#0b1220;border:1px solid #1e293b;border-radius:14px;min-height:230px;display:grid;place-items:center;padding:16px;text-align:center;user-select:none;position:relative;overflow:hidden}
  button{font-family:inherit;border:0;border-radius:10px;padding:11px 15px;font-size:14px;font-weight:700;background:#0ea5e9;color:#04222a;cursor:pointer}
  button:active{transform:translateY(1px)}
  .hint{color:#64748b;font-size:11px;text-align:center;line-height:1.6}
  .big{font-size:26px;font-weight:800}
  .opt{background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:10px;padding:10px 14px;font-size:16px;font-weight:700;margin:4px;cursor:pointer}
  .opt:hover{border-color:#38bdf8}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>VICTOIRES <b id="score">0</b></span><span>BEST <b id="best">—</b></span></div>
  <div class="area" id="area"><div class="big" id="pile">15</div><div style="display:flex;gap:8px;margin-top:12px"><button class="opt" id="b1">1</button><button class="opt" id="b2">2</button><button class="opt" id="b3">3</button></div></div>
  <button id="go">Rejouer</button>
  <div class="hint">Retire 1 à 3 pierres. Celui qui prend la dernière perd. 10 manches.</div>
</div>
<script>
const $=s=>document.querySelector(s);
let best=0;try{best=parseInt(localStorage.getItem('nim.best')||'0',10)||0}catch(e){}
function saveHigh(v){ if(v>best){best=v;try{localStorage.setItem('nim.best',String(v))}catch(e){}} upd(); }
function saveLow(v){ if(best===0||v<best){best=v;try{localStorage.setItem('nim.best',String(v))}catch(e){}} upd(); }
function upd(){ $('#best').textContent=best?best:'—'; }
let n=0, wins=0, rounds=10, turn=0;
function render(){ $('#pile').textContent=n; }
function take(k){ if(turn!==0||n<=0) return; n-=k; if(n===0){ wins++; $('#score').textContent=wins; nextRound(); return; } turn=1; setTimeout(ai,400); }
function ai(){ const k=((n-1)%4===0)?1:((n-1)%4); n-=k; if(n===0){ nextRound(); return; } turn=0; render(); }
function nextRound(){ rounds--; if(rounds<=0){ saveHigh(wins); $('#area').innerHTML='<div class="big">'+wins+' victoires</div>'; } else { n=12+Math.floor(Math.random()*8); turn=0; render(); } }
$('#b1').onclick=()=>take(1); $('#b2').onclick=()=>take(2); $('#b3').onclick=()=>take(3);
$('#go').onclick=()=>{ n=15; wins=0; rounds=10; turn=0; $('#score').textContent='0'; $('#area').innerHTML='<div class="big" id="pile">15</div><div style="display:flex;gap:8px;margin-top:12px"><button class="opt" id="b1">1</button><button class="opt" id="b2">2</button><button class="opt" id="b3">3</button></div>'; $('#b1').onclick=()=>take(1); $('#b2').onclick=()=>take(2); $('#b3').onclick=()=>take(3); render(); };
upd();
</script>
</body>
</html>
