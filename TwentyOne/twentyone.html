<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Twenty One</title>
<style>
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0%,#16233a 0%,#070b12 65%);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#cbd5e1;padding:16px;-webkit-tap-highlight-color:transparent}
  .wrap{width:min(92vw,460px);display:flex;flex-direction:column;gap:12px}
  .hud{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.15em;color:#64748b}
  .hud b{color:#38bdf8;font-size:20px;margin-left:6px}
  .area{background:#0b1220;border:1px solid #1e293b;border-radius:14px;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center;user-select:none;position:relative;overflow:hidden}
  button{font-family:inherit;border:0;border-radius:10px;padding:11px 15px;font-size:14px;font-weight:700;background:#0ea5e9;color:#04222a;cursor:pointer}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.4;cursor:default}
  .hint{color:#64748b;font-size:11px;text-align:center;line-height:1.6}
  .opt{background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:10px;padding:11px 18px;font-size:16px;font-weight:700;margin:4px;cursor:pointer}
  .opt:hover{border-color:#38bdf8}
  .opt:disabled{opacity:.4;cursor:default}
  .row{display:flex;gap:10px}
  .msg{font-size:13px;color:#94a3b8;min-height:18px;line-height:1.5}
  .dice{display:flex;gap:12px}
  .die{width:72px;height:72px;border-radius:14px;background:linear-gradient(145deg,#1e293b,#0f172a);border:1px solid #334155;display:grid;place-items:center;font-size:46px;line-height:1;box-shadow:0 10px 22px -12px #000}
  .die.roll{animation:tumble .1s linear infinite}
  @keyframes tumble{0%{transform:rotate(0)}50%{transform:rotate(12deg) scale(1.06)}100%{transform:rotate(0)}}
  .sum{font-size:34px;font-weight:800}
  .meta{font-size:12px;color:#64748b;letter-spacing:.1em}
  .meta b{color:#38bdf8}
  .area.good{animation:goodflash .45s}
  .area.bad{animation:badflash .5s}
  @keyframes goodflash{0%{box-shadow:inset 0 0 0 4px #22c55e;background:#06281c}100%{box-shadow:inset 0 0 0 0 #22c55e}}
  @keyframes badflash{0%{box-shadow:inset 0 0 0 4px #ef4444;background:#2a0a0e}100%{box-shadow:inset 0 0 0 0 #ef4444}}
  .shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
</style>
<script src="../audio.js"></script>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>TOTAL <b id="score">0</b></span><span>BEST <b id="best">—</b></span></div>
  <div class="area" id="area">
    <div class="dice"><div class="die" id="d0">⚀</div><div class="die" id="d1">⚁</div></div>
    <div class="sum" id="sum">0</div>
    <div class="meta">TOURS RESTANTS <b id="left">10</b></div>
    <div class="msg" id="msg">Lance pour approcher 21, ou STOP pour encaisser.</div>
    <div class="row"><button class="opt" id="roll">LANCER</button><button class="opt" id="stop">STOP</button></div>
  </div>
  <button id="go">Rejouer</button>
  <div class="hint">Lance deux dés pour approcher 21 sans dépasser.<br>Dépasse 21 = tu perds le tour. 10 tours. Objectif : total 80+.</div>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
let best=0;try{best=parseInt(localStorage.getItem('twentyone.best')||'0',10)||0}catch(e){}
function saveHigh(v){ if(v>best){best=v;try{localStorage.setItem('twentyone.best',String(v))}catch(e){}} upd(); }
function upd(){ $('#best').textContent=best?best:'—'; }
const FACE=['⚀','⚁','⚂','⚃','⚄','⚅'];
const area=$('#area'), msg=$('#msg'), sumEl=$('#sum');
const die0=$('#d0'), die1=$('#d1');
const btnRoll=$('#roll'), btnStop=$('#stop');
let sum=0, total=0, turns=10, busy=false, over=false;
function flash(kind){ area.classList.remove('good','bad'); void area.offsetWidth; area.classList.add(kind); }
function paint(){
  $('#score').textContent=total;
  $('#left').textContent=turns;
  sumEl.textContent=sum;
  btnRoll.disabled = busy||over||turns<=0;
  btnStop.disabled = busy||over||turns<=0||sum===0;
}
function roll(){
  if(busy||over||turns<=0) return;
  busy=true; paint();
  die0.classList.add('roll'); die1.classList.add('roll');
  Arcade.sfx('tick');
  let n=0;
  const iv=setInterval(()=>{
    die0.textContent=FACE[Math.floor(Math.random()*6)];
    die1.textContent=FACE[Math.floor(Math.random()*6)];
    if(++n>=9){ clearInterval(iv); settle(); }
  },70);
}
function settle(){
  const d1=1+Math.floor(Math.random()*6), d2=1+Math.floor(Math.random()*6);
  die0.classList.remove('roll'); die1.classList.remove('roll');
  die0.textContent=FACE[d1-1]; die1.textContent=FACE[d2-1];
  sum+=d1+d2;
  Arcade.sfx('hit');
  if(sum===21){
    msg.textContent='21 ! Parfait.';
    flash('good'); Arcade.sfx('win');
    busy=false; paint();
  }else if(sum>21){
    msg.innerHTML='Dépassé ('+sum+') — le tour est perdu.';
    flash('bad'); Arcade.sfx('lose');
    turns--;
    sum=0;
    paint();
    if(turns<=0){ endGame(); return; }
    setTimeout(()=>{ busy=false; msg.textContent='Nouveau tour — lance ou stoppe.'; paint(); },800);
  }else{
    msg.textContent='Encore ? Lance ou encaisse avec STOP.';
    busy=false; paint();
  }
}
function stop(){
  if(busy||over||turns<=0||sum===0) return;
  const banked=sum;
  total+=sum;
  flash('good'); Arcade.sfx('coin');
  sum=0; turns--;
  if(turns<=0){ endGame(); return; }
  paint();
  msg.innerHTML='+'+banked+' encaissé. Nouveau tour.';
}
function endGame(){
  over=true;
  const rec=total>best;
  saveHigh(total);
  msg.innerHTML='Partie terminée — Total <b>'+total+'</b>'+(rec?' — RECORD !':'');
  paint();
  (rec?Arcade.sfx('win'):Arcade.sfx('lose'));
}
function reset(){
  sum=0; total=0; turns=10; busy=false; over=false;
  die0.textContent='⚀'; die1.textContent='⚁';
  die0.classList.remove('roll'); die1.classList.remove('roll');
  area.classList.remove('good','bad');
  msg.textContent='Lance pour approcher 21, ou STOP pour encaisser.';
  paint();
}
btnRoll.onclick=roll;
btnStop.onclick=stop;
$('#go').onclick=reset;
upd();
reset();
</script>
</body>
</html>
