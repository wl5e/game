<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Code Breaker</title>
<style>
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0%,#16233a 0%,#070b12 65%);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#cbd5e1;padding:16px;-webkit-tap-highlight-color:transparent}
  .wrap{width:min(92vw,460px);display:flex;flex-direction:column;gap:12px}
  .hud{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.15em;color:#64748b}
  .hud b{color:#38bdf8;font-size:20px;margin-left:6px}
  .area{background:#0b1220;border:1px solid #1e293b;border-radius:16px;min-height:300px;display:grid;place-items:center;padding:16px;text-align:center;user-select:none;position:relative;overflow:hidden}
  button{font-family:inherit;border:0;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:700;background:#0ea5e9;color:#04222a;cursor:pointer}
  button.big{width:100%}
  button:active{transform:translateY(1px)}
  .hint{color:#64748b;font-size:11px;text-align:center;line-height:1.6}
  #g{display:flex;flex-direction:column;gap:10px;align-items:center;width:100%;max-width:320px}
  .hrow{display:flex;align-items:center;gap:10px}
  .pegs{display:flex;gap:6px}
  .peg{width:40px;height:40px;border-radius:10px;background:#1e293b;border:1px solid #334155;font-size:19px;display:grid;place-items:center}
  button.peg.slot{cursor:pointer;color:#64748b;background:#111c2c}
  button.peg.slot.filled{color:#e2e8f0;background:#0e7490;border-color:#22d3ee}
  .dots{display:flex;gap:5px;width:56px;flex-wrap:wrap}
  .dot{width:14px;height:14px;border-radius:50%}
  .dot.black{background:#e2e8f0;box-shadow:0 0 6px #e2e8f088}
  .dot.white{background:transparent;border:2px solid #94a3b8}
  .pal{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .col{width:46px;height:46px;border-radius:12px;background:#1e293b;border:1px solid #334155;font-size:23px;cursor:pointer;display:grid;place-items:center}
  .col:active{background:#0e7490}
  .actions{display:flex;gap:8px}
  button.act{background:#1e293b;border:1px solid #334155;color:#e2e8f0;font-size:13px;padding:10px 14px;border-radius:12px}
  button.act.ok{background:#0ea5e9;color:#04222a;border:0}
  button.act:disabled{opacity:.4;cursor:default}
  .overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(7,11,18,.9);z-index:5;text-align:center}
  .overlay .t{font-size:26px;font-weight:800;color:#4ade80}
  .overlay .t.lose{color:#f87171}
  .overlay .s{color:#94a3b8;margin-top:10px;font-size:13px;line-height:1.8}
  .overlay .code{font-size:26px;letter-spacing:.2em;margin-top:6px}
</style>
<script src="../audio.js"></script>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>ESSAIS <b id="score">0</b></span><span>BEST <b id="best">—</b></span></div>
  <div class="area" id="area"><div id="g"></div></div>
  <button class="big" id="go">Rejouer</button>
  <div class="hint">Devine le code de 4 couleurs (sans répétition). ⚫ = bonne couleur bien placée, ◯ = bonne couleur mal placée. 10 essais. · Par 8</div>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
let best=0;try{best=parseInt(localStorage.getItem('codebreaker.best')||'0',10)||0}catch(e){}
function upd(){ $('#best').textContent=best?best:'—'; }
function saveLow(v){ if(best===0||v<best){ best=v; try{localStorage.setItem('codebreaker.best',String(v))}catch(e){} upd(); } }

const COLS=['🔴','🟢','🔵','🟡','🟣','🟠'];
const MAX=10;
let code=[], tries=0, guess=[], history=[], won=false, over=false;

function render(){
  const g=$('#g'); g.innerHTML='';
  history.forEach(h=>{
    const row=document.createElement('div'); row.className='hrow';
    const pegs=document.createElement('div'); pegs.className='pegs';
    h.guess.forEach(c=>{ const s=document.createElement('span'); s.className='peg'; s.textContent=c; pegs.appendChild(s); });
    row.appendChild(pegs);
    const dots=document.createElement('div'); dots.className='dots';
    for(let i=0;i<h.black;i++){ const d=document.createElement('span'); d.className='dot black'; dots.appendChild(d); }
    for(let i=0;i<h.white;i++){ const d=document.createElement('span'); d.className='dot white'; dots.appendChild(d); }
    row.appendChild(dots);
    g.appendChild(row);
  });

  const crow=document.createElement('div'); crow.className='hrow';
  const cpegs=document.createElement('div'); cpegs.className='pegs';
  for(let i=0;i<4;i++){
    const s=document.createElement('button'); s.className='peg slot'+(i<guess.length?' filled':'');
    s.textContent=i<guess.length?guess[i]:'·';
    if(i<guess.length) s.onclick=()=>{ guess.splice(i,1); Arcade.sfx('click'); render(); };
    cpegs.appendChild(s);
  }
  crow.appendChild(cpegs);
  const cdots=document.createElement('div'); cdots.className='dots';
  crow.appendChild(cdots);
  g.appendChild(crow);

  const pal=document.createElement('div'); pal.className='pal';
  COLS.forEach(c=>{
    const b=document.createElement('button'); b.className='col'; b.textContent=c;
    b.onclick=()=>{ if(!won && !over && guess.length<4){ guess.push(c); Arcade.sfx('click'); render(); } };
    pal.appendChild(b);
  });
  g.appendChild(pal);

  const actions=document.createElement('div'); actions.className='actions';
  const clr=document.createElement('button'); clr.className='act'; clr.textContent='Effacer';
  clr.onclick=()=>{ if(guess.length){ guess=[]; Arcade.sfx('click'); render(); } };
  const ok=document.createElement('button'); ok.className='act ok'; ok.textContent='Valider';
  ok.disabled = guess.length<4 || won || over;
  ok.onclick=check;
  actions.appendChild(clr); actions.appendChild(ok);
  g.appendChild(actions);
}

function check(){
  if(guess.length<4 || won || over) return;
  let black=0, white=0;
  const cc=code.slice(), gg=guess.slice();
  gg.forEach((c,i)=>{ if(c===cc[i]){ black++; cc[i]=gg[i]=null; } });
  gg.forEach(c=>{ if(c){ const j=cc.indexOf(c); if(j>=0){ white++; cc[j]=null; } } });
  history.push({guess:guess.slice(), black, white});
  tries++; $('#score').textContent=tries;
  guess=[];
  if(black===4){ won=true; Arcade.sfx('win'); saveLow(tries); showOver('Gagné !', tries+' essai(s)', false); }
  else if(tries>=MAX){ over=true; Arcade.sfx('lose'); showOver('Perdu !', 'Le code était', true); }
  else { Arcade.sfx('tick'); render(); }
}

function showOver(t,s,lose){
  const ov=document.createElement('div'); ov.className='overlay';
  ov.innerHTML='<div><div class="t'+(lose?' lose':'')+'">'+t+'</div><div class="s">'+s+'</div><div class="code">'+code.join('')+'</div><div class="s">'+(lose?'Meilleur : '+(best?best+' essai(s)':'—'):(tries<=best?'nouveau record !':'record '+best+' essai(s)'))+'</div></div>';
  $('#area').appendChild(ov);
}

function reset(){
  const sh=[...COLS].sort(()=>Math.random()-0.5);
  code=sh.slice(0,4);
  tries=0; guess=[]; history=[]; won=false; over=false;
  $('#score').textContent='0';
  const ov=$('.overlay'); if(ov) ov.remove();
  upd();
  render();
}
$('#go').onclick=reset;
upd();
reset();
</script>
</body>
</html>
