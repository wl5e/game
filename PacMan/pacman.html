<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Pac-Man</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    background: radial-gradient(120% 80% at 50% 0%, #4a4200 0%, #0e0c00 65%);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #cbd5e1;
    padding: 16px;
    -webkit-tap-highlight-color: transparent;
  }

  .wrap {
    width: min(88vw, 480px);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .hud {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 12px;
    letter-spacing: .16em;
    color: #64748b;
  }
  .hud b {
    color: #4ade80;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .02em;
    margin-left: 6px;
    text-shadow: 0 0 14px rgba(74, 222, 128, .45);
  }

  .board {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 16px;
    overflow: hidden;
    background: #0b1220;
    box-shadow:
      0 0 0 1px #1e293b,
      0 0 0 6px rgba(15, 23, 42, .55),
      0 30px 60px -25px #000;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  .pause-btn {
    position: fixed;
    top: 12px;
    right: 12px;
    width: 36px;
    height: 36px;
    display: none;
    align-items: center;
    justify-content: center;
    border: 1px solid #1e293b;
    border-radius: 10px;
    background: rgba(15, 23, 42, .72);
    color: #cbd5e1;
    font-size: 12px;
    letter-spacing: 0;
    cursor: pointer;
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    z-index: 90;
  }
  .pause-btn.show { display: flex; }
  .pause-btn:hover { background: rgba(30, 41, 59, .8); }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 24px;
    background: rgba(5, 9, 16, .82);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  .overlay h1 {
    margin: 0;
    font-size: clamp(26px, 8vw, 40px);
    letter-spacing: .22em;
    color: #e2e8f0;
    text-shadow: 0 0 26px rgba(74, 222, 128, .35);
  }
  .overlay p {
    margin: 0;
    font-size: 13px;
    line-height: 1.7;
    color: #94a3b8;
    letter-spacing: .06em;
    max-width: 30ch;
  }

  button {
    margin-top: 4px;
    padding: 12px 30px;
    font: inherit;
    font-size: 14px;
    letter-spacing: .18em;
    color: #04210f;
    background: linear-gradient(180deg, #86efac, #4ade80);
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 24px -8px rgba(74, 222, 128, .8);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 12px 28px -8px rgba(74, 222, 128, .9); }
  button:active { transform: translateY(1px) scale(.98); }

  .hint {
    margin: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: .14em;
    color: #475569;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="hud">
    <div>SCORE<b id="score">0</b></div>
    <div>BEST<b id="best">0</b></div>
  </div>

  <div class="board">
    <canvas id="game"></canvas>
    <button class="pause-btn" id="pauseBtn" aria-label="Pause">❚❚</button>
    <div class="overlay show" id="overlay">
      <h1 id="ovTitle">PAC-MAN</h1>
      <p id="ovText">Arrow keys or WASD to move. Eat every dot and dodge the ghosts — power pellets let you eat them back.</p>
      <button id="ovBtn">PLAY</button>
      <button id="ovBtn2" style="display:none">RESTART</button>
    </div>
  </div>

  <p class="hint">ARROWS / WASD &nbsp;·&nbsp; SPACE PAUSE &nbsp;·&nbsp; R RESTART</p>
</div>

<script>
(() => {
  "use strict";

  /* ---------- Setup ---------- */
  const COLS = 15;
  const ROWS = 15;
  const CELL = 30;
  const W = COLS * CELL;
  const H = ROWS * CELL;

  const MAP = [
    "###############",
    "#.............#",
    "#.##.##.##.##.#",
    "#.##.##.##.##.#",
    "#.............#",
    "#.............#",
    "#.##.##.##.##.#",
    "#.##.##.##.##.#",
    "#.............#",
    "#.............#",
    "#.##.##.##.##.#",
    "#.##.##.##.##.#",
    "#.............#",
    "#.............#",
    "###############"
  ];

  const canvas  = document.getElementById('game');
  const ctx     = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText  = document.getElementById('ovText');
  const ovBtn   = document.getElementById('ovBtn');
  const ovBtn2  = document.getElementById('ovBtn2');
  const pauseBtn = document.getElementById('pauseBtn');
  const scoreEl = document.getElementById('score');
  const bestEl  = document.getElementById('best');

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);

  /* ---------- Constants ---------- */
  const DIRS = [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }];
  const PLAYER_SPEED = 7.8;
  const FRIGHT_MS = 6500;
  const FRIGHT_SPEED = 3.4;
  const START = { x: 7, y: 13 };
  const GHOST_DEFS = [
    { spawn: { x: 7, y: 8 }, color: '#f87171', smart: 0.95, mul: 1.0 },
    { spawn: { x: 8, y: 7 }, color: '#f472b6', smart: 0.80, mul: 0.93 },
    { spawn: { x: 8, y: 9 }, color: '#22d3ee', smart: 0.65, mul: 0.86 }
  ];

  /* ---------- State ---------- */
  let dots, player, ghosts;
  let score, lives, level, ghostCombo, freezeUntil, frightUntil;
  let last = 0;
  let state = 'idle'; // 'idle' | 'playing' | 'paused' | 'over'

  let best = 0;
  try { best = parseInt(localStorage.getItem('pacman.best') || '0', 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  /* ---------- Helpers ---------- */
  function updateHud() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
  }

  function showOverlay(title, text, btnLabel, btn2Label) {
    ovTitle.textContent = title;
    ovText.textContent = text;
    ovBtn.textContent = btnLabel;
    if (btn2Label) { ovBtn2.textContent = btn2Label; ovBtn2.style.display = ''; }
    else { ovBtn2.style.display = 'none'; }
    overlay.classList.add('show');
  }

  function hideOverlay() {
    overlay.classList.remove('show');
  }

  function updatePauseBtn() { pauseBtn.classList.toggle('show', state === 'playing'); }

  function ghostSpeed(level) { return Math.min(7.4, 6.3 + (level - 1) * 0.25); }

  function cellAt(x, y) {
    if (y < 0 || y >= ROWS) return '#';
    if (x < 0 || x >= COLS) return (y === 1 || y === ROWS - 2) ? '.' : '#';
    return MAP[y][x];
  }

  function canMove(cx, cy, d) {
    if (!d.x && !d.y) return false;
    return cellAt(cx + d.x, cy + d.y) !== '#';
  }

  function wrapEntity(e) {
    if (e.gx < -0.5) e.gx += COLS;
    else if (e.gx > COLS - 0.5) e.gx -= COLS;
  }

  function isPowerCorner(x, y) {
    return (x === 1 && y === 1) || (x === COLS - 2 && y === 1) ||
           (x === 1 && y === ROWS - 2) || (x === COLS - 2 && y === ROWS - 2);
  }

  function isGhostSpawn(x, y) {
    return GHOST_DEFS.some(g => g.spawn.x === x && g.spawn.y === y);
  }

  function buildDots() {
    dots = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (MAP[y][x] === '#') continue;
        if (isPowerCorner(x, y)) { dots.push({ x, y, power: true }); continue; }
        if ((x === START.x && y === START.y) || isGhostSpawn(x, y)) continue;
        dots.push({ x, y, power: false });
      }
    }
  }

  function resetPositions() {
    player = { gx: START.x, gy: START.y, dir: { x: 0, y: 0 }, desired: { x: 0, y: 0 }, angle: 0 };
    ghosts = GHOST_DEFS.map(def => ({
      gx: def.spawn.x, gy: def.spawn.y,
      dir: { x: 0, y: -1 }, desired: { x: 0, y: -1 },
      color: def.color, smart: def.smart, mul: def.mul,
      spawn: def.spawn, fright: false, freeze: 0
    }));
  }

  /* ---------- Flow ---------- */
  function reset() {
    score = 0;
    lives = 3;
    level = 1;
    ghostCombo = 0;
    frightUntil = 0;
    freezeUntil = performance.now() + 1200;
    buildDots();
    resetPositions();
    updateHud();
  }

  function start() {
    reset();
    state = 'playing';
    hideOverlay();
    updatePauseBtn();
    last = performance.now();
  }

  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      showOverlay('PAUSED', 'The maze waits. Press space or hit resume.', 'RESUME', 'RESTART');
    } else if (state === 'paused') {
      state = 'playing';
      hideOverlay();
      last = performance.now();
    }
    updatePauseBtn();
  }

  function gameOver() {
    state = 'over';
    updatePauseBtn();
    if (score > best) {
      best = score;
      try { localStorage.setItem('pacman.best', String(best)); } catch (e) {}
      updateHud();
    }
    showOverlay(
      'GAME OVER',
      `You scored ${score} points and reached level ${level}. Best: ${best}.`,
      'PLAY AGAIN'
    );
  }

  function nextLevel() {
    level++;
    ghostCombo = 0;
    buildDots();
    resetPositions();
    freezeUntil = performance.now() + 1400;
    updateHud();
  }

  function loseLife() {
    lives--;
    if (lives <= 0) { gameOver(); return; }
    resetPositions();
    freezeUntil = performance.now() + 1100;
  }

  /* ---------- Update ---------- */
  function advance(e, step) {
    const dx = e.dir.x, dy = e.dir.y;
    if (!dx && !dy) return false;
    const axis = dx ? 'gx' : 'gy';
    const sign = dx || dy;
    const start = e[axis];
    const next = sign > 0 ? Math.floor(start) + 1 : Math.ceil(start) - 1;
    const end = start + sign * step;
    if (sign > 0 ? end >= next : end <= next) {
      e[axis] = next;
      return true;
    }
    e[axis] = end;
    return false;
  }

  function updatePlayer(s) {
    const p = player;
    if (!p.dir.x && !p.dir.y) {
      const cx = Math.round(p.gx), cy = Math.round(p.gy);
      p.gx = cx; p.gy = cy;
      if (canMove(cx, cy, p.desired)) p.dir = p.desired;
    }
    if (p.dir.x || p.dir.y) {
      const arrived = advance(p, PLAYER_SPEED * s);
      if (arrived) {
        const cx = Math.round(p.gx), cy = Math.round(p.gy);
        if (canMove(cx, cy, p.desired)) p.dir = p.desired;
        else if (!canMove(cx, cy, p.dir)) p.dir = { x: 0, y: 0 };
      }
    }
    wrapEntity(p);
    if (p.dir.x || p.dir.y) p.angle = Math.atan2(p.dir.y, p.dir.x);
    eatDots();
  }

  function eatDots() {
    const px = player.gx, py = player.gy;
    if (px !== Math.round(px) || py !== Math.round(py)) return;
    const idx = dots.findIndex(d => d.x === px && d.y === py);
    if (idx === -1) return;
    const d = dots[idx];
    dots.splice(idx, 1);
    if (d.power) {
      score += 50;
      ghostCombo = 0;
      frightUntil = performance.now() + FRIGHT_MS;
      for (const g of ghosts) {
        if (!g.fright) {
          g.fright = true;
          g.dir = { x: -g.dir.x, y: -g.dir.y };
          g.desired = { x: g.dir.x, y: g.dir.y };
        }
      }
    } else {
      score += 10;
    }
    updateHud();
    if (dots.length === 0) nextLevel();
  }

  function ghostDecide(g) {
    const cx = Math.round(g.gx), cy = Math.round(g.gy);
    const options = [];
    for (const d of DIRS) {
      if (d.x === -g.dir.x && d.y === -g.dir.y) continue;
      if (canMove(cx, cy, d)) options.push(d);
    }
    if (!options.length) { g.dir = { x: -g.dir.x, y: -g.dir.y }; return; }
    let chosen;
    if (g.fright) {
      chosen = options[(Math.random() * options.length) | 0];
    } else if (Math.random() < g.smart) {
      let bd = Infinity;
      for (const d of options) {
        const dx = cx + d.x - player.gx, dy = cy + d.y - player.gy;
        const dist = dx * dx + dy * dy;
        if (dist < bd) { bd = dist; chosen = d; }
      }
    } else {
      chosen = options[(Math.random() * options.length) | 0];
    }
    g.dir = chosen;
    g.desired = chosen;
  }

  function updateGhosts(s) {
    const now = performance.now();
    for (const g of ghosts) {
      if (g.fright && now >= frightUntil) g.fright = false;
      if (now < g.freeze) continue;
      const spd = g.fright ? FRIGHT_SPEED : ghostSpeed(level) * g.mul;
      const arrived = advance(g, spd * s);
      if (arrived) ghostDecide(g);
      wrapEntity(g);
    }
  }

  function checkCollisions() {
    const now = performance.now();
    for (const g of ghosts) {
      const dx = g.gx - player.gx, dy = g.gy - player.gy;
      if (dx * dx + dy * dy < 0.55 * 0.55) {
        if (g.fright) {
          ghostCombo++;
          score += [200, 400, 800, 1600][Math.min(ghostCombo - 1, 3)];
          updateHud();
          g.fright = false;
          g.gx = g.spawn.x; g.gy = g.spawn.y;
          g.dir = { x: 0, y: -1 };
          g.desired = { x: 0, y: -1 };
          g.freeze = now + 600;
        } else {
          loseLife();
          return;
        }
      }
    }
  }

  function update(s) {
    updatePlayer(s);
    updateGhosts(s);
    checkCollisions();
  }

  /* ---------- Rendering ---------- */
  function drawGhost(g) {
    const px = (g.gx + 0.5) * CELL, py = (g.gy + 0.5) * CELL;
    const r = CELL * 0.42;
    const blinking = g.fright && frightUntil - performance.now() < 1800;
    const body = g.fright
      ? (blinking && ((performance.now() / 140) | 0) % 2 === 0 ? '#dbeafe' : '#3b82f6')
      : g.color;

    ctx.save();
    ctx.translate(px, py);

    ctx.fillStyle = body;
    ctx.shadowColor = g.fright ? 'rgba(59, 130, 246, .6)' : 'rgba(0, 0, 0, .4)';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(-r, -r);
    ctx.arc(0, -r, r, Math.PI, 0);
    ctx.lineTo(r, r * 0.9);
    const feet = 3;
    const fw = (2 * r) / feet;
    for (let i = 0; i < feet; i++) {
      const xr = r - i * fw;
      const xl = r - (i + 1) * fw;
      ctx.lineTo(xr, r * 0.9);
      ctx.lineTo((xr + xl) / 2, r * 0.9 + r * 0.25);
      ctx.lineTo(xl, r * 0.9);
    }
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;

    if (g.fright) {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(-r * 0.32, -r * 0.18, r * 0.2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc( r * 0.32, -r * 0.18, r * 0.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1e3a8a';
      ctx.beginPath(); ctx.arc(-r * 0.32, -r * 0.18, r * 0.1, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc( r * 0.32, -r * 0.18, r * 0.1, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#dbeafe';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(-r * 0.45, r * 0.35);
      for (let i = 0; i <= 4; i++) {
        const mx = -r * 0.45 + (i * r * 0.9) / 4;
        const my = r * 0.35 - (i % 2 === 0 ? 0 : r * 0.15);
        ctx.lineTo(mx, my);
      }
      ctx.stroke();
    } else {
      const ex = g.dir.x, ey = g.dir.y;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(-r * 0.3 + ex * r * 0.12, -r * 0.2 + ey * r * 0.12, r * 0.22, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc( r * 0.3 + ex * r * 0.12, -r * 0.2 + ey * r * 0.12, r * 0.22, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1e293b';
      ctx.beginPath(); ctx.arc(-r * 0.3 + ex * r * 0.18, -r * 0.2 + ey * r * 0.18, r * 0.11, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc( r * 0.3 + ex * r * 0.18, -r * 0.2 + ey * r * 0.18, r * 0.11, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function drawPlayer(t) {
    const px = (player.gx + 0.5) * CELL, py = (player.gy + 0.5) * CELL;
    const r = CELL * 0.42;
    const mouth = (player.dir.x || player.dir.y) ? (0.12 + 0.30 * Math.abs(Math.sin(t / 120))) : 0.15;
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(player.angle);
    ctx.fillStyle = '#ffd34d';
    ctx.shadowColor = 'rgba(255, 211, 77, .6)';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, r, mouth, Math.PI * 2 - mouth);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawLives() {
    for (let i = 0; i < lives; i++) {
      const px = 24 + i * 26, py = 22;
      ctx.save();
      ctx.translate(px, py);
      ctx.fillStyle = '#ffd34d';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, 9, Math.PI * 0.2, Math.PI * 1.8);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  function draw(t) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#0b1220';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(255, 255, 255, 0.022)';
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if ((x + y) % 2 === 0) ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
      }
    }

    ctx.fillStyle = '#1e293b';
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (MAP[y][x] === '#') ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
      }
    }

    ctx.strokeStyle = 'rgba(148, 163, 184, .10)';
    ctx.lineWidth = 1;
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (MAP[y][x] === '#') ctx.strokeRect(x * CELL + 0.5, y * CELL + 0.5, CELL - 1, CELL - 1);
      }
    }

    for (const d of dots) {
      const cx = (d.x + 0.5) * CELL, cy = (d.y + 0.5) * CELL;
      if (d.power) {
        const pulse = 1 + 0.15 * Math.sin(t / 160);
        ctx.save();
        ctx.fillStyle = '#4ade80';
        ctx.shadowColor = 'rgba(74, 222, 128, .9)';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(cx, cy, CELL * 0.18 * pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      } else {
        ctx.fillStyle = '#cbd5e1';
        ctx.beginPath();
        ctx.arc(cx, cy, CELL * 0.10, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (const g of ghosts) drawGhost(g);
    drawPlayer(t);
    drawLives();

    if (state === 'playing' && performance.now() < freezeUntil) {
      ctx.fillStyle = 'rgba(226, 232, 240, .9)';
      ctx.font = '700 22px ui-monospace, Menlo, Consolas, monospace';
      ctx.textAlign = 'center';
      ctx.fillText('READY!', W / 2, H * 0.44);
    }
  }

  /* ---------- Main loop ---------- */
  function loop(t) {
    requestAnimationFrame(loop);
    if (!last) last = t;
    const dt = Math.min(t - last, 100);
    last = t;
    if (state === 'playing' && performance.now() >= freezeUntil) {
      update(Math.min(dt / 1000, 0.033));
    }
    draw(t);
  }

  /* ---------- Input ---------- */
  const KEYS = {
    ArrowUp:    { x: 0,  y: -1 },
    ArrowDown:  { x: 0,  y: 1  },
    ArrowLeft:  { x: -1, y: 0  },
    ArrowRight: { x: 1,  y: 0  },
    w: { x: 0, y: -1 }, W: { x: 0, y: -1 },
    s: { x: 0, y: 1  }, S: { x: 0, y: 1  },
    a: { x: -1, y: 0 }, A: { x: -1, y: 0 },
    d: { x: 1, y: 0  }, D: { x: 1, y: 0  }
  };

  window.addEventListener('keydown', (e) => {
    const k = e.key;
    if (k === ' ' || k === 'Spacebar' || k.startsWith('Arrow')) e.preventDefault();

    if (k === 'r' || k === 'R') { start(); return; }

    if (k === 'p' || k === 'P') {
      if (state === 'playing' || state === 'paused') togglePause();
      return;
    }

    if (k === ' ' || k === 'Spacebar') {
      if (state === 'playing' || state === 'paused') togglePause();
      else start();
      return;
    }

    const d = KEYS[k];
    if (!d) return;
    if (state === 'idle' || state === 'over') start();
    if (state === 'paused') return;
    player.desired = d;
  });

  ovBtn.addEventListener('click', () => {
    ovBtn.blur();
    if (state === 'paused') togglePause();
    else start();
  });

  ovBtn2.addEventListener('click', () => {
    ovBtn2.blur();
    start();
  });

  pauseBtn.addEventListener('click', () => {
    pauseBtn.blur();
    if (state === 'playing') togglePause();
  });

  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });

  canvas.addEventListener('touchmove', (e) => {
    if (state === 'playing') e.preventDefault();
  }, { passive: false });

  canvas.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    touchStart = null;

    if (Math.hypot(dx, dy) < 22) {
      if (state === 'idle' || state === 'over') start();
      return;
    }
    if (state === 'idle' || state === 'over') start();
    if (state !== 'playing') return;

    if (Math.abs(dx) > Math.abs(dy)) player.desired = { x: Math.sign(dx), y: 0 };
    else player.desired = { x: 0, y: Math.sign(dy) };
  }, { passive: true });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'playing') togglePause();
  });

  /* ---------- Boot ---------- */
  reset();
  state = 'idle';
  updatePauseBtn();
  requestAnimationFrame(loop);
})();
</script>

<button class="sound-btn" id="soundBtn" aria-label="Toggle sound">♪</button>
<script>
(function () {
  "use strict";
  var AC = window.AudioContext || window.webkitAudioContext;
  var ctx = null, master = null, musicGain = null, noiseBuf = null;
  var muted = false, musicOn = false, timer = null, step = 0, nextT = 0;

  var LEAD = [587.32,698.45,879.99,698.45,587.32,698.45,879.99,698.45,932.31,879.99,698.45,659.24,587.32,0,587.32,0];
  var BASS = [146.83,220,146.83,0,146.83,220,146.83,0,146.83,220,146.83,0,146.83,220,146.83,0];
  var STEP = 0.11;

  try { muted = localStorage.getItem('arcade.muted') === '1'; } catch (e) {}

  function ensureCtx() {
    if (!ctx) {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = muted ? 0 : 0.6;
      master.connect(ctx.destination);
      musicGain = ctx.createGain();
      musicGain.gain.value = 0.5;
      musicGain.connect(master);
      var n = Math.floor(ctx.sampleRate * 0.04);
      noiseBuf = ctx.createBuffer(1, n, ctx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    }
    if (ctx.state === 'suspended') ctx.resume();
  }

  function note(freq, t, dur, type, vol) {
    if (!freq) return;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(musicGain);
    o.start(t); o.stop(t + dur + 0.05);
  }

  function hat(t) {
    var s = ctx.createBufferSource(); s.buffer = noiseBuf;
    var hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7000;
    var g = ctx.createGain(); g.gain.value = 0.05;
    s.connect(hp); hp.connect(g); g.connect(musicGain);
    s.start(t);
  }

  function schedule(i, t) {
    var k = i % LEAD.length;
    note(LEAD[k], t, STEP * 0.9, 'sawtooth', 0.16);
    note(BASS[k], t, STEP * 0.95, 'sine', 0.2);
    hat(t);
  }

  function tick() {
    while (nextT < ctx.currentTime + 0.12) {
      schedule(step, nextT);
      step++;
      nextT += STEP;
    }
  }

  function startMusic() {
    if (musicOn) return;
    ensureCtx();
    musicOn = true;
    nextT = ctx.currentTime + 0.05;
    step = 0;
    timer = setInterval(tick, 25);
  }

  function stopMusic() {
    if (timer) { clearInterval(timer); timer = null; }
    musicOn = false;
    step = 0;
  }

  function setMuted(m) {
    muted = m;
    try { localStorage.setItem('arcade.muted', m ? '1' : '0'); } catch (e) {}
    if (master) master.gain.setTargetAtTime(m ? 0 : 0.6, ctx.currentTime, 0.02);
    var b = document.getElementById('soundBtn');
    if (b) b.textContent = m ? '🔇' : '♪';
  }

  function sync() {
    var pb = document.getElementById('pauseBtn');
    if (pb && pb.classList.contains('show')) { if (!musicOn) startMusic(); }
    else if (musicOn) stopMusic();
  }

  function wire() {
    var sb = document.getElementById('soundBtn');
    if (sb) sb.addEventListener('click', function () { ensureCtx(); setMuted(!muted); });
    window.addEventListener('pointerdown', ensureCtx);
    window.addEventListener('keydown', ensureCtx);
    var pb = document.getElementById('pauseBtn');
    if (pb) new MutationObserver(sync).observe(pb, { attributes: true, attributeFilter: ['class'] });
    var b = document.getElementById('soundBtn');
    if (b) b.textContent = muted ? '🔇' : '♪';
    sync();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', wire);
  else wire();
})();
</script>

<script>
(function () {
  "use strict";
  var RULES = "Eat all the dots to clear the level while avoiding the ghosts. Getting caught costs one of your 3 lives. Power pellets make the ghosts vulnerable for a few seconds - eat them for bonus points. Move with the arrows or WASD.";
  var btn = document.getElementById('rulesBtn');
  var panel = document.getElementById('rulesPanel');
  var text = document.getElementById('rulesText');
  var close = document.getElementById('rulesClose');
  if (text) text.textContent = RULES;
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' || e.key === 'Esc') {
      e.preventDefault();
      if (panel && panel.classList.contains('show')) { panel.classList.remove('show'); return; }
      try { document.dispatchEvent(new KeyboardEvent('keydown', { key: 'p', bubbles: true, cancelable: true })); } catch (err) {}
    }
  });
  function sync() {
    var pb = document.getElementById('pauseBtn');
    var title = document.getElementById('ovTitle');
    var paused = pb && !pb.classList.contains('show') && title && /PAUSED/i.test(title.textContent || '');
    if (btn) btn.classList.toggle('show', !!paused);
    var ov = document.getElementById('overlay');
    if (ov && !ov.classList.contains('show') && panel) panel.classList.remove('show');
  }
  var pb = document.getElementById('pauseBtn');
  if (pb) new MutationObserver(sync).observe(pb, { attributes: true, attributeFilter: ['class'] });
  var ov = document.getElementById('overlay');
  if (ov) new MutationObserver(sync).observe(ov, { attributes: true, attributeFilter: ['class'] });
  if (btn) btn.addEventListener('click', function () { if (panel) panel.classList.add('show'); });
  if (close) close.addEventListener('click', function () { if (panel) panel.classList.remove('show'); });
  if (panel) panel.addEventListener('click', function (e) { if (e.target === panel) panel.classList.remove('show'); });
  sync();
})();
</script>

<script>
(function () {
  "use strict";
  var el = document.getElementById('score');
  if (!el) return;
  var last = parseInt(el.textContent, 10) || 0;
  var mo = new MutationObserver(function () {
    var cur = parseInt(el.textContent, 10) || 0;
    if (cur > last) {
      el.classList.remove('pulse');
      void el.offsetWidth;
      el.classList.add('pulse');
    }
    last = cur;
  });
  mo.observe(el, { childList: true, characterData: true, subtree: true });
})();
</script>
