<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Nim</title>
<style>
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0%,#16233a 0%,#070b12 65%);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#cbd5e1;padding:16px;-webkit-tap-highlight-color:transparent}
  .wrap{width:min(92vw,460px);display:flex;flex-direction:column;gap:12px}
  .hud{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.15em;color:#64748b}
  .hud b{color:#38bdf8;font-size:20px;margin-left:6px}
  .area{background:#0b1220;border:1px solid #1e293b;border-radius:14px;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;user-select:none;position:relative;overflow:hidden}
  button{font-family:inherit;border:0;border-radius:10px;padding:11px 15px;font-size:14px;font-weight:700;background:#0ea5e9;color:#04222a;cursor:pointer}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.4;cursor:default}
  .hint{color:#64748b;font-size:11px;text-align:center;line-height:1.6}
  .opt{background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:10px;padding:11px 18px;font-size:16px;font-weight:700;margin:4px;cursor:pointer}
  .opt:hover{border-color:#38bdf8}
  .opt:disabled{opacity:.4;cursor:default}
  .row{display:flex;gap:10px}
  .msg{font-size:13px;color:#94a3b8;min-height:18px;line-height:1.5}
  .meta{font-size:12px;color:#64748b;letter-spacing:.1em}
  .meta b{color:#38bdf8}
  .stones{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:280px;min-height:34px}
  .stone{width:18px;height:18px;border-radius:50%;background:linear-gradient(145deg,#94a3b8,#475569);box-shadow:inset -2px -2px 3px rgba(0,0,0,.4),0 2px 3px rgba(0,0,0,.4)}
  .stone.gone{animation:vanish .3s forwards}
  @keyframes vanish{to{transform:scale(0);opacity:0}}
  .area.good{animation:goodflash .5s}
  .area.bad{animation:badflash .5s}
  @keyframes goodflash{0%{box-shadow:inset 0 0 0 4px #22c55e;background:#06281c}100%{box-shadow:inset 0 0 0 0 #22c55e}}
  @keyframes badflash{0%{box-shadow:inset 0 0 0 4px #ef4444;background:#2a0a0e}100%{box-shadow:inset 0 0 0 0 #ef4444}}
  .shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
</style>
<script src="../audio.js"></script>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>VICTOIRES <b id="score">0</b></span><span>BEST <b id="best">—</b></span></div>
  <div class="area" id="area">
    <div class="meta">MANCHE <b id="round">1</b>/10 · PIERRES <b id="count">15</b></div>
    <div class="stones" id="stones"></div>
    <div class="msg" id="msg">Retire 1, 2 ou 3 pierres. Ne prends pas la dernière !</div>
    <div class="row"><button class="opt" id="b1">1</button><button class="opt" id="b2">2</button><button class="opt" id="b3">3</button></div>
  </div>
  <button id="go">Rejouer</button>
  <div class="hint">Retire 1 à 3 pierres, à tour de rôle avec l'IA.<br>Celui qui prend la DERNIÈRE pierre perd la manche. 10 manches.</div>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
let best=0;try{best=parseInt(localStorage.getItem('nim.best')||'0',10)||0}catch(e){}
function saveHigh(v){ if(v>best){best=v;try{localStorage.setItem('nim.best',String(v))}catch(e){}} upd(); }
function upd(){ $('#best').textContent=best?best:'—'; }
const area=$('#area'), msg=$('#msg'), stonesEl=$('#stones');
const btn1=$('#b1'), btn2=$('#b2'), btn3=$('#b3');
let n=0, wins=0, rounds=10, turn='player', over=false;
function flash(kind){ area.classList.remove('good','bad'); void area.offsetWidth; area.classList.add(kind); }
function render(){
  $('#count').textContent=n;
  $('#round').textContent=11-rounds;
  stonesEl.innerHTML='';
  for(let i=0;i<n;i++){ const s=document.createElement('div'); s.className='stone'; stonesEl.appendChild(s); }
  btn1.disabled = !(turn==='player'&&!over&&n>=1);
  btn2.disabled = !(turn==='player'&&!over&&n>=2);
  btn3.disabled = !(turn==='player'&&!over&&n>=3);
}
function take(k){
  if(turn!=='player'||over||k>n||k<1) return;
  n-=k; Arcade.sfx('hit');
  if(n===0){
    resolve(false); // player took the last stone -> loses
    return;
  }
  turn='ai'; render();
  msg.textContent='L\'IA réfléchit…';
  setTimeout(aiMove,650);
}
function aiMove(){
  if(over) return;
  let k=(n-1)%4; if(k===0) k=1;
  n-=k; Arcade.sfx('pop');
  if(n===0){
    resolve(true); // AI took the last stone -> player wins
    return;
  }
  turn='player'; render();
  msg.textContent='À toi — retire 1, 2 ou 3 pierres.';
}
function resolve(playerWon){
  turn='idle'; over=false;
  render();
  if(playerWon){
    wins++; $('#score').textContent=wins;
    msg.innerHTML='L\'IA a pris la dernière pierre — <b>tu gagnes la manche !</b>';
    flash('good'); Arcade.sfx('win');
  }else{
    msg.innerHTML='Tu as pris la dernière pierre — <b>tu perds la manche.</b>';
    area.classList.add('shake'); flash('bad'); Arcade.sfx('lose');
    setTimeout(()=>area.classList.remove('shake'),500);
  }
  rounds--;
  if(rounds<=0){ endGame(); return; }
  setTimeout(newRound,1100);
}
function newRound(){
  n=12+Math.floor(Math.random()*8);
  turn='player';
  msg.textContent='Nouvelle manche — à toi de jouer.';
  render();
  Arcade.sfx('tick');
}
function endGame(){
  over=true; turn='idle';
  const rec=wins>best;
  saveHigh(wins);
  msg.innerHTML='Partie terminée — <b>'+wins+'</b> victoire'+(wins>1?'s':'')+' sur 10'+(rec?' — RECORD !':'');
  render();
  (rec?Arcade.sfx('win'):Arcade.sfx('lose'));
}
function reset(){
  wins=0; rounds=10; over=false;
  $('#score').textContent='0';
  area.classList.remove('good','bad','shake');
  newRound();
}
btn1.onclick=()=>take(1);
btn2.onclick=()=>take(2);
btn3.onclick=()=>take(3);
$('#go').onclick=reset;
upd();
newRound();
</script>
</body>
</html>
