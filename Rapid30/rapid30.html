<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Rapid 30</title>
<style>
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0%,#16233a 0%,#070b12 65%);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#cbd5e1;padding:16px;-webkit-tap-highlight-color:transparent;user-select:none}
  .wrap{width:min(92vw,460px);display:flex;flex-direction:column;gap:12px}
  .hud{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.15em;color:#64748b}
  .hud b{color:#38bdf8;font-size:20px;font-weight:700;margin-left:6px}
  .area{background:#0b1220;border:1px solid #1e293b;border-radius:16px;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;position:relative;overflow:hidden;touch-action:manipulation;transition:background .15s,border-color .15s}
  .area.good{background:#0b2316;border-color:#22c55e}
  .big{font-size:56px;font-weight:800;line-height:1}
  .small{color:#64748b;font-size:13px;line-height:1.6}
  .dots{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;width:100%}
  .dot{width:14px;height:14px;border-radius:4px;background:#1e293b;border:1px solid #334155;transition:background .1s}
  .dot.on{background:#38bdf8;border-color:#38bdf8}
  button{font-family:inherit;border:0;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:700;background:#0ea5e9;color:#04222a;cursor:pointer;letter-spacing:.03em;touch-action:manipulation}
  button:active{transform:translateY(1px) scale(.98)}
  .hint{color:#64748b;font-size:11px;text-align:center;line-height:1.6}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.16)}100%{transform:scale(1)}}
  .pop{animation:pop .14s}
</style>
<script src="../audio.js"></script>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>TEMPS <b id="score">—</b></span><span>BEST <b id="best">—</b></span></div>
  <div class="area" id="area">
    <div class="big" id="big">30</div>
    <div class="small" id="sub">Tape pour commencer.</div>
    <div class="dots" id="dots"></div>
  </div>
  <button id="go">Rejouer</button>
  <div class="hint">Tape <b>30 fois</b> le plus vite possible.<br>Le chrono démarre au premier tap. Objectif : ~5 s. (Espace fonctionne)</div>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const sfx=n=>{ try{ if(window.Arcade) window.Arcade.sfx(n); }catch(e){} };
const KEY='rapid30.best', TOTAL=30, PAR=5000;
let best=0; try{ best=parseInt(localStorage.getItem(KEY)||'0',10)||0; }catch(e){}
function upd(){ $('#best').textContent=best?best+' ms':'—'; }
function save(v){ if(v>0 && v<60000 && (best===0 || v<best)){ best=v; try{ localStorage.setItem('rapid30.best',String(v)); }catch(e){} } upd(); }

const area=$('#area'), big=$('#big'), sub=$('#sub'), dotsEl=$('#dots'), scoreEl=$('#score');
let remaining=TOTAL, phase='idle', startAt=0;

function buildDots(){
  dotsEl.innerHTML='';
  for(let i=0;i<TOTAL;i++){
    const d=document.createElement('div');
    d.className='dot'; dotsEl.appendChild(d);
  }
}
function paintDots(){
  const done=TOTAL-remaining;
  [...dotsEl.children].forEach((d,i)=>d.classList.toggle('on',i<done));
}
function pop(){ big.classList.remove('pop'); void big.offsetWidth; big.classList.add('pop'); }
function reset(){
  phase='idle'; remaining=TOTAL; startAt=0;
  big.textContent=String(TOTAL); scoreEl.textContent='—';
  sub.textContent='Tape pour commencer.';
  area.classList.remove('good');
  buildDots(); paintDots();
}
function finish(){
  phase='end';
  const ms=Math.round(performance.now()-startAt);
  scoreEl.textContent=ms+' ms';
  save(ms);
  big.textContent=ms+' ms';
  sub.textContent=(ms===best && ms>0)?'Nouveau record !':('Best : '+(best?best+' ms':'—'));
  area.classList.add('good'); setTimeout(()=>area.classList.remove('good'),400);
  sfx(ms<=PAR?'win':'pop');
}
function doTap(){
  if(phase==='end') return;
  if(phase==='idle'){ phase='go'; startAt=performance.now(); }
  remaining--;
  big.textContent=remaining>0?String(remaining):'0';
  sub.textContent=remaining>0?'Encore '+remaining+'…':'Dernier !';
  scoreEl.textContent=(TOTAL-remaining)+'/'+TOTAL;
  paintDots(); pop(); sfx('tick');
  if(remaining<=0) finish();
}
area.addEventListener('pointerdown',e=>{ e.preventDefault(); doTap(); });
window.addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); doTap(); } });
$('#go').addEventListener('click',reset);
reset(); upd();
</script>
</body>
</html>
