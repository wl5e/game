<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Rock Paper Scissors</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    background: radial-gradient(120% 80% at 50% 0%, #4a0a0a 0%, #0e0202 65%);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #cbd5e1;
    padding: 16px;
    -webkit-tap-highlight-color: transparent;
  }

  .wrap {
    width: min(88vw, 380px);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .hud {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 12px;
    letter-spacing: .16em;
    color: #64748b;
  }
  .hud b {
    color: #4ade80;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .02em;
    margin-left: 6px;
    text-shadow: 0 0 14px rgba(74, 222, 128, .45);
  }

  .board {
    position: relative;
    width: 100%;
    border-radius: 16px;
    overflow: hidden;
    background: #0b1220;
    box-shadow:
      0 0 0 1px #1e293b,
      0 0 0 6px rgba(15, 23, 42, .55),
      0 30px 60px -25px #000;
  }

  .board.rps {
    min-height: 340px;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 18px;
  }

  .pause-btn {
    position: fixed;
    top: 12px;
    right: 12px;
    width: 36px;
    height: 36px;
    display: none;
    align-items: center;
    justify-content: center;
    border: 1px solid #1e293b;
    border-radius: 10px;
    background: rgba(15, 23, 42, .72);
    color: #cbd5e1;
    font-size: 12px;
    letter-spacing: 0;
    cursor: pointer;
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    z-index: 90;
  }
  .pause-btn.show { display: flex; }
  .pause-btn:hover { background: rgba(30, 41, 59, .8); }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 24px;
    background: rgba(5, 9, 16, .82);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  .overlay h1 {
    margin: 0;
    font-size: clamp(26px, 8vw, 40px);
    letter-spacing: .22em;
    color: #e2e8f0;
    text-shadow: 0 0 26px rgba(74, 222, 128, .35);
  }
  .overlay p {
    margin: 0;
    font-size: 13px;
    line-height: 1.7;
    color: #94a3b8;
    letter-spacing: .06em;
    max-width: 30ch;
  }

  button {
    margin-top: 4px;
    padding: 12px 30px;
    font: inherit;
    font-size: 14px;
    letter-spacing: .18em;
    color: #04210f;
    background: linear-gradient(180deg, #86efac, #4ade80);
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 24px -8px rgba(74, 222, 128, .8);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 12px 28px -8px rgba(74, 222, 128, .9); }
  button:active { transform: translateY(1px) scale(.98); }

  .rps-score {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 12px;
    letter-spacing: .16em;
    color: #64748b;
  }
  .rps-score b {
    color: #e2e8f0;
    font-size: 18px;
    font-weight: 700;
    margin: 0 8px;
  }

  .rps-picks {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .rps-side {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .rps-label {
    font-size: 11px;
    letter-spacing: .18em;
    color: #64748b;
  }
  .rps-pick {
    font-size: 46px;
    line-height: 1;
    min-height: 54px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .rps-pick.dim {
    opacity: .25;
    filter: grayscale(.5);
  }
  .rps-mid {
    font-size: 12px;
    letter-spacing: .14em;
    color: #475569;
  }

  .rps-result {
    text-align: center;
    font-size: 12px;
    letter-spacing: .08em;
    color: #94a3b8;
    min-height: 18px;
  }
  .rps-result.win  { color: #4ade80; }
  .rps-result.lose { color: #ff4d6d; }

  .rps-row {
    display: flex;
    gap: 8px;
  }
  .rps-row button {
    flex: 1;
    margin: 0;
    padding: 14px 4px;
    font-size: 12px;
    letter-spacing: .04em;
  }

  .hint {
    margin: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: .14em;
    color: #475569;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="hud">
    <div>SCORE<b id="score">0</b></div>
    <div>BEST<b id="best">0</b></div>
  </div>

  <div class="board rps">
    <div class="rps-score">
      <span>YOU<b id="youScore">0</b></span>
      <span>CPU<b id="cpuScore">0</b></span>
    </div>

    <div class="rps-picks">
      <div class="rps-side">
        <div class="rps-label">YOU</div>
        <div class="rps-pick dim" id="playerPick">—</div>
      </div>
      <div class="rps-mid">VS</div>
      <div class="rps-side">
        <div class="rps-label">CPU</div>
        <div class="rps-pick dim" id="cpuPick">—</div>
      </div>
    </div>

    <div class="rps-result" id="resultText">First to 5 wins the match.</div>

    <div class="rps-row">
      <button id="btnRock">🪨 Rock</button>
      <button id="btnPaper">📄 Paper</button>
      <button id="btnScissors">✂️ Scissors</button>
    </div>

    <button class="pause-btn" id="pauseBtn" aria-label="Pause">❚❚</button>
    <div class="overlay show" id="overlay">
      <h1 id="ovTitle">ROCK PAPER SCISSORS</h1>
      <p id="ovText">Pick your move. First to 5 round wins takes the match.</p>
      <button id="ovBtn">PLAY</button>
      <button id="ovBtn2" style="display:none">RESTART</button>
    </div>
  </div>

  <p class="hint">TAP A MOVE &nbsp;·&nbsp; KEYS 1/2/3 &nbsp;·&nbsp; SPACE PAUSE &nbsp;·&nbsp; R RESTART</p>
</div>

<script>
(() => {
  "use strict";

  /* ---------- Setup ---------- */
  const CHOICES = [
    { id: 'rock',     emoji: '🪨', beats: 'scissors' },
    { id: 'paper',    emoji: '📄', beats: 'rock' },
    { id: 'scissors', emoji: '✂️', beats: 'paper' }
  ];
  const byId = {};
  CHOICES.forEach(c => { byId[c.id] = c; });

  const overlay   = document.getElementById('overlay');
  const ovTitle   = document.getElementById('ovTitle');
  const ovText    = document.getElementById('ovText');
  const ovBtn     = document.getElementById('ovBtn');
  const ovBtn2    = document.getElementById('ovBtn2');
  const pauseBtn  = document.getElementById('pauseBtn');
  const scoreEl   = document.getElementById('score');
  const bestEl    = document.getElementById('best');
  const youScore  = document.getElementById('youScore');
  const cpuScore  = document.getElementById('cpuScore');
  const playerPick = document.getElementById('playerPick');
  const cpuPick    = document.getElementById('cpuPick');
  const resultText = document.getElementById('resultText');
  const btnRock    = document.getElementById('btnRock');
  const btnPaper   = document.getElementById('btnPaper');
  const btnScissors = document.getElementById('btnScissors');

  /* ---------- State ---------- */
  let score = 0;      // player round wins in the current match
  let cpuTotal = 0;   // CPU round wins in the current match
  let state = 'idle'; // 'idle' | 'playing' | 'paused' | 'over'

  let best = 0;
  try { best = parseInt(localStorage.getItem('rockpaperscissors.best') || '0', 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  /* ---------- Helpers ---------- */
  function updateHud() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
  }

  function updateScoreBoard() {
    youScore.textContent = score;
    cpuScore.textContent = cpuTotal;
  }

  function showOverlay(title, text, btnLabel, btn2Label) {
    ovTitle.textContent = title;
    ovText.textContent = text;
    ovBtn.textContent = btnLabel;
    if (btn2Label) { ovBtn2.textContent = btn2Label; ovBtn2.style.display = ''; }
    else { ovBtn2.style.display = 'none'; }
    overlay.classList.add('show');
  }

  function hideOverlay() {
    overlay.classList.remove('show');
  }

  function updatePauseBtn() { pauseBtn.classList.toggle('show', state === 'playing'); }

  /* ---------- Game logic ---------- */
  function playRound(id) {
    if (state !== 'playing') return;

    const player = byId[id];
    const cpu = CHOICES[(Math.random() * 3) | 0];

    playerPick.textContent = player.emoji;
    playerPick.classList.remove('dim');
    cpuPick.textContent = cpu.emoji;
    cpuPick.classList.remove('dim');

    let outcome;
    if (player.beats === cpu.id) outcome = 'win';
    else if (cpu.beats === player.id) outcome = 'lose';
    else outcome = 'draw';

    if (outcome === 'win') {
      score++;
      if (score > best) {
        best = score;
        try { localStorage.setItem('rockpaperscissors.best', String(best)); } catch (e) {}
      }
      resultText.textContent = `Round won — ${player.emoji} beats ${cpu.emoji}.`;
      resultText.className = 'rps-result win';
    } else if (outcome === 'lose') {
      cpuTotal++;
      resultText.textContent = `Round lost — ${cpu.emoji} beats ${player.emoji}.`;
      resultText.className = 'rps-result lose';
    } else {
      resultText.textContent = `Draw — both picked ${player.emoji}.`;
      resultText.className = 'rps-result';
    }

    updateHud();
    updateScoreBoard();

    if (score >= 5) endMatch('win');
    else if (cpuTotal >= 5) endMatch('lose');
  }

  function endMatch(result) {
    state = 'over';
    updatePauseBtn();
    const won = result === 'win';
    showOverlay(
      won ? 'YOU WIN' : 'YOU LOSE',
      `Final score ${score}–${cpuTotal}. ${won ? 'You took the match.' : 'The CPU took the match.'}`,
      'PLAY AGAIN'
    );
  }

  function reset() {
    score = 0;
    cpuTotal = 0;
    playerPick.textContent = '—';
    playerPick.classList.add('dim');
    cpuPick.textContent = '—';
    cpuPick.classList.add('dim');
    resultText.textContent = 'First to 5 wins the match.';
    resultText.className = 'rps-result';
    updateHud();
    updateScoreBoard();
  }

  function start() {
    reset();
    state = 'playing';
    hideOverlay();
    updatePauseBtn();
  }

  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      showOverlay('PAUSED', 'The match is on hold. Press space or hit resume.', 'RESUME', 'RESTART');
    } else if (state === 'paused') {
      state = 'playing';
      hideOverlay();
    }
    updatePauseBtn();
  }

  /* ---------- Input ---------- */
  btnRock.addEventListener('click', () => { btnRock.blur(); playRound('rock'); });
  btnPaper.addEventListener('click', () => { btnPaper.blur(); playRound('paper'); });
  btnScissors.addEventListener('click', () => { btnScissors.blur(); playRound('scissors'); });

  window.addEventListener('keydown', (e) => {
    const k = e.key;

    if (k === ' ' || k === 'Spacebar') e.preventDefault();

    if (k === 'r' || k === 'R') { start(); return; }

    if (k === ' ' || k === 'Spacebar' || k === 'p' || k === 'P') {
      if (state === 'playing' || state === 'paused') togglePause();
      else start();
      return;
    }

    const keyMap = { '1': 'rock', '2': 'paper', '3': 'scissors' };
    if (keyMap[k]) {
      if (state === 'idle' || state === 'over') start();
      playRound(keyMap[k]);
    }
  });

  ovBtn.addEventListener('click', () => {
    ovBtn.blur();
    if (state === 'paused') togglePause();
    else start();
  });

  ovBtn2.addEventListener('click', () => {
    ovBtn2.blur();
    start();
  });

  pauseBtn.addEventListener('click', () => {
    pauseBtn.blur();
    if (state === 'playing') togglePause();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'playing') togglePause();
  });

  /* ---------- Boot ---------- */
  reset();
  state = 'idle';
  updatePauseBtn();
})();
</script>
<style>
.sound-btn{position:fixed;top:12px;left:12px;width:38px;height:38px;border:1px solid #1e293b;border-radius:10px;background:rgba(15,23,42,.72);color:#cbd5e1;font-size:16px;line-height:1;cursor:pointer;z-index:99;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sound-btn:hover{background:rgba(30,41,59,.8)}
</style>
<button class="sound-btn" id="soundBtn" aria-label="Toggle sound">♪</button>
<script>
(function () {
  "use strict";
  var AC = window.AudioContext || window.webkitAudioContext;
  var ctx = null, master = null, musicGain = null, noiseBuf = null;
  var muted = false, musicOn = false, timer = null, step = 0, nextT = 0;

  var LEAD = [698.44,830.59,1046.48,1244.48,1046.48,830.59,698.44,0,698.44,830.59,1046.48,1244.48,1046.48,830.59,698.44,0];
  var BASS = [174.61,261.62,174.61,0,174.61,261.62,174.61,0,174.61,261.62,174.61,0,174.61,261.62,174.61,0];
  var STEP = 0.13;

  try { muted = localStorage.getItem('arcade.muted') === '1'; } catch (e) {}

  function ensureCtx() {
    if (!ctx) {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = muted ? 0 : 0.6;
      master.connect(ctx.destination);
      musicGain = ctx.createGain();
      musicGain.gain.value = 0.5;
      musicGain.connect(master);
      var n = Math.floor(ctx.sampleRate * 0.04);
      noiseBuf = ctx.createBuffer(1, n, ctx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    }
    if (ctx.state === 'suspended') ctx.resume();
  }

  function note(freq, t, dur, type, vol) {
    if (!freq) return;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(musicGain);
    o.start(t); o.stop(t + dur + 0.05);
  }

  function hat(t) {
    var s = ctx.createBufferSource(); s.buffer = noiseBuf;
    var hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7000;
    var g = ctx.createGain(); g.gain.value = 0.05;
    s.connect(hp); hp.connect(g); g.connect(musicGain);
    s.start(t);
  }

  function schedule(i, t) {
    var k = i % LEAD.length;
    note(LEAD[k], t, STEP * 0.9, 'sawtooth', 0.16);
    note(BASS[k], t, STEP * 0.95, 'sine', 0.2);
    hat(t);
  }

  function tick() {
    while (nextT < ctx.currentTime + 0.12) {
      schedule(step, nextT);
      step++;
      nextT += STEP;
    }
  }

  function startMusic() {
    if (musicOn) return;
    ensureCtx();
    musicOn = true;
    nextT = ctx.currentTime + 0.05;
    step = 0;
    timer = setInterval(tick, 25);
  }

  function stopMusic() {
    if (timer) { clearInterval(timer); timer = null; }
    musicOn = false;
    step = 0;
  }

  function setMuted(m) {
    muted = m;
    try { localStorage.setItem('arcade.muted', m ? '1' : '0'); } catch (e) {}
    if (master) master.gain.setTargetAtTime(m ? 0 : 0.6, ctx.currentTime, 0.02);
    var b = document.getElementById('soundBtn');
    if (b) b.textContent = m ? '🔇' : '♪';
  }

  function sync() {
    var pb = document.getElementById('pauseBtn');
    if (pb && pb.classList.contains('show')) { if (!musicOn) startMusic(); }
    else if (musicOn) stopMusic();
  }

  function wire() {
    var sb = document.getElementById('soundBtn');
    if (sb) sb.addEventListener('click', function () { ensureCtx(); setMuted(!muted); });
    window.addEventListener('pointerdown', ensureCtx);
    window.addEventListener('keydown', ensureCtx);
    var pb = document.getElementById('pauseBtn');
    if (pb) new MutationObserver(sync).observe(pb, { attributes: true, attributeFilter: ['class'] });
    var b = document.getElementById('soundBtn');
    if (b) b.textContent = muted ? '🔇' : '♪';
    sync();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', wire);
  else wire();
})();
</script>
<button class="rules-btn" id="rulesBtn">RULES</button>
<div class="rules-panel" id="rulesPanel">
  <div class="rules-card">
    <h2>HOW TO PLAY</h2>
    <p id="rulesText"></p>
    <button id="rulesClose">BACK</button>
  </div>
</div>
<style>
.rules-btn{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);padding:10px 22px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:.18em;color:#cbd5e1;background:rgba(15,23,42,.85);border:1px solid #334155;border-radius:999px;cursor:pointer;display:none;z-index:60}
.rules-btn.show{display:block}
.rules-btn:hover{background:rgba(30,41,59,.9)}
.rules-panel{position:fixed;inset:0;background:rgba(5,9,16,.94);display:none;align-items:center;justify-content:center;padding:20px;z-index:200;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.rules-panel.show{display:flex}
.rules-card{width:min(88vw,440px);max-height:80vh;overflow:auto;background:#0b1220;border:1px solid #1e293b;border-radius:16px;padding:24px;box-shadow:0 30px 60px -25px #000;text-align:center}
.rules-card h2{margin:0 0 14px;font-size:14px;letter-spacing:.24em;color:#4ade80}
.rules-card p{margin:0 0 20px;font-size:13px;line-height:1.9;color:#cbd5e1;letter-spacing:.03em;text-align:left}
.rules-card button{margin:0;padding:10px 26px;font:inherit;font-size:13px;letter-spacing:.18em;color:#04210f;background:linear-gradient(180deg,#86efac,#4ade80);border:0;border-radius:999px;cursor:pointer;box-shadow:0 8px 24px -8px rgba(74,222,128,.8)}
</style>
<script>
(function () {
  "use strict";
  var RULES = "Choose Rock, Paper, or Scissors. Rock beats Scissors, Scissors beats Paper, and Paper beats Rock. The first to 5 round wins takes the match.";
  var btn = document.getElementById('rulesBtn');
  var panel = document.getElementById('rulesPanel');
  var text = document.getElementById('rulesText');
  var close = document.getElementById('rulesClose');
  if (text) text.textContent = RULES;
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' || e.key === 'Esc') {
      e.preventDefault();
      if (panel && panel.classList.contains('show')) { panel.classList.remove('show'); return; }
      try { document.dispatchEvent(new KeyboardEvent('keydown', { key: 'p', bubbles: true, cancelable: true })); } catch (err) {}
    }
  });
  function sync() {
    var pb = document.getElementById('pauseBtn');
    var title = document.getElementById('ovTitle');
    var paused = pb && !pb.classList.contains('show') && title && /PAUSED/i.test(title.textContent || '');
    if (btn) btn.classList.toggle('show', !!paused);
    var ov = document.getElementById('overlay');
    if (ov && !ov.classList.contains('show') && panel) panel.classList.remove('show');
  }
  var pb = document.getElementById('pauseBtn');
  if (pb) new MutationObserver(sync).observe(pb, { attributes: true, attributeFilter: ['class'] });
  var ov = document.getElementById('overlay');
  if (ov) new MutationObserver(sync).observe(ov, { attributes: true, attributeFilter: ['class'] });
  if (btn) btn.addEventListener('click', function () { if (panel) panel.classList.add('show'); });
  if (close) close.addEventListener('click', function () { if (panel) panel.classList.remove('show'); });
  if (panel) panel.addEventListener('click', function (e) { if (e.target === panel) panel.classList.remove('show'); });
  sync();
})();
</script>
<style>
#score{display:inline-block}
#score.pulse{animation:scorePulse .45s ease}
@keyframes scorePulse{
  0%{transform:scale(1);text-shadow:0 0 14px rgba(74,222,128,.45)}
  40%{transform:scale(1.4);text-shadow:0 0 26px rgba(74,222,128,.95)}
  100%{transform:scale(1);text-shadow:0 0 14px rgba(74,222,128,.45)}
}
</style>
<script>
(function () {
  "use strict";
  var el = document.getElementById('score');
  if (!el) return;
  var last = parseInt(el.textContent, 10) || 0;
  var mo = new MutationObserver(function () {
    var cur = parseInt(el.textContent, 10) || 0;
    if (cur > last) {
      el.classList.remove('pulse');
      void el.offsetWidth;
      el.classList.add('pulse');
    }
    last = cur;
  });
  mo.observe(el, { childList: true, characterData: true, subtree: true });
})();
</script>
</body>
</html>
