<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Code Breaker</title>
<style>
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0%,#16233a 0%,#070b12 65%);font-family:ui-monospace,Menlo,Consolas,monospace;color:#cbd5e1;padding:16px;-webkit-tap-highlight-color:transparent}
  .wrap{width:min(92vw,460px);display:flex;flex-direction:column;gap:12px}
  .hud{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.15em;color:#64748b}
  .hud b{color:#38bdf8;font-size:20px;margin-left:6px}
  .area{background:#0b1220;border:1px solid #1e293b;border-radius:14px;min-height:230px;display:grid;place-items:center;padding:16px;text-align:center;user-select:none;position:relative;overflow:hidden}
  button{font-family:inherit;border:0;border-radius:10px;padding:11px 15px;font-size:14px;font-weight:700;background:#0ea5e9;color:#04222a;cursor:pointer}
  button:active{transform:translateY(1px)}
  .hint{color:#64748b;font-size:11px;text-align:center;line-height:1.6}
  .big{font-size:26px;font-weight:800}
  .opt{background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:10px;padding:10px 14px;font-size:16px;font-weight:700;margin:4px;cursor:pointer}
  .opt:hover{border-color:#38bdf8}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>ESSAIS <b id="score">0</b></span><span>BEST <b id="best">—</b></span></div>
  <div class="area" id="area"><div id="g"></div></div>
  <button id="go">Rejouer</button>
  <div class="hint">Devine le code de 4 couleurs. Noir=juste, blanc=bonne couleur.</div>
</div>
<script>
const $=s=>document.querySelector(s);
let best=0;try{best=parseInt(localStorage.getItem('codebreaker.best')||'0',10)||0}catch(e){}
function saveHigh(v){ if(v>best){best=v;try{localStorage.setItem('codebreaker.best',String(v))}catch(e){}} upd(); }
function saveLow(v){ if(best===0||v<best){best=v;try{localStorage.setItem('codebreaker.best',String(v))}catch(e){}} upd(); }
function upd(){ $('#best').textContent=best?best:'—'; }
const COLS=['🔴','🟢','🔵','🟡','🟣','🟠']; let code=[], tries=0, guess=[];
function render(){ let h='<div style="margin-bottom:8px">'+guess.map((c,i)=>`<button class="opt" style="font-size:22px;padding:6px 10px" data-i="${i}">${c||'·'}</button>`).join('')+'</div><div>'+COLS.map(c=>`<button class="opt" style="font-size:22px;padding:6px 10px">${c}</button>`).join('')+'</div><button class="opt" id="ok" style="margin-top:8px">Valider</button>'; $('#g').innerHTML=h; $('#g').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; guess[i]=guess[i]?'':guess[i]; render(); }); $('#g').querySelectorAll('.opt').forEach(b=>{ if(!b.dataset.i && b.id!=='ok') b.onclick=()=>{ const e=guess.findIndex(x=>!x); if(e>=0){ guess[e]=b.textContent; render(); } }; }); const ok=$('#ok'); if(ok) ok.onclick=check; }
function check(){ if(guess.some(x=>!x)) return; tries++; let black=0, white=0; const cc=[...code]; const gg=[...guess]; gg.forEach((g,i)=>{ if(g===cc[i]){ black++; cc[i]=gg[i]=null; } }); gg.forEach(g=>{ if(g){ const j=cc.indexOf(g); if(j>=0){ white++; cc[j]=null; } } }); if(black===4){ saveLow(tries); $('#score').textContent=tries; $('#g').innerHTML='<div class="big">Trouvé en '+tries+' !</div>'; } else { $('#g').insertAdjacentHTML('beforeend',`<div style="margin-top:6px">${guess.join('')} · ⚫${black} ⚪${white}</div>`); guess=[]; render(); } }
$('#go').onclick=()=>{ code=[]; for(let i=0;i<4;i++) code.push(COLS[Math.floor(Math.random()*COLS.length)]); tries=0; guess=[]; $('#score').textContent='0'; render(); };
upd();
</script>
</body>
</html>
