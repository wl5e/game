<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Anagram</title>
<style>
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0%,#16233a 0%,#070b12 65%);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#cbd5e1;padding:16px;-webkit-tap-highlight-color:transparent}
  .wrap{width:min(92vw,460px);display:flex;flex-direction:column;gap:12px}
  .hud{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.15em;color:#64748b}
  .hud b{color:#38bdf8;font-size:20px;margin-left:6px}
  .hud b.time{color:#fbbf24}
  .area{background:#0b1220;border:1px solid #1e293b;border-radius:16px;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;text-align:center;user-select:none;position:relative;overflow:hidden}
  button{font-family:inherit;border:0;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:700;background:#0ea5e9;color:#04222a;cursor:pointer}
  button.big{width:100%}
  button:active{transform:translateY(1px)}
  .hint{color:#64748b;font-size:11px;text-align:center;line-height:1.6}
  #w{font-size:34px;font-weight:800;letter-spacing:.3em;color:#fbbf24;word-break:break-all}
  input{background:#0a1322;border:1px solid #334155;border-radius:10px;color:#e2e8f0;padding:10px;font-size:20px;text-align:center;width:180px;letter-spacing:.15em;text-transform:uppercase;font-family:inherit}
  input:focus{outline:none;border-color:#38bdf8}
  .row{display:flex;gap:8px;align-items:center}
  .area.good{border-color:#4ade80}
  .area.bad{border-color:#f87171}
  .overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(7,11,18,.9);z-index:5;text-align:center}
  .overlay .t{font-size:26px;font-weight:800;color:#f87171}
  .overlay .s{color:#94a3b8;margin-top:10px;font-size:13px;line-height:1.6}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
  .shake{animation:shake .3s}
</style>
<script src="../audio.js"></script>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>SCORE <b id="score">0</b></span><span>TEMPS <b class="time" id="time">60</b></span><span>BEST <b id="best">—</b></span></div>
  <div class="area" id="area">
    <div id="w">—</div>
    <div class="row"><input id="in" maxlength="14" autocomplete="off" autocapitalize="characters" placeholder="?" /><button id="ok">OK</button></div>
  </div>
  <button class="big" id="go">Rejouer</button>
  <div class="hint">Retrouve le mot à partir des lettres mélangées. 60 s. Erreur = −3 s. · Par 15</div>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
let best=0;try{best=parseInt(localStorage.getItem('anagram.best')||'0',10)||0}catch(e){}
function upd(){ $('#best').textContent=best?best:'—'; }
function saveHigh(v){ if(v>best){ best=v; try{localStorage.setItem('anagram.best',String(v))}catch(e){} upd(); } }

const WORDS=['CHAT','CHIEN','LAPIN','TIGRE','ZEBRE','POULE','MOUTON','CHEVAL','POISSON','FLEUR','ARBRE','PIERRE','NUAGE','SOLEIL','LUNE','MONTAGNE','VOITURE','BATEAU','MAISON','JARDIN','FROMAGE','ORANGE','CERISE','PLAGE','LIVRE'];
let score=0, cur='', timeLeft=60, timer=null, over=false;

function shuf(s){ const a=s.split(''); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a.join(''); }
function q(){
  cur=WORDS[Math.floor(Math.random()*WORDS.length)];
  let s=shuf(cur); if(s===cur) s=shuf(cur);
  $('#w').textContent=s;
}

function flash(cls){ const a=$('#area'); a.classList.add(cls); setTimeout(()=>a.classList.remove(cls),300); }
function shake(){ const a=$('#area'); a.classList.add('shake'); setTimeout(()=>a.classList.remove('shake'),320); }

function guess(){
  if(over) return;
  const v=$('#in').value.trim().toUpperCase();
  if(!v) return;
  $('#in').value='';
  if(v===cur){
    score++; $('#score').textContent=score;
    flash('good'); Arcade.sfx('correct');
    q();
  } else {
    flash('bad'); shake(); Arcade.sfx('wrong');
    timeLeft=Math.max(0,timeLeft-3); $('#time').textContent=timeLeft;
    if(timeLeft<=0) end();
  }
}

function end(){
  if(over) return;
  over=true; clearInterval(timer);
  Arcade.sfx('lose');
  saveHigh(score);
  $('#in').disabled=true; $('#ok').disabled=true;
  showOver('Temps écoulé !', 'Score : '+score+' mot(s)'+(score>=best&&score>0?' · nouveau record !':''));
}

function showOver(t,s){
  const ov=document.createElement('div'); ov.className='overlay'; ov.innerHTML='<div><div class="t">'+t+'</div><div class="s">'+s+'</div></div>';
  $('#area').appendChild(ov);
}

function reset(){
  clearInterval(timer);
  score=0; timeLeft=60; over=false;
  $('#score').textContent='0'; $('#time').textContent='60';
  $('#in').disabled=false; $('#ok').disabled=false; $('#in').value='';
  const ov=$('.overlay'); if(ov) ov.remove();
  $('#area').classList.remove('good','bad','shake');
  q(); upd();
  $('#in').focus();
  timer=setInterval(()=>{
    if(over) return;
    timeLeft--; $('#time').textContent=Math.max(0,timeLeft);
    if(timeLeft<=5) $('#time').style.color='#f87171';
    if(timeLeft<=0) end();
  },1000);
}

$('#ok').onclick=guess;
$('#in').onkeydown=e=>{ if(e.key==='Enter') guess(); };
$('#go').onclick=reset;
upd();
reset();
</script>
</body>
</html>
