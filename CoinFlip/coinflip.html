<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Coin Flip</title>
<style>
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0%,#16233a 0%,#070b12 65%);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#cbd5e1;padding:16px;-webkit-tap-highlight-color:transparent}
  .wrap{width:min(92vw,460px);display:flex;flex-direction:column;gap:12px}
  .hud{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.15em;color:#64748b}
  .hud b{color:#38bdf8;font-size:20px;margin-left:6px}
  .area{background:#0b1220;border:1px solid #1e293b;border-radius:14px;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center;user-select:none;position:relative;overflow:hidden}
  button{font-family:inherit;border:0;border-radius:10px;padding:11px 15px;font-size:14px;font-weight:700;background:#0ea5e9;color:#04222a;cursor:pointer}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.4;cursor:default}
  .hint{color:#64748b;font-size:11px;text-align:center;line-height:1.6}
  .opt{background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:10px;padding:11px 18px;font-size:16px;font-weight:700;margin:4px;cursor:pointer}
  .opt:hover{border-color:#38bdf8}
  .opt:disabled{opacity:.4;cursor:default}
  .row{display:flex;gap:10px}
  .msg{font-size:13px;color:#94a3b8;min-height:18px;line-height:1.5}
  .coin{width:96px;height:96px;border-radius:50%;background:linear-gradient(145deg,#fbbf24,#b45309);display:grid;place-items:center;font-size:24px;font-weight:800;color:#451a03;box-shadow:0 0 0 6px #92400e,0 14px 30px -10px #000}
  .coin.spin{animation:flip .65s ease-in-out}
  @keyframes flip{0%{transform:rotateY(0)}100%{transform:rotateY(1080deg)}}
  .area.good{animation:goodflash .45s}
  .area.bad{animation:badflash .5s}
  @keyframes goodflash{0%{box-shadow:inset 0 0 0 4px #22c55e;background:#06281c}100%{box-shadow:inset 0 0 0 0 #22c55e}}
  @keyframes badflash{0%{box-shadow:inset 0 0 0 4px #ef4444;background:#2a0a0e}100%{box-shadow:inset 0 0 0 0 #ef4444}}
  .shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
</style>
<script src="../audio.js"></script>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>SÉRIE <b id="score">0</b></span><span>BEST <b id="best">—</b></span></div>
  <div class="area" id="area">
    <div class="coin" id="coin">?</div>
    <div class="msg" id="msg">Devine : PILE ou FACE.</div>
    <div class="row"><button class="opt" id="h">PILE</button><button class="opt" id="t">FACE</button></div>
  </div>
  <button id="go">Rejouer</button>
  <div class="hint">Devine le côté de la pièce. Bonne réponse = +1 à la série.<br>Une seule erreur met fin à la partie. Objectif : série de 8.</div>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
let best=0;try{best=parseInt(localStorage.getItem('coinflip.best')||'0',10)||0}catch(e){}
function saveHigh(v){ if(v>best){best=v;try{localStorage.setItem('coinflip.best',String(v))}catch(e){}} upd(); }
function upd(){ $('#best').textContent=best?best:'—'; }
const area=$('#area'), coin=$('#coin'), msg=$('#msg');
const btnH=$('#h'), btnT=$('#t');
let streak=0, running=true, busy=false;
function flash(kind){ area.classList.remove('good','bad'); void area.offsetWidth; area.classList.add(kind); }
function setLocked(b){ busy=b; btnH.disabled=b; btnT.disabled=b; }
function judge(v){
  if(!running||busy) return;
  setLocked(true); Arcade.sfx('coin');
  coin.classList.remove('spin'); void coin.offsetWidth; coin.classList.add('spin');
  setTimeout(()=>{
    const flip=Math.random()<0.5;
    coin.textContent=flip?'PILE':'FACE';
    coin.classList.remove('spin');
    if(flip===v){
      streak++; $('#score').textContent=streak;
      msg.textContent=(flip?'PILE':'FACE')+' ! Bien joué.';
      flash('good'); Arcade.sfx('correct');
      setLocked(false);
    }else{
      running=false;
      const rec=streak>0&&streak>=best;
      msg.innerHTML='C\'était '+(flip?'PILE':'FACE')+'. Série finale : <b>'+streak+'</b>'+(rec?' — RECORD !':'');
      area.classList.add('shake'); flash('bad'); Arcade.sfx('wrong');
      saveHigh(streak);
      setTimeout(()=>area.classList.remove('shake'),500);
    }
  },650);
}
function reset(){
  streak=0; running=true;
  coin.textContent='?'; coin.classList.remove('spin');
  $('#score').textContent='0';
  msg.textContent='Devine : PILE ou FACE.';
  area.classList.remove('good','bad','shake');
  setLocked(false);
}
btnH.onclick=()=>judge(true);
btnT.onclick=()=>judge(false);
$('#go').onclick=reset;
upd();
</script>
</body>
</html>
