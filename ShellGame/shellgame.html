<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Shell Game</title>
<style>
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0%,#16233a 0%,#070b12 65%);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#cbd5e1;padding:16px;-webkit-tap-highlight-color:transparent}
  .wrap{width:min(92vw,460px);display:flex;flex-direction:column;gap:12px}
  .hud{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.15em;color:#64748b}
  .hud b{color:#38bdf8;font-size:20px;margin-left:6px}
  .area{background:#0b1220;border:1px solid #1e293b;border-radius:14px;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center;user-select:none;position:relative;overflow:hidden}
  button{font-family:inherit;border:0;border-radius:10px;padding:11px 15px;font-size:14px;font-weight:700;background:#0ea5e9;color:#04222a;cursor:pointer}
  button:active{transform:translateY(1px)}
  .hint{color:#64748b;font-size:11px;text-align:center;line-height:1.6}
  .msg{font-size:13px;color:#94a3b8;min-height:18px;line-height:1.5}
  .table{position:relative;width:310px;height:110px}
  .slot{position:absolute;top:0;width:90px;height:110px;transition:left .22s ease-in-out;display:grid;place-items:end center;cursor:pointer}
  .ball{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fde68a,#d97706);box-shadow:0 4px 10px rgba(0,0,0,.5);opacity:0;transform:translateY(0);transition:opacity .15s,transform .2s}
  .cup{width:84px;height:56px;background:linear-gradient(180deg,#334155,#1e293b);border:1px solid #475569;border-radius:10px 10px 16px 16px;display:grid;place-items:center;font-size:22px;transition:transform .2s ease;box-shadow:0 8px 16px -8px #000}
  .slot.show .ball{opacity:1}
  .slot.show .cup{transform:translateY(-30px)}
  .slot.hit .cup{transform:translateY(-30px)}
  .slot.reveal{animation:reveal .5s}
  @keyframes reveal{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
  .area.good{animation:goodflash .45s}
  .area.bad{animation:badflash .5s}
  @keyframes goodflash{0%{box-shadow:inset 0 0 0 4px #22c55e;background:#06281c}100%{box-shadow:inset 0 0 0 0 #22c55e}}
  @keyframes badflash{0%{box-shadow:inset 0 0 0 4px #ef4444;background:#2a0a0e}100%{box-shadow:inset 0 0 0 0 #ef4444}}
  .shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
</style>
<script src="../audio.js"></script>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>SÉRIE <b id="score">0</b></span><span>BEST <b id="best">—</b></span></div>
  <div class="area" id="area">
    <div class="table" id="table"></div>
    <div class="msg" id="msg">Suis la balle sous les gobelets.</div>
  </div>
  <button id="go">Rejouer</button>
  <div class="hint">La balle est montrée, puis les gobelets se mélangent.<br>Retrouve le bon gobelet. Une erreur = fin. Objectif : série de 8.</div>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
let best=0;try{best=parseInt(localStorage.getItem('shellgame.best')||'0',10)||0}catch(e){}
function saveHigh(v){ if(v>best){best=v;try{localStorage.setItem('shellgame.best',String(v))}catch(e){}} upd(); }
function upd(){ $('#best').textContent=best?best:'—'; }
const area=$('#area'), table=$('#table'), msg=$('#msg');
const SLOT_X=[0,110,220];
let slots=[], ballPos=0, streak=0, running=true, locked=true;
function flash(kind){ area.classList.remove('good','bad'); void area.offsetWidth; area.classList.add(kind); }
function build(){
  table.innerHTML='';
  slots=[];
  for(let i=0;i<3;i++){
    const s=document.createElement('div');
    s.className='slot';
    s.style.left=SLOT_X[i]+'px';
    s.innerHTML='<div class="ball"></div><div class="cup">🥤</div>';
    s.onclick=()=>pick(i);
    table.appendChild(s);
    slots.push(s);
  }
}
function paint(){
  slots.forEach((s,i)=>{ s.style.left=SLOT_X[i]+'px'; });
}
function pick(i){
  if(!running||locked) return;
  locked=true;
  if(i===ballPos){
    streak++; $('#score').textContent=streak;
    slots[i].classList.add('show');
    msg.textContent='Bien vu ! Série '+streak+'.';
    flash('good'); Arcade.sfx('correct');
    setTimeout(round,800);
  }else{
    running=false;
    slots[ballPos].classList.add('show');
    slots[i].classList.add('hit','reveal');
    const rec=streak>0&&streak>=best;
    msg.innerHTML='C\'était '+(ballPos===0?'à gauche':ballPos===1?'au milieu':'à droite')+'. Série finale : <b>'+streak+'</b>'+(rec?' — RECORD !':'');
    area.classList.add('shake'); flash('bad'); Arcade.sfx('wrong');
    saveHigh(streak);
    setTimeout(()=>area.classList.remove('shake'),500);
  }
}
function round(){
  ballPos=Math.floor(Math.random()*3);
  build();
  locked=true;
  msg.textContent='Regarde bien où est la balle…';
  slots[ballPos].classList.add('show');
  Arcade.sfx('pop');
  setTimeout(shuffle,1000);
}
function shuffle(){
  slots.forEach(s=>s.classList.remove('show'));
  msg.textContent='Mélange…';
  let steps=0;
  const total=9;
  const iv=setInterval(()=>{
    const a=Math.floor(Math.random()*3);
    let b; do{ b=Math.floor(Math.random()*3); }while(b===a);
    [slots[a],slots[b]]=[slots[b],slots[a]];
    if(ballPos===a) ballPos=b; else if(ballPos===b) ballPos=a;
    paint();
    Arcade.sfx('whoosh');
    if(++steps>=total){
      clearInterval(iv);
      locked=false;
      msg.textContent='Où est la balle ? Touche un gobelet.';
      Arcade.sfx('tick');
    }
  },240);
}
function reset(){
  streak=0; running=true; locked=true;
  $('#score').textContent='0';
  area.classList.remove('good','bad','shake');
  round();
}
$('#go').onclick=reset;
upd();
reset();
</script>
</body>
</html>
